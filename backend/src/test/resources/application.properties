# 테스트 전용: 메모리 DB, AI 호출 끔(절대 실제 API 를 부르지 않음), 스케줄러·시드 끔
spring.datasource.url=jdbc:h2:mem:tstest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
app.ai.enabled=false
app.scheduler.enabled=false
app.seed.enabled=false
app.upload-dir=./target/test-uploads
# 외부 키는 테스트에서 항상 비운다(실제 Gemini·Anthropic·Firebase 호출 금지)
GEMINI_API_KEY=
ANTHROPIC_API_KEY=
FIREBASE_WEB_API_KEY=
AI_PROVIDER=rule
app.phone.demo-code-enabled=true
