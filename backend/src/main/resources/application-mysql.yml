# MySQL 8 프로필: SPRING_PROFILES_ACTIVE=mysql 로 켠다. 접속 정보는 환경변수로만 준다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/timesavings?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER:timesavings}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
