<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시간적금 운영자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>[hidden]{display:none!important}body{margin:0}</style>
<style>
/* Layout: 밝은 사이드바 + 최대 1240px 작업 영역. 카드 대신 큰 패널 몇 개, 패널 안은 구분선으로 나눔.
   색은 데이터 뜻에만: 요청=파랑, 봉사=초록, 위험=빨강, 주의=호박. 화면 크롬은 무채색. */
:root{
  --canvas:#F4F5F7; --surface:#FFFFFF; --sunken:#F7F8FA; --hover:#F1F3F6; --select:#EAEEF5;
  --ink:#16191F; --ink-2:#3B4250; --ink-3:#6B7280; --ink-4:#9CA3AF; --rule:#E4E7EC; --rule-2:#EEF0F3;
  --req:#2F6FDB; --req-weak:#E8F0FC; --req-line:#A9C4F2;
  --vol:#14866D; --vol-weak:#E4F3EF; --vol-line:#9BD3C4;
  --neg:#C8372D; --neg-weak:#FBECEA; --warn:#A86A00; --warn-weak:#FBF1DE; --pos:#14866D;
  --ai:#5B4BC4; --ai-weak:#F3F1FC;
  --focus:#2F6FDB;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0F1115; --surface:#171A20; --sunken:#1C2027; --hover:#20252D; --select:#232A36;
  --ink:#EDEFF3; --ink-2:#C9CED7; --ink-3:#98A0AD; --ink-4:#6F7783; --rule:#2A2F38; --rule-2:#242931;
  --req:#6C9DF2; --req-weak:#1C2840; --req-line:#3A5A93;
  --vol:#45BC9E; --vol-weak:#15302A; --vol-line:#2A6F5F;
  --neg:#F0776C; --neg-weak:#3A1F1D; --warn:#E3AA45; --warn-weak:#342916; --pos:#45BC9E;
  --ai:#A79AF0; --ai-weak:#221F36; --focus:#6C9DF2; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0F1115; --surface:#171A20; --sunken:#1C2027; --hover:#20252D; --select:#232A36;
  --ink:#EDEFF3; --ink-2:#C9CED7; --ink-3:#98A0AD; --ink-4:#6F7783; --rule:#2A2F38; --rule-2:#242931;
  --req:#6C9DF2; --req-weak:#1C2840; --req-line:#3A5A93;
  --vol:#45BC9E; --vol-weak:#15302A; --vol-line:#2A6F5F;
  --neg:#F0776C; --neg-weak:#3A1F1D; --warn:#E3AA45; --warn-weak:#342916; --pos:#45BC9E;
  --ai:#A79AF0; --ai-weak:#221F36; --focus:#6C9DF2; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.tn{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--rule);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px;stroke:var(--surface);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand b{font-size:15px;font-weight:700;display:block;line-height:1.3}
.brand span{font-size:12px;color:var(--ink-3)}
.nav-sec{font-size:12px;color:var(--ink-4);padding:16px 10px 6px;font-weight:500}
.nav a{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px}
.nav a svg.i{color:var(--ink-4)}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--select);color:var(--ink);font-weight:600}
.nav a.on svg.i{color:var(--ink)}
.nav .n{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav .n.urgent{color:var(--neg);font-weight:600}
.side-user{margin-top:auto;border-top:1px solid var(--rule);padding:14px 10px 0;display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sunken);border:1px solid var(--rule);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.side-user small{display:block;color:var(--ink-3);font-size:12px}

/* page */
.main{min-width:0;padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.wrap>*{min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.pagehead h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
.pagehead .desc{font-size:13.5px;color:var(--ink-3);margin:4px 0 0}
.head-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stamp{font-size:12.5px;color:var(--ink-3);margin-right:4px}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--neg)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn svg.i{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{color:var(--req);text-decoration:none;font-weight:500;font-size:13px;background:none;border:none;padding:0;display:inline-flex;align-items:center;gap:2px}
.link:hover{text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.panel-h h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.panel-h .sub{font-size:12.5px;color:var(--ink-3)}
.panel-b{padding:16px 20px 20px}
.panel-f{border-top:1px solid var(--rule-2);padding:14px 20px}
.cols{display:grid;gap:20px}
.c-main{grid-template-columns:minmax(0,1fr) 340px}
.c-half{grid-template-columns:repeat(2,minmax(0,1fr))}
.c-list{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr)}
.stackv{display:grid;gap:20px;align-content:start;min-width:0}

/* KPI strip: 한 패널 안에 4칸 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:18px 20px;border-left:1px solid var(--rule-2);min-width:0}
.kpi:first-child{border-left:none}
.kpi .label{font-size:13px;color:var(--ink-3);font-weight:500}
.kpi .value{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .value .u{font-size:15px;font-weight:500;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.kpi .value .of{font-size:15px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.kpi .meta{font-size:12.5px;color:var(--ink-3);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.up{color:var(--pos);font-weight:600}.down{color:var(--neg);font-weight:600}

/* banner */
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;background:var(--warn-weak);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);font-size:13.5px;flex-wrap:wrap}
.banner svg.i{color:var(--warn)}
.banner strong{font-weight:600}
.banner .sep{color:var(--ink-4)}
.banner .link{margin-left:auto}

/* insight (AI) */
.insight{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.ai-tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:5px;background:var(--ai-weak);color:var(--ai);font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;margin-top:1px}
.insight p{margin:0;font-size:14px;color:var(--ink-2);max-width:78ch}
.insight p strong{color:var(--ink);font-weight:600}
.insight .basis{font-size:12.5px;color:var(--ink-4);margin-top:4px}
.insight ol{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.insight li{margin:4px 0}

/* todo */
.todo{list-style:none;margin:0;padding:6px 0}
.todo a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 20px;text-decoration:none;color:inherit}
.todo a:hover{background:var(--hover)}
.todo .t{font-weight:500}
.todo .d{display:block;font-size:12.5px;color:var(--ink-3)}
.todo .c{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;min-width:24px;text-align:right}
.todo .c.urgent{color:var(--neg)}
.todo svg.i{width:16px;height:16px;color:var(--ink-4)}

/* legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:3px;border-radius:2px;display:inline-block}
.sw.box{height:10px;width:10px;border-radius:2px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{font-size:12.5px;font-weight:500;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface)}
tbody td{padding:12px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--hover)}
tr.row.on td{background:var(--select)}
td .muted{color:var(--ink-3)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-4)}
.status.wait::before{background:var(--warn)}
.status.bad::before{background:var(--neg)}
.status.ok::before{background:var(--pos)}
.flag-neg{color:var(--neg);font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
.tag.req{background:var(--req-weak);border-color:transparent;color:var(--req)}
.tag.vol{background:var(--vol-weak);border-color:transparent;color:var(--vol)}

/* bars */
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:84px minmax(0,1fr) 60px;gap:12px;align-items:center;font-size:13px}
.hb .track{height:8px;border-radius:4px;background:var(--rule-2);overflow:hidden}
.hb .fill{height:100%;border-radius:4px}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hb.two .track{height:auto;background:none;display:grid;gap:3px}
.hb.two .fill{height:7px}
.hb.two .v{line-height:1.3;font-size:12.5px}
.mirror{display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);gap:0 12px;align-items:center;font-size:13px;padding:5px 0}
.mirror .l,.mirror .r{display:flex;align-items:center;gap:8px}
.mirror .l{flex-direction:row-reverse}
.mirror .b{height:10px;border-radius:2px}
.mirror .n{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:28px}
.mirror .l .n{text-align:right}
.mirror .k{text-align:center;color:var(--ink-2)}
.split{display:flex;height:36px;border-radius:6px;overflow:hidden;gap:2px}
.split div{display:flex;flex-direction:column;justify-content:center;padding:0 10px;font-size:12px;line-height:1.25;min-width:0;white-space:nowrap;overflow:hidden}
.split b{font-size:14px}
.dist{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:1px}
.dist div{font-size:11.5px;display:flex;align-items:center;justify-content:center;font-weight:500;min-width:0;overflow:hidden}

/* controls */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;max-width:100%}
.tabs button{border:none;background:none;height:44px;padding:0 12px;font-size:14px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.tabs .cnt{color:var(--ink-4);font-weight:500;margin-left:4px;font-size:13px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
.seg{display:inline-flex;padding:3px;background:var(--sunken);border:1px solid var(--rule);border-radius:8px;gap:2px}
.seg button{border:none;background:none;height:28px;padding:0 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-3);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--rule)}
.seg .dot{width:8px;height:8px;border-radius:50%}
.flabel{font-size:12.5px;color:var(--ink-3)}
.note{font-size:12.5px;color:var(--ink-4)}
.context{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.context b{color:var(--ink);font-weight:600}
.context .mode-b{font-weight:600}

/* forms */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
input[type=text],textarea{width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:9px 12px;font-size:14px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin-bottom:16px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 16px}
.suggest button{border:1px dashed var(--rule);background:none;border-radius:6px;padding:4px 10px;font-size:12.5px;color:var(--ink-3)}
.suggest button:hover{border-style:solid;color:var(--ink)}
dl.props{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px 16px;margin:0;font-size:13.5px}
dl.props dt{color:var(--ink-3)}
dl.props dd{margin:0}
.detail-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.detail-h h3{margin:0;font-size:16px;font-weight:600}
.doc{height:132px;border:1px solid var(--rule);border-radius:8px;background:var(--sunken);display:grid;place-items:center;color:var(--ink-4);font-size:12.5px;margin:18px 0}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* forecast */
.assume{display:grid;gap:0}
.assume div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.assume div:last-child{border-bottom:none}
.assume span{color:var(--ink-3)}
.policy{display:grid;gap:6px;padding:16px 20px;border-bottom:1px solid var(--rule-2)}
.policy:last-child{border-bottom:none}
.policy.on{background:var(--select)}
.policy h3{margin:0;font-size:14px;font-weight:600}
.policy p{margin:0;font-size:13px;color:var(--ink-3)}
.policy .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.shift{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.shift b{color:var(--pos)}
.vars{width:100%;font-size:13.5px}
.vars td{padding:8px 0;border-bottom:1px solid var(--rule-2)}
.vars td:first-child{padding-left:0}
.vars td:last-child{padding-right:0;text-align:right}
.copybox{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sunken);border-radius:8px;padding:14px 16px}
.copybox p{margin:2px 0 0;font-size:14px}
.copybox small{font-size:12.5px;color:var(--ink-3)}

/* alerts */
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule-2);border-radius:8px;margin:14px 0}
.figures div{padding:12px 14px;border-left:1px solid var(--rule-2)}
.figures div:first-child{border-left:none}
.figures b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.figures small{font-size:12.5px;color:var(--ink-3)}
.sev{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.sev::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--ink-4)}
.sev.bad::before{background:var(--neg)}.sev.warn::before{background:var(--warn)}

/* chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font)}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:7px;padding:8px 10px;font-size:12.5px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:50}

@media (max-width:1180px){.c-main,.c-list{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:none}.kpi:nth-child(n+3){border-top:1px solid var(--rule-2)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule);padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .brand{padding:0 0 10px}
  .nav{display:flex;gap:2px;flex-wrap:wrap}
  .nav-sec,.side-user{display:none}
  .nav a{white-space:nowrap;flex:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:20px}
  .c-half{grid-template-columns:minmax(0,1fr)}
  .figures{grid-template-columns:repeat(2,minmax(0,1fr))}
  .figures div:nth-child(3){border-left:none}.figures div:nth-child(n+3){border-top:1px solid var(--rule-2)}
}
@media (max-width:540px){table{font-size:12.5px}thead th{white-space:normal;padding:8px 6px;font-size:11.5px}tbody td{padding:10px 6px}th:first-child,td:first-child{padding-left:14px}th:last-child,td:last-child{padding-right:14px}.tag{white-space:nowrap}.kpis{grid-template-columns:minmax(0,1fr)}.kpi{border-left:none!important;border-top:1px solid var(--rule-2)}.kpi:first-child{border-top:none}.hb{grid-template-columns:64px minmax(0,1fr) 52px}.mirror{grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr)}}


/* dialog · drawer */

}

  --acc:#C6F35E; --acc-soft:#232C12; --acc-ink:#14161B; --acc-text:#C6F35E; --on-acc:#14161B; --acc-deep:#D4F77C;
  --hero:#1E2128; --bar:#B9BEC8; --ai:#C6F35E; --ai-weak:#232C12; --focus:#C6F35E; --card-sh:none}}
:root[data-theme="dark"]{
  --canvas:#0C0E12; --surface:#15171D; --sunken:#1B1E25; --hover:#1E2129; --select:#202812;
  --ink:#ECEEF2; --ink-2:#C4C8D0; --ink-3:#8C919C; --ink-4:#5F6470; --rule:#262931; --rule-2:#1F2229;

  --acc:#C6F35E; --acc-soft:#232C12; --acc-ink:#14161B; --acc-text:#C6F35E; --on-acc:#14161B; --acc-deep:#D4F77C;
  --hero:#1E2128; --bar:#B9BEC8; --ai:#C6F35E; --ai-weak:#232C12; --focus:#C6F35E; --card-sh:none}
html,body{background:var(--canvas)}
/* 사이드바: 화면 끝까지 같은 색 */
.app{background:linear-gradient(90deg,var(--side) 0 228px,var(--canvas) 228px);grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:hidden;padding:22px 14px 18px}
.brand{padding:0 8px 22px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--acc)}
.brand-mark svg{stroke:#14161B;width:15px;height:15px;stroke-width:2}
.brand b{color:#fff;font-size:15px;font-weight:700;letter-spacing:-.01em}
.nav-sec{color:var(--side-mute);font-size:11px;font-weight:600;letter-spacing:.06em;padding:16px 10px 6px}
.nav a{height:38px;border-radius:10px;padding:0 10px;color:var(--side-ink);font-size:13.5px;font-weight:500;gap:11px}
.nav a svg.i{width:18px;height:18px;color:var(--side-ink)}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a:hover svg.i{color:#fff}
.nav a.on{background:var(--acc);color:#14161B;font-weight:700;box-shadow:none}
.nav a.on svg.i{color:#14161B}
.nav .n,.nav a.on .n{color:var(--side-mute);font-size:12px;font-weight:600}
.nav a.on .n{color:rgba(20,22,27,.6)}
.nav .n.urgent{color:#FF7A6E}
.nav a.on .n.urgent{color:#B42318}
.side-user{border-top:1px solid var(--side-line);padding:14px 6px 0;margin:0 -2px}
.side-user .avatar{background:var(--acc);color:#14161B}
.side-user .who b{color:#fff}
.side-user .who small{color:var(--side-mute)}
.side .iconbtn{background:transparent;border-color:var(--side-line);color:var(--side-ink)}
.side .iconbtn:hover{background:rgba(255,255,255,.06);color:#fff}
/* 아이콘 두 톤 */
svg.i .d{fill:currentColor;opacity:.22;stroke:none}
.nav a.on svg.i .d{opacity:.35}
/* 제목 줄 */
.main{padding-bottom:40px}
.topbar{padding:24px 32px 6px}
.pagehead h1{font-size:24px;font-weight:700;letter-spacing:-.03em}
.iconbtn{border-color:var(--rule);background:var(--surface)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{background:#2A2E37;border-color:#2A2E37}
.btn.primary svg.i{color:var(--acc)}
:root[data-theme="dark"] .btn.primary{background:var(--acc);border-color:var(--acc);color:#14161B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--acc);border-color:var(--acc);color:#14161B}:root:not([data-theme="light"]) .btn.primary svg.i{color:#14161B}}
:root[data-theme="dark"] .btn.primary svg.i{color:#14161B}
.link{color:var(--acc-text)}
.banner .link{color:var(--acc-text)}
/* 본문 · 카드 */
.wrap{padding:16px 32px 0;gap:16px}
.cols,.stackv{gap:16px}
.panel{border:1px solid var(--rule);border-radius:14px;box-shadow:var(--card-sh)}
.c-main>section.panel:first-child{border:1px solid var(--rule);border-radius:14px}
.c-main>section.panel:first-child>.panel-h,.c-main>section.panel:first-child>.panel-b{padding-left:18px;padding-right:18px}
.c-main>section.panel:first-child>.panel-h{padding-top:16px}
.c-main>section.panel:first-child>.panel-f{padding:0 18px 18px}
.panel-h{padding:16px 18px 0}
.panel-b{padding:12px 18px 18px}
.panel-f{padding:12px 18px}
/* 지표: 첫 칸은 진한 카드 */
.kpi{border-radius:14px;border:1px solid var(--rule)!important;box-shadow:var(--card-sh)!important;padding:16px 18px}
.kpi:first-child{background:var(--hero);border-color:var(--hero)!important}
.kpi:first-child .label{color:#A3A8B3}
.kpi:first-child .value{color:#fff}
.kpi:first-child .value .u{color:#A3A8B3}
.kpi:first-child .meta{color:#A3A8B3}
.kpi:first-child .up{color:var(--acc)}
/* 상단 줄: 관리 화면 모두 같은 높이 */
.toolbar{min-height:44px;border-bottom:1px solid var(--rule);gap:12px;align-items:flex-end}
.toolbar>.tabs,.toolbar>.tb-l{align-self:stretch;display:flex;align-items:center}
.toolbar>.filters{padding-bottom:7px;align-self:center}
.tb-l{font-size:13px;color:var(--ink-3)}
.tb-l b{color:var(--ink);font-weight:700;margin:0 1px}
.tabs button,.tabs button:hover{height:44px}
.tabs button.on{box-shadow:inset 0 -2px 0 var(--ink);color:var(--ink)}
.tabs .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--rule-2);font-size:11px!important;font-weight:600}
.tabs button.on .cnt{background:var(--acc);color:#14161B}
.seg button.on{color:var(--ink)}
/* 표 · 목록 */
tr.row.on td{background:var(--select)}
tr.row.on td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
:root[data-theme="dark"] tr.row.on td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.todo .ti{background:var(--sunken);color:var(--ink-2);border:1px solid var(--rule-2)}
.todo .ti svg.i{color:var(--ink-2)}
.todo a:hover .ti{background:var(--acc);border-color:var(--acc)}
.todo a:hover .ti svg.i{color:#14161B}
.ai-tag{background:var(--ai-weak);color:var(--ai)}
.c-main>section.panel:first-child>.panel-f .insight{background:var(--sunken)}
.policy.on{box-shadow:inset 3px 0 0 var(--ink)}
.radios label:has(input:checked){border-color:var(--ink);background:var(--sunken);color:var(--ink)}
.radios input{accent-color:#14161B}
.suggest button:hover{border-color:var(--ink);color:var(--ink)}
.wx-n{background:var(--ink);color:var(--surface)}
.wx-bar i{background:var(--ink)}
:root[data-theme="dark"] .wx-bar i{background:var(--acc)}
.who-o{background:var(--sunken);color:var(--ink-2)}
.wx-dot{background:var(--ink)}
/* 쓸데없는 스크롤 없애기 */
.tw{overflow-x:auto;scrollbar-width:thin}
.side,.side *{scrollbar-width:none}
@media (max-width:860px){
  .app{background:var(--canvas);grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;overflow:visible;padding:14px 16px 10px}
  .brand{padding:0 0 10px}
  .topbar{padding:18px 16px 4px}.wrap{padding:12px 16px 0}
}
.toolbar{height:44px;min-height:0;flex-wrap:nowrap}
.side{overflow-y:auto;scrollbar-width:none}.side::-webkit-scrollbar{display:none}
@media (max-width:1180px){.toolbar{height:auto;min-height:44px;flex-wrap:wrap}}
.side-user{margin:auto -2px 0}
.toolbar>.tb-l{display:block;line-height:44px;white-space:nowrap}

  --side:#0C0C0B; --side-ink:#A29E95; --side-mute:#5F5C55; --side-line:#22211E;
  --req:#FF8A4C; --req-weak:#3A2316; --vol:#7A9BFF; --vol-weak:#1B2440; --neg:#FF7A6E; --neg-weak:#3A1D1A; --pos:#5CC98A;
  --acc:#EDEBE5; --acc-soft:#2A2925; --acc-text:#EDEBE5; --hero:#262522; --bar:#C9C6BD; --ai:#B9A2F0; --ai-weak:#2A2340; --focus:#EDEBE5}
/* 모서리: 전부 작게 */
.panel,.kpi,.c-main>section.panel:first-child,.wx-tk,.wx-hero,.wx-f,.copybox,.answer,.doc,.banner,.dialog,.toast,.tip{border-radius:var(--r)!important}
.btn,.btn.sm,.iconbtn,input[type=text],textarea,.search,.seg,.radios label,.suggest button{border-radius:4px!important}

.hb .track,.hb .fill,.wx-prog,.wx-prog i,.wx-bar,.wx-bar i,.split,.dist,.mirror .b{border-radius:1px!important}

.btn.primary,.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--surface)}

:root[data-theme="dark"] .btn.primary{background:var(--ink);border-color:var(--ink);color:#121210}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--ink);border-color:var(--ink);color:#121210}}
.link,.banner .link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink-4)}
/* 지표 */
.kpi:first-child{background:var(--hero)}

/* 대시보드 그래프 숫자 */

.sw,.sw.box{width:10px;height:10px;border-radius:2px}

let CH=[];
function mono(v,k=10){const n=v.length;if(n<3)return v.map((y,i)=>[i,y]);const d=[],m=[];for(let i=0;i<n-1;i++)d.push(v[i+1]-v[i]);
  m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}
  const out=[];for(let i=0;i<n-1;i++)for(let j=0;j<k;j++){const t=j/k,h00=2*t*t*t-3*t*t+1,h10=t*t*t-2*t*t+t,h01=-2*t*t*t+3*t*t,h11=t*t*t-t*t;out.push([i+t,h00*v[i]+h10*m[i]+h01*v[i+1]+h11*m[i+1]])}
  out.push([n-1,v[n-1]]);return out}
function lineChart({labels,series,min=0,max,step,unit='',w=680,h=260,mark,gap,forecastFrom,tipUnit}){
  const L=48,R=96,T=20,B=30,iw=w-L-R,ih=h-T-B,id=CH.length;
  const x=i=>L+i*iw/(labels.length-1), y=v=>T+ih-(v-min)/(max-min)*ih;
  let g='';
  for(let v=min;v<=max+1e-9;v+=step){g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--rule-2)"/><text x="${L-10}" y="${y(v)+4}" text-anchor="end" style="fill:var(--ink-4);font-size:11px">${fmt(Math.round(v))}${unit}</text>`}
  g+=`<line x1="${L}" x2="${L+iw}" y1="${y(min)}" y2="${y(min)}" style="stroke:var(--rule)"/>`;
  const every=labels.length>9?2:1;
  labels.forEach((l,i)=>{if(i%every===0||i===labels.length-1)g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle" style="fill:var(--ink-4);font-size:11px">${l}</text>`});
  if(forecastFrom!=null){g+=`<rect x="${x(forecastFrom-1)}" y="${T}" width="${x(labels.length-1)-x(forecastFrom-1)}" height="${ih}" style="fill:var(--sunken)"/><text x="${(x(forecastFrom-1)+x(labels.length-1))/2}" y="${T+14}" text-anchor="middle" style="fill:var(--ink-3);font-size:11.5px">예상</text>`}
  const sm=v=>mono(v);
  if(gap){const a=sm(gap[0]),b=sm(gap[1]);for(let i=0;i<a.length-1;i++){if(a[i][1]>b[i][1]||a[i+1][1]>b[i+1][1]){
    let t0=a[i][0],t1=a[i+1][0],a0=a[i][1],a1=a[i+1][1],b0=b[i][1],b1=b[i+1][1];
    if(a0<=b0){const t=(b0-a0)/((a1-a0)-(b1-b0));t0=t0+t*(t1-t0);a0=b0=a0+t*(a1-a0)}
    if(a1<=b1){const t=(b0-a0)/((a1-a0)-(b1-b0));t1=t0+t*(t1-t0);a1=b1=a0+t*(a1-a0)}
    g+=`<path d="M${x(t0)} ${y(a0)} L${x(t1)} ${y(a1)} L${x(t1)} ${y(b1)} L${x(t0)} ${y(b0)} Z" style="fill:var(--neg);opacity:.09"/>`}}}
  if(mark){const mx=x(mark.i);g+=`<line x1="${mx}" x2="${mx}" y1="${T}" y2="${T+ih}" style="stroke:var(--neg);stroke-dasharray:3 3"/><text x="${mx+6}" y="${T+12}" style="fill:var(--neg);font-size:12px;font-weight:600">${mark.text}</text>`}
  series.forEach(s=>{const d=sm(s.values).map(([t,v],i)=>(i?'L':'M')+x(t).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    if(s.area)g+=`<path d="${d} L${x(s.values.length-1)} ${y(min)} L${x(0)} ${y(min)} Z" style="fill:${s.color};opacity:.08"/>`;
    g+=`<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:${s.weak?1.5:2.4};stroke-linejoin:round;stroke-linecap:round${s.dash?';stroke-dasharray:4 4':''}"/>`;
    const li=s.values.length-1;g+=`<circle cx="${x(li)}" cy="${y(s.values[li])}" r="3.5" style="fill:${s.color}"/>`});
  const ends=series.map(s=>({s,yy:y(s.values[s.values.length-1])+4})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++)if(ends[i].yy-ends[i-1].yy<16)ends[i].yy=ends[i-1].yy+16;
  ends.forEach(e=>{g+=`<text x="${L+iw+10}" y="${e.yy}" style="fill:${e.s.color};font-size:12px;font-weight:600">${e.s.name} <tspan style="fill:var(--ink-3);font-weight:400">${fmt(e.s.values[e.s.values.length-1])}${unit}</tspan></text>`});
  g+=`<line class="cross" x1="0" x2="0" y1="${T}" y2="${T+ih}" style="stroke:var(--ink-4);visibility:hidden"/><rect x="${L}" y="${T}" width="${iw}" height="${ih}" style="fill:transparent" data-chart="${id}"/>`;
  CH.push({labels,series,L,iw,w,T,unit:tipUnit||unit});
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))} 추이">${g}</svg><div class="tip" hidden></div></div>`;
}
document.addEventListener('pointermove',e=>{
  const r=e.target.closest&&e.target.closest('rect[data-chart]');
  document.querySelectorAll('.chartbox').forEach(b=>{if(!r||!b.contains(r)){b.querySelector('.tip').hidden=true;const c=b.querySelector('.cross');if(c)c.style.visibility='hidden'}});
  if(!r)return;const c=CH[+r.dataset.chart];if(!c)return;const box=r.closest('.chartbox');const svg=box.querySelector('svg');const sr=svg.getBoundingClientRect();
  const sx=sr.width/c.w;const px=(e.clientX-sr.left)/sx;const n=c.labels.length;const i=Math.max(0,Math.min(n-1,Math.round((px-c.L)/(c.iw/(n-1)))));
  const cx=c.L+i*c.iw/(n-1);const cr=box.querySelector('.cross');cr.setAttribute('x1',cx);cr.setAttribute('x2',cx);cr.style.visibility='visible';
  const tip=box.querySelector('.tip');tip.innerHTML=`<b>${c.labels[i]}</b>`+c.series.map(s=>`<div><i style="background:${s.color}"></i>${s.name} <span class="tn">${fmt(s.values[i])}${c.unit}</span></div>`).join('');
  tip.hidden=false;let left=cx*sx;left=Math.max(80,Math.min(sr.width-80,left));tip.style.left=left+'px';tip.style.top=(c.T*sx)+'px';
});
function pairBars(labels,a,b){const w=680,h=240,L=36,R=6,T=14,B=26,iw=w-L-R,ih=h-T-B,n=labels.length;
  const mx=Math.ceil(Math.max(...a,...b)/100)*100,y=v=>T+ih-v/mx*ih,gw=iw/n,bw=Math.min(18,gw*.26);let g='';
  for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--rule-2)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" style="fill:var(--ink-4);font-size:11px">${v}</text>`}
  labels.forEach((l,i)=>{const cx=L+gw*i+gw/2,last=i===n-1,op=last?1:.78;
    g+=`<rect x="${cx-bw-1.5}" y="${y(a[i])}" width="${bw}" height="${y(0)-y(a[i])}" style="fill:var(--req);opacity:${op}"><title>${l} 주 · 도움 요청 ${a[i]}건</title></rect>`;

    if(a[i]>b[i])g+=`<text x="${cx}" y="${y(a[i])-6}" text-anchor="middle" style="fill:var(--neg);font-size:10.5px;font-weight:700">−${a[i]-b[i]}</text>`;
    g+=`<text x="${cx}" y="${h-7}" text-anchor="middle" style="fill:${last?'var(--ink)':'var(--ink-4)'};font-size:11px;font-weight:${last?700:400}">${last?'이번 주':l}</text>`});
  g+=`<line x1="${L}" x2="${L+iw}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--rule)"/>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="주별 도움 요청과 봉사 가능 공고 수">${g}</svg>`}
function hbars(rows,max,color,f=fmt){return `<div class="hbars">${rows.map(([k,v,col,on])=>`<div class="hb"><span>${on?`<button class="rowlink" type="button" onclick="${on}">${k}</button>`:k}</span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%;background:${col||color}"></div></div><span class="v">${f(v)}</span></div>`).join('')}</div>`}

function goRes(){requestAnimationFrame(()=>{const el=$('#simres');if(el&&el.getBoundingClientRect().top>innerHeight*0.6)el.scrollIntoView({block:'start'})})}
function runPolicy(i){S.policy=i;S.custom='';render();goRes()}
function runCustom(){const q=$('#simq').value.trim();if(!q){$('#simerr').textContent='시험해 볼 정책을 한 문장으로 써 주세요.';$('#simq').focus();return}
  if(!/\d|두 배|절반/.test(q)){$('#simerr').textContent='이 문장은 시험할 수 있는 항목으로 바꾸지 못했어요. 예시처럼 숫자를 넣어 써 주세요.';return}
  S.custom=q;S.policy=/20/.test(q)?1:/60/.test(q)?2:0;render();goRes()}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('복사했어요'),()=>toast('복사가 막혀 있어요. 문구를 직접 선택해 주세요'))}catch(e){toast('복사가 막혀 있어요. 문구를 직접 선택해 주세요')}}
function toNotice(from,title,body,pin){S.draft={from,title,body,pin};S.editNotice=null;location.hash='notices'}

/* ---------- 관리 공통 ---------- */
function filterSeg(cur,opts,fn){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" class="${cur===v?'on':''}" aria-pressed="${cur===v}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`}
function listDetail({cols,rows,sel,onSel,cell,detail,empty}){
  const cur=rows.find(r=>r.id===sel)||rows[0];
  const card=r=>{const p=cell(r).split('</td>').slice(0,-1).map(x=>x.replace(/^\s*<td[^>]*>/,''));const on=cur&&r.id===cur.id;
    const ti=/class="tag/.test(p[0])?1:0, st=p[p.length-1];
    const mid=p.map((v,i)=>[cols[i],v,i]).filter(([,,i])=>i!==ti&&i!==0&&i!==p.length-1);
    return `<div class="qc ${on?'on':''}" role="button" tabindex="0" aria-pressed="${on}" onclick="${onSel}(${r.id})" onkeydown="if(event.key==='Enter')${onSel}(${r.id})"><div class="qc-h"><span class="qc-t">${ti?p[0]+' ':''}${p[ti]}</span>${st}</div><dl class="qc-m">${mid.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl></div>`};
  return `<div class="cols c-list"><div class="qlist">${rows.length?rows.map(card).join(''):`<div class="qempty">${empty}</div>`}</div>
    <section class="panel qdetail"><div class="panel-b" style="padding-top:20px">${cur?detail(cur):'<div class="empty">목록에서 항목을 선택하세요</div>'}</div></section></div>`;
}

     <div class="btns"><button class="btn danger" type="button" onclick="rejectAppr(${r.id})">반려</button><button class="btn primary" type="button" ${block?'disabled':''} onclick="approve(${r.id})">승인</button></div>${block?`<p class="hint warn">${block}</p>`:''}`}`}});
}
function setApprF(v){S.apprF=v;S.apprSel=null;render()}
function selAppr(id){S.apprSel=id;render()}
function nextPending(list,id){const p=list.filter(x=>x.st==='대기'&&x.id!==id);return p.length?p[0].id:null}
function approve(id){const r=AP[S.appr].list.find(x=>x.id===id);S.apprSel=nextPending(AP[S.appr].list,id);r.st='승인';render();toast(`${r.name}, 승인했어요. 신청자에게 알림을 보냈어요`)}
function rejectAppr(id){const r=AP[S.appr].list.find(x=>x.id===id);
  confirmBox({title:`${r.name} 신청을 반려할까요?`,text:'반려 사유는 신청자에게 그대로 전달돼요.',ok:'반려하기',danger:true,
   extra:`<div class="field"><label for="rr">반려 사유</label><input id="rr" type="text" autofocus placeholder="예) 사업자등록증 글자가 흐려서 읽을 수 없어요"></div>`,
   onOk:()=>{const v=$('#rr').value.trim();if(v.length<5){$('#dlgerr').textContent='반려 사유를 5자 이상 적어 주세요.';$('#rr').classList.add('bad');return false}
     S.apprSel=nextPending(AP[S.appr].list,id);r.st='반려';r.reason=v;render();toast(`${r.name}, 반려했어요`)}})}

/* ---------- A-07 신고 ---------- */
function vFlags(){
  const rows=FLAGS.filter(r=>S.flagF==='전체'||r.st===S.flagF);

  listDetail({cols:['사유','대상','신고자','날짜','상태'],rows,sel:S.flagSel,onSel:'selFlag',empty:'검토할 신고 없음',cell:r=>`<td><b style="font-weight:600">${r.why}</b></td><td>${r.target}</td><td>${r.by}</td><td class="tn">${r.date}</td><td>${status(r.st)}</td>`,
   detail:r=>`<div class="detail-h"><h3>${r.why}</h3>${status(r.st)}</div><dl class="props"><dt>대상</dt><dd>${r.full} (${r.target.split(' ')[0]})</dd><dt>신고자</dt><dd>${r.by}</dd><dt>날짜</dt><dd class="tn">${r.date}</dd><dt>신고 내용</dt><dd>${r.body}</dd><dt>관련 기록</dt><dd>${r.log}</dd>${r.result?`<dt>처리 결과</dt><dd>${esc(r.result)}</dd>`:''}</dl>
     ${r.st==='검토 중'?`<div class="field" style="margin-top:18px"><label for="memo">처리 메모</label><textarea id="memo" style="min-height:84px" placeholder="처리 사유 (경고 · 이용 정지는 필수)"></textarea><div class="err" id="memoerr"></div></div>
     <div class="btns"><button class="btn" type="button" onclick="flagDo(${r.id},'기각')">기각</button><button class="btn" type="button" onclick="flagDo(${r.id},'경고')">경고</button><button class="btn danger" type="button" onclick="flagDo(${r.id},'이용 정지')">이용 정지</button></div>`:''}`});
}
function setFlagF(v){S.flagF=v;S.flagSel=null;render()}
function selFlag(id){S.flagSel=id;render()}
function flagDo(id,act){const r=FLAGS.find(x=>x.id===id);const memo=$('#memo').value.trim();
  if(act!=='기각'&&!memo){$('#memoerr').textContent='처리 이유를 남겨 주세요.';$('#memo').classList.add('bad');$('#memo').focus();return}
  const finish=extra=>{r.st='처리 완료';r.result=act+(extra?` ${extra}`:'')+(memo?` · ${memo}`:'');S.flagSel=nextPendingF(id);render();toast(`${act} 처리했어요. 신고자에게 결과를 알렸어요`)};
  if(act==='이용 정지'){confirmBox({title:`${r.full} 님을 이용 정지할까요?`,text:'정지 기간 동안 공고 쓰기, 신청, 메시지가 막히고 예정된 활동은 취소돼요.',ok:'이용 정지',danger:true,
    extra:`<div class="radios" role="radiogroup" aria-label="정지 기간">${['7일','30일','영구'].map((d,i)=>`<label><input type="radio" name="days" value="${d}" ${i===0?'checked':''}>${d}</label>`).join('')}</div>`,
    onOk:()=>finish(document.querySelector('input[name=days]:checked').value)});return}
  finish('');
}
function nextPendingF(id){const p=FLAGS.filter(x=>x.st==='검토 중'&&x.id!==id);return p.length?p[0].id:null}

/* ---------- A-08 문의 ---------- */
function vInq(){
  const rows=INQ.filter(r=>S.inqF==='전체'||r.st===S.inqF);
  return head('inquiries')+`<div class="toolbar"><div class="tb-l">미답변 <b>${INQ.filter(x=>x.st==='미답변').length}</b>건 · 전체 ${INQ.length}건</div><div class="filters">${filterSeg(S.inqF,[['미답변','미답변'],['답변 완료','답변 완료'],['전체','전체']],'setInqF')}</div></div>`+
  listDetail({cols:['유형','제목','날짜','상태'],rows,sel:S.inqSel,onSel:'selInq',empty:'답변할 문의 없음',cell:r=>`<td><span class="tag">${r.type}</span></td><td><b style="font-weight:600">${r.title}</b></td><td class="tn">${r.date}</td><td>${status(r.st)}</td>`,
   detail:r=>`<div class="detail-h"><div><h3>${r.title}</h3><div class="note" style="margin-top:2px">${r.type} · ${r.date} · ${r.by}</div></div>${status(r.st)}</div><p style="margin:0 0 18px;padding:12px 14px;background:var(--sunken);border-radius:8px">${r.body}</p>
     ${r.answer&&!r.editing?`<div class="answer"><small>보낸 답변${r.edited?' · 수정됨':''}</small>${esc(r.answer)}</div><button class="btn" type="button" onclick="INQ.find(x=>x.id===${r.id}).editing=true;render()">답변 고치기</button>`:
     `<div class="field"><label for="ans">답변</label><textarea id="ans" maxlength="1000" placeholder="쉬운 말로, 한 줄에 한 가지씩 써 주세요">${r.answer?esc(r.answer):''}</textarea><div class="err" id="anserr"></div></div><div class="btns">${r.editing?`<button class="btn" type="button" onclick="INQ.find(x=>x.id===${r.id}).editing=false;render()">취소</button>`:''}<button class="btn primary" type="button" onclick="answer(${r.id})">${r.editing?'고친 답변 저장':'답변 등록'}</button></div>`}`});
}
function setInqF(v){S.inqF=v;S.inqSel=null;render()}
function selInq(id){S.inqSel=id;render()}
function answer(id){const r=INQ.find(x=>x.id===id);const v=$('#ans').value.trim();if(!v){$('#anserr').textContent='답변을 써 주세요.';$('#ans').classList.add('bad');$('#ans').focus();return}
  const was=!!r.answer;r.answer=v;r.st='답변 완료';if(was)r.edited=true;r.editing=false;if(!was&&S.inqF==='미답변'){const p=INQ.filter(x=>x.st==='미답변');S.inqSel=p.length?p[0].id:null}render();toast(was?'답변을 고쳤어요':'답변을 등록했어요. 회원에게 알림을 보냈어요')}

/* ---------- A-09 공지사항 ---------- */
function vNotices(){
  const d=S.draft,e=NOTICES.find(n=>n.id===S.editNotice);const v=e||d||{};
  return head('notices')+`<div class="toolbar"><div class="tb-l">공지 <b>${NOTICES.length}</b>개 · 상단 고정 ${NOTICES.filter(n=>n.pin).length}/3</div><div class="filters"><button class="btn sm" type="button" onclick="newNotice()">새 공지 쓰기</button></div></div><div class="cols c-list">
    <div class="qlist">${[...NOTICES].sort((a,b)=>(b.pin-a.pin)||b.id-a.id).map(n=>`<div class="qc ${e&&e.id===n.id?'on':''}" role="button" tabindex="0" onclick="editNotice(${n.id})" onkeydown="if(event.key==='Enter')editNotice(${n.id})"><div class="qc-h"><span class="qc-t">${esc(n.title)}</span>${n.pin?'<span class="tag pin">상단 고정</span>':''}</div><dl class="qc-m"><div><dt>게시일</dt><dd class="tn">${n.date}</dd></div><div><dt>본문</dt><dd class="clip">${esc((n.body||'').split('\n')[0])}</dd></div></dl></div>`).join('')}</div>
    <section class="panel"><div class="panel-h"><h2>${e?'공지 고치기':'새 공지'}</h2>${e||d?`<button class="link" type="button" onclick="newNotice()">${e?'새 공지 쓰기':'비우기'}</button>`:''}</div><div class="panel-b">
      ${d&&!e?`<div class="context" style="margin-bottom:14px;padding:10px 12px;background:var(--sunken);border-radius:8px">${d.from} · 확인 후 등록</div>`:''}
      <div class="field"><label for="nt">제목</label><input id="nt" type="text" maxlength="50" value="${esc(v.title||'')}" placeholder="예) 12월 동행 봉사자 모집"><div class="err" id="nterr"></div></div>
      <div class="field"><label for="nb">본문</label><textarea id="nb" maxlength="2000" placeholder="본문">${esc(v.body||'')}</textarea></div>
      <label class="check"><input id="pin" type="checkbox" ${v.pin?'checked':''}> 상단에 고정하기 <span class="note">사용자 앱 상단 노출 · 최대 3개</span></label>
      <div id="polish"></div><div class="err" id="pinerr" style="margin-bottom:10px"></div>
      <div class="btns" style="justify-content:space-between"><button class="btn" type="button" onclick="polish()">AI로 문장 다듬기</button><span class="btns">${e?`<button class="btn danger" type="button" onclick="delNotice(${e.id})">삭제</button>`:''}<button class="btn primary" type="button" onclick="saveNotice()">${e?'고친 내용 저장':'등록'}</button></span></div></div></section></div>`;
}
function editNotice(id){S.editNotice=id;S.draft=null;render()}
function newNotice(){S.editNotice=null;S.draft=null;render()}
let POL='';
function polish(){const b=$('#nb').value.trim();if(!b){toast('다듬을 본문을 먼저 써 주세요');$('#nb').focus();return}
  POL=b.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.replace(/^-\s*/,'').replace(/해 주세요\./,'해 주세요.')).join('\n');
  $('#polish').innerHTML=`<div style="border:1px solid var(--rule);border-radius:8px;padding:14px;margin-bottom:14px">${insight(`<p style="white-space:pre-line">${esc(POL)}</p>`,'공지 문체 기준(쉬운 존댓말, 한 줄에 한 행동), 원래 문장','다듬은 문장')}<div class="btns" style="margin-top:10px;justify-content:flex-end"><button class="btn sm" type="button" onclick="$('#polish').innerHTML=''">원래대로 두기</button><button class="btn sm primary" type="button" onclick="$('#nb').value=POL;$('#polish').innerHTML=''">이 문장으로 바꾸기</button></div></div>`}
function saveNotice(){const t=$('#nt').value.trim(),b=$('#nb').value.trim(),pin=$('#pin').checked;
  if(!t){$('#nterr').textContent='제목을 써 주세요.';$('#nt').classList.add('bad');$('#nt').focus();return}
  const e=NOTICES.find(n=>n.id===S.editNotice);
  if(pin&&NOTICES.filter(n=>n.pin&&(!e||n.id!==e.id)).length>=3){$('#pinerr').textContent='고정 공지는 3개까지예요. 다른 공지의 고정을 먼저 풀어 주세요.';return}
  if(e){Object.assign(e,{title:t,body:b,pin});toast('공지를 고쳤어요')}else{const id=Math.max(...NOTICES.map(n=>n.id))+1;NOTICES.push({id,title:t,body:b,pin,date:'11/16'});toast(pin?'공지를 등록했어요. 고정 공지라 회원에게 알림이 갔어요':'공지를 등록했어요')}
  S.draft=null;S.editNotice=null;render()}
function delNotice(id){const n=NOTICES.find(x=>x.id===id);confirmBox({title:'이 공지를 삭제할까요?',text:`"${esc(n.title)}" 공지가 회원 앱에서도 바로 사라져요.`,ok:'삭제',danger:true,onOk:()=>{NOTICES=NOTICES.filter(x=>x.id!==id);S.editNotice=null;render();toast('공지를 삭제했어요')}})}

/* ---------- A-10 카테고리 건의 ---------- */
function vCategories(){
  return head('categories')+`<div class="toolbar"><div class="tb-l">처리할 건의 <b>${CATREQ.length}</b>건</div></div>${CATREQ.length?`<div class="catgrid">${CATREQ.map(c=>`<article class="catc"><div class="catc-top"><h3>${c.name}</h3><span class="catc-cnt"><b class="tn">${c.same}</b>명 같은 건의</span></div><p>${c.desc}</p><div class="catc-meta">처음 건의 ${c.by} · <span class="tn">${c.date}</span></div><div class="btns"><button class="btn sm danger" type="button" onclick="rejectCat(${c.id})">반려</button><button class="btn sm primary" type="button" onclick="approveCat(${c.id})">승인</button></div></article>`).join('')}</div>`:`<div class="qempty">처리할 건의 없음</div>`}
    <p class="note" style="margin:0">승인 시 공고 작성 카테고리에 즉시 추가 · 위생 · 안전 문제는 반려 사유 필수</p>`;
}
function approveCat(id){const c=CATREQ.find(x=>x.id===id);CATREQ=CATREQ.filter(x=>x.id!==id);render();toast(`"${c.name}" 카테고리를 추가했어요. 건의한 ${c.same}명에게 알렸어요`)}
function rejectCat(id){const c=CATREQ.find(x=>x.id===id);confirmBox({title:`"${c.name}" 건의를 반려할까요?`,text:`건의한 ${c.same}명에게 사유와 함께 알림이 가요.`,ok:'반려하기',danger:true,
  extra:`<div class="field"><label for="cr">반려 사유</label><input id="cr" type="text" autofocus placeholder="예) 반려동물 물림 사고 위험이 있어요"></div>`,
  onOk:()=>{const v=$('#cr').value.trim();if(!v){$('#dlgerr').textContent='반려 사유를 적어 주세요.';$('#cr').classList.add('bad');return false}CATREQ=CATREQ.filter(x=>x.id!==id);render();toast(`"${c.name}" 건의를 반려했어요`)}})}

/* ---------- A-11 공공 서비스 정보 ---------- */
function vServices(){
  const q=S.svcQ.trim();const rows=SERVICES.filter(s=>!q||(s.name+s.tags).includes(q)).sort((a,b)=>(b.on-a.on)||a.name.localeCompare(b.name,'ko'));
  return head('services',`<button class="btn sm primary" type="button" onclick="openSvc(null)">서비스 등록</button>`)+`<section class="panel"><div class="panel-b" style="padding-bottom:0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center">${insight('공공 서비스 안내 AI는 <strong>이 목록에서 사용 중인 서비스만</strong> 근거로 답해요. 저장하면 바로 반영돼요.','','안내')}<input class="search" id="svcq" type="text" placeholder="서비스 이름이나 태그로 찾기" value="${esc(S.svcQ)}" oninput="S.svcQ=this.value;renderKeep('svcq')"></div>
  <div class="tw" style="margin-top:12px"><table><thead><tr><th>서비스</th><th>대상</th><th>신청 기관</th><th>전화</th><th>검색 태그</th><th>상태</th><th></th></tr></thead><tbody>
    ${rows.length?rows.map(s=>`<tr class="${s.on?'':'off'}"><td><b style="font-weight:600">${esc(s.name)}</b></td><td>${esc(s.target)}</td><td>${esc(s.org)}</td><td class="tn" style="white-space:nowrap">${esc(s.phone)}</td><td><span class="muted">${esc(s.tags)}</span></td><td>${s.on?'<span class="status ok">사용 중</span>':'<span class="status">사용 중지</span>'}</td><td><button class="btn sm" type="button" onclick="openSvc(${s.id})">수정</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">"${esc(q)}"에 맞는 서비스가 없어요.</td></tr>`}</tbody></table></div></section>`;
}
function renderKeep(id){const el=$('#'+id);const pos=el.selectionStart;render();const n=$('#'+id);n.focus();n.setSelectionRange(pos,pos)}
function openSvc(id){const s=SERVICES.find(x=>x.id===id)||{name:'',target:'',org:'',phone:'',link:'',tags:'',ai:'',on:true};S.svcEdit=id;
  const f=(k,l,ph,req,max)=>`<div class="field"><label for="sv_${k}">${l}${req?' <span class="note">필수</span>':''}</label><input id="sv_${k}" type="text" ${max?`maxlength="${max}"`:''} value="${esc(s[k])}" placeholder="${ph}"><div class="err" id="sv_${k}_e"></div></div>`;
  $('#layer').innerHTML=`<div class="drawer-scrim" onclick="closeLayer()"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dwt"><div class="drawer-h"><h3 id="dwt">${id?'공공 서비스 고치기':'공공 서비스 등록'}</h3><button class="btn sm" type="button" onclick="closeLayer()">닫기</button></div>
   <div class="drawer-b">${f('name','서비스 이름','예) 노인맞춤돌봄서비스',1,40)}${f('target','대상','누가 신청할 수 있는지',1,80)}${f('org','신청 기관','예) 행정복지센터','',40)}${f('phone','전화','예) 02-123-4567','',20)}${f('link','링크','https:// 로 시작','',200)}${f('tags','검색 태그','쉼표로 나눠 주세요. 예) 난방, 겨울','',80)}
   <div class="field"><label for="sv_ai">AI가 쓸 설명</label><textarea id="sv_ai" maxlength="500" placeholder="AI가 회원에게 설명할 때 쓸 문장">${esc(s.ai)}</textarea></div>
   ${id?`<label class="switch"><input id="sv_on" type="checkbox" ${s.on?'checked':''}> 사용 중 <span class="note">끄면 AI가 이 서비스를 안내하지 않아요</span></label>`:''}</div>
   <div class="drawer-f"><button class="btn" type="button" onclick="closeLayer()">취소</button><button class="btn primary" type="button" onclick="saveSvc()">저장</button></div></aside>`;
  setTimeout(()=>$('#sv_name').focus(),0)}
function saveSvc(){const g=k=>$('#sv_'+k).value.trim();let ok=true;
  const err=(k,m)=>{$('#sv_'+k+'_e').textContent=m;$('#sv_'+k).classList.add('bad');ok=false};
  ['name','target','phone','link'].forEach(k=>{$('#sv_'+k+'_e').textContent='';$('#sv_'+k).classList.remove('bad')});
  if(!g('name'))err('name','서비스 이름을 써 주세요.');if(!g('target'))err('target','대상을 써 주세요.');
  if(g('phone')&&!/^[0-9-]{7,14}$/.test(g('phone')))err('phone','전화번호 형식을 확인해 주세요.');
  if(g('link')&&!/^https?:\/\//.test(g('link')))err('link','링크는 http:// 나 https:// 로 시작해야 해요.');
  if(!ok)return;
  const data={name:g('name'),target:g('target'),org:g('org'),phone:g('phone'),link:g('link'),tags:g('tags'),ai:$('#sv_ai').value.trim()};
  if(S.svcEdit){const s=SERVICES.find(x=>x.id===S.svcEdit);Object.assign(s,data,{on:$('#sv_on').checked})}else{SERVICES.push({id:Math.max(...SERVICES.map(x=>x.id))+1,...data,on:true})}
  const was=S.svcEdit;closeLayer();render();toast(was?'저장했어요. AI 안내에 바로 반영돼요':'등록했어요. AI 안내에 바로 반영돼요')}

/* ---------- 라우팅 ---------- */
const VIEWS={dashboard:vDashboard,usage:vUsage,forecast:vForecast,alerts:vAlerts,approvals:vApprovals,flags:vFlags,inquiries:vInq,notices:vNotices,categories:vCategories};
function cur(){const h=location.hash.slice(1);return VIEWS[h]?h:'dashboard'}
function render(){CH=[];const id=cur();renderNav(id);$('#main').innerHTML=VIEWS[id]();const ph=$('#main>.pagehead');if(ph)$('#top').replaceChildren(ph)}
let lastView=cur();
addEventListener('hashchange',()=>{if($('#layer').innerHTML)closeLayer();render();if(cur()!==lastView){scrollTo(0,0);lastView=cur();$('#toast').hidden=true}});
