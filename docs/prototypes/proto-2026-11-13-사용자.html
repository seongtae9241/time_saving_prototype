/* 대화형 봉사 요청 공고 (작성 도우미 AI) */
let wn={msgs:[],step:0,d:{}};
let forFamily=null;
function wnReset(){wn={msgs:[{a:1,t:forElder?`${EL(forElder).alias} 대신 봉사 요청 공고를 만들어 볼게요. 어떤 도움이 필요하신가요?`:forFamily?`${forFamily} 님 대신 공고를 만들어 볼게요. 어머니께 어떤 도움이 필요하세요? 최종 수락은 어머니가 직접 하세요.`:'어떤 도움이 필요하세요? 편하게 말해 주시면 제가 공고로 정리할게요.'}],step:0,d:{}};}
const WNQ=[null,['몇 시부터 몇 시 사이가 괜찮으세요?',['오후 2시~5시','오전 10시~12시','저녁 6시~8시']],['어디서 도와드리면 될까요?',null]];
SCREENS.write_need=()=>{if(!wn.msgs.length)wnReset();
 const qs=wn.step===0?(forElder?['다음 주 화요일 오전에 병원 같이 가 줄 사람','이번 주 금요일 장보기 도와줄 사람','약 챙겨서 먹여 줄 사람']:['다음 주 수요일 오후에 폰 사진 옮기는 거 도와줄 사람','주말에 같이 장 봐줄 사람','약 챙겨서 먹여 줄 사람']):wn.step===1?WNQ[1][1]:wn.step===2?(forElder?['대상 집 (주소는 담당자가 안내)','행복동 주민센터']:['우리 집','근처 카페','행복동 주민센터']):[];
 let firstAI=true;const msgs=wn.msgs.map(m=>{if(m.card)return `<div class="mrow"><span class="bot">${LOGO}</span><div class="mcol wide">${m.card}</div></div>`;if(m.a){const n=firstAI?'<div class="bot-n">작성 도우미</div>':'';firstAI=false;return `<div class="mrow"><span class="bot">${LOGO}</span><div class="mcol">${n}<div class="msg ai-m">${m.t}</div></div></div>`;}return `<div class="msg me">${m.t}</div>`;}).join('');
 const done=wn.msgs.some(m=>m.card);
 return{title:forElder?`${EL(forElder).alias} 대신 공고`:forFamily?'가족 대신 공고':'봉사 요청 공고',noTabs:true,cls:'chatv',html:`<div class="chat-wrap"><div class="chat-day"><span>AI가 공고를 정리해요 · ${MODS[1]}</span></div><div class="chat">${msgs}</div></div>
 <div class="chat-dock">${done&&!wn.blocked?'':`<div class="qr-row"><div class="qr">${qs.map(q=>`<button data-act="wnSay" data-v="${q}">${q}</button>`).join('')}</div><button class="qr-reset" data-act="wnReset">↺ 처음부터</button></div><form class="composer" data-form="wn"><button type="button" class="mic" data-act="voice" data-v="wn" aria-label="음성 입력">${I.mic}</button><input class="in" id="wnin" placeholder="말하듯 적어 주세요"><button type="submit" aria-label="보내기">${I.send}</button></form>`}</div>`,mount(){const b=$('#bd');b.scrollTop=b.scrollHeight;}};};
function wnSay(t){wn.msgs.push({a:0,t});
 if(/처음부터/.test(t)){wnReset();return render();}
 if(wn.step===0){
  const j=judge(t,'');
  if(j.lv==='불가'){wn.blocked=true;wn.msgs.push({card:j.html+pubCards(['장기요양 방문요양·방문목욕','노인맞춤돌봄서비스'],true)});wn.msgs.push({a:1,t:'대신 말벗, 장보기, 동행, 디지털 도움처럼 이웃이 할 수 있는 일은 공고로 올릴 수 있어요.'});return render();}
  wn.blocked=false;
  wn.d.cat=/폰|사진|키오스크|휴대폰|영상통화/.test(t)?'디지털 도움':/장/.test(t)?'장보기·심부름':/병원/.test(t)?'동행':/정리/.test(t)?'생활 정리':/청소|빨래/.test(t)?'가벼운 집안일':'말동무·정서';
  wn.d.title=wn.d.cat==='디지털 도움'?'휴대폰 사진 옮기기':wn.d.cat==='장보기·심부름'?'장보기 같이 하기':wn.d.cat==='동행'?'병원 진료 동행':'도움 요청';
  wn.d.date=/수요일/.test(t)?'11/12(수)':/화요일/.test(t)?'11/18(화)':/금요일/.test(t)?'11/14(금)':'11/15(토)';
  wn.step=1;wn.msgs.push({a:1,t:`${wn.d.date}에 <b>${SHORT[wn.d.cat]}</b> 도움이 필요하시군요. ${WNQ[1][0]}`});return render();}
 if(wn.step===1){const m=t.match(/(오전|오후|저녁)?\s*(\d+)시\s*~\s*(\d+)시/);let s=14,e=17;if(m){s=+m[2];e=+m[3];if(m[1]&&m[1]!=='오전'&&s<12){s+=12;e+=12;}}wn.d.s=s;wn.d.e=e;wn.step=2;wn.msgs.push({a:1,t:WNQ[2][0]});return render();}
 if(wn.step===2){wn.d.place=t;wn.step=3;wn.msgs.push({a:1,t:'잠깐만요, 공고로 정리해 볼게요.'});render();setTimeout(()=>{wn.msgs.push({card:wnCard()});render();},900);}
}
function wnCard(){const d=wn.d;d.hours=d.cat==='동행'?2.5:d.cat==='장보기·심부름'?1.5:1;const j=judge(d.title,d.cat);
 const json=JSON.stringify({type:'봉사 요청 공고',date:d.date,time_range:[hh(d.s),hh(d.e)],place:d.place,category:d.cat,detail:d.title,difficulty:LV(d.cat),expected_hours:d.hours,filter:'허용'},null,1);
 return `<div class="ai"><div class="ah">${spk}AI가 정리한 공고${M(1)}</div><dl class="kv"><dt>종류</dt><dd>${d.cat}</dd><dt>내용</dt><dd>${d.title}</dd><dt>날짜</dt><dd>${d.date}</dd><dt>시간 범위</dt><dd>${hh(d.s)} ~ ${hh(d.e)}</dd><dt>장소</dt><dd>${d.place}</dd></dl>${tbar(d.s,d.e)}
 <details style="margin-top:10px"><summary class="mute2" style="cursor:pointer">AI가 만든 JSON 보기</summary><pre class="json">${json}</pre></details></div>
 <div class="ai" style="margin-top:8px"><div class="ah">${spk}난이도·예상 적립${M(2)}</div><div class="between"><span class="small">${d.hours}시간 × ${LV(d.cat)} ${W(d.cat).toFixed(1)}</span><b class="cr plus">+${fmt(d.hours*W(d.cat))}시간</b></div><div class="small muted">금지 요청 확인: 허용 ✓ · ${forElder?'기관 대상이라 시간 차감 없음':'완료 후 실제 시간만큼 차감'}</div></div>
 <div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="wnReset">다시 쓰기</button><button class="btn" data-act="wnPost">공고 등록</button></div>`;}

SCREENS.r_detail=({id})=>{const r=RR(id);const iVol=r.vol==='me';const other=iVol?(r.elder?null:r.recv):r.vol;const h=other?D.H[other]:null;

 else if(r.st==='log'&&r.recv==='me') act=`<div class="ai" style="margin-top:16px"><div class="ah">${spk}활동 일지${M(3)}</div><ul class="small">${r.log.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="sum" style="margin-top:10px"><div class="between"><span class="muted">예정 시간</span><b>${r.h}시간</b></div><div class="between"><span class="muted">내 통장에서 차감</span><b class="cr minus">−${fmt(r.h)}시간</b></div><div class="between"><span class="muted">${nm(r.vol)} 님 적립</span><b class="cr plus">+${hmTxt(earn(r))}</b></div></div><div class="btns" style="margin-top:12px"><button class="btn ghost" data-act="rAdjust" data-v="${id}">시간 조정 요청</button><button class="btn" data-act="rConfirm" data-v="${id}">확인했어요</button></div><div class="mute2 center" style="margin-top:8px">24시간 안에 확인하지 않으면 자동 확정돼요</div>`;
 else if(r.st==='log') act=`<div class="notice" style="margin-top:16px">일지를 제출했어요. ${r.elder?'담당자':'상대'}가 확인하면 적립돼요 (24시간 뒤 자동 확정).</div>`;

 return{title:r.kind==='proposal'?'봉사 제안':r.kind==='regular'?'단골 요청':'도움 요청',noTabs:true,html:`

 ${r.st==='vol_ok'&&r.recv==='me'?`<div class="intro" style="margin-top:14px"><div class="mute2" style="margin-bottom:10px">${h.name} 님이 수락했어요 · 소개 카드</div><div class="row" style="gap:14px"><div class="ph">${h.name[0]}</div><div class="grow"><div class="b" style="font-size:18px">${h.name} <span class="mute2" style="font-weight:500">${h.age}</span></div><div>${stars(h.rating)} <span class="mute2">· 활동 ${h.cnt}회</span></div><div class="tags" style="margin-top:6px">${h.crime?'<span class="badge trust">✓ 범죄경력 확인</span>':''}${isReg(r.vol,'me')?'<span class="badge">★ 내 단골</span>':''}</div></div></div><div class="small" style="margin-top:12px">"${h.intro}"</div><div class="mute2" style="margin-top:6px">${h.exp}</div><div class="tags" style="margin-top:8px">${h.tags.map(t=>`<span class="tag2">${t}</span>`).join('')}</div></div>`:''}
 ${r.elder&&iVol?`<div class="lock" style="margin-top:14px">${ic('users',18)}<div><b>${EL(r.elder).alias}</b> · ${EL(r.elder).dong} · 기관 등록 대상<div style="margin-top:4px">${EL(r.elder).caution}</div><div style="margin-top:6px;opacity:.85">${r.st==='confirmed'?'방문 장소는 아래 메시지로 담당자가 알려드렸어요.':'수락되면 담당자가 방문 장소를 따로 알려드려요.'} 이 활동은 받는 분의 시간이 차감되지 않아요.</div></div></div>`:''}

 <div class="card" style="margin-top:10px"><div class="row" style="gap:12px">${catIc(r.cat,44)}<div class="grow"><div class="b" style="font-size:16.5px">${r.content}</div><div class="mute2">${r.cat} · ${LV(r.cat)} ${W(r.cat).toFixed(1)}</div></div></div><div class="divider"></div><dl class="kv"><dt>일시</dt><dd>${r.date} ${hh(r.s)} ~ ${hh(r.s+r.h)} (${r.h}시간)</dd><dt>봉사자 적립</dt><dd class="cr plus">+${hmTxt(earn(r))}</dd>${r.memo?`<dt>메모</dt><dd>${r.memo}</dd>`:''}</dl></div>

function pav(n,s=40){const c=PAV[[...n].reduce((a,ch)=>a+ch.charCodeAt(0),0)%PAV.length];return `<span class="pav" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.4)}px;background:${c[0]};color:${c[1]}">${n[0]}</span>`;}

 const T={acc:['내 요청을 수락했어요','최종 확정'],offer:['내 글에 돕겠대요','수락 / 거절'],done:['활동이 끝났어요','일지 확인'],ask:['도움을 요청했어요','수락 / 거절'],org:['기관이 부탁했어요','수락 / 거절']}[ty];
 const dl=r.left&&['sent','vol_ok'].includes(r.st)?` · <em class="w-dl2">${r.left} 남음</em>`:'';
 return `<div class="wcard t-${ty} click" data-ty="${ty}" data-go="r_detail" data-id="${r.id}"><div class="w-top">${pav(who,26)}<div class="w-nm">${who} 님${dl}</div></div>

 const g={};need.forEach(r=>{const t=wType(r);(g[t]=g[t]||[]).push(r);});const ks=order.filter(k=>g[k]);const first=ks[0];
 return `<div class="wfold f-${first}"><div class="wtabs">${ks.map(k=>`<button class="wt t-${k} ${k===first?'on':''}" data-act="wTab" data-v="${k}">${L[k]} <b>${g[k].length}</b></button>`).join('')}</div>

/* QR */
function qrSvg(seed=7,size=180){let s=seed;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};const N=25,c=size/N;let r='';
 const fin=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#111"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#111"/>`;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if((x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9))continue;if(rnd()>.52)r+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#111"/>`;}
 return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="background:#fff">${r}${fin(0,0)}${fin(N-7,0)}${fin(0,N-7)}</svg>`;}

const PL={age:56,start:72,month:4,needs:{'동행':2,'장보기·심부름':2,'말동무·정서':1},gift:0,done:false};
const NEEDS=[['동행','병원 동행',2],['장보기·심부름','장보기',2],['말동무·정서','말동무',2],['디지털 도움','폰·디지털',1],['가벼운 집안일','집안일',2],['생활 정리','생활 정리',1]];
function plCalc(){const B=D.me.bal,yrs=Math.max(0,PL.start-PL.age);const saved=B+PL.month*12*yrs-PL.gift;const use=Object.values(PL.needs).reduce((a,b)=>a+b,0)*12;const last=use?saved/use:99;const end=PL.start+last;
 const pts=[];for(let y=PL.age;y<=95;y++){let v=y<=PL.start?B+PL.month*12*(y-PL.age)-PL.gift*(y-PL.age)/Math.max(1,yrs):saved-use*(y-PL.start);pts.push([y,Math.max(0,v)]);}
 return {saved,use,last,end,pts,need90:Math.max(0,(90-PL.start)*use-saved)};}
function plChart(c){const W=320,H=180,pl=6,pr=6,pt=34,pb=24;const mx=Math.max(...c.pts.map(p=>p[1]))*1.12||1;const x=a=>pl+(a-PL.age)/(95-PL.age)*(W-pl-pr),y=v=>pt+(H-pt-pb)*(1-v/mx);
 const line=c.pts.map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`).join(' ');const area=line+` L${x(95)} ${H-pb} L${x(PL.age)} ${H-pb}Z`;
 const sx=x(PL.start),ex=x(Math.min(95,c.end));
 return `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="plg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5B8DEF" stop-opacity=".35"/><stop offset="1" stop-color="#5B8DEF" stop-opacity="0"/></linearGradient></defs>
 <rect x="${x(PL.age)}" y="${pt-30}" width="${sx-x(PL.age)}" height="${H-pb-pt+30}" fill="#F3F6FF" rx="8"/><rect x="${sx}" y="${pt-30}" width="${Math.max(0,ex-sx)}" height="${H-pb-pt+30}" fill="#FFF5EA" rx="8"/>
 <text x="${(x(PL.age)+sx)/2}" y="${pt-18}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5B8DEF">모으는 시기</text><text x="${(sx+ex)/2}" y="${pt-18}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#E07A2E">쓰는 시기</text>
 <path d="${area}" fill="url(#plg)"/><path d="${line}" fill="none" stroke="#5B8DEF" stroke-width="3" stroke-linejoin="round"/>
 <circle cx="${sx}" cy="${y(c.saved)}" r="5.5" fill="#5B8DEF" stroke="#fff" stroke-width="2.5"/><g transform="translate(${Math.min(W-76,sx+8)} ${y(c.saved)+6})"><rect width="68" height="21" rx="10.5" fill="#1B1D22"/><text x="34" y="14.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${Math.round(c.saved)}시간</text></g>
 ${[PL.age,60,70,80,90].filter(a=>a===PL.age||a-PL.age>=6).map(a=>`<text x="${x(a)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#9AA1AC">${a}세</text>`).join('')}</svg>`;}

 {age:`${PL.age+5}세 ~ ${PL.start-1}세`,t:'몸이 가벼울 때 더 모으기',d:'동행(1.5배)·장보기(1.2배)를 섞으면 같은 시간에 더 많이 쌓여요.',c:'#1F9D63'},

 {age:'언제든',t:'가족에게 선물',d:'부모님께 지금 필요한 만큼 선물할 수 있어요. 내 계획에서 그만큼 빠져요.',c:'#E2457A'}];}

 <div class="ai" style="margin-top:12px"><div class="ah">${spk}AI 조언${M(4)}</div><div class="small">${ok?`지금 속도면 충분해요. 남는 시간은 ${PL.start}세 전후로 부모님께 선물하는 것도 좋아요.`:`90세까지 쓰려면 <b>${Math.round(c.need90)}시간</b>이 더 필요해요. 한 달 봉사를 <b>${PL.month+Math.ceil(c.need90/12/Math.max(1,PL.start-PL.age))}시간</b>으로 늘리거나, 동행처럼 가중치가 높은 봉사를 섞으면 채울 수 있어요.`}</div>${ok?'':`<button class="btn soft sm" style="margin-top:10px" data-act="plFix">AI 추천대로 고치기</button>`}</div>
 <div class="sec-t">생애 시간 계획</div><div class="tl">${plSteps().map(s=>`<div class="tl-i"><span class="tl-d" style="background:${s.c}"></span><div class="tl-age" style="color:${s.c}">${s.age}</div><div class="b">${s.t}</div><div class="small muted">${s.d}</div></div>`).join('')}</div>

 <div class="btns" style="margin-top:14px"><button class="btn ghost" data-act="plEdit">조건 바꾸기</button><button class="btn" data-act="plSave">계획 저장</button></div></div>`;}

SCREENS.profileEdit=(o=>p=>{const r=o(p);const m=D.me.mgr;r.html=r.html.replace('<label class="f">한 줄 소개</label>',`<label class="f">담당 기관 <span class="mute2" style="font-weight:500">(있는 분만)</span></label><div class="card item click" data-go="myOrg"><div class="ic">${ic('building',20)}</div><div class="grow"><div class="b">${m?`${m.org} · ${m.name}`:'없음 (개인 사용자)'}</div><div class="mute2">${m?'권한 위임 관리':'요양원·병원 돌봄을 받고 있다면 등록해요'}</div></div>›</div><label class="f">한 줄 소개</label>`);return r;})(SCREENS.profileEdit);
let suMgr=false;
SCREENS.signup=(o=>p=>{const r=o(p);if(su.step!==2)return r;r.html=r.html.replace('<div class="su-bottom">',`<label class="f">돌봐 주는 기관이 있나요? <span class="mute2" style="font-weight:500">(선택)</span></label><div class="su-mgr"><button class="${suMgr?'':'on'}" data-act="suMgr" data-v="0">없어요 (개인)</button><button class="${suMgr?'on':''}" data-act="suMgr" data-v="1">있어요</button></div>${suMgr?`<label class="f">기관 이름</label><input class="in" placeholder="예) 행복요양원"><label class="f">담당자 이름</label><input class="in" placeholder="기관에서 알려준 담당자"><div class="mute2" style="margin-top:6px">가입 뒤 담당자가 확인하면 연결돼요. 맡길 일은 마이에서 고를 수 있어요.</div>`:''}<div class="su-bottom">`);return r;})(SCREENS.signup);
ACT.suMgr=el=>{suMgr=el.dataset.v==='1';keepScroll(render);};

/* ---------- 9) 공공 서비스 AI: 담당자에게 전달 ---------- */
pubAnswer=(o=>q=>{const s=o(q);if(/봉사를/.test(q))return s;const m=D.me.mgr;
 const add=hasMgr()?`<div class="fwd"><div class="small">🏥 <b>${m.name} ${m.job}</b>(${m.org})에게 "이 서비스가 필요해요"라고 보내면, 담당자가 자격 확인과 신청을 도와드려요.</div><button class="btn sm" style="margin-top:10px" data-act="pubFwd" data-v="${q}">담당자에게 전달하기</button></div>`:`<div class="fwd-hint">신청이 어렵다면 주민센터에 전화해 보세요. 요양원·병원 담당자가 있다면 <a style="color:#3A6FD8;font-weight:600;cursor:pointer" data-go="myOrg">마이 › 담당 기관</a>을 등록하면 담당자에게 바로 전달할 수 있어요.</div>`;
 return s.replace(/<\/div>\s*$/,add+'</div>');})(pubAnswer);
ACT.pubFwd=el=>{const q=el.dataset.v,m=D.me.mgr;sheet(`<h2>담당자에게 전달할까요?</h2><div class="card" style="margin-top:8px"><div class="mute2">받는 사람</div><div class="b">${m.org} ${m.name} ${m.job}</div><div class="mute2" style="margin-top:10px">내가 한 말</div><div>"${q}"</div><div class="mute2" style="margin-top:10px">AI가 찾은 서비스</div><div>${/목욕|씻|약|요양/.test(q)?'장기요양 방문요양·방문목욕, 노인맞춤돌봄서비스':/쓰러|응급|혼자/.test(q)?'응급안전안심서비스, 노인맞춤돌봄서비스':/깜빡|기억|치매/.test(q)?'치매안심센터':'노인맞춤돌봄서비스'}</div></div><label class="f">담당자에게 한마디 (선택)</label><input class="in" placeholder="예) 평일 오전에 전화 주세요"><div class="mute2" style="margin-top:8px">이름·나이·주소는 담당자가 이미 알고 있어 따로 보내지 않아요.</div><button class="btn big-cta" style="margin-top:14px" data-act="pubFwdOk">전달하기</button>`);};
ACT.pubFwdOk=()=>{closeSheet();toast(`${D.me.mgr.name} 담당자에게 전달했어요. 처리 상황은 알림으로 알려드려요`);};

/* ---------- 10) 계정 바꾸기: 개인 / 담당 기관 있는 사용자 / PC 화면 ---------- */
const PCURL='시간적금_기관운영자_PC.html';
ACT.roleSheet=()=>{if(D.role==='user'&&nav.stack.length&&cur().name!=='login'&&cur().name!=='loginForm'){}
 const rows=[['user','사용자 · 개인','손유진 · 담당 기관 없음',D.role==='user'&&!D.me.mgr],['user_m','사용자 · 담당 기관 있음','김영자 · 행복요양원 박지현 담당',D.role==='user'&&!!D.me.mgr],['org','기관 담당자 (PC)','박지현 · 행복요양원',false],['admin','운영자 (PC)','시간 적금 운영팀',false]];
 sheet(`${D.role==='user'?`<div class="msel"><h2>지금 할 일</h2><div class="msel-r"><button class="msel-b r ${D.mode!=='give'?'on':''}" data-act="modePick" data-v="recv">${dIc('recv',40)}<div><b>도움 받기</b><span>도움 가능 공고 보기</span></div></button><button class="msel-b g ${D.mode==='give'?'on':''}" data-act="modePick" data-v="give">${dIc('offer',40)}<div><b>봉사하기</b><span>봉사 요청 보기</span></div></button></div></div>`:''}<h2>계정 바꾸기 (시연)</h2>${rows.map(([k,t,s,on])=>`<div class="opt ${on?'on':''}" data-act="pickRole" data-v="${k}"><span class="rd"></span><div class="grow"><div class="b">${t}</div><div class="mute2">${s}</div></div></div>`).join('')}<button class="btn ghost" style="margin-top:12px" data-act="logout">로그아웃</button>`);};
ACT.pickRole=el=>{const v=el.dataset.v;closeSheet();
 if(v==='org'||v==='admin'){location.href=encodeURI(PCURL)+'?role='+v;return;}
 const mg=v==='user_m';Object.assign(D.me,mg?ME1:ME0);D.me.mgr=mg?{...MGR0,perm:{...MGR0.perm}}:null;D.role='user';forElder=null;tab('u_home');toast(mg?'담당 기관이 있는 사용자 화면이에요':'개인 사용자 화면이에요');};
})();
</script>

</body>
</html>
