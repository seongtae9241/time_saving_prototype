<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B8DEF">
<title>시간 적금</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#EFEBE4; --paper:#FBF9F5; --card:#FFFFFF; --ink:#1E2A26; --sub:#5C6B66; --mute:#8A9793;
  --line:#E4DED4; --pri:#2F6B5E; --pri-2:#3E8573; --pri-soft:#E3EFEA; --amber:#C98A2B; --amber-soft:#FBF0DC;
  --red:#B5483B; --red-soft:#F8E4E0; --blue:#3A6EA5; --blue-soft:#E4EDF7;
  --r:16px; --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;color:var(--ink);font-size:var(--fs);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
body.big{--fs:18px}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column}
@media (min-width:520px){
  body{padding:24px 0}
  #app{min-height:calc(100dvh - 48px);height:calc(100dvh - 48px);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(30,42,38,.18)}
}
/* header */
.hd{position:sticky;top:0;z-index:20;background:rgba(251,249,245,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;padding:12px 14px 10px;border-bottom:1px solid var(--line);min-height:58px}
.hd .bk{width:38px;height:38px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.hd .bk:hover{background:var(--pri-soft)}
.hd h1{font-size:18px;margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:-.3px}
.chip-role{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px 6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer}
.chip-role .dot{width:8px;height:8px;border-radius:50%;background:var(--pri)}
/* body */
.bd{flex:1 1 auto;overflow-y:auto;padding:16px 16px 28px}
.bd.notab{padding-bottom:28px}
.sec-t{font-size:13px;font-weight:700;color:var(--sub);margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sec-t a{color:var(--pri);font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:10px}
.click{cursor:pointer;transition:transform .08s ease, box-shadow .15s}
.click:active{transform:scale(.985)}
.click:hover{box-shadow:0 4px 14px rgba(30,42,38,.08)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row > *{min-width:0}
.grow{flex:1 1 auto;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--sub)} .mute2{color:var(--mute);font-size:13px}
.small{font-size:13px}
.b{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:#8A5A12}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.gray{background:#EEEAE3;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:16px;cursor:pointer;padding:0 16px;text-align:center}
.btn:hover{background:var(--pri-2)}
.btn.ghost{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}
.btn.ghost:hover{background:var(--pri-soft)}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.warn{background:var(--red)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px}
.btns{display:flex;gap:8px}
.btns > *{flex:1 1 0;min-width:0}
.stack > * + *{margin-top:10px}
/* hero credit */
.hero{background:linear-gradient(135deg,#2F6B5E 0%,#3E8573 100%);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .lbl{font-size:13px;opacity:.85}
.hero .num{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0 2px}
.hero .num small{font-size:16px;font-weight:600;opacity:.85;margin-left:4px}
.hero .sub{font-size:13px;opacity:.9}
.hero .acts{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}
.hero .acts button{flex:1 1 0;min-width:0;min-height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
.hero .acts button:hover{background:rgba(255,255,255,.28)}
.hero.amber{background:linear-gradient(135deg,#B9792A 0%,#D29A45 100%)}
/* list item */
.item{display:flex;gap:12px;align-items:flex-start}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--pri-soft);color:var(--pri)}
.ic.amber{background:var(--amber-soft);color:#8A5A12}
.ic.red{background:var(--red-soft);color:var(--red)}
.ic.blue{background:var(--blue-soft);color:var(--blue)}
.cr{font-weight:800;color:#8A5A12;white-space:nowrap}
.cr.plus{color:var(--pri)} .cr.minus{color:var(--red)}
/* tabs */
.tabs{position:sticky;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--mute);cursor:pointer;border-radius:12px}
.tabs button.on{color:var(--pri);font-weight:700}
.tabs button svg{width:24px;height:24px}
/* form */
label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:16px 2px 6px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:48px;outline:none}
.in:focus{border-color:var(--pri)}
textarea.in{min-height:110px;resize:vertical;line-height:1.55}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.stepper button{width:56px;height:52px;border:0;background:var(--pri-soft);color:var(--pri);font-size:22px;font-weight:700;cursor:pointer;flex:0 0 auto}
.stepper .v{flex:1 1 auto;text-align:center;font-size:20px;font-weight:800}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;cursor:pointer}
.opt + .opt{margin-top:8px}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--mute);flex:0 0 auto;display:grid;place-items:center}
.opt.on .rd{border-color:var(--pri)}
.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pri)}
.toggle{width:46px;height:28px;border-radius:999px;background:#D7D1C6;position:relative;border:0;cursor:pointer;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--pri)}
.toggle.on::after{left:21px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* AI box */
.ai{border:1.5px solid #CFE3DB;background:linear-gradient(180deg,#F4FAF7 0%,#FFFFFF 100%);border-radius:var(--r);padding:14px 16px}
.ai .ah{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--pri);margin-bottom:8px;letter-spacing:.2px}
.ai .ah .spark{width:20px;height:20px;border-radius:6px;background:var(--pri);color:#fff;display:grid;place-items:center}
.ai ul{margin:6px 0 0;padding-left:18px}
.ai li{margin:3px 0}
.ai.warn{border-color:#EBC9C2;background:linear-gradient(180deg,#FCF3F1 0%,#fff 100%)}
.ai.warn .ah{color:var(--red)} .ai.warn .ah .spark{background:var(--red)}
.ai.amber{border-color:#EED9B3;background:linear-gradient(180deg,#FDF7EC 0%,#fff 100%)}
.ai.amber .ah{color:#8A5A12} .ai.amber .ah .spark{background:var(--amber)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#E9F2EE 25%,#D6E8E0 50%,#E9F2EE 75%);background-size:200% 100%;animation:sh 1s infinite linear;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--sub)} .kv dd{margin:0;font-weight:600;min-width:0}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;line-height:1.5}
.msg.ai-m{background:var(--card);border:1px solid var(--line);border-top-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--pri);color:#fff;border-top-right-radius:6px;align-self:flex-end}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.qr button{border:1.5px solid var(--pri);background:var(--card);color:var(--pri);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.qr button:hover{background:var(--pri-soft)}
.composer{display:flex;gap:8px;margin-top:14px}
.composer .in{flex:1 1 auto;min-width:0}
.composer button{flex:0 0 auto;width:52px;border-radius:12px;border:0;background:var(--pri);color:#fff;cursor:pointer;display:grid;place-items:center}
/* stepper status */
.steps{display:flex;gap:4px;margin-top:10px}
.steps span{flex:1 1 0;height:6px;border-radius:3px;background:#E7E1D7}
.steps span.on{background:var(--pri)}
.stepl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
/* bars */
.bar{height:10px;border-radius:5px;background:#EEE9E1;overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:5px;background:var(--pri)}
.bar > i.amber{background:var(--amber)} .bar > i.red{background:var(--red)}
.vbars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.vbars .col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vbars .col i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--pri);display:block}
.vbars .col span{font-size:11px;color:var(--mute)}
/* doc thumb */
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.doc{aspect-ratio:3/4;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.doc b{font-size:11px}
.doc i{display:block;height:4px;border-radius:2px;background:#E6E1D8}
.doc i.s{width:60%}
/* sheet & toast */
.ov{position:fixed;inset:0;background:rgba(20,28,25,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:100%;max-width:430px;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;animation:up .2s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D3CCC1;margin:2px auto 12px}
.sheet h2{font-size:19px;margin:4px 0 6px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:min(380px,calc(100vw - 32px));text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
/* role pick */
.rolecard{display:flex;gap:14px;align-items:center}
.rolecard .ic{width:52px;height:52px;border-radius:16px}
.logo{display:flex;align-items:center;gap:10px;margin:18px 2px 6px}
.logo .mk{width:44px;height:44px;border-radius:14px;background:var(--pri);display:grid;place-items:center;color:#fff}
.notice{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:13px;color:#7A5212}
.divider{height:1px;background:var(--line);margin:14px 0}
.big-cta{min-height:64px;font-size:18px;border-radius:18px}
.center{text-align:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:0 0 auto;background:var(--pri-soft);color:var(--pri)}
.avatar.lg{width:64px;height:64px;font-size:22px}
.timer{font-size:44px;font-weight:800;letter-spacing:-1px;text-align:center;font-variant-numeric:tabular-nums}
.thanks{background:linear-gradient(160deg,#FFF8EA 0%,#FFFFFF 70%);border:1px solid #F0DFC0;border-radius:18px;padding:18px}
.thanks .q{font-size:16px;line-height:1.7;font-weight:500}
.ok{color:var(--pri);font-weight:700}
.warnc{color:var(--red);font-weight:700}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.check-row:last-child{border-bottom:0}
.check-row .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;font-size:13px;font-weight:800;color:#fff;background:var(--pri)}
.check-row .ck.w{background:var(--red)}
.cb{width:22px;height:22px;accent-color:var(--pri);flex:0 0 auto;margin-top:2px}

/* ===== v4: 흰 바탕 · 파랑 한 가지 · 여백 중심 ===== */
:root{--bg:#fff;--paper:#FFFFFF;--line:#F0F1F4;--ink:#1B1D22;--sub:#5F6672;--mute:#9AA1AC;--brand:#5B8DEF;--pri:#5B8DEF;--pri-2:#2F5BDB;--pri-soft:#EEF3FF;--fill:#F6F7F9;--r:16px;--fs:16px}
body{padding:0 !important;background:#fff;letter-spacing:-.3px}
body.big{--fs:19px}
#app{max-width:600px;height:100dvh !important;min-height:0 !important;border-radius:0 !important;box-shadow:none !important;overflow:hidden;background:#fff}
@media (min-width:601px){#app{box-shadow:0 0 0 1px #ECEDF0 !important}}
.hd{background:#fff;backdrop-filter:none;border-bottom:0;min-height:58px;padding:8px 14px 4px 20px}
.hd h1{font-size:20px;font-weight:700;letter-spacing:-.6px}
.hd .bk:hover{background:var(--fill)}
.chip-role{border:0;background:var(--fill);font-size:13px;padding:7px 10px 7px 12px;box-shadow:none;font-weight:600}
.tabs{background:#fff;border-top:1px solid var(--line);box-shadow:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{font-size:11.5px;color:#B4BAC3}
.tabs button.on{color:var(--ink);font-weight:700}
.tabs button svg{width:24px;height:24px}
.bd{padding:8px 20px 40px}
.sec-t{font-size:18px;font-weight:700;color:var(--ink);margin:36px 0 12px;letter-spacing:-.5px}
.sec-t a{font-size:13.5px;font-weight:500;color:var(--mute)}
.muted{color:var(--sub)} .mute2{color:var(--mute);font-size:13.5px} .small{font-size:14.5px}
.card{background:var(--fill);border:0;border-radius:var(--r);padding:18px 18px;box-shadow:none}
.card + .card{margin-top:10px}
.click:hover{box-shadow:none;background:#F1F2F5}
.click:active{transform:scale(.985)}
.item .b{font-size:16px}
/* 통장 */
.hero,.hero.amber{background:var(--brand);color:#fff;border-radius:20px;padding:20px 20px 18px;box-shadow:none;margin:4px 0 0}
.hero.amber{background:#F28C4B}
.hero::after{display:none}
.hero + .card{margin-top:12px}
.bk-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:18px;opacity:.9}
.bk-name{font-weight:600}
.bk-name::before{display:none}
.bk-no{opacity:.75;font-variant-numeric:tabular-nums}
.hero .lbl{font-size:13px;opacity:.8}
.hero .num{font-size:40px;font-weight:700;letter-spacing:-1.2px;margin:2px 0 4px}
.hero .num small{font-size:17px;opacity:.85;font-weight:500}
.hero .sub{font-size:13px;opacity:.8}
.hero .acts{margin-top:20px;gap:6px}
.hero .acts button{background:rgba(255,255,255,.16);border-radius:12px;min-height:44px;font-size:14.5px;font-weight:600}
.hero .acts button:hover{background:rgba(255,255,255,.26)}
.pass{background:var(--fill);border-radius:var(--r);padding:2px 18px 6px;box-shadow:none;font-variant-numeric:tabular-nums}
.pass-d{font-size:12.5px;color:var(--mute);font-weight:600;padding:16px 0 2px}
.pass-r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 12px;border-bottom:1px solid #EBEDF0}
.pass-r:last-child{border-bottom:0}
.pc{min-width:0} .pc b{display:block;font-size:15px;font-weight:600;color:var(--ink)} .pc span{font-size:12.5px;color:var(--mute)}
.pa{text-align:right;flex:0 0 auto} .pa b{display:block;font-size:16px} .pa span{font-size:12px;color:var(--mute)}
.pass .p-in{color:var(--brand)} .pass .p-out{color:var(--ink)}
/* 버튼 */
.btn{background:var(--brand);border-radius:14px;min-height:54px;font-size:16px;font-weight:600}
.btn:hover{background:var(--pri-2)}
.btn[disabled]{background:#D5DAE3;cursor:default}
.btn.ghost{background:var(--fill);color:var(--ink);border:0;box-shadow:none}
.btn.ghost:hover{background:#ECEEF2}
.btn.soft{background:var(--pri-soft);color:var(--brand)}
.btn.soft:hover{background:#E2EAFF}
.btn.warn{background:#EF4E4E}
.btn.sm{border-radius:12px;min-height:44px;font-size:14.5px}
.big-cta{min-height:56px;font-size:16.5px;border-radius:16px}
/* 태그·숫자 */
.tag{background:transparent;color:var(--sub);border-radius:0;font-size:12.5px;padding:0;font-weight:600}
.tags .tag + .tag::before{content:"·";margin-right:6px;color:#C9CED6}
.tag.amber{color:#E07A2E;background:transparent}
.tag.red{background:#FFEDED;color:#E54848;padding:3px 8px;border-radius:6px}
.tag.blue{color:var(--brand);background:transparent}
.tag.gray{color:var(--mute);background:transparent}
.tags{gap:6px}
.cr{color:var(--ink);font-weight:700;font-size:16px}
.cr.plus{color:var(--brand)} .cr.minus{color:var(--ink)}
/* AI */
.ai,.ai.warn,.ai.amber{border:0;border-radius:var(--r);background:var(--pri-soft);padding:18px;box-shadow:none}
.ai::before{display:none}
.ai.warn{background:#FFF1F1} .ai.amber{background:#FFF6EC}
.ai .ah{font-size:12.5px;font-weight:700;color:var(--brand);margin-bottom:8px}
.ai .ah .spark{width:auto;height:auto;background:none;color:var(--brand)}
.ai.warn .ah,.ai.warn .ah .spark{color:#E54848;background:none}
.ai.amber .ah,.ai.amber .ah .spark{color:#D9772B;background:none}
.ai .small,.ai li{font-size:14.5px;line-height:1.65}
.skel{background:linear-gradient(90deg,#E3EAFD 25%,#D3DEFB 50%,#E3EAFD 75%);background-size:200% 100%}
.ic,.ic.amber,.ic.red,.ic.blue{background:#fff;color:var(--ink);border-radius:14px}
.ic.red{color:#E54848}
.avatar{background:#E8EEFF;color:var(--brand);font-weight:700}
/* 폼 */
label.f{font-size:14px;color:var(--sub);font-weight:600;margin:22px 2px 8px}
.in,select.in,textarea.in{border:0;box-shadow:none;border-radius:14px;background:var(--fill);font-size:16px;min-height:54px;padding:14px 16px}
.in:focus{box-shadow:inset 0 0 0 2px var(--brand);background:#fff}
.stepper{border:0;border-radius:14px;box-shadow:none;background:var(--fill)}
.stepper button{background:transparent;color:var(--brand)}
.opt{border:0;border-radius:16px;background:var(--fill);box-shadow:none;padding:16px}

.cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px 4px 4px}

.kind{font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 7px;white-space:nowrap}
.kind.offer{background:#E6F7EE;color:#1F9D63} .kind.need{background:#FFF1E2;color:#D9731A} .kind.reg{background:#EAF0FF;color:#5B8DEF}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;background:#FFF4D6;color:#B07C00;white-space:nowrap}
.badge.trust{background:#E6F7EE;color:#1F9D63}
.badge.elder{background:#F1EDFF;color:#3A6FD8}
.seg2{display:flex;background:var(--fill);border-radius:14px;padding:4px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:none;min-height:44px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--sub);cursor:pointer}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* todo */
.todo{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #EEF0F3;border-radius:18px;padding:14px 16px;cursor:pointer}
.todo + .todo{margin-top:8px}
.todo .n{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto}
.todo .t{font-weight:700;font-size:15px} .todo .d{font-size:12.5px;color:var(--mute)}
.dl{font-size:11.5px;font-weight:700;color:#E5484D;background:#FFEDED;border-radius:6px;padding:3px 7px;white-space:nowrap}
/* state */
.st{font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.st.wait{background:#FFF4E5;color:#D9731A} .st.ok{background:#E6F7EE;color:#1F9D63} .st.go{background:#EAF0FF;color:#5B8DEF} .st.end{background:#F1F2F5;color:#8A919C} .st.no{background:#FFEDED;color:#E5484D}
.flow{display:flex;align-items:flex-start;margin:6px 0 2px}
.flow > div{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--mute)}
.flow > div::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:#E4E8EF;z-index:0}
.flow > div:first-child::before{display:none}
.flow > div span{display:block;width:18px;height:18px;border-radius:50%;background:#E4E8EF;margin:0 auto 4px;position:relative;z-index:1}
.flow > div.on{color:var(--ink);font-weight:600}
.flow > div.on span,.flow > div.on::before{background:var(--brand)}
.flow > div.cur span{box-shadow:0 0 0 4px #D6E2FF}
/* intro card */
.intro{background:linear-gradient(180deg,#F3F6FF,#fff);border:1px solid #E3EAFD;border-radius:20px;padding:18px}
.intro .ph{width:64px;height:64px;border-radius:50%;background:#DCE6FF;color:var(--brand);display:grid;place-items:center;font-size:24px;font-weight:800;flex:0 0 auto}
.stars{color:#FFB400;letter-spacing:1px}
/* messages */
.thread{display:flex;flex-direction:column;gap:8px;background:var(--fill);border-radius:18px;padding:14px}
.tm{max-width:84%;font-size:14.5px;line-height:1.5}
.tm .bub{padding:10px 13px;border-radius:16px;background:#fff}
.tm.me{align-self:flex-end} .tm.me .bub{background:var(--brand);color:#fff}
.tm .meta{font-size:11px;color:var(--mute);margin:3px 4px 0;display:flex;gap:8px}
.tm.me .meta{justify-content:flex-end}
.tm .meta a{cursor:pointer;color:var(--mute);text-decoration:underline}
.tsys{align-self:center;font-size:12px;color:var(--sub);background:#fff;border-radius:999px;padding:5px 12px;text-align:center}
.tin{display:flex;gap:8px;margin-top:10px}
.tin .in{flex:1;min-width:0;border-radius:999px;min-height:48px;padding:0 16px}
.tin button{width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
/* time picker */
.tp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tp button{border:0;background:var(--fill);border-radius:12px;min-height:44px;font-weight:600;cursor:pointer;font-size:14px}
.tp button.on{background:var(--brand);color:#fff}
.tp button:disabled{opacity:.35;cursor:default}
.sum{background:var(--fill);border-radius:16px;padding:14px 16px}
.sum .between + .between{margin-top:8px}
/* notif */
.nt{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.nt.new{background:linear-gradient(90deg,#F5F8FF,#fff);margin:0 -20px;padding:14px 20px}
.nt .ic{width:40px;height:40px;border-radius:14px;flex:0 0 auto}
/* menu list */
.ml{background:var(--fill);border-radius:18px;overflow:hidden}
.ml > div{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;font-size:15px}
.ml > div + div{border-top:1px solid #ECEEF2}
.ml > div:hover{background:#F0F2F5}
.ml .grow span{display:block;font-size:12.5px;color:var(--mute)}
.ml svg{flex:0 0 auto}
.danger{color:#E5484D}
/* elder card */
.ec{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #EEF0F3;border-radius:18px;padding:14px 16px;cursor:pointer}
.ec + .ec{margin-top:8px}
.ec .av{width:46px;height:46px;border-radius:16px;background:#F1EDFF;color:#3A6FD8;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.lock{display:flex;gap:10px;align-items:flex-start;background:#F4F1FF;border-radius:14px;padding:12px 14px;font-size:13.5px;color:#4B3A9E}
/* fab */
.fab{position:sticky;bottom:12px;margin-left:auto;display:flex;align-items:center;gap:6px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:0 18px;height:50px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(0,0,0,.2);cursor:pointer;margin-top:16px;width:max-content}
/* mic */
.mic{width:50px;height:50px;border-radius:50%;border:0;background:var(--fill);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.wave{display:flex;gap:5px;justify-content:center;align-items:center;height:60px;margin:18px 0}
.wave i{width:6px;border-radius:3px;background:var(--brand);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:12px}50%{height:50px}}
.stars-in{display:flex;gap:6px;justify-content:center;font-size:34px;color:#E2E6EC;cursor:pointer}
.stars-in span.on{color:#FFB400}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat2 > div{background:var(--fill);border-radius:16px;padding:14px}
.stat2 b{display:block;font-size:20px;letter-spacing:-.5px} .stat2 span{font-size:12px;color:var(--sub)}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px}
.hero .row3 div{text-align:center;font-size:11.5px;opacity:.9} .hero .row3 b{display:block;font-size:15px;opacity:1}
.empty{text-align:center;color:var(--mute);padding:30px 0;font-size:14px}
.tag2{font-size:12px;border-radius:999px;background:var(--fill);padding:5px 10px;font-weight:600;cursor:pointer;border:0}
.tag2.on{background:var(--ink);color:#fff}
.ai-ban{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#EEF3FF 0%,#EEF4FF 100%);border-radius:22px;padding:18px 18px;margin-top:26px}
.ah2{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--brand)}
.ah2 .spark{background:none;color:var(--brand)}
.ai-orb{width:58px;height:58px;border-radius:20px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 8px 18px rgba(91,141,239,.3)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:4px 0;line-height:1.3;text-align:center}
.qa button span{width:52px;height:52px;border-radius:18px;display:grid;place-items:center}
.qa button:active{transform:scale(.95)}
pre.json{background:#1B1D22;color:#C9D6FF;font-size:11.5px;border-radius:10px;padding:10px 12px;overflow-x:auto;margin:8px 0 0;white-space:pre-wrap;word-break:break-all}
details summary{list-style:none} details summary::-webkit-details-marker{display:none}
.bd > .card.item,.card.item{display:flex;align-items:center;gap:12px}
.mcol.wide .policy > div{background:#F7F8FA}
.ec.av{cursor:default}
.nc .cats .cat-chip{font-size:11.5px}

.chk{display:flex;align-items:center;gap:12px;background:var(--fill);border-radius:16px;padding:14px 16px;margin-top:12px}
.chk.on{background:#EAF0FF}
.dotp{width:12px;height:12px;border-radius:50%;background:var(--brand);flex:0 0 auto;box-shadow:0 0 0 5px rgba(91,141,239,.18);animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 9px rgba(91,141,239,.05)}}
.mapbox{position:relative;height:150px;border-radius:16px;margin-bottom:12px;background:linear-gradient(0deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),repeating-linear-gradient(45deg,#E7ECF5 0 12px,#EEF2F9 12px 24px)}
.pin2{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);color:#E5484D}
.cert{border:1.5px solid #E3E7EF;border-radius:18px;padding:18px;background:#fff;margin-top:14px}
.cert-h{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px dashed #E3E7EF}

.plinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.plink{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#fff;background:var(--brand);border-radius:10px;padding:8px 12px;text-decoration:none}
.plink.ghost{background:#EEF3FF;color:var(--brand)}
.btn.sm{white-space:nowrap;flex-shrink:0}
.mode{display:flex;background:var(--fill);border-radius:16px;padding:5px;margin:4px 0 12px}
.mode button{flex:1;border:0;background:none;min-height:46px;border-radius:12px;font-weight:700;font-size:15.5px;color:var(--sub);cursor:pointer}
.mode button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mini-bank{display:flex;align-items:center;gap:12px;background:var(--brand);color:#fff;border-radius:18px;padding:16px 18px}
.mini-bank .mute2{color:rgba(255,255,255,.8)}
.mb-r{display:flex;flex-direction:column;gap:2px;font-size:12px;opacity:.9;text-align:right}
.mb-r b{font-size:13px}
.hs2{gap:10px}
.hcard{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:#fff;border:1px solid #EEF0F3;border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(27,36,64,.06)}
.hc-t{font-weight:700;font-size:16px;margin-top:12px;letter-spacing:-.4px}
.hc-m{font-size:13px;color:var(--sub);margin-top:2px}
.hc-c{font-size:13px;color:var(--mute);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evc{flex:0 0 220px;scroll-snap-align:start;background:#fff;border:1px solid #EEF0F3;border-radius:20px;overflow:hidden}
.ev-img{height:96px;display:grid;place-items:center;position:relative}
.ev-img.big{height:150px;border-radius:18px}
.ev-org{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.9);color:var(--ink);border-radius:6px;padding:2px 7px}
.ev-b{padding:12px 14px}
.bbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bbtn button{border:1.5px solid #E6E9EF;background:#fff;border-radius:18px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.bbtn button span{font-size:24px}
.bbtn button b{font-size:16px;margin-top:4px}
.bbtn button em{font-style:normal;font-size:12px;color:var(--mute)}
.bbtn button.on{border-color:var(--brand);background:#F3F6FF;box-shadow:inset 0 0 0 1px var(--brand)}
.bbtn.big{grid-template-columns:1fr}
.bbtn.big button{padding:18px}
.cam{position:relative;height:220px;border-radius:18px;background:#1B1D22;display:grid;place-items:center;overflow:hidden}
.cam-f{position:absolute;width:160px;height:160px;border:3px solid #fff;border-radius:18px;opacity:.8}
.cam-qr{opacity:.9}
.cam-l{position:absolute;left:20%;right:20%;height:2px;background:#4ADE80;top:30%;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{50%{top:70%}}
.qrbox{display:grid;place-items:center;margin:16px 0 8px}
.qrbox svg{border-radius:12px;box-shadow:0 0 0 10px #fff,0 0 0 11px #E6E9EF}
.qrcard{border:2px dashed #CBD3E1;border-radius:18px;padding:18px;text-align:center}
.hist{background:#fff;border:1px solid #EEF0F3;border-radius:16px;padding:14px 16px;margin-top:8px}
.hist ul{margin:8px 0 0;padding-left:18px}
.hnote{margin-top:8px;background:#FFF6E9;color:#7A5212;border-radius:10px;padding:8px 10px;font-size:13.5px}
.linkpv{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #E6E9EF;border-radius:14px;padding:10px;margin-top:10px;text-decoration:none;color:var(--ink)}
.lp-img{width:52px;height:52px;border-radius:10px;background:#EEF3FF;color:var(--brand);display:grid;place-items:center;flex:0 0 auto}
.locb{margin-top:12px;font-size:14px;font-weight:700}
.locb span{font-size:12px;color:var(--mute);font-weight:500;margin-left:6px}
.heat{display:grid;grid-template-columns:44px repeat(4,1fr);gap:4px;margin-top:10px;font-size:12px}
.hh{text-align:center;color:var(--sub);font-weight:600}
.hl{color:var(--sub);display:flex;align-items:center}
.hc{border-radius:8px;text-align:center;padding:8px 0;font-weight:700}

.click:hover{background:inherit}

.mini-bank{background:linear-gradient(135deg,#5B8DEF 0%,#5B86F7 100%);box-shadow:0 10px 22px rgba(91,141,239,.25)}
.mode{background:#F2F4F7}
.mode button{font-size:15px}
.sec-t{margin-top:32px}
.hd h1{font-size:19px}

 .chat-dock,.nt.new,.hs,.bd > .row:has(> .tag2),.qr-row{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
 .hero{margin-left:0;margin-right:0}
 .hd h1{font-size:17px}
}

.cat-chip{padding:4px 10px 4px 7px;gap:4px}

.bk2-acts .pl-btn{background:#fff;color:var(--brand)}
.pl-peek{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#F3F6FF,#EEF4FF);border-radius:18px;padding:14px 16px;margin-top:10px}

/* ===== v9 파스텔 테마 ===== */
:root{--paper:#F4F4F8;--fill:#FFFFFF;--line:#ECECF2;--ink:#2A2B3D;--sub:#6B6E82;--mute:#A3A6B8;--brand:#5B8DEF;--pri:#5B8DEF;--pri-2:#4A7DE0;--pri-soft:#EAF2FF;
 --recv:#EE9A7E;--recv2:#F7C2AE;--recv-soft:#FDF0EA;--give:#6DB3A0;--give2:#A8D5C8;--give-soft:#EAF5F1;--shadow:0 6px 20px rgba(60,62,110,.07)}
body[data-mode=recv]{--brand:#EE9A7E;--pri:#EE9A7E;--pri-2:#DC7754;--pri-soft:#FDF0EA}
body[data-mode=give]{--brand:#6DB3A0;--pri:#6DB3A0;--pri-2:#4E937F;--pri-soft:#EAF5F1}
body{background:#ECECF2}
#app,.hd,.tabs{background:var(--paper)}
.tabs{border-top:0;box-shadow:0 -4px 20px rgba(60,62,110,.06);background:#fff;border-radius:22px 22px 0 0}
.tabs button.on{color:var(--brand)}
.card,.pass,.goal,.pl-q,.sum,.ml,.notice,.hist,.stat2>div,.kpis>div,.ask-hero,.tip,.pl-peek,.chk{background:#fff;box-shadow:var(--shadow);border:0}
.ml>div+div{border-top:1px solid #F0F0F5}
.in,select.in,textarea.in,.stepper,.seg,.seg2,.mode{background:#fff;box-shadow:inset 0 0 0 1px #E8E8F0}
.chip,.tag2,.tp button{background:#fff;box-shadow:inset 0 0 0 1px #E6E6EE}
.chip.on,.tag2.on{background:var(--ink);box-shadow:none}
.tp button.on{background:var(--brand);box-shadow:none}
.btn{background:var(--brand);box-shadow:0 8px 18px color-mix(in srgb,var(--brand) 28%,transparent)}
.btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px #E3E3EC}
.btn.soft{background:var(--pri-soft);color:var(--brand);box-shadow:none}
.btn.warn{background:#E57373;box-shadow:none}
.pc2,.rq,.hcard,.todo,.ec,.nc,.evc,.reg{border:0;box-shadow:var(--shadow);border-radius:22px}
.ai,.ai.warn,.ai.amber{background:#fff;box-shadow:var(--shadow);border-left:4px solid var(--brand);border-radius:18px}
.ai.warn{border-left-color:#E57373}.ai.amber{border-left-color:#E8B060}
.ai .ah,.ai .ah .spark,.ah2,.ah2 .spark{color:var(--brand)}
.cr.plus,.pass .p-in,.ok,.pl-v{color:var(--brand)}
.pill,.rq-cr{background:var(--pri-soft);color:var(--brand)}.rq-cr b{color:var(--brand)}.rq-cr span{color:var(--mute)}
.tb i{background:color-mix(in srgb,var(--brand) 30%,#fff)}.tb b{background:var(--brand)}
.steps span.on,.flow>div.on span,.flow>div.on::before,.bar>i,.toggle.on,.su-check.on .bx,.su-prog i{background:var(--brand)}
.flow>div.cur span{box-shadow:0 0 0 4px var(--pri-soft)}
.opt.on,.su-role.on,.pl-n.on{box-shadow:inset 0 0 0 2px var(--brand);background:var(--pri-soft)}
.opt.on .rd,.su-role.on .rd{border-color:var(--brand)}.opt.on .rd::after,.su-role.on .rd::after{background:var(--brand)}
.msg.me,.tm.me .bub{background:var(--brand)}
.avatar{background:var(--pri-soft);color:var(--brand)}
.hero,.bank2,.mini-bank{background:linear-gradient(140deg,var(--brand) 0%,color-mix(in srgb,var(--brand) 70%,#fff) 100%);box-shadow:0 14px 30px color-mix(in srgb,var(--brand) 30%,transparent)}
.hero.amber{background:linear-gradient(140deg,#EE9A7E,#F7C2AE)}
.bank2::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-20px;height:70px;background:radial-gradient(60% 50% at 30% 100%,rgba(255,255,255,.18),transparent 70%)}
.bk2-acts .pl-btn{color:var(--brand)}
.sec-t{font-size:18px}
.empty{background:#fff;border-radius:18px;box-shadow:var(--shadow)}
.pl-go,.pl-hero{background:linear-gradient(135deg,#5B8DEF,#8FB3F5)}
.mode-hint{font-size:13px;color:var(--sub);margin:10px 4px 14px}
.mode-hint b{color:var(--brand)}
/* 모드 타일 */
.mode2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.mt{position:relative;overflow:hidden;border:0;text-align:left;cursor:pointer;border-radius:22px;padding:14px 14px 14px;min-height:108px;display:flex;flex-direction:column;justify-content:flex-end;background:#fff;box-shadow:var(--shadow);transition:transform .15s,box-shadow .2s}
.mt b{font-size:17px;letter-spacing:-.4px;color:var(--ink);position:relative;z-index:1}
.mt em{font-style:normal;font-size:12px;color:var(--mute);margin-top:2px;position:relative;z-index:1}
.mt-ic{position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;z-index:1}
.mt-recv .mt-ic{background:var(--recv-soft)}.mt-give .mt-ic{background:var(--give-soft)}
.mt-wave{position:absolute;right:-20px;top:-26px;width:110px;height:110px;border-radius:50%;opacity:.0;transition:opacity .2s}
.mt-chk{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:#fff;font-style:normal;font-weight:800;font-size:13px;display:grid;place-items:center;z-index:1}
.mt.on{transform:translateY(-2px)}
.mt-recv.on{background:linear-gradient(145deg,#EE9A7E,#F7C2AE);box-shadow:0 14px 28px rgba(232,137,106,.38)}
.mt-give.on{background:linear-gradient(145deg,#6DB3A0,#A8D5C8);box-shadow:0 14px 28px rgba(94,165,147,.38)}
.mt.on b,.mt.on em{color:#fff}.mt.on em{opacity:.9}
.mt.on .mt-ic{background:rgba(255,255,255,.28)}
.mt.on .mt-wave{opacity:1;background:rgba(255,255,255,.16)}
.mt-recv.on .mt-chk{color:#EE9A7E}.mt-give.on .mt-chk{color:#6DB3A0}
.mt:not(.on){opacity:.85}
/* 공고 탭 버튼 */
.bbtn button{border:0;box-shadow:var(--shadow);background:#fff}
.bbtn button:first-child.on{background:linear-gradient(145deg,#EE9A7E,#F7C2AE);box-shadow:0 12px 24px rgba(232,137,106,.35)}
.bbtn button:last-child.on{background:linear-gradient(145deg,#6DB3A0,#A8D5C8);box-shadow:0 12px 24px rgba(94,165,147,.35)}
.bbtn button.on b,.bbtn button.on em{color:#fff!important}
.bbtn button.on .dic{background:rgba(255,255,255,.3)!important;box-shadow:none!important}
.bbtn.big button:first-child{background:linear-gradient(145deg,#EAF5F1,#fff)}.bbtn.big button:last-child{background:linear-gradient(145deg,#FDF0EA,#fff)}
.kind.offer{background:var(--give-soft);color:var(--give)}.kind.need{background:var(--recv-soft);color:var(--recv)}
/* 타임라인 느낌의 할 일 카드 */
.hcard{border-left:0;position:relative;padding-left:18px}
.hcard::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.tl::before{border-left:2px dashed #D8D9E5;background:none;width:0}
/* ===== v10 ===== */
.bank3{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 16px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#4A4C78 0%,#2A2B3D 55%,#1F2030 100%);box-shadow:0 16px 34px rgba(31,32,48,.35)}
.bank3::after{content:"";position:absolute;right:-60px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--brand) 55%,transparent),transparent 70%);opacity:.8}
.b3-top{display:flex;align-items:center;gap:8px;font-size:13px}
.b3-chip{width:28px;height:20px;border-radius:5px;background:linear-gradient(135deg,#F6D88A,#D9A94A);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.b3-name{font-weight:700}.b3-no{margin-left:auto;opacity:.55;font-variant-numeric:tabular-nums}
.b3-l{margin-top:18px;font-size:13px;opacity:.7}
.b3-n{font-size:50px;font-weight:800;letter-spacing:-2px;line-height:1.05}
.b3-n small{font-size:18px;font-weight:600;opacity:.75;margin-left:5px;letter-spacing:0}
.b3-tag{display:inline-block;margin-top:8px;font-size:12.5px;background:color-mix(in srgb,var(--brand) 85%,transparent);border-radius:999px;padding:5px 11px}
.b3-row{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);position:relative;z-index:1}
.b3-row div{display:flex;flex-direction:column;gap:2px}.b3-row span{font-size:11.5px;opacity:.6}.b3-row b{font-size:16px}
.b3-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;position:relative;z-index:1}
.b3-acts button{border:0;border-radius:12px;min-height:42px;background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.b3-acts button:last-child{background:#fff;color:#2A2B3D}
.wkcard{background:#fff;border-radius:22px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.wk-h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px}
.wk-open{font-size:13px;font-weight:700;color:#5B8DEF;background:#EAF2FF;border-radius:999px;padding:6px 12px}
.wk-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wk{border:0;background:#F4F6FA;border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.wk span{font-size:11px;color:var(--mute)}.wk b{font-size:16px}
.wk.on{background:#2A2B3D;color:#fff}.wk.on span{color:rgba(255,255,255,.6)}
.wk-dots,.cd-dots{display:flex;gap:3px;height:6px;justify-content:center}
.wk-dots i,.cd-dots i{width:6px;height:6px;border-radius:50%;display:block}
.plist{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:4px 16px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0}
.prow+.prow{border-top:1px solid #F0F0F5}
.pr-t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-m{font-size:12.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-d{font-size:12.5px;color:var(--sub);font-weight:600;flex:0 0 auto}
.prow .grow{min-width:0}
/* calendar */
.calc{background:#fff;border-radius:24px;padding:16px 14px;box-shadow:var(--shadow)}
.cal-m{font-weight:800;font-size:18px}
.cal-nav{border:0;background:#F4F4F8;width:36px;height:36px;border-radius:12px;font-size:20px;cursor:pointer}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;margin-top:12px}
.cw{text-align:center;font-size:12px;color:var(--mute);padding-bottom:4px}.cw.sun{color:#E57373}
.cd{border:0;background:none;border-radius:14px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:46px}
.cd b{font-size:15px;font-weight:600;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.cd.past b{color:#B8BACB}
.cd.today b{box-shadow:inset 0 0 0 2px #2A2B3D}
.cd.sel b{background:#2A2B3D;color:#fff;box-shadow:none}
.cal-lg{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px;font-size:12px;color:var(--sub)}
.cal-lg span{display:flex;align-items:center;gap:5px}.cal-lg i{width:8px;height:8px;border-radius:50%}
.tline{position:relative;padding-left:24px}
.tline::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;border-left:2px dashed #D8D9E5}
.tl2{position:relative;margin-bottom:10px}
.tl2-dot{position:absolute;left:-24px;top:22px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid}
.tl2-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.tl2-card .grow{min-width:0}
.tl2-r{text-align:right;flex:0 0 auto}.tl2-r b{display:block;font-size:14px}.tl2-r span{font-size:12.5px;font-weight:700}
.goal2{display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:16px;margin-top:16px;box-shadow:var(--shadow)}
.ai-fill{width:100%;display:flex;align-items:center;gap:12px;border:0;cursor:pointer;margin-top:10px;border-radius:22px;padding:16px;color:#fff;background:linear-gradient(135deg,#5B8DEF,#8FB3F5);box-shadow:0 12px 26px rgba(91,141,239,.35);font-size:18px}
.ai-fill b{display:block;font-size:15.5px}.ai-fill span{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
.ai-fill svg{background:rgba(255,255,255,.95);border-radius:14px;padding:4px;flex:0 0 auto}
.ai-fill.busy{animation:plb 1s ease-in-out infinite}
.life{background:#fff;border-radius:22px;padding:18px 16px;box-shadow:var(--shadow)}
.life-bar{display:flex;gap:4px;height:14px}
.life-bar span{border-radius:7px}.lb1{background:linear-gradient(90deg,#A8D5C8,#6DB3A0)}.lb2{background:linear-gradient(90deg,#EE9A7E,#F7C2AE)}
.life-l{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px;font-weight:600}
.life-s{display:flex;gap:16px;margin-top:12px;font-size:13.5px;color:var(--sub)}
.life-s div{display:flex;align-items:center;gap:6px}.life-s i{width:8px;height:8px;border-radius:50%}.life-s b{color:var(--ink)}
.life .spark{color:#5B8DEF}
/* ===== v11: 플로팅 탭바 · 화면 전환 애니메이션 · 플래너 ===== */
#app{position:relative}
.tabs{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));border-radius:999px;background:#22233A;box-shadow:0 14px 30px rgba(20,20,40,.35);padding:6px;z-index:30}
.tabs button{color:rgba(255,255,255,.55);border-radius:999px;padding:7px 2px;font-size:11px;transition:background .25s,color .25s}
.tabs button svg{width:22px;height:22px}
.tabs button.on{background:#fff;color:#22233A}
body[data-mode=recv] .tabs button.on{color:#EE9A7E}body[data-mode=give] .tabs button.on{color:#6DB3A0}
.bd{padding-bottom:110px!important}
.bd.notab,.bd.chatv{padding-bottom:28px!important}
.bd > *{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.bd > *:nth-child(2){animation-delay:.03s}.bd > *:nth-child(3){animation-delay:.06s}.bd > *:nth-child(4){animation-delay:.09s}.bd > *:nth-child(5){animation-delay:.12s}.bd > *:nth-child(6){animation-delay:.15s}.bd > *:nth-child(7){animation-delay:.18s}.bd > *:nth-child(n+8){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.click,.mt,.rec,.wk,.cd,.qa button,.btn{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.click:active,.mt:active,.rec:active,.qa button:active,.btn:active{transform:scale(.97)}
.mt{transition:transform .25s cubic-bezier(.2,.8,.2,1),background .3s,box-shadow .3s}
.bank3{transition:transform .3s}.bank3:hover{transform:translateY(-2px)}
.hs .hcard,.hs .evc,.hs .nc{animation:slidein .45s cubic-bezier(.2,.8,.2,1) both}
.hs > *:nth-child(2){animation-delay:.06s}.hs > *:nth-child(3){animation-delay:.12s}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.cd.new b{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.ptext{background:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ptext::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#5B8DEF,#8FB3F5,#6DB3A0)}
.ptext.busy{animation:plb 1.1s ease-in-out infinite}
.pt-h{display:flex;align-items:center;gap:10px}
.pt-h svg{background:#EAF2FF;border-radius:12px;padding:3px}
.pt-h b{display:block;font-size:16px}.pt-h span{display:block;font-size:12.5px;color:var(--mute)}
.ptext p{font-size:14.5px;line-height:1.7;color:var(--sub);margin:12px 0 0}.ptext p b{color:var(--ink)}
.pt-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pt-i{display:flex;align-items:center;gap:12px;background:#F6F8F7;border-radius:16px;padding:10px 12px;animation:rise .4s both}
.pt-i .grow{min-width:0}
.pt-d{width:42px;height:46px;border-radius:12px;background:#6DB3A0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
.pt-d b{font-size:17px;line-height:1}
.pt-tip{margin-top:12px;font-size:13px;color:var(--sub);background:#FFF8EC;border-radius:12px;padding:9px 12px}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit;position:relative}
.rec .grow{min-width:0}
.rec .b{font-size:15px}
.rec-why{font-size:12.5px;color:#4E937F;margin-top:4px}.rec-why .spark{color:#6DB3A0}
.rec-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
.rec-ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px #D8DAE3;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.rec.on{box-shadow:inset 0 0 0 2px #6DB3A0,var(--shadow);background:#F5FBF9}
.rec.on .rec-ck{background:#6DB3A0;box-shadow:none}
.rec.done{opacity:.6}.rec.done .rec-ck{width:auto;padding:0 8px;border-radius:8px;background:#E8F4F0;color:#4E937F;box-shadow:none;font-size:11px}
/* ===== 11/10: 모드 버튼·통장 작게 + 파스텔 톤 정리 ===== */
:root{--recv:#EE9A7E;--recv-soft:#FFF1EB;--give:#6DB3A0;--give-soft:#E9F6F1}
.mode2{gap:6px;margin-top:2px;background:#F1F4F9;border-radius:18px;padding:5px}
.mt{min-height:0;height:56px;border-radius:14px;padding:0 10px 0 50px;justify-content:center;box-shadow:none;background:transparent}
.mt b{font-size:15.5px}
.mt em{font-size:11.5px;margin-top:1px}
.mt-ic{top:50%;left:9px;transform:translateY(-50%);width:34px;height:34px;border-radius:11px}
.mt-ic svg{width:22px;height:22px}
.mt-wave,.mt-chk{display:none}
.mt.on{transform:none}
.mt:not(.on){opacity:1}
.mt:not(.on) b{color:var(--sub)}
.mt:not(.on) .mt-ic{background:#fff}
.mt-recv.on{background:linear-gradient(135deg,#FFE9DF,#FFF4EE);box-shadow:0 4px 12px rgba(238,154,126,.18)}
.mt-give.on{background:linear-gradient(135deg,#DDF2EA,#EEF8F4);box-shadow:0 4px 12px rgba(109,179,160,.18)}
.mt.on em{color:var(--sub);opacity:.8}
.mt-recv.on b{color:#D9775A}.mt-give.on b{color:#3F8F7B}
.mt.on .mt-ic{background:#fff}
.mode-hint{margin:8px 4px 12px;font-size:12.5px}

.bank3{border-radius:20px;padding:16px 18px 14px;color:var(--ink);background:linear-gradient(135deg,#E6E5FF 0%,#F1E8FA 55%,#FCEDEF 100%);box-shadow:0 8px 22px rgba(91,141,239,.14)}
.bank3::after{right:-40px;bottom:auto;top:-60px;width:150px;height:150px;background:rgba(255,255,255,.45);opacity:1}
.b3-top{font-size:12.5px}
.b3-chip{width:22px;height:16px;border-radius:4px;background:linear-gradient(135deg,#B9B6F5,#8E8BE6)}
.b3-name{color:#3A6FD8}
.b3-no{opacity:1;color:var(--mute);font-size:12px}
.b3-l{margin-top:10px;font-size:12px;opacity:1;color:var(--sub)}
.b3-n{font-size:32px;letter-spacing:-1.2px;line-height:1.1;color:#3A6FD8}
.b3-n small{font-size:14px;color:var(--sub);opacity:1}
.b3-tag{display:block;background:none;padding:0;margin-top:2px;font-size:11.5px;color:var(--sub)}
.b3-tag b{color:#3A6FD8}
.b3-row{margin-top:10px;padding-top:10px;border-top:1px solid rgba(91,141,239,.15)}
.b3-row span{font-size:11px;opacity:1;color:var(--mute)}
.b3-row b{font-size:14px;color:var(--ink)}
.b3-acts{position:absolute;right:16px;top:50px;margin:0;display:flex;gap:6px}
.b3-acts button{min-height:32px;padding:0 12px;font-size:12.5px;border-radius:999px;background:rgba(255,255,255,.7);color:#3A6FD8}
.b3-acts button:last-child{background:#5B8DEF;color:#fff}
.wk.on{background:#5B8DEF}
@media (max-width:350px){.b3-acts{position:static;margin-top:10px}.b3-acts button{flex:1}}
.mt b,.mt em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}@media (max-width:350px){.mt{padding-left:46px}.mt-ic{left:7px;width:32px;height:32px}.mt em{font-size:11px}}
/* ===== 11/10-2: 그라데이션 제거(단색 파스텔) + 플래너 톤 + 스크롤바 숨김 ===== */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.mt-recv.on{background:#FFEDE5}
.mt-give.on{background:#E2F3EC}
.bank3{background:#E8F1FF;box-shadow:0 6px 18px rgba(91,141,239,.12)}
.bank3::after{display:none}
.b3-chip{background:#9DBDF5}
.hero,.bank2,.mini-bank{background:var(--brand)}
.hero.amber{background:#EE9A7E}
.bank2::before{display:none}
.pl-go,.pl-hero,.ai-fill{background:#5B8DEF}
.pl-peek{background:#EEF4FF}
.pl-orb{background:#EAF2FF}

.n-name{font-size:15px;font-weight:800;margin-top:8px}
.n-sub{font-size:11.5px;color:var(--mute);margin-top:1px}
.n-note{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.4;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.n-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:8px;height:22px;overflow:hidden}
.n-tags span{font-size:11px;font-weight:600;color:#4F83E8;background:#E8F0FE;border-radius:999px;padding:3px 8px}
body[data-mode=give] .n-tags span{color:#3F8F7B;background:#E4F4EE}
.n-f{font-size:11.5px;color:var(--mute);margin-top:10px;padding-top:8px;border-top:1px solid #EDF0F5;align-self:stretch}
/* 요청 종류별 색 */
.wcard{gap:9px}
.w-head{display:flex;justify-content:space-between;align-items:center}
.w-ty{font-size:11.5px;font-weight:800;border-radius:8px;padding:4px 9px}
.w-st{font-size:14.5px;font-weight:600;line-height:1.4;color:var(--sub)}
.w-st b{color:var(--ink);font-weight:800}
.w-dl{align-self:center}
.wcard.t-acc{box-shadow:0 0 0 1.5px #CFE0FC!important}.t-acc .w-ty{background:#E8F0FE;color:#3A6FD8}.t-acc .w-go{background:#6F9CF0!important}
.wcard.t-offer{box-shadow:0 0 0 1.5px #F6D2C3!important}.t-offer .w-ty{background:#FFEDE5;color:#D9775A}.t-offer .w-go{background:#EE9A7E!important}
.wcard.t-done{box-shadow:0 0 0 1.5px #CDE8DD!important}.t-done .w-ty{background:#E4F4EE;color:#3F8F7B}.t-done .w-go{background:#6DB3A0!important}
.wcard.t-ask{box-shadow:0 0 0 1.5px #CDE8DD!important}.t-ask .w-ty{background:#E4F4EE;color:#3F8F7B}.t-ask .w-go{background:#6DB3A0!important}
.wcard.t-org{box-shadow:0 0 0 1.5px #F3E2B8!important}.t-org .w-ty{background:#FFF4D6;color:#B98516}.t-org .w-go{background:#E3B25A!important}
/* 상세: 도움 받기 vs 봉사하기 */
.rban{border-radius:20px;padding:16px;margin-bottom:14px}
.rban.recv{background:#FFEDE5}.rban.give{background:#E2F3EC}
.rb-l{display:flex;justify-content:space-between;align-items:center}
.rb-chip{font-size:11.5px;font-weight:800;border-radius:8px;padding:4px 9px;background:#fff}
.recv .rb-chip{color:#D9775A}.give .rb-chip{color:#3F8F7B}
.rb-st{font-size:12px;font-weight:700;color:var(--sub)}
.rb-t{font-size:20px;line-height:1.35;margin-top:10px;color:var(--ink);letter-spacing:-.4px}
.rb-t b{font-weight:800}
.recv .rb-t b{color:#D9775A}.give .rb-t b{color:#3F8F7B}
.rb-row{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;font-weight:700;color:var(--ink)}
.rb-tip{display:flex;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.06);font-size:12px;color:var(--sub)}
.hlogo{display:inline-flex;align-items:center;gap:8px;font-size:20px;font-weight:800;letter-spacing:-.6px;color:#2B3A55}
.hlogo i{width:32px;height:32px;border-radius:10px;background:#8DB4F7;color:#fff;display:grid;place-items:center}
.hlogo i svg{width:20px;height:20px}
/* 헤더 구분 */
.hd{background:#fff!important;backdrop-filter:none!important;border-bottom:1px solid #E9EDF3!important;box-shadow:0 2px 10px rgba(60,80,120,.04);padding:10px 14px 10px 18px!important}
.hd+.bd,.hd~.bd{padding-top:14px}
.chip-role{background:#F1F5FC!important;box-shadow:none!important;border:0!important}
.hd .bell{background:#F1F5FC;border-radius:50%}
.ev-dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.ev-dots i{width:6px;height:6px;border-radius:99px;background:#D5DCE6;transition:all .3s}
.ev-dots i.on{width:18px;background:#8DB4F7}
/* 나를 기다리는 요청: 작게 + 배경 색 빼기 */
.wcard{flex:0 0 74%;background:rgba(255,255,255,.65)!important;padding:12px 13px;gap:7px;border-radius:18px}
.wcard .pav{width:30px!important;height:30px!important;font-size:12px!important}
.w-top{gap:8px}
.w-st{font-size:13.5px;line-height:1.35}
.w-box{background:none;padding:0;gap:8px}
.w-box .dic{display:none!important}
.w-c{font-size:13px;font-weight:600;color:var(--ink)}
.w-m{font-size:11.5px}
.w-go{background:none!important;padding:8px 0 0;border-top:1px solid #EDF0F5;border-radius:0;font-size:13px;text-align:right}
.t-acc .w-go{color:#3A6FD8}.t-offer .w-go{color:#D9775A}.t-done .w-go,.t-ask .w-go{color:#3F8F7B}.t-org .w-go{color:#B98516}
.w-go::after{content:" ›"}
/* 도와줄 수 있는 이웃: 가로형 카드 */
.ncard3{flex:0 0 230px;scroll-snap-align:start;background:rgba(255,255,255,.65);border:1.5px solid #E3E8EF;border-radius:18px;padding:12px 13px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.n3-top{display:flex;align-items:center;gap:9px}
.n3-top .grow{min-width:0}
.n3-name{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n3-sub{font-size:11.5px;color:var(--mute)}
.n3-h{font-size:12px;font-weight:800;color:#3F8F7B;white-space:nowrap}
.n3-note{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n3-f{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mute)}
.n3-tag{font-weight:700;color:#4F83E8;background:#E8F0FE;border-radius:999px;padding:3px 8px}
body[data-mode=give] .n3-tag{color:#3F8F7B;background:#E4F4EE}
.wcard[class] .w-go{background:none!important;padding:8px 0 0}
/* 나를 기다리는 요청 v3 */
.wtabs{display:flex;gap:6px;margin:0 2px 10px;overflow-x:auto}
.wt{border:1.5px solid #E3E8EF;background:rgba(255,255,255,.65);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap}
.wt b{font-weight:800;margin-left:2px}
.wt.on.t-acc{border-color:#9DBDF5;color:#3A6FD8;background:#EEF4FF}
.wt.on.t-offer{border-color:#F3B9A2;color:#D9775A;background:#FFF3EE}
.wt.on.t-done,.wt.on.t-ask{border-color:#A9D6C5;color:#3F8F7B;background:#EEF8F4}
.wt.on.t-org{border-color:#EBCF8E;color:#B98516;background:#FFF8E6}
.wcard{flex:0 0 228px!important;padding:12px!important;gap:8px!important}
.wcard.hide{display:none}
.w-nm{font-size:11.5px;color:var(--mute)}
.w-st{font-size:13.5px!important;font-weight:800!important;color:var(--ink)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-top .grow{min-width:0}
.w-c{font-size:13px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-f{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mute);padding-top:8px;border-top:1px solid #EDF0F5}
.w-f b{font-size:12.5px}
.t-acc .w-f b{color:#3A6FD8}.t-offer .w-f b{color:#D9775A}.t-done .w-f b,.t-ask .w-f b{color:#3F8F7B}.t-org .w-f b{color:#B98516}
.w-dl{font-size:11px!important;padding:3px 8px!important}
.wcard{width:240px;flex:0 0 240px!important;min-width:0;box-sizing:border-box}
.w-dl2{font-style:normal;font-weight:700;color:#E07A55}
/* 요청함: 폴더 모양 */
.wfold{--ft:#F4F7FD;--fb:#DCE6F7;--fk:#3A6FD8;margin:0 -2px}
.wfold.f-acc{--ft:#EEF4FF;--fb:#D3E1FA;--fk:#3A6FD8}
.wfold.f-offer{--ft:#FFF3EE;--fb:#F6D9CD;--fk:#D9775A}
.wfold.f-done,.wfold.f-ask{--ft:#EEF8F4;--fb:#CFE8DE;--fk:#3F8F7B}
.wfold.f-org{--ft:#FFF8E6;--fb:#F1E1B5;--fk:#B98516}
.wfold .wtabs{gap:4px;margin:0;padding:0 0 0 2px;overflow:visible;position:relative;z-index:1}
.wfold .wt{border:1.5px solid transparent;border-bottom:0;border-radius:14px 14px 0 0;background:rgba(255,255,255,.5);color:var(--mute);padding:9px 14px 9px;font-size:13px;margin-bottom:-1.5px}
.wfold .wt.on{background:var(--ft)!important;border-color:var(--fb)!important;color:var(--fk)!important}
.wfold .wt:not(.on):hover{color:var(--sub)}
.wpanel{background:var(--ft);border:1.5px solid var(--fb);border-radius:0 18px 18px 18px;padding:12px 0 12px 12px;transition:background .25s,border-color .25s}
.wfold:not(.f-acc):not(.f-ask) .wpanel{border-top-left-radius:18px}
.wpanel .hs{margin:0;padding:0 12px 0 0;scroll-padding-left:0}
.wpanel .wcard{background:#fff!important;box-shadow:none!important;border:1.5px solid rgba(0,0,0,.04)!important}
.wpanel .wcard .w-f b{color:var(--fk)!important}
.qa+.wfold,.qa+.empty{margin-top:22px}
/* 요청함 카드: 내용 강조, 폴더 색 진하게 */
.wcard .pav{width:26px!important;height:26px!important;font-size:11px!important}
.w-top{align-items:center}
.w-nm{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.w-ttl{font-size:15px;font-weight:800;color:var(--ink);line-height:1.35;height:40px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;letter-spacing:-.3px}
.wfold.f-acc{--ft:#E1ECFE;--fb:#BED3F8;--fk:#2F62CC}
.wfold.f-offer{--ft:#FFE6DB;--fb:#F3C3AE;--fk:#CC6646}
.wfold.f-done,.wfold.f-ask{--ft:#DDF1E8;--fb:#B5DCCB;--fk:#2F8069}
.wfold.f-org{--ft:#FFF0C8;--fb:#EBD08A;--fk:#A6760C}
.wfold .wt{background:rgba(255,255,255,.7);color:#8A94A6}
/* 아이콘 메뉴 테두리 */
.qa .dic{box-shadow:inset 0 0 0 1.5px var(--dk)!important}
/* 이웃 섹션 눈에 띄게 */
.npanel{background:#E1ECFE;border:1.5px solid #BED3F8;border-radius:20px;padding:12px 0 12px 12px}
body[data-mode=give] .npanel{background:#DDF1E8;border-color:#B5DCCB}
.npanel .hs{margin:0;padding:0 12px 0 0}
.npanel .ncard3{background:#fff;border-color:transparent;flex:0 0 232px}
.npanel .n3-note{font-size:15px;font-weight:800;letter-spacing:-.3px;white-space:normal;height:40px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.npanel .n3-name{font-size:12px;font-weight:600;color:var(--sub)}
.npanel .n3-top .pav{width:26px!important;height:26px!important;font-size:11px!important}
.npanel .n3-f{padding-top:8px;border-top:1px solid #EDF0F5}
.npanel,body[data-mode=give] .npanel{background:#E9EDF3;border-color:#D7DDE7}
/* 통장 탭: 적립/사용 합친 카드 */
.bsum{background:rgba(255,255,255,.65);border:1.5px solid #E3E8EF;border-radius:20px;padding:14px 12px 10px;margin-top:12px}
.bs-h{display:flex;align-items:center;justify-content:space-between}
.bs-nav{width:34px;height:34px;border-radius:50%;border:0;background:#F1F5FC;font-size:20px;line-height:1;color:#5B6B85;cursor:pointer;font-family:inherit}
.bsum.out .bs-nav{background:#FFF1EB}
.bs-ttl{text-align:center;display:flex;flex-direction:column}
.bs-ttl span{font-size:12.5px;color:var(--sub);font-weight:600}
.bs-ttl b{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:1px}
.bsum.in .bs-ttl b{color:#3A6FD8}.bsum.out .bs-ttl b{color:#D9775A}
.bs-sub{text-align:center;font-size:12px;color:var(--mute);margin-top:4px}
.bs-sub b{color:var(--ink)}
.bs-chart{width:100%;height:auto;display:block;margin-top:6px}
.bs-dots{display:flex;justify-content:center;gap:5px;margin-top:2px}
.bs-dots i{width:6px;height:6px;border-radius:9px;background:#D5DCE6}
.bs-dots i.on{width:16px;background:#8DB4F7}
.bsum.out .bs-dots i.on{background:#EE9A7E}
.pass .p-in{color:#3A6FD8!important}.pass .p-out{color:#D9775A!important}
/* 월별 막대(가로) */
.bs-bars{display:flex;flex-direction:column;gap:9px;margin:14px 4px 10px}
.bb-r{display:grid;grid-template-columns:36px 1fr 84px;align-items:center;gap:10px}
.bb-m{font-size:12.5px;color:var(--mute);font-weight:600}
.bb-t{height:12px;border-radius:99px;background:#EEF2F8;overflow:hidden}
.bb-t i{display:block;height:100%;border-radius:99px;background:#BFD3F8}
.bsum.out .bb-t i{background:#F7CDBD}
.bb-v{font-size:12.5px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bb-r.on .bb-m{color:var(--ink);font-weight:800}
.bb-r.on .bb-t i{background:#6F9CF0}.bsum.out .bb-r.on .bb-t i{background:#EE9A7E}
.bb-r.on .bb-v{color:var(--ink);font-weight:800}
/* 거래 내역: 통장 장부 */
.ledger{background:rgba(255,255,255,.65);border:1.5px solid #E3E8EF;border-radius:18px;overflow:hidden;font-variant-numeric:tabular-nums}
.lg-top{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1.5px dashed #D3DDEC;font-size:12.5px}
.lg-top b{color:#24529E;font-weight:800}.lg-top span{color:#8A9BB8;font-size:11.5px}
.lg-h,.lg-r{display:grid;grid-template-columns:42px 1fr 78px 78px;gap:6px;align-items:center;padding:0 12px}
.lg-h{background:#EEF3FB;font-size:11px;color:#7A8AA5;font-weight:700;padding-top:7px;padding-bottom:7px}
.lg-h span:nth-child(n+3),.lg-r>span:nth-child(n+3){text-align:right}
.lg-r{padding-top:11px;padding-bottom:11px;border-bottom:1px dashed #E3E8EF}
.lg-d{font-size:11.5px;color:var(--mute)}
.lg-t{min-width:0;display:flex;flex-direction:column}
.lg-t b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-t em{font-style:normal;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-v{font-size:12.5px;font-weight:800;white-space:nowrap}
.lg-v.in{color:#3A6FD8}.lg-v.out{color:#D9775A}
.lg-b{font-size:12px;color:var(--sub);white-space:nowrap}
.lg-end{text-align:center;font-size:11px;color:#B3BCCB;padding:10px 0 12px;letter-spacing:2px}
@media (max-width:350px){.lg-h,.lg-r{grid-template-columns:38px 1fr 70px 66px;padding:0 9px}.lg-r{padding-top:10px;padding-bottom:10px}.lg-v,.lg-b{font-size:11px}}
.lg-v.lg-in{color:#3A6FD8}.lg-v.lg-out{color:#D9775A}
/* 월별 결산 v3 */
.bsum{padding:14px 14px 12px}
.bs-ttl b{font-size:18px;color:var(--ink)!important}
.bs-ttl span{font-size:12px;color:var(--mute);margin-top:2px;font-weight:500}
.bs-nav:disabled{opacity:.35;cursor:default}
.bsum .bs-nav{background:#F1F5FC!important}
.bs-two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.bs-two>div{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.bt-in{background:#EEF4FF}.bt-out{background:#FFF1EB}
.bs-two span{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.bs-two i{width:8px;height:8px;border-radius:3px}
.bt-in i{background:#6F9CF0}.bt-out i{background:#EE9A7E}
.bs-two b{font-size:17px;font-weight:800;letter-spacing:-.4px}
.bt-in b{color:#3A6FD8}.bt-out b{color:#D9775A}
.bs-chart{margin-top:8px}
.bs-tot{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding-top:10px;border-top:1px solid #EDF0F5;margin-top:4px}
.bs-tot b{font-weight:800;margin-left:3px}.bt-a{color:#3A6FD8}.bt-b{color:#D9775A}
/* 결산: 작게, 그래프 없이 */
.bsum2{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.65);border:1.5px solid #E3E8EF;border-radius:18px;padding:10px 12px;margin-top:12px}
.b2-m{display:flex;align-items:center;gap:6px}
.b2-m b{font-size:15px;font-weight:800;min-width:34px;text-align:center}
.bsum2 .bs-nav{width:28px;height:28px;font-size:17px;background:#F1F5FC!important}
.b2-v{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.b2-v>div{display:flex;flex-direction:column;align-items:flex-end}
.b2-v span{font-size:11px;color:var(--mute)}
.b2-v b{font-size:14.5px;font-weight:800;white-space:nowrap}
.b2-tot{font-size:12px;color:var(--mute);text-align:right;margin:8px 6px 0}
.b2-tot b{font-weight:800}
/* 거래 내역: 크게 */
.ledger2{background:rgba(255,255,255,.65);border:1.5px solid #E3E8EF;border-radius:20px;overflow:hidden}
.lg2{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px dashed #E3E8EF}
.lg2.more{display:none}.ledger2.open .lg2.more{display:grid}
.l2-d{text-align:center;line-height:1.1}
.l2-d b{display:block;font-size:19px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.l2-d span{font-size:11px;color:var(--mute)}
.l2-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.l2-t b{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2-t em{font-style:normal;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2-r{text-align:right;display:flex;flex-direction:column;gap:2px}
.l2-r b{font-size:16px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.l2-r span{font-size:12px;color:var(--mute);white-space:nowrap}
.l2-r .lg-in{color:#3A6FD8}.l2-r .lg-out{color:#D9775A}
.l2-more{display:block;width:100%;border:0;background:none;padding:14px 0;font:inherit;font-size:14px;font-weight:700;color:#4F83E8;cursor:pointer}
.l2-more span{color:var(--mute);font-weight:500;margin-left:2px}
@media (max-width:350px){.lg2{padding:12px;gap:9px}.l2-t b{font-size:14px}.l2-r b{font-size:14px}}
/* 결산 살짝 키우고 전체를 안으로 */
.bsum2{flex-wrap:wrap;padding:14px 16px 0;gap:12px;background:rgba(255,255,255,.4)}
.bsum2 .bs-nav{width:32px;height:32px;font-size:19px}
.b2-m b{font-size:17px;min-width:40px}
.b2-v span{font-size:12px}
.b2-v b{font-size:16.5px}
.bsum2 .b2-tot{flex:0 0 100%;display:flex;justify-content:space-between;margin:0;padding:10px 2px 12px;border-top:1px solid #E6EAF0;font-size:12.5px;text-align:left}
/* 거래 내역 흰색 줄이기 */
.ledger2{background:rgba(255,255,255,.4)}
.ledger2 .lg-top{border-bottom-color:#D9E1EE}
.lg2{border-bottom-color:#DFE4EC}
/* 결산 v4: 이번 달 + 그 달까지 누적 */
.bsum3{margin-top:12px;background:rgba(255,255,255,.4);border:1.5px solid #E3E8EF;border-radius:20px;padding:12px}
.b3m{display:flex;align-items:center;justify-content:center;gap:14px}
.b3m b{font-size:17px;font-weight:800;min-width:44px;text-align:center}
.bsum3 .bs-nav{width:32px;height:32px;font-size:19px;background:#F1F5FC!important}
.b3g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.b3c{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.b3c.in{background:#E8F0FE}.b3c.out{background:#FFEDE5}
.b3l{font-size:12.5px;color:var(--sub);font-weight:600}
.b3c b{font-size:19px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
.b3c.in b{color:#3A6FD8}.b3c.out b{color:#D9775A}
.b3s{margin-top:6px;padding-top:7px;border-top:1px solid rgba(0,0,0,.06);font-size:11.5px;color:var(--mute);white-space:nowrap}
.b3s em{font-style:normal;font-weight:800;color:var(--ink)}
@media (max-width:350px){.b3c{padding:10px}.b3c b{font-size:16px}.b3s{font-size:10.5px}}
/* 통장 안에 결산 넣기 */
.pb-in{padding:0 14px 14px}
.pb-in .bsum3{margin:0;background:rgba(255,255,255,.55);border:0;border-radius:16px;padding:10px}
.pb-in .b3m{justify-content:space-between;padding:0 2px}
.pb-in .b3m b{font-size:15px;color:#24529E}
.pb-in .bs-nav{width:28px;height:28px;font-size:17px;background:#fff!important;color:#4F6A99}
.pb-in .b3g{margin-top:8px}
.pb-in .b3c{background:#fff;padding:10px 12px}
.pb-in .b3c b{font-size:17px}
.pb-in .b3l{font-size:12px}
.pb:not(.pbh) .pb-body{padding-bottom:10px!important}
.pb:not(.pbh) .pb-note{display:none}
.ledger2 .lg-top{display:none}
/* 통장 안 결산: 상자 없애고 통장 줄처럼 */
.pb-in{padding:0 16px 4px 16px}
.pb-in .bsum3{background:none!important;border:0;border-radius:0;padding:12px 0 10px;border-top:1.5px dashed rgba(36,82,158,.25)}
.pb-in .b3m{justify-content:flex-start;gap:6px;padding:0}
.pb-in .b3m b{order:-1;margin-right:auto;text-align:left;font-size:14px;color:#24529E;min-width:0}
.pb-in .b3m b::after{content:" 결산"}
.pb-in .bs-nav{width:26px;height:26px;font-size:16px;background:rgba(255,255,255,.7)!important}
.pb-in .b3g{gap:0;margin-top:8px}
.pb-in .b3c{background:none!important;border:0!important;box-shadow:none!important;padding:2px 0 2px 0;border-radius:0}
.pb-in .b3c.out{padding-left:16px;border-left:1px solid rgba(36,82,158,.15)!important}
.pb-in .b3l{font-size:12px;color:#557099}
.pb-in .b3c b{font-size:18px}
.pb-in .b3s{border-top:0;margin-top:2px;padding-top:0;font-size:12px;color:#6E8BBE}
.pb-in .b3s em{color:#1F3B6E}
/* 통장: 누적만, 버튼 같은 색 */
.pb-in{display:none}
.pb-tot{display:grid;grid-template-columns:1fr 1fr;margin:0 16px 14px;padding-top:12px;border-top:1.5px dashed rgba(36,82,158,.25)}
.pb-tot>div{display:flex;flex-direction:column;gap:1px}
.pb-tot>div+div{padding-left:16px;border-left:1px solid rgba(36,82,158,.15)}
.pb-tot span{font-size:12px;color:#557099}
.pb-tot b{font-size:18px;font-weight:800;letter-spacing:-.4px}
.pb:not(.pbh) .pb-acts button,.pb:not(.pbh) .pb-acts button:first-child{background:rgba(255,255,255,.55)!important;color:#24529E!important}
/* 거래 내역: 월별 */
.lm-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1.5px dashed #D9E1EE}
.lm-t{text-align:center;display:flex;flex-direction:column;gap:1px}
.lm-t b{font-size:17px;font-weight:800}
.lm-t span{font-size:12px;color:var(--mute)}
.lm-t em{font-style:normal;font-weight:800}
.ledger2 .bs-nav{width:32px;height:32px;font-size:19px;background:#F1F5FC!important}
/* 모은 시간 vs 쓴 시간 막대 */
.pbt{margin:0 16px 14px;padding-top:12px;border-top:1.5px dashed rgba(36,82,158,.25)}
.pbt-row{display:flex;justify-content:space-between;font-size:12px;color:#557099}
.pbt-row.big{margin-top:1px}
.pbt-row.big b{font-size:17px;font-weight:800;letter-spacing:-.4px}
.pbt-bar{display:flex;gap:3px;height:10px;margin-top:8px}
.pbt-bar i{background:#6F9CF0;border-radius:99px}
.pbt-bar em{background:#EE9A7E;border-radius:99px}
.pb-tot{display:none}
/* 모은/쓴 시간: 막대 대신 칩 */
.pbt{display:none}
.pbt2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 16px 14px;padding-top:12px;border-top:1.5px dashed rgba(36,82,158,.22)}
.pt-i{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.6);border-radius:14px;padding:10px 12px}
.pt-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.pt-i.in .pt-ic{background:#D5E3FB;color:#3A6FD8}
.pt-i.out .pt-ic{background:#FBE1D6;color:#D9775A}
.pt-i span{display:block;font-size:11.5px;color:#6A82AD}
.pt-i b{display:block;font-size:16px;font-weight:800;color:#1F3B6E;letter-spacing:-.4px;white-space:nowrap}
.pt-i>div{min-width:0}
@media (max-width:350px){.pt-i{padding:9px;gap:7px}.pt-i b{font-size:14px}.pt-ic{width:26px;height:26px}}
.pt-ic svg{width:17px;height:17px}
/* ===== 11/12 기능 보강 스타일 ===== */
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#EEF1F6;border-radius:14px;padding:4px}
.seg2 button{border:0;background:none;border-radius:11px;padding:9px 0;font:inherit;font-size:14px;font-weight:700;color:var(--mute);cursor:pointer}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(60,80,120,.1)}
.chip-add{border-style:dashed!important;color:#4F83E8!important;background:transparent!important}
.catq{background:rgba(255,255,255,.65);border:1.5px solid #E3E8EF;border-radius:16px;padding:14px;margin-top:10px}

.cq-f .btn.sm{width:auto;padding:0 14px}
.ev-loc{font-size:12.5px;color:var(--sub);margin:0 2px 8px}
.ev-f{margin-bottom:12px}
.evl{display:flex;flex-direction:column;gap:8px}
.evrow{display:flex;align-items:center;gap:12px;background:var(--ec);border-radius:18px;padding:12px 14px;cursor:pointer}
.evr-ic .dic{background:#fff!important}
.evr-org{font-size:11.5px;font-weight:700;color:var(--ek)}
.evr-t{font-size:15px;font-weight:800;margin-top:1px}
.evr-d{font-size:12px;color:var(--sub);margin-top:1px}
.evr-left{font-size:11.5px;font-weight:700;color:var(--ek);background:rgba(255,255,255,.75);border-radius:999px;padding:4px 9px;white-space:nowrap}
.rsec{margin-top:10px;background:rgba(255,255,255,.65);border:1.5px solid #E3E8EF;border-radius:18px;padding:12px}
.rsec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.rsec-h b{font-size:15px}.rsec-h span{font-size:12px;color:var(--mute)}
.rsec:first-of-type .rsec-h b{color:#B98516}
.rcd{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #EEF1F5;cursor:pointer}
.rcd:first-of-type{border-top:0}
.rcd-n{font-weight:800;font-size:14.5px}.rcd-n .badge{margin-left:6px}
.rcd-s{font-size:12px;color:var(--mute);margin-top:1px}
.rcd-why{font-size:12px;color:var(--sub);margin-top:3px}
.rc-empty{font-size:13px;color:var(--mute);padding:8px 0;display:flex;justify-content:space-between;align-items:center}
.rc-empty button{border:0;background:none;font:inherit;font-weight:700;color:#4F83E8;cursor:pointer}
.pubr{padding:12px 0;border-top:1px solid #EEF1F5;margin-top:8px}
.pub-near{font-size:12px;color:var(--sub);margin-top:4px;display:flex;align-items:center;gap:4px}
.pub-l{font-size:12px;color:#4F83E8;margin-top:2px}
.pub-tip{margin-top:10px;background:#E2F3EC;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink)}
.wtype{background:rgba(255,255,255,.65);border:1.5px solid #E3E8EF;border-radius:18px;padding:14px;margin-top:10px}
.wt-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ml2{margin-top:8px}.ml2>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #EEF1F5;font-size:13px}.ml2 span{color:var(--mute);white-space:nowrap}.ml2 b{text-align:right}
.pltabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#EEF1F6;border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:0;z-index:5}
.pltabs button{border:0;background:none;border-radius:11px;padding:9px 0;font:inherit;font-size:14px;font-weight:700;color:var(--mute);cursor:pointer}
.pltabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(60,80,120,.1)}
.plpane>.sec-t:first-child{margin-top:0}
.prio{background:rgba(255,255,255,.65);border:1.5px solid #E3E8EF;border-radius:18px;padding:12px 14px;margin-bottom:12px}
.prio-h{display:flex;justify-content:space-between;align-items:baseline}.prio-h b{font-size:16px}.prio-h span{font-size:11.5px;color:var(--mute)}
.pr-r{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #EEF1F5;cursor:pointer}
.prio-h+.pr-r{border-top:0;margin-top:4px}
.pr-n{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:0 0 auto}
.pr-t b{font-size:14.5px}.pr-t span{font-size:11.5px;color:var(--mute);margin-left:6px}
.pr-w{font-size:12.5px;color:var(--sub);margin-top:2px}
.pr-a{font-size:12px;font-weight:800;white-space:nowrap}
.ty-r{display:grid;grid-template-columns:92px 1fr 78px;gap:8px;align-items:center;margin-top:10px}
.ty-n{font-size:12.5px;color:var(--sub);white-space:nowrap}
.ty-t{height:10px;background:#EEF1F6;border-radius:99px;overflow:hidden}.ty-t i{display:block;height:100%;border-radius:99px}
.ty-v{font-size:12px;text-align:right;color:var(--ink);font-weight:700;white-space:nowrap}

function judge(t,cat){
 if(/약|주사|목욕|씻겨|기저귀|대소변|송금|통장|돈 ?관리|사다리|지붕|전기 ?공사/.test(t)) return {lv:'불가',html:`<div class="ai warn"><div class="ah">${spk}이 요청은 보낼 수 없어요 · 불가${M(2)}</div><div class="small">${/약|주사/.test(t)?'약 먹이기·주사 같은 <b>의료 행위</b>':/목욕|씻겨|기저귀|대소변/.test(t)?'목욕·배변 같은 <b>신체 돌봄</b>':/송금|통장|돈/.test(t)?'<b>금전 관리</b>':'<b>위험 작업</b>'}은 이웃끼리 할 수 없어요. 대신 받을 수 있는 공공 서비스를 찾아볼게요.</div><button class="btn soft sm" style="margin-top:10px" data-act="pubFrom" data-v="${t}">공공 서비스 안내 보기</button></div>`};
 if(/무거|계단|쌀|이사|높은/.test(t)) return {lv:'주의',html:`<div class="ai amber"><div class="ah">${spk}보낼 수 있어요 · 주의${M(2)}</div><div class="small">무거운 짐이나 계단이 있어 다칠 수 있어요. 무리하지 않는 선에서 도와 달라고 적어 두면 좋아요.</div><div class="between" style="margin-top:8px"><span class="small">난이도 제안</span><b>${cat==='동행'?'책임 1.5':'수고 1.2'}</b></div><div class="small muted">근거: 신체 부담(무거운 짐)</div></div>`};
 return {lv:'허용',html:`<div class="ai"><div class="ah">${spk}보낼 수 있어요 · 허용${M(2)}</div><div class="between"><span class="small">난이도 제안</span><b>${LV(cat)} ${W(cat).toFixed(1)}</b></div><div class="small muted">근거: ${cat==='동행'?'이동 중 안전 책임':'신체 부담·위험·전문성이 낮아요'}</div></div>`};
}
