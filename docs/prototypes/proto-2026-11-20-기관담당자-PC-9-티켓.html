/* 두 선 (이 분 / 평균): 끝점에 이름, 선 아래 옅은 면, 펼칠 때 한 번 그려짐 */
function line2({labels,a,b,max,step,unit='',w=262,h=170}){const L=26,R=6,T=14,B=22,iw=w-L-R,ih=h-T-B,n=labels.length,X=i=>L+i*iw/(n-1),y=v=>T+ih-v/max*ih;let g='';
  for(let v=0;v<=max+1e-9;v+=step)g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" style="stroke:${v?'var(--rule-2)':'var(--rule)'}"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" style="fill:var(--ink-3);font-size:13px">${v}${v===max?unit:''}</text>`;
  const P=s=>s.values.map((v,i)=>X(i).toFixed(1)+' '+y(v).toFixed(1)).join(' L');
  g+=`<path d="M${X(0)} ${y(0)} L${P(a)} L${X(n-1)} ${y(0)} Z" style="fill:var(--a500);opacity:.12"/><path class="draw" pathLength="1" d="M${P(b)}" style="fill:none;stroke:var(--ink-4);stroke-width:2;stroke-dasharray:4 4"/><path class="draw" pathLength="1" d="M${P(a)}" style="fill:none;stroke:var(--a600);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round"/>`;
  [[a,'var(--a600)'],[b,'var(--ink-4)']].forEach(([s,c])=>{const v=s.values[n-1];g+=`<circle cx="${X(n-1)}" cy="${y(v)}" r="4" style="fill:${c};stroke:var(--surface);stroke-width:2"/>`});
  labels.forEach((l,i)=>{g+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle" style="fill:var(--ink-3);font-size:13px">${l}</text><rect x="${X(i)-iw/(n-1)/2}" y="${T-6}" width="${iw/(n-1)}" height="${ih+6}" style="fill:transparent" ${tip(`<b>${l}</b><br>${a.name} ${a.values[i]}${unit}<br>${b.name} ${b.values[i]}${unit}`)}/>`});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(a.name+'과 '+b.name+'의 월별 돌봄 횟수. '+labels.map((l,i)=>l+' '+a.values[i]+unit+', 평균 '+b.values[i]+unit).join('; '))}" style="max-width:${w}px">${g}</svg><div class="legend" style="margin-top:4px"><span><i class="sw" style="background:var(--a600)"></i>${a.name} <b class="tn">${a.values[n-1]}${unit}</b></span><span><i class="sw" style="background:var(--ink-4)"></i>${b.name} <b class="tn">${b.values[n-1]}${unit}</b></span></div>`}
function colChart({labels,series,unit='건',w=360,h=150,max,step,aria,every=1,lastNote=''}){
  const L=30,R=10,T=18,B=22,iw=w-L-R,ih=h-T-B,n=labels.length,band=iw/n,bw=Math.min(22,band*.58),y=v=>T+ih-v/max*ih;let g='';
  for(let v=0;v<=max+1e-9;v+=step)g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" style="stroke:${v?'var(--rule-2)':'var(--rule)'}"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" style="fill:var(--ink-3);font-size:calc(13px*var(--fz))">${v}${v===max?unit:''}</text>`;
  labels.forEach((l,i)=>{const cx=L+band*(i+.5),x=cx-bw/2;let base=0,segs='';const last=i===n-1;
    series.forEach((s,si)=>{const v=s.values[i];if(!v)return;const top=series.slice(si+1).every(z=>!z.values[i]),y1=y(base),y0=y(base+v)+(si?0:0),hh=Math.max(1,y1-y0-(si?2:0)),yy=y1-hh-(si?2:0),r=top?Math.min(4,hh):0;
      const d=`M${x},${yy+hh} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${yy+hh} Z`;
      segs+=`<path class="bar" d="${d}" style="fill:${last||series.length>1?s.color:'var(--bar-mute)'}"/>`+(series.length===1?`<path class="bar" d="${d}" fill="url(#gsh)"/>`:'')+(s.hatch?`<path d="${d}" fill="url(#hx)"/>`:'');base+=v});
    const tot=series.reduce((a,z)=>a+z.values[i],0);
    g+=segs+(last?`<text x="${cx}" y="${y(tot)-6}" text-anchor="middle" style="fill:var(--ink);font-size:calc(13px*var(--fz));font-weight:600">${series.length>1?series.map(z=>z.values[i]).join(' · '):tot+unit}</text>`:'');
    if(i%every===0||last)g+=`<text x="${cx}" y="${h-6}" text-anchor="middle" style="fill:var(--ink-3);font-size:calc(13px*var(--fz))">${l}</text>`;
    g+=`<rect x="${L+band*i}" y="${T-6}" width="${band}" height="${ih+6}" style="fill:transparent" ${tip(`<b>${l}${last&&lastNote?' '+lastNote:''}</b><br>`+series.map(z=>`${z.name} ${z.values[i]}${z.unit||unit}`).join('<br>'))}/>`});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(aria)}" style="max-width:${w}px"><defs><linearGradient id="gsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".38"/></linearGradient></defs>${series.some(z=>z.hatch)?HATCH:''}${g}</svg>`}
/* 꺾은선 (한 계열): 2px 선, 끝점에만 값 */
function lineChart1({labels,values,unit='',w=360,h=150,max,step,color='var(--a500)',aria}){
  const L=30,R=46,T=18,B=22,iw=w-L-R,ih=h-T-B,n=labels.length,X=i=>L+i*iw/(n-1),y=v=>T+ih-v/max*ih;let g='';
  for(let v=0;v<=max+1e-9;v+=step)g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" style="stroke:${v?'var(--rule-2)':'var(--rule)'}"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" style="fill:var(--ink-3);font-size:calc(13px*var(--fz))">${v}</text>`;
  const pts=values.map((v,i)=>X(i).toFixed(1)+' '+y(v).toFixed(1));
  g+=`<path d="M${X(0)} ${y(0)} L${pts.join(' L')} L${X(n-1)} ${y(0)} Z" style="fill:${color};opacity:.1"/><path d="M${pts.join(' L')}" style="fill:none;stroke:${color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
  g+=`<circle cx="${X(n-1)}" cy="${y(values[n-1])}" r="4.5" style="fill:${color};stroke:var(--surface);stroke-width:2"/><text x="${X(n-1)+9}" y="${y(values[n-1])+4}" style="fill:var(--ink);font-size:calc(13px*var(--fz));font-weight:600">${values[n-1]}${unit}</text>`;
  labels.forEach((l,i)=>{g+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle" style="fill:var(--ink-3);font-size:calc(13px*var(--fz))">${l}</text><rect x="${X(i)-iw/(n-1)/2}" y="${T-6}" width="${iw/(n-1)}" height="${ih+6}" style="fill:transparent" ${tip(`<b>${l} 주</b><br>평균 ${values[i]}${unit}`)}/>`});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(aria)}" style="max-width:${w}px">${g}</svg>`}

    <div class="panel-b" style="padding-top:0;padding-bottom:16px">${insight(`<p>${e.age}세, ${e.home} 사세요. <strong>${r.svc[0]}</strong>는 ${s0[0]}이 대상이에요. 해당하는지 아래 항목을 확인해 보세요.</p><div class="basis"><b>확인할 것</b>기초연금 수급 여부, 장기요양 등급 여부</div>`,'관리 대상 정보 · 공공 서비스 DB (운영자 등록)','자격 미리 보기')}</div>
    <div class="svrows">${r.svc.map((sv,i)=>{const k=svrec(r,sv);return `<div class="svrow"><div class="sv-ai"><div class="sv-t"><span class="ai-tag">AI 안내</span><b>${sv}</b></div><dl><dt>대상</dt><dd>${SVC[sv][0]}</dd><dt>내용</dt><dd>${SVC[sv][1]}</dd><dt>신청</dt><dd>${SVC[sv][2]}</dd></dl></div>
      <div class="sv-me"><div class="sv-k">담당자 기록${k.st?` <span class="sv-st s${['','1','2','3'][['','안내함','신청함','해당 없음'].indexOf(k.st)]}">${k.st}</span> <span class="muted small tn" style="font-weight:400">${k.at||'11/13'} 기록</span>`:' <span class="muted small">아직 없음, 하나를 골라 주세요</span>'}</div><div class="chips ck" role="group" aria-label="${sv} 처리 상태">${['안내함','신청함','해당 없음'].map(o=>`<button type="button" class="chip ${k.st===o?'on':''}" aria-pressed="${k.st===o}" onclick="pbsvc('${r.id}',${i},'${o}')">${k.st===o?icon('tick'):''}${o}</button>`).join('')}</div>${k.memo||F('svm_'+r.id+i)?`<input type="text" class="sm" aria-label="${sv} 메모" placeholder="메모" value="${esc(k.memo||'')}" onchange="pbsvm('${r.id}',${i},this.value)">`:`<button type="button" class="link" onclick="setF('svm_${r.id}${i}',1)">${icon('plus')}메모 추가</button>`}</div></div>`}).join('')}</div>

 {place:'행복요양원 2층 프로그램실',who:'65세 이상 어르신 (12명)',desc:'손뜨개로 목도리를 함께 떠요. 실과 바늘은 기관에서 준비해요. 처음 하시는 분도 괜찮아요.',save:11,ask:2}];
const wk=(e,i)=>Object.assign({},EXTRA[i]||{place:'-',who:'누구나',desc:'',save:0,ask:0},e);
LAYERS.eventDetail=i=>{const e=wk(EVENTS[i],i);const m=e.d.match(/(\d+)\/(\d+) \((.)\) (.*)/)||[0,'','','',e.d];const off=!!e.off;
 return drawer('기관 행사',`<div class="evd9"><div class="evd9-top"><div class="evd9-date"><small>${+m[1]}월</small><b>${+m[2]}</b><small>${m[3]}요일</small></div><div><span class="tag">${e.kind}</span><h4>${esc(e.t)}</h4></div></div>
 <dl><dt>일시</dt><dd>${e.d}</dd><dt>장소</dt><dd>${e.place}</dd><dt>대상</dt><dd>${e.who}</dd><dt>보이는 곳</dt><dd>반경 1km 사용자 홈 "동네 기관 소식"</dd><dt>상태</dt><dd>${off?'<span class="status">노출 끔</span>':'<span class="status ok">노출 중</span>'}</dd></dl>
 ${e.desc?`<div class="evd9-desc">${e.desc}</div>`:''}
 <div class="evd9-stats"><div><span class="muted small">조회</span><b class="tn">${e.view}</b></div><div><span class="muted small">관심 표시</span><b class="tn">${e.save}</b></div><div><span class="muted small">문의</span><b class="tn">${e.ask}</b></div></div>
 <p class="note" style="margin-top:18px">시간이 적립·차감되지 않는 소식이에요. 봉사자가 필요하면 기관 공고로 올려요.</p></div>`,
 `<button class="btn" type="button" onclick="EVENTS[${i}].off=${!off};drawLayer();render();toast('${off?'다시 보이게 했어요':'노출을 껐어요'}')">${off?'다시 보이기':'노출 끄기'}</button><span class="sp"></span><button class="btn primary" type="button" onclick="openLayer('eventForm')">수정</button>`)};
function ev9(){if(((location.hash||'').slice(1).split('/')[0])!=='events')return;document.querySelectorAll('#main .evs .ev').forEach((a,i)=>{if(a.dataset.ev9)return;a.dataset.ev9='1';a.tabIndex=0;a.setAttribute('role','button');a.setAttribute('aria-label',EVENTS[i].t+' 상세 보기');
  if(EVENTS[i].off){const s=a.querySelector('.status');if(s){s.className='status';s.textContent='노출 끔'}}
  const op=()=>openLayer('eventDetail',i);a.addEventListener('click',op);a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();op()}})})}
const _rE=render;render=function(){_rE.apply(this,arguments);try{ev9()}catch(e){console.warn(e)}};addEventListener('load',()=>setTimeout(()=>{try{ev9()}catch(e){}},0));
})();
</script>
</body>
</html>
