 <div class="stats c3" style="margin-top:10px"><div class="stat"><b>${fmt(Math.max(0,earnedBal(a)))}</b><span>직접 적립</span></div><div class="stat"><b>${fmt(giftBal(a))}</b><span>선물받은 시간</span></div><div class="stat"><b>${fmt(tb)}</b><span>누적 적립</span></div></div>
 <div class="card"><div class="row between"><b>받을 수 있는 자격</b>${tb>=10?tp('충족','ok'):tp('적립 중','y')}</div><div class="bar" style="margin:10px 0 6px"><i style="width:${Math.min(100,tb*10)}%"></i></div><div class="mini">직접 적립한 시간은 <b>누적 10시간 이상</b>부터 쓸 수 있어요. 가족에게 선물받은 시간은 바로 쓸 수 있어요. (B-33)</div></div>
 <div class="btns" style="margin-top:10px"><button class="btn soft" data-act="giftSheet">${I.gift}가족에게 선물</button><button class="btn soft" data-go="family">가족 연결</button></div>
 <div class="sec-t sm">가중치 (난이도)</div><div class="card"><table class="tbl">${[['기본 ×1.0',CATS.filter(c=>c.w===1).map(c=>SHORT[c.k]).join(', ')],['수고 ×1.2',CATS.filter(c=>c.w===1.2).map(c=>SHORT[c.k]).join(', ')],['책임 ×1.5',CATS.filter(c=>c.w===1.5).map(c=>SHORT[c.k]).join(', ')]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</table><div class="mini" style="margin-top:6px">적립 = 활동 시간 × 가중치 (0.5시간 단위 반올림)</div></div>
 <div class="sec-t sm">월별 결산</div><div class="card"><table class="tbl"><tr><th>월</th><th>적립·받음</th><th>사용·선물</th><th>순</th></tr>${monthly(a).map(([k,v])=>`<tr><td>${k.slice(5)}월</td><td style="color:var(--green)">+${fmt(v.in)}</td><td style="color:var(--redc)">-${fmt(v.out)}</td><td><b>${fmt(v.in-v.out)}</b></td></tr>`).join('')||'<tr><td colspan=4>내역 없음</td></tr>'}</table></div>

ACT.giftSheet=()=>{const a=me();const f=famOf(a);if(!f.length)return toast('먼저 가족을 연결해 주세요');sheet(`<h2>가족에게 시간 선물</h2><p class="muted">내가 직접 적립한 시간만 선물할 수 있어요 (보낼 수 있는 시간 ${fmt(Math.max(0,earnedBal(a)))}). 선물받은 시간은 다시 선물할 수 없어요.</p><div class="lbl2">받는 가족</div>${sel('gt',f.map(x=>[x.id,x.name]))}<div class="lbl2">시간</div><input class="in" id="gh" type="number" min="0.5" step="0.5" value="2"><button class="btn" style="margin-top:14px" data-act="giftGo">선물하기</button>`);};

ACT.inqSt=d=>{const q=D.inquiries.find(x=>x.id===d.id);q.status=q.status==='처리 중'?'접수':'처리 중';render();};
ACT.mgrSus=d=>{const o=D.mgrs.filter(m=>m.id!==d.id&&m.status==='active');const n=eldersOf(acct(d.id)).length;sheet(`<h2>담당자 계정 정지</h2><p class="muted">담당 어르신 ${n}명을 다른 담당자에게 넘겨요 (D-01).</p>${n?sel('mto',o.map(m=>[m.id,m.name+' · '+m.org])):''}<button class="btn warn" style="margin-top:12px" data-act="mgrSusGo" data-id="${d.id}">정지하고 재배정</button>`);};
ACT.mgrSusGo=d=>{const n=eldersOf(acct(d.id)).length;if(n){const to=val('#mto');if(!to)return toast('받을 담당자가 없어요');reassignElders(d.id,to);}acct(d.id).status='suspended';closeSheet();toast('정지했어요');render();};
ACT.mgrRes=d=>{acct(d.id).status='active';toast('해제했어요');render();};
ACT.noticeEdit=d=>{const n=D.notices.find(x=>x.id===d.id);sheet(`<h2>공지 수정</h2><input class="in" id="net" value="${esc(n.title)}"><textarea class="in" id="neb" rows="4" style="margin-top:8px">${esc(n.body)}</textarea><button class="btn" style="margin-top:12px" data-act="noticeEditGo" data-id="${n.id}">저장</button>`);};
ACT.noticeEditGo=d=>{const n=D.notices.find(x=>x.id===d.id);n.title=val('#net')||n.title;n.body=val('#neb')||n.body;closeSheet();toast('수정했어요');render();};
ACT.noticeDel=d=>confirmSheet('공지를 삭제할까요?','삭제하면 사용자에게 더 이상 보이지 않아요.','삭제',()=>{D.notices=D.notices.filter(x=>x.id!==d.id);render();},true);
SCREENS.a_svc_edit=p=>{const s=p.id?D.svc.find(x=>x.id===p.id):{name:'',target:'',what:'',where:'',region:'전국',kw:[]};return {title:p.id?'서비스 수정':'서비스 등록',tab:'a_ops',html:`<form data-form="svcSave" data-id="${p.id||''}"><div class="lbl2">이름</div><input class="in" id="vn" value="${esc(s.name)}"><div class="lbl2">대상</div><input class="in" id="vt" value="${esc(s.target)}"><div class="lbl2">내용</div><textarea class="in" id="vw" rows="2">${esc(s.what)}</textarea><div class="lbl2">신청처·문의처</div><input class="in" id="vh" value="${esc(s.where)}"><div class="lbl2">지역</div>${sel('vr',[['전국','전국'],...REGIONS.map(r=>[r,r])],s.region||'전국')}<div class="lbl2">검색 키워드 (쉼표로 구분)</div><input class="in" id="vk" value="${esc((s.kw||[]).join(','))}"><button class="btn" style="margin-top:16px">저장</button></form>`};};
ACT.svcSave=d=>{if(!val('#vn')||!val('#vh'))return toast('이름과 문의처는 꼭 필요해요');const o={name:val('#vn'),target:val('#vt'),what:val('#vw'),where:val('#vh'),region:val('#vr'),kw:val('#vk').split(',').map(x=>x.trim()).filter(Boolean)};if(d.id)Object.assign(D.svc.find(x=>x.id===d.id),o);else D.svc.push({id:nid('s'),...o});toast('저장했어요');back();};
ACT.svcDel=d=>confirmSheet('삭제할까요?','AI 안내에서 더 이상 사용하지 않아요.','삭제',()=>{D.svc=D.svc.filter(x=>x.id!==d.id);render();},true);
ACT.repGen=()=>{D.repAt=new Date(NOW);D.users.filter(u=>u.status==='active'&&D.reqs.some(r=>r.recv.k==='user'&&r.recv.id===u.id&&r.stage==='completed')).forEach(u=>notify(u.id,'이번 달 생활 변화 리포트가 만들어졌어요',{name:'life_report',p:{k:'user',id:u.id}}));D.mgrs.forEach(m=>{if(eldersOf(m).length)notify(m.id,'담당 어르신 생활 변화 리포트가 만들어졌어요',{name:'m_elders',p:{}});});toast('리포트를 생성하고 알림을 보냈어요');render();};
SCREENS.a_member=p=>{const u=acct(p.id);const hs=D.reqs.filter(r=>r.helperId===u.id),rs=D.reqs.filter(r=>r.recv.k==='user'&&r.recv.id===u.id);const c=l=>l.filter(r=>r.stage==='completed').length;
 return {title:'회원 상세',tab:'a_members',html:`<div class="pfcard">${av(u.name,'lg')}<div><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">${esc(u.region)} · ${u.status==='active'?'이용 중':u.status==='suspended'?'정지':u.status==='expelled'?'퇴출':'탈퇴'}</div></div></div>
 <div class="stats c3" style="margin-top:12px"><div class="stat"><b>${c(hs)}</b><span>봉사한 활동</span></div><div class="stat"><b>${c(rs)}</b><span>받은 활동</span></div><div class="stat"><b>${u.pen}</b><span>패널티</span></div></div>
 <div class="card"><div class="kvl"><span>구분</span><span>${helperOK(u)?'봉사하는 사용자 + 봉사받는 사용자':'봉사받는 사용자 (봉사 미인증)'}</span></div><div class="kvl"><span>봉사자 인증</span><span>${{none:'미신청',pending:'심사 중',approved:'승인',rejected:'반려'}[u.ver.status]}</span></div><div class="kvl"><span>누적 적립 / 사용 가능</span><span>${fmt(lifetimeEarned(u))} / ${fmt(Math.max(0,available(u)))}시간</span></div><div class="kvl"><span>평점</span><span>${u.rating.length?fmt(avgRating(u))+' ('+u.rating.length+')':'-'}</span></div><div class="kvl"><span>가입 동네</span><span>${esc(u.region)}</span></div></div>
 <div class="sec-t sm">최근 활동</div>${[...hs,...rs].slice(0,6).map(reqCard).join('')||empty('활동이 없어요')}
 ${u.status==='active'?`<button class="btn warn" style="margin-top:14px" data-act="suspend" data-id="${u.id}">이용 정지</button>`:u.status==='suspended'?`<button class="btn" style="margin-top:14px" data-act="restore" data-id="${u.id}">정지 해제</button>`:''}`};};

/* ================= 시작 ================= */
seed(); D.__live=false;
nav.stack=[{name:'login',p:{}}];
document.addEventListener('DOMContentLoaded',()=>render());
if(document.readyState!=='loading') render();

</script>
</body></html>
