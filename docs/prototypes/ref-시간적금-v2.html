<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D6DF2">
<title>시간 적금</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>

:root{
  --bg:#EFEBE4; --paper:#FBF9F5; --card:#FFFFFF; --ink:#1E2A26; --sub:#5C6B66; --mute:#8A9793;
  --line:#E4DED4; --pri:#2F6B5E; --pri-2:#3E8573; --pri-soft:#E3EFEA; --amber:#C98A2B; --amber-soft:#FBF0DC;
  --red:#B5483B; --red-soft:#F8E4E0; --blue:#3A6EA5; --blue-soft:#E4EDF7;
  --r:16px; --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;color:var(--ink);font-size:var(--fs);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
body.big{--fs:18px}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column}
@media (min-width:520px){
  body{padding:24px 0}
  #app{min-height:calc(100dvh - 48px);height:calc(100dvh - 48px);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(30,42,38,.18)}
}
/* header */
.hd{position:sticky;top:0;z-index:20;background:rgba(251,249,245,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;padding:12px 14px 10px;border-bottom:1px solid var(--line);min-height:58px}
.hd .bk{width:38px;height:38px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.hd .bk:hover{background:var(--pri-soft)}
.hd h1{font-size:18px;margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:-.3px}
.chip-role{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px 6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer}
.chip-role .dot{width:8px;height:8px;border-radius:50%;background:var(--pri)}
/* body */
.bd{flex:1 1 auto;overflow-y:auto;padding:16px 16px 28px}
.bd.notab{padding-bottom:28px}
.sec-t{font-size:13px;font-weight:700;color:var(--sub);margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sec-t a{color:var(--pri);font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:10px}
.click{cursor:pointer;transition:transform .08s ease, box-shadow .15s}
.click:active{transform:scale(.985)}
.click:hover{box-shadow:0 4px 14px rgba(30,42,38,.08)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row > *{min-width:0}
.grow{flex:1 1 auto;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--sub)} .mute2{color:var(--mute);font-size:13px}
.small{font-size:13px}
.b{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:#8A5A12}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.gray{background:#EEEAE3;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:16px;cursor:pointer;padding:0 16px;text-align:center}
.btn:hover{background:var(--pri-2)}
.btn.ghost{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}
.btn.ghost:hover{background:var(--pri-soft)}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.warn{background:var(--red)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px}
.btns{display:flex;gap:8px}
.btns > *{flex:1 1 0;min-width:0}
.stack > * + *{margin-top:10px}
/* hero credit */
.hero{background:linear-gradient(135deg,#2F6B5E 0%,#3E8573 100%);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .lbl{font-size:13px;opacity:.85}
.hero .num{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0 2px}
.hero .num small{font-size:16px;font-weight:600;opacity:.85;margin-left:4px}
.hero .sub{font-size:13px;opacity:.9}
.hero .acts{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}
.hero .acts button{flex:1 1 0;min-width:0;min-height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
.hero .acts button:hover{background:rgba(255,255,255,.28)}
.hero.amber{background:linear-gradient(135deg,#B9792A 0%,#D29A45 100%)}
/* list item */
.item{display:flex;gap:12px;align-items:flex-start}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--pri-soft);color:var(--pri)}
.ic.amber{background:var(--amber-soft);color:#8A5A12}
.ic.red{background:var(--red-soft);color:var(--red)}
.ic.blue{background:var(--blue-soft);color:var(--blue)}
.cr{font-weight:800;color:#8A5A12;white-space:nowrap}
.cr.plus{color:var(--pri)} .cr.minus{color:var(--red)}
/* tabs */
.tabs{position:sticky;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--mute);cursor:pointer;border-radius:12px}
.tabs button.on{color:var(--pri);font-weight:700}
.tabs button svg{width:24px;height:24px}
/* form */
label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:16px 2px 6px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:48px;outline:none}
.in:focus{border-color:var(--pri)}
textarea.in{min-height:110px;resize:vertical;line-height:1.55}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.stepper button{width:56px;height:52px;border:0;background:var(--pri-soft);color:var(--pri);font-size:22px;font-weight:700;cursor:pointer;flex:0 0 auto}
.stepper .v{flex:1 1 auto;text-align:center;font-size:20px;font-weight:800}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;cursor:pointer}
.opt + .opt{margin-top:8px}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--mute);flex:0 0 auto;display:grid;place-items:center}
.opt.on .rd{border-color:var(--pri)}
.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pri)}
.toggle{width:46px;height:28px;border-radius:999px;background:#D7D1C6;position:relative;border:0;cursor:pointer;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--pri)}
.toggle.on::after{left:21px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* AI box */
.ai{border:1.5px solid #CFE3DB;background:linear-gradient(180deg,#F4FAF7 0%,#FFFFFF 100%);border-radius:var(--r);padding:14px 16px}
.ai .ah{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--pri);margin-bottom:8px;letter-spacing:.2px}
.ai .ah .spark{width:20px;height:20px;border-radius:6px;background:var(--pri);color:#fff;display:grid;place-items:center}
.ai ul{margin:6px 0 0;padding-left:18px}
.ai li{margin:3px 0}
.ai.warn{border-color:#EBC9C2;background:linear-gradient(180deg,#FCF3F1 0%,#fff 100%)}
.ai.warn .ah{color:var(--red)} .ai.warn .ah .spark{background:var(--red)}
.ai.amber{border-color:#EED9B3;background:linear-gradient(180deg,#FDF7EC 0%,#fff 100%)}
.ai.amber .ah{color:#8A5A12} .ai.amber .ah .spark{background:var(--amber)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#E9F2EE 25%,#D6E8E0 50%,#E9F2EE 75%);background-size:200% 100%;animation:sh 1s infinite linear;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--sub)} .kv dd{margin:0;font-weight:600;min-width:0}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;line-height:1.5}
.msg.ai-m{background:var(--card);border:1px solid var(--line);border-top-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--pri);color:#fff;border-top-right-radius:6px;align-self:flex-end}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.qr button{border:1.5px solid var(--pri);background:var(--card);color:var(--pri);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.qr button:hover{background:var(--pri-soft)}
.composer{display:flex;gap:8px;margin-top:14px}
.composer .in{flex:1 1 auto;min-width:0}
.composer button{flex:0 0 auto;width:52px;border-radius:12px;border:0;background:var(--pri);color:#fff;cursor:pointer;display:grid;place-items:center}
/* stepper status */
.steps{display:flex;gap:4px;margin-top:10px}
.steps span{flex:1 1 0;height:6px;border-radius:3px;background:#E7E1D7}
.steps span.on{background:var(--pri)}
.stepl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
/* bars */
.bar{height:10px;border-radius:5px;background:#EEE9E1;overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:5px;background:var(--pri)}
.bar > i.amber{background:var(--amber)} .bar > i.red{background:var(--red)}
.vbars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.vbars .col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vbars .col i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--pri);display:block}
.vbars .col span{font-size:11px;color:var(--mute)}
/* doc thumb */
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.doc{aspect-ratio:3/4;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.doc b{font-size:11px}
.doc i{display:block;height:4px;border-radius:2px;background:#E6E1D8}
.doc i.s{width:60%}
/* sheet & toast */
.ov{position:fixed;inset:0;background:rgba(20,28,25,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:100%;max-width:430px;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;animation:up .2s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D3CCC1;margin:2px auto 12px}
.sheet h2{font-size:19px;margin:4px 0 6px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:min(380px,calc(100vw - 32px));text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
/* role pick */
.rolecard{display:flex;gap:14px;align-items:center}
.rolecard .ic{width:52px;height:52px;border-radius:16px}
.logo{display:flex;align-items:center;gap:10px;margin:18px 2px 6px}
.logo .mk{width:44px;height:44px;border-radius:14px;background:var(--pri);display:grid;place-items:center;color:#fff}
.notice{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:13px;color:#7A5212}
.divider{height:1px;background:var(--line);margin:14px 0}
.big-cta{min-height:64px;font-size:18px;border-radius:18px}
.center{text-align:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:0 0 auto;background:var(--pri-soft);color:var(--pri)}
.avatar.lg{width:64px;height:64px;font-size:22px}
.timer{font-size:44px;font-weight:800;letter-spacing:-1px;text-align:center;font-variant-numeric:tabular-nums}
.thanks{background:linear-gradient(160deg,#FFF8EA 0%,#FFFFFF 70%);border:1px solid #F0DFC0;border-radius:18px;padding:18px}
.thanks .q{font-size:16px;line-height:1.7;font-weight:500}
.ok{color:var(--pri);font-weight:700}
.warnc{color:var(--red);font-weight:700}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.check-row:last-child{border-bottom:0}
.check-row .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;font-size:13px;font-weight:800;color:#fff;background:var(--pri)}
.check-row .ck.w{background:var(--red)}
.cb{width:22px;height:22px;accent-color:var(--pri);flex:0 0 auto;margin-top:2px}

/* ===== v4: 흰 바탕 · 파랑 한 가지 · 여백 중심 ===== */
:root{--bg:#fff;--paper:#FFFFFF;--line:#F0F1F4;--ink:#1B1D22;--sub:#5F6672;--mute:#9AA1AC;--brand:#3D6DF2;--pri:#3D6DF2;--pri-2:#2F5BDB;--pri-soft:#EEF3FF;--fill:#F6F7F9;--r:16px;--fs:16px}
body{padding:0 !important;background:#fff;letter-spacing:-.3px}
body.big{--fs:19px}
#app{max-width:600px;height:100dvh !important;min-height:0 !important;border-radius:0 !important;box-shadow:none !important;overflow:hidden;background:#fff}
@media (min-width:601px){#app{box-shadow:0 0 0 1px #ECEDF0 !important}}
.hd{background:#fff;backdrop-filter:none;border-bottom:0;min-height:58px;padding:8px 14px 4px 20px}
.hd h1{font-size:20px;font-weight:700;letter-spacing:-.6px}
.hd .bk:hover{background:var(--fill)}
.chip-role{border:0;background:var(--fill);font-size:13px;padding:7px 10px 7px 12px;box-shadow:none;font-weight:600}
.tabs{background:#fff;border-top:1px solid var(--line);box-shadow:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{font-size:11.5px;color:#B4BAC3}
.tabs button.on{color:var(--ink);font-weight:700}
.tabs button svg{width:24px;height:24px}
.bd{padding:8px 20px 40px}
.sec-t{font-size:18px;font-weight:700;color:var(--ink);margin:36px 0 12px;letter-spacing:-.5px}
.sec-t a{font-size:13.5px;font-weight:500;color:var(--mute)}
.muted{color:var(--sub)} .mute2{color:var(--mute);font-size:13.5px} .small{font-size:14.5px}
.card{background:var(--fill);border:0;border-radius:var(--r);padding:18px 18px;box-shadow:none}
.card + .card{margin-top:10px}
.click:hover{box-shadow:none;background:#F1F2F5}
.click:active{transform:scale(.985)}
.item .b{font-size:16px}
/* 통장 */
.hero,.hero.amber{background:var(--brand);color:#fff;border-radius:20px;padding:20px 20px 18px;box-shadow:none;margin:4px 0 0}
.hero.amber{background:#F28C4B}
.hero::after{display:none}
.hero + .card{margin-top:12px}
.bk-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:18px;opacity:.9}
.bk-name{font-weight:600}
.bk-name::before{display:none}
.bk-no{opacity:.75;font-variant-numeric:tabular-nums}
.hero .lbl{font-size:13px;opacity:.8}
.hero .num{font-size:40px;font-weight:700;letter-spacing:-1.2px;margin:2px 0 4px}
.hero .num small{font-size:17px;opacity:.85;font-weight:500}
.hero .sub{font-size:13px;opacity:.8}
.hero .acts{margin-top:20px;gap:6px}
.hero .acts button{background:rgba(255,255,255,.16);border-radius:12px;min-height:44px;font-size:14.5px;font-weight:600}
.hero .acts button:hover{background:rgba(255,255,255,.26)}
.pass{background:var(--fill);border-radius:var(--r);padding:2px 18px 6px;box-shadow:none;font-variant-numeric:tabular-nums}
.pass-d{font-size:12.5px;color:var(--mute);font-weight:600;padding:16px 0 2px}
.pass-r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 12px;border-bottom:1px solid #EBEDF0}
.pass-r:last-child{border-bottom:0}
.pc{min-width:0} .pc b{display:block;font-size:15px;font-weight:600;color:var(--ink)} .pc span{font-size:12.5px;color:var(--mute)}
.pa{text-align:right;flex:0 0 auto} .pa b{display:block;font-size:16px} .pa span{font-size:12px;color:var(--mute)}
.pass .p-in{color:var(--brand)} .pass .p-out{color:var(--ink)}
/* 버튼 */
.btn{background:var(--brand);border-radius:14px;min-height:54px;font-size:16px;font-weight:600}
.btn:hover{background:var(--pri-2)}
.btn[disabled]{background:#D5DAE3;cursor:default}
.btn.ghost{background:var(--fill);color:var(--ink);border:0;box-shadow:none}
.btn.ghost:hover{background:#ECEEF2}
.btn.soft{background:var(--pri-soft);color:var(--brand)}
.btn.soft:hover{background:#E2EAFF}
.btn.warn{background:#EF4E4E}
.btn.sm{border-radius:12px;min-height:44px;font-size:14.5px}
.big-cta{min-height:56px;font-size:16.5px;border-radius:16px}
/* 태그·숫자 */
.tag{background:transparent;color:var(--sub);border-radius:0;font-size:12.5px;padding:0;font-weight:600}
.tags .tag + .tag::before{content:"·";margin-right:6px;color:#C9CED6}
.tag.amber{color:#E07A2E;background:transparent}
.tag.red{background:#FFEDED;color:#E54848;padding:3px 8px;border-radius:6px}
.tag.blue{color:var(--brand);background:transparent}
.tag.gray{color:var(--mute);background:transparent}
.tags{gap:6px}
.cr{color:var(--ink);font-weight:700;font-size:16px}
.cr.plus{color:var(--brand)} .cr.minus{color:var(--ink)}
/* AI */
.ai,.ai.warn,.ai.amber{border:0;border-radius:var(--r);background:var(--pri-soft);padding:18px;box-shadow:none}
.ai::before{display:none}
.ai.warn{background:#FFF1F1} .ai.amber{background:#FFF6EC}
.ai .ah{font-size:12.5px;font-weight:700;color:var(--brand);margin-bottom:8px}
.ai .ah .spark{width:auto;height:auto;background:none;color:var(--brand)}
.ai.warn .ah,.ai.warn .ah .spark{color:#E54848;background:none}
.ai.amber .ah,.ai.amber .ah .spark{color:#D9772B;background:none}
.ai .small,.ai li{font-size:14.5px;line-height:1.65}
.skel{background:linear-gradient(90deg,#E3EAFD 25%,#D3DEFB 50%,#E3EAFD 75%);background-size:200% 100%}
.ic,.ic.amber,.ic.red,.ic.blue{background:#fff;color:var(--ink);border-radius:14px}
.ic.red{color:#E54848}
.avatar{background:#E8EEFF;color:var(--brand);font-weight:700}
/* 폼 */
label.f{font-size:14px;color:var(--sub);font-weight:600;margin:22px 2px 8px}
.in,select.in,textarea.in{border:0;box-shadow:none;border-radius:14px;background:var(--fill);font-size:16px;min-height:54px;padding:14px 16px}
.in:focus{box-shadow:inset 0 0 0 2px var(--brand);background:#fff}
.stepper{border:0;border-radius:14px;box-shadow:none;background:var(--fill)}
.stepper button{background:transparent;color:var(--brand)}
.opt{border:0;border-radius:16px;background:var(--fill);box-shadow:none;padding:16px}

.msg{font-size:16px;border-radius:20px;padding:12px 16px}

.msg.me{background:var(--brand);border-top-right-radius:6px}
.qr button{background:#fff;border:0;box-shadow:inset 0 0 0 1.5px #D6DEF7;color:var(--brand);font-size:15px;font-weight:600;padding:10px 15px}
.composer button{background:var(--brand);border-radius:14px}
.steps span{height:5px;background:#E6E9EE} .steps span.on{background:var(--brand)}
.bar{height:8px;background:#E9ECF1} .bar > i{background:var(--brand)}
.vbars .col i{background:var(--brand)}
.check-row .ck{background:var(--brand);border-radius:50%}
.check-row .ck.w{background:#EF4E4E}
.ok{color:var(--brand)} .warnc{color:#E54848;font-weight:600}
.notice{background:var(--fill);color:var(--sub);border-radius:14px;font-size:13.5px}
.divider{background:#E9ECF0}
.sheet{max-width:600px;background:#fff;border-radius:24px 24px 0 0}
.toast{background:rgba(27,29,34,.92);border-radius:14px;bottom:92px;font-size:14.5px}
.timer{font-size:48px;font-weight:700}
.btns > .card{margin-top:0 !important}
/* ===== 스플래시 · 온보딩 · 로그인 · 가입 ===== */
.bd.full{padding:0 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.splash{justify-content:center;align-items:center}
.sp-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:spIn .9s ease both}
.sp-icon{width:84px;height:84px;border-radius:24px;background:var(--brand);color:#fff;padding:18px;box-shadow:0 12px 30px rgba(61,109,242,.28)}
.sp-word{font-size:15px;font-weight:600;color:var(--brand);letter-spacing:.5px}
@keyframes spIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.ob{animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ob-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:40px;min-height:0}
.ob-text{transition:opacity .26s, transform .26s}
.ob-ill{width:100%;max-width:340px;margin:30px auto 18px;transition:opacity .26s, transform .26s}
.ob-ill svg{width:100%;height:auto;display:block}
.fade{opacity:0;transform:translateY(8px)}
.ob-h{font-size:28px;font-weight:700;line-height:1.35;letter-spacing:-1px;margin:0}
.ob-p{font-size:15px;color:var(--sub);line-height:1.6;margin:12px 0 0}
.ob-dots{display:flex;gap:6px;justify-content:center}
.ob-dots i{width:6px;height:6px;border-radius:3px;background:#D5DAE3;cursor:pointer;transition:width .25s}
.ob-dots i.on{width:18px;background:var(--brand)}
.ob-note{font-size:12px;color:var(--mute);text-align:center;margin:18px 0 14px}
.ob-btns{display:flex;gap:10px}
.ob-btns .btn{flex:1;min-height:56px;border-radius:999px;font-size:16px}
.ob-login{background:var(--fill);color:var(--ink)} .ob-login:hover{background:#ECEEF2}
.au-demo{display:block;margin:14px auto 0;border:0;background:none;color:var(--mute);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.au-form{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.au-form .btn{margin-top:6px}
.au-links{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0 30px;font-size:14px;color:var(--sub)}
.au-links a{cursor:pointer} .au-links span{width:1px;height:12px;background:#D5DAE3}
.au-or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin-bottom:14px}
.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.sns{border-radius:14px;font-size:15.5px}
.btn.kakao{background:#FEE500;color:#191600} .btn.kakao:hover{background:#F5DC00}
.btn.naver{background:#03C75A} .btn.naver:hover{background:#02B451}
.su-prog{height:3px;background:var(--line);border-radius:2px;margin:0 0 26px;overflow:hidden}
.su-prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.su-h{font-size:24px;font-weight:700;letter-spacing:-.8px;margin:0;line-height:1.35}
.su-p{color:var(--sub);margin:8px 0 22px;font-size:15px}
.su-role{display:flex;align-items:center;gap:14px;background:var(--fill);border-radius:18px;padding:18px;cursor:pointer;margin-top:10px}
.su-role.on{background:var(--pri-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.su-ic{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--brand);flex:0 0 auto}
.su-ic svg{width:24px;height:24px}
.su-rt{font-weight:700;font-size:16.5px} .su-rd{font-size:13.5px;color:var(--sub);margin-top:2px}
.su-role .rd{width:22px;height:22px;border-radius:50%;border:2px solid #CDD3DC;flex:0 0 auto;display:grid;place-items:center}
.su-role.on .rd{border-color:var(--brand)} .su-role.on .rd::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--brand)}
.su-bottom{margin-top:32px}
.seg{display:flex;background:var(--fill);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;min-height:46px;border-radius:11px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.su-check{display:flex;align-items:center;gap:12px;padding:14px 4px;cursor:pointer;font-size:15px}
.su-check.all{background:var(--fill);border-radius:14px;padding:16px;margin-bottom:6px}
.su-check .bx{width:24px;height:24px;border-radius:50%;background:#E3E7ED;flex:0 0 auto;display:grid;place-items:center}
.su-check .bx::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.su-check.on .bx{background:var(--brand)}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:700;animation:spIn .5s ease}

/* ===== v5: 요청 카드 · 홈 · 채팅 · 차트 · 로그인 ===== */
.cat-ic{display:grid;place-items:center;border-radius:16px;flex:0 0 auto}
.rq{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #EEF0F3;border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(27,36,64,.05)}

.rq-cr span{font-size:11px;color:#7D93D6}

.reg-n{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reg-b{font-size:11.5px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:3px 8px}
.reg-box{background:#fff;border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 2px 10px rgba(27,36,64,.05)}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:4px 20px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.nc{flex:0 0 200px;scroll-snap-align:start;background:#fff;border:1px solid #EEF0F3;border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(27,36,64,.05);display:flex;flex-direction:column}
.nc-t{font-weight:700;font-size:16px;margin-top:14px;letter-spacing:-.4px;line-height:1.35;min-height:43px}
.nc-m{font-size:13px;color:var(--sub);margin-top:2px}
.nc-f{display:flex;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #F0F1F4;font-size:12.5px;color:var(--mute)}
.nc-f span{display:flex;align-items:center;gap:3px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
.cg-i{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--ink);font-weight:500;padding:0}
.cg-i:active{transform:scale(.95)}
.tip{display:flex;align-items:center;gap:12px;background:var(--fill);border-radius:18px;padding:16px 18px;margin-top:28px}
/* 채팅 */
.bd.chatv{display:flex;flex-direction:column;padding-bottom:0;background:#F7F8FA}
.chat-wrap{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 0 16px}
.chat-day{text-align:center;margin:8px 0 18px}
.chat-day span{font-size:12px;color:var(--mute);background:#EDEFF3;border-radius:999px;padding:4px 12px}
.chat{gap:12px}
.mrow{display:flex;gap:8px;align-items:flex-start;max-width:88%}
.bot{width:34px;height:34px;border-radius:12px;background:var(--brand);color:#fff;padding:7px;flex:0 0 auto}
.mcol{display:flex;flex-direction:column;gap:4px;min-width:0}

.msg{max-width:100%}
.msg.ai-m{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);border-top-left-radius:6px}
.msg.me{max-width:80%;box-shadow:0 2px 8px rgba(61,109,242,.25)}
.mcol.wide .ai{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.mcol.wide .ai.amber{background:#FFF8EE}
.chat-dock{position:sticky;bottom:0;background:#fff;margin:0 -20px;padding:12px 20px 14px;border-top:1px solid #EEF0F3;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(27,36,64,.06)}
.chat-dock:empty{display:none}
.qr-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 2px}
.qr-row::-webkit-scrollbar{display:none}
.qr-row .qr{display:flex;flex-wrap:nowrap;gap:8px;margin:0}
.qr-row .qr button{white-space:nowrap;flex:0 0 auto;background:var(--pri-soft);box-shadow:none;border-radius:999px}
.qr-reset{flex:0 0 auto;border:0;background:var(--fill);color:var(--sub);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chat-dock .composer{margin-top:10px}
.chat-dock .composer .in{border-radius:999px;background:var(--fill);min-height:50px;padding:0 18px}
.chat-dock .composer button{width:50px;height:50px;border-radius:50%}
/* 차트 */
.chart{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpis > div{background:var(--fill);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.kpis b{font-size:20px;letter-spacing:-.5px} .kpis span{font-size:12px;color:var(--sub)}
.kpis em{font-style:normal;font-size:11.5px;font-weight:700;margin-top:4px}

.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}

.donut{display:flex;align-items:center;gap:18px}
.donut svg{flex:0 0 auto}
.lgd{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.lgd-r{display:flex;align-items:center;gap:8px;font-size:14px}

.lgd-r b{font-weight:700} .lgd-r em{font-style:normal;color:var(--mute);font-size:12.5px;width:34px;text-align:right}

.bd.lf{padding-top:4px}

.fl label{font-size:13px;color:var(--sub);font-weight:600;padding-left:4px}

.lf-row a{cursor:pointer}
.lf-keep{display:flex;align-items:center;gap:6px;cursor:pointer}
.lf-keep input{accent-color:var(--brand);width:17px;height:17px}
.bd.lf .au-or{margin:30px 0 18px}
.sns-row{display:flex;justify-content:center;gap:16px}
.sns-c{width:56px;height:56px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.sns-c.kakao{background:#FEE500} .sns-c.naver{background:#03C75A;color:#fff;font-size:20px} .sns-c.apple{background:#111}
.sns-c:active{transform:scale(.94)}
.lf-sign{text-align:center;color:var(--sub);font-size:14px;margin-top:34px}
.lf-sign a{color:var(--brand);font-weight:700;cursor:pointer;margin-left:4px}

/* ===== v6: AI 모듈 라벨 · 도구 실행 · 영수증 · 안내문 · AI 분석 ===== */
.ai .ah{display:flex;align-items:center;gap:5px;flex-wrap:wrap}

.tool-list{display:flex;flex-direction:column;gap:2px}

@keyframes spin{to{transform:rotate(360deg)}}
.tool code,code.fn{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:#6E7CA8;margin-top:2px;word-break:break-all;line-height:1.45}
code.fn{background:#fff;border-radius:8px;padding:6px 9px;margin:0 0 10px}
.tr{font-size:13.5px;color:var(--ink);margin-top:3px}
.rc{background:#fff;border-radius:12px;padding:12px 14px;font-variant-numeric:tabular-nums;border:1px dashed #D5DCEA}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:1px dashed #E1E6EF;margin-bottom:6px}

.rc-r,.rc-t{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.rc-t{border-top:1px dashed #E1E6EF;margin-top:6px;padding-top:8px}
.rc-t b{font-size:16px}
.upl{width:100%;min-height:96px;border:2px dashed #CBD6F5;background:#F7F9FF;border-radius:16px;color:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14.5px;cursor:pointer}
.upl:hover{background:#EEF3FF}
.paper{background:#FFFEFA;border:1px solid #ECE6D6;border-radius:6px;padding:18px 18px 14px;box-shadow:0 8px 22px rgba(60,50,20,.10);transform:rotate(-1.2deg);margin:6px 6px 0;font-family:"Nanum Myeongjo","Noto Serif KR",serif}
.pp-h{font-weight:700;font-size:16px;text-align:center;padding-bottom:10px;border-bottom:2px solid #333;margin-bottom:8px}

.pp-s{font-size:12px;color:#8A6B2E;margin-top:10px}

.policy b{display:block;font-size:15px;margin-bottom:2px}

.ask-hero{background:var(--fill);border-radius:20px;padding:20px 18px}

.ask-hero .composer .in{background:#fff}
.ask-hero .qr-row{margin:10px -18px 0;padding:0 18px}
.ans{margin-top:22px}
.ans .msg.me{max-width:85%;display:table}
.ans-n{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-bottom:10px}
.hb{display:flex;flex-direction:column;gap:9px;background:#fff;border-radius:12px;padding:14px}

.rp b{display:block;font-size:15px;margin-top:12px}

.tip .btn{white-space:nowrap;flex:0 0 auto}
.hs{scroll-padding-left:20px}
.btns .btn{white-space:nowrap}
#mtext{min-height:150px}
.bd > .tags:first-child{margin-top:8px}
.rq-m{white-space:normal;overflow:visible}


/* ===== v2 프로토타입 추가 스타일 ===== */
:root{--orange:#E07A2E;--orange-soft:#FFF1E2;--green:#1F9D63;--green-soft:#E6F7EE;--redc:#E54848}
.hd .right{display:flex;align-items:center;gap:4px;flex:0 0 auto}

.bell svg{width:23px;height:23px}
.bell i{position:absolute;top:2px;right:1px;min-width:17px;height:17px;border-radius:9px;background:#EF4E4E;color:#fff;font-size:10.5px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px}
.chip-role{max-width:150px}
.chip-role span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tp.o{background:#EAF0FF;color:#3D6DF2}.tp.n{background:var(--orange-soft);color:var(--orange)}
.tp.g{background:#EEF0F3;color:var(--sub)}.tp.r{background:#FFEDED;color:var(--redc)}.tp.ok{background:var(--green-soft);color:var(--green)}
.tp.y{background:#FFF6D6;color:#9A7400}
.tps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stats.c3{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--fill);border-radius:16px;padding:14px 14px 12px}
.stat b{display:block;font-size:24px;letter-spacing:-.8px;font-weight:700}
.stat span{font-size:12.5px;color:var(--sub)}
.stat.warnc2 b{color:var(--redc)}
.flow{display:flex;gap:4px;margin:12px 0 4px}
.flow span{flex:1 1 0;text-align:center;font-size:10.5px;color:#B4BAC3;padding-top:7px;border-top:4px solid #E6E9EE;line-height:1.25}
.flow span.on{color:var(--sub);border-color:var(--brand)}
.flow span.cur{color:var(--ink);font-weight:700;border-color:var(--brand)}
.flow.bad span.cur{border-color:#EF4E4E;color:var(--redc)}
.dl{font-size:13px;font-weight:700;color:var(--orange)}
.thread{display:flex;flex-direction:column;gap:8px}
.bub{max-width:84%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5}
.bub .who{font-size:11.5px;opacity:.7;margin-bottom:2px;font-weight:600}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-top-right-radius:5px}
.bub.ot{align-self:flex-start;background:var(--fill);border-top-left-radius:5px}
.bub.sys{align-self:center;background:#fff;border:1px dashed #D5DAE3;color:var(--sub);font-size:13px;max-width:100%;text-align:center}
.bub.place{background:#EAF0FF;border:1px solid #D6DEF7;max-width:100%;align-self:stretch}
.empty{text-align:center;color:var(--mute);padding:34px 0;font-size:14.5px}
.acct{display:flex;align-items:center;gap:12px;background:var(--fill);border-radius:14px;padding:12px 14px;cursor:pointer;margin-top:8px}
.acct.on{box-shadow:inset 0 0 0 2px var(--brand);background:var(--pri-soft)}
.acct .avatar{width:38px;height:38px;font-size:15px}
.lbl2{font-size:12px;font-weight:700;color:var(--mute);margin:16px 2px 4px}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0}
.stars button{border:0;background:none;font-size:34px;color:#D5DAE3;cursor:pointer;padding:0 2px}
.stars button.on{color:#F5B301}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{font-size:12.5px;color:var(--mute)}
.sticky-act{position:sticky;bottom:-40px;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,#fff 28%);padding:18px 0 14px;margin-top:10px;z-index:5}
.pfcard{display:flex;gap:14px;align-items:center}
.pfcard .avatar{width:56px;height:56px;font-size:20px}
.lock{opacity:.55;pointer-events:none}
.mapbox{background:var(--fill);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--sub)}
.tabrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -20px 10px;padding:2px 20px}
.tabrow::-webkit-scrollbar{display:none}
.hlt{background:#FFF6D6;border-radius:4px;padding:0 3px}
.demo{background:#1B1D22;color:#fff;border-radius:16px;padding:16px}
.demo .btn{background:rgba(255,255,255,.14);min-height:44px;font-size:14.5px}

.login-demo{margin-top:22px}
.login-demo .acct{margin-top:6px}

.kvl span:first-child{color:var(--sub);flex:0 0 auto}

.sw:last-child{border-bottom:0}

.btn.sm.inl{width:auto;display:inline-flex;padding:0 14px;min-height:38px;font-size:13.5px}
.chat-in{display:flex;gap:8px;margin-top:12px}
.chat-in .in{flex:1;min-width:0}
.chat-in button{flex:0 0 auto;width:52px;border-radius:14px;border:0;background:var(--brand);color:#fff;cursor:pointer;display:grid;place-items:center}
.seg.sm button{min-height:38px;font-size:14px}
.hr{height:1px;background:var(--line);margin:12px 0}
.sec-t.sm{font-size:15px;margin:24px 0 8px}
.pill.o{background:var(--orange-soft);color:var(--orange)}
.pill.g{background:var(--green-soft);color:var(--green)}
.rq-cr.o{background:var(--orange-soft)}.rq-cr.o b{color:var(--orange)}.rq-cr.o span{color:#E5A56B}

.card.ok{background:var(--green-soft)}
.warnc{color:var(--redc)}
.row.between{justify-content:space-between}
.btn svg{width:20px;height:20px;flex:0 0 auto}

const nav={stack:[]};
const SCREENS={};
function go(name,p={}){nav.stack.push({name,p});render();}
function tab(name,p={}){nav.stack=[{name,p}];render();}
function back(){if(nav.stack.length>1){nav.stack.pop();render();}}
function replace(name,p={}){nav.stack[nav.stack.length-1]={name,p};render();}
function cur(){return nav.stack[nav.stack.length-1];}
const ROLES={
 user:{label:'사용자',tabs:[['u_home','홈','home'],['u_posts','공고','list'],['u_acts','내 활동','hand'],['u_wallet','통장','wallet'],['u_my','내 정보','user']]},

function render(){
  tick();
  const {name,p}=cur();
  const out=SCREENS[name](p||{});
  const a=me();
  const canBack=nav.stack.length>1;
  const nUn=a?unread():0;
  $('#hd').innerHTML=`${canBack?`<button class="bk" data-act="back" aria-label="뒤로">${I.back}</button>`:`<span style="width:6px"></span>`}
    <h1>${out.title||''}</h1>
    ${a?`<div class="right"><button class="bell" data-go="notifs" aria-label="알림">${I.bell}${nUn?`<i>${nUn}</i>`:''}</button><button class="chip-role" data-act="acctSheet"><span class="nm">${esc(a.name)}</span>${I.down}</button></div>`:''}`;
  $('#hd').style.display=out.noHeader?'none':'flex';
  $('#bd').className='bd '+(out.cls||'');
  $('#bd').innerHTML=out.html;
  $('#bd').scrollTop=0;
  const role=a?a.role:null;
  const showTabs=role&&!out.noTabs;
  $('#tabs').style.display=showTabs?'flex':'none';
  if(showTabs){const active=out.tab||name;$('#tabs').innerHTML=ROLES[role].tabs.map(([k,l,ic])=>`<button class="${k===active?'on':''}" data-tab="${k}">${I[ic]}<span>${l}</span></button>`).join('');}
  if(out.mount) out.mount();
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2300);}
function sheet(html){$('#sheet').innerHTML=`<div class="grab"></div>`+html;$('#ov').classList.add('on');}
function closeSheet(){$('#ov').classList.remove('on');}
function confirmSheet(title,body,yes,fn,danger){window._yes=fn;sheet(`<h2>${title}</h2><p class="muted" style="margin:6px 0 0">${body}</p><div class="btns" style="margin-top:18px"><button class="btn ghost" data-act="closeSheet">아니요</button><button class="btn ${danger?'warn':''}" data-act="yes">${yes||'네'}</button></div>`);}
function aiRun(sel,html,ms=800){const el=$(sel);if(!el)return;el.innerHTML=`<div class="ai"><div class="ah">${spk}AI가 정리하는 중…</div><div class="skel"></div><div class="skel" style="width:80%"></div></div>`;setTimeout(()=>{if($(sel))$(sel).innerHTML=html;},ms);}

const ACT={};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-tab]');
  if(t){
    if(t.dataset.tab){closeSheet();return tab(t.dataset.tab);}
    if(t.dataset.go){closeSheet();const p={...t.dataset};delete p.go;return go(t.dataset.go,p);}
    if(t.dataset.act){const f=ACT[t.dataset.act];if(f)return f(t.dataset,t);}
  }
  if(e.target.id==='ov')closeSheet();
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f){e.preventDefault();const fn=ACT[f.dataset.form];if(fn)fn(f.dataset,f);}});

const STAGE_LABEL={wait_helper:'봉사자 수락 대기',wait_recv:'받는 분 수락 대기',confirmed:'일정 확정',inprogress:'진행 중',await_confirm:'활동 확인 대기',completed:'완료',rejected:'거절됨',expired:'기한 만료',auto_rejected:'자동 거절',cancelled:'취소됨'};
const costOf=r=>r.recv.k==='elder'?0:creditOf(r.cat,r.hours);   // B-30: 완료 후 차감(가중치 적용 가정, 기록은 README 참고)

/* ---- 시간 통장 (A-06, B-30~34) ---- */
const helperCredits=u=>D.reqs.filter(r=>r.helperId===u.id&&r.stage==='completed'&&!r.onHold).reduce((s,r)=>s+r.credit,0);
const lifetimeEarned=u=>u.base+helperCredits(u);
const giftIn=u=>D.gifts.filter(g=>g.to===u.id).reduce((s,g)=>s+g.h,0);
const giftOut=u=>D.gifts.filter(g=>g.from===u.id).reduce((s,g)=>s+g.h,0);
const dedSum=(u,k)=>D.reqs.filter(r=>r.stage==='completed'&&r.recv.k==='user'&&r.recv.id===u.id&&r.ded).reduce((s,r)=>s+r.ded[k],0);
const earnedBal=u=>lifetimeEarned(u)-dedSum(u,'earn')-giftOut(u);
const giftBal=u=>giftIn(u)-dedSum(u,'gift');
const holdOf=u=>D.reqs.filter(r=>r.recv.k==='user'&&r.recv.id===u.id&&['confirmed','inprogress','await_confirm'].includes(r.stage)).reduce((s,r)=>s+costOf(r),0);
const totalBal=u=>earnedBal(u)+giftBal(u);
const usable=u=>giftBal(u)+(lifetimeEarned(u)>=10?Math.max(0,earnedBal(u)):0);   // B-33
const available=u=>usable(u)-holdOf(u);
function canReceive(u,cost){
  if(!u||u.role!=='user'||cost<=0) return {ok:true};
  if(available(u)>=cost) return {ok:true};
  if(lifetimeEarned(u)<10 && totalBal(u)-holdOf(u)>=cost) return {ok:false,err:`적립 10시간 이상부터 쓸 수 있어요 (지금 누적 ${fmt(lifetimeEarned(u))}). 가족에게 선물받은 시간은 바로 쓸 수 있어요.`};
  return {ok:false,err:`시간이 부족해요. 필요 ${fmt(cost)} · 사용 가능 ${fmt(Math.max(0,available(u)))}. 먼저 도움을 주고 적립하거나 가족에게 선물을 받아 보세요.`};
}
const helperOK=u=>u&&u.ver&&u.ver.status==='approved';
const VERIFY_MSG='봉사하는 활동은 신원 인증 승인 후에 할 수 있어요. 내 정보 > 봉사자 인증을 진행해 주세요.';
function ledgerOf(u){
  const rows=[];
  D.reqs.filter(r=>r.stage==='completed'&&r.helperId===u.id).forEach(r=>rows.push({d:`${r.cat} · ${nameOf(r.recv.k,r.recv.id)}`,t:+r.credit,date:r.date,k:'적립',w:W(r.cat),h:r.hours,hold:r.onHold}));
  D.reqs.filter(r=>r.stage==='completed'&&r.recv.k==='user'&&r.recv.id===u.id).forEach(r=>rows.push({d:`${r.cat} · ${nameOf('user',r.helperId)} 님께 받음`,t:-(r.ded?r.ded.gift+r.ded.earn:0),date:r.date,k:'사용',w:W(r.cat),h:r.hours}));
  D.gifts.filter(g=>g.from===u.id).forEach(g=>rows.push({d:`${acct(g.to).name} 님에게 선물`,t:-g.h,date:g.at,k:'선물',raw:g.at}));
  D.gifts.filter(g=>g.to===u.id).forEach(g=>rows.push({d:`${acct(g.from).name} 님이 보낸 선물`,t:+g.h,date:g.at,k:'선물받음'}));
  const key=x=>/^\d{4}/.test(x.date)?x.date:'2026-11-'+x.date.split('/')[1].padStart(2,'0');
  return rows.sort((a,b)=>key(b).localeCompare(key(a)));
}

/* ---- 신뢰·단골 (B-40, B-41) ---- */
const avgRating=u=>u.rating&&u.rating.length?u.rating.reduce((a,b)=>a+b,0)/u.rating.length:0;
const doneCount=u=>D.reqs.filter(r=>r.helperId===u.id&&r.stage==='completed').length;
const regCount=(hid,rk,rid)=>D.reqs.filter(r=>r.helperId===hid&&r.stage==='completed'&&r.recv.k===rk&&r.recv.id===rid).length;
const isReg=(hid,rk,rid)=>regCount(hid,rk,rid)>=3;
function regularsOf(rk,rid){const ids=[...new Set(D.reqs.filter(r=>r.recv.k===rk&&r.recv.id===rid&&r.stage==='completed').map(r=>r.helperId))];return ids.filter(h=>isReg(h,rk,rid)).map(h=>({u:acct(h),n:regCount(h,rk,rid)})).filter(x=>x.u&&x.u.status==='active');}
const recvOfUserSide=a=>a.role==='user'?{k:'user',id:a.id}:null;

/* ---- AI 모사 (요청 처리 AI / 판단 AI) ---- */
const BLOCK=[[/목욕|씻겨|샤워|기저귀|대소변|식사 ?수발|떠먹/,'신체 돌봄'],[/주사|투약|약을 ?먹|약 ?먹여|링거|상처|소독|혈압 ?재/,'의료 행위'],[/송금|이체|대출|통장|비밀번호|카드 ?비|현금 ?인출|보증|돈 ?빌/,'금전 관리'],[/사다리|지붕|높은 ?곳|외벽|전기 ?공사|가스 ?공사|형광등 ?교체/,'위험 작업']];
const CAUTION=[[/병원|진료|약국/,'병원 안에서는 의료진 지시를 따르고 의료 판단은 하지 않아요.'],[/계단|부축|휠체어/,'부축이 필요하면 팔을 잡는 정도만 가능하고 안아 올리는 일은 안 돼요.'],[/무거운|이사|짐/,'무거운 물건은 혼자 들지 않고 가벼운 것만 도와요.'],[/영수증|현금|결제|사다/,'물건값은 어르신이 직접 결제하고 영수증 사진만 남겨요. 서비스는 금전을 중개하지 않아요.']];
function classify(text){
  for(const [re,why] of BLOCK){ if(re.test(text)) return {lv:'block',why,alt:ragSearch(text)}; }
  const cs=CAUTION.filter(([re])=>re.test(text)).map(x=>x[1]);
  return cs.length?{lv:'caution',notes:cs}:{lv:'ok'};
}
function suggestDiff(cat,text=''){
  const lv=LV(cat), why=[];
  if(cat==='동행') why.push('병원·이동 동행은 책임이 커서 책임 등급(×1.5)이에요.');
  if(cat==='장보기·심부름') why.push('이동과 물건 운반이 있어 수고 등급(×1.2)이에요.');
  if(cat==='가벼운 집안일') why.push('몸을 쓰는 일이라 수고 등급(×1.2)이에요.');
  if(lv==='기본') why.push('몸의 부담이 적고 이동이 짧아 기본 등급(×1.0)이에요.');
  if(/계단|무거운|이사/.test(text)) why.push('내용에 계단·무거운 물건이 있어 현장에서 난이도 이의 신청이 가능해요.');
  return {lv,w:W(cat),why};
}
function ragSearch(text,region){
  const t=text||'';
  const sc=D.svc.filter(s=>!region||s.region==='전국'||s.region===region).map(s=>({s,hits:s.kw.filter(k=>t.includes(k))})).filter(x=>x.hits.length).sort((a,b)=>b.hits.length-a.hits.length);
  if(sc.length) return sc.slice(0,3).map(x=>({...x.s,hits:x.hits}));
  return [];
}
function polish(text){
  let t=text.trim().replace(/\s+/g,' ');
  t=t.replace(/(해|했)요[.!]*$/,'했습니다.').replace(/(어|았|였)요[.!]*$/,'$1습니다.').replace(/([가-힣])[.!]*$/,'$1.');
  return t;
}
function guessCat(t){
  if(/병원|진료|동행|약국/.test(t)) return '동행';
  if(/스마트폰|폰|컴퓨터|키오스크|영상통화|와이파이|앱/.test(t)) return '디지털 도움';
  if(/장보|마트|심부름|사다/.test(t)) return '장보기·심부름';
  if(/정리|짐|옷장/.test(t)) return '생활 정리';
  if(/전구|집안일|설거지|빨래|청소|화분/.test(t)) return '가벼운 집안일';
  if(/얘기|이야기|말동무|산책|안부|대화|말벗/.test(t)) return '말동무·정서';
  return null;
}
function parseDate(t){
  if(/오늘/.test(t)) return dOff(0); if(/모레/.test(t)) return dOff(2); if(/내일/.test(t)) return dOff(1);
  let m=t.match(/(\d{1,2})월 ?(\d{1,2})일/); if(m) return `2026-${pad(+m[1])}-${pad(+m[2])}`;
  m=t.match(/(다음 ?주 ?)?(일|월|화|수|목|금|토)요일/);
  if(m){const w=DAYS.indexOf(m[2]);let best=null;for(let i=1;i<=7;i++){const d=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+i);if(d.getDay()===w){best=i;break;}}return dOff(best+(m[1]?7:0));}
  return null;
}
function parseTime(t){
  const to24=(ap,h,other)=>{h=+h;if(ap==='오후'&&h<12)return h+12;if(ap==='오전')return h===12?0:h;if(!ap&&h<7)return h+12;return h;};
  let m=t.match(/(오전|오후)?\s*(\d{1,2})\s*시?\s*(?:부터|~|-|에서)\s*(오전|오후)?\s*(\d{1,2})\s*시/);
  if(m){let a=to24(m[1],m[2]);let b=to24(m[3]||m[1],m[4]);if(b<=a)b+=12;return {from:a,to:b};}
  m=t.match(/(오전|오후)\s*(\d{1,2})\s*시/);
  if(m){const a=to24(m[1],m[2]);return {from:a,to:a+2,single:true};}
  return null;
}
function parseUtter(t){
  const o={};const c=guessCat(t);if(c)o.cat=c;const d=parseDate(t);if(d)o.date=d;const tm=parseTime(t);if(tm){o.from=tm.from;o.to=tm.to;o.single=tm.single;}
  const r=REGIONS.find(x=>t.includes(x));if(r)o.region=r;return o;
}

/* ---- 공고 (B-04~06, B-09, B-11, B-21) ---- */
const postOpen=p=>p.status==='open'&&p.date>=dkey(NOW);
const postAuthorName=p=>nameOf(p.aKind,p.aId);
function createPost(o){
  const a=me(); if(!a) return {ok:false,err:'로그인이 필요해요.'};
  if(o.type==='offer'&&!helperOK(a)) return {ok:false,err:VERIFY_MSG};
  if(o.aKind==='elder'&&a.role!=='mgr') return {ok:false,err:'독거노인의 도움 요청은 담당자만 등록할 수 있어요.'};
  if(!o.cats||!o.cats.length) return {ok:false,err:'카테고리를 선택해 주세요.'};
  if(!o.date||o.date<dkey(NOW)) return {ok:false,err:'지난 날짜에는 공고를 올릴 수 없어요.'};
  if(!(o.from<o.to)) return {ok:false,err:'시간 범위를 확인해 주세요.'};
  if(o.type==='need'&&(o.to-o.from)<0.5) return {ok:false,err:'30분 이상으로 정해 주세요.'};
  const cl=classify(o.detail||''); if(cl.lv==='block') return {ok:false,err:`'${cl.why}'에 해당해 올릴 수 없어요.`,block:cl};
  const made=[];const weeks=o.recurring?4:1;
  for(let i=0;i<weeks;i++){
    const d=new Date(pd(o.date).getTime()+i*7*86400000);
    const p={id:nid('p'),type:o.type,aKind:o.aKind,aId:o.aId,date:dkey(d),from:o.from,to:o.to,region:o.region,cats:o.cats,detail:o.detail,status:'open',recurring:!!o.recurring,at:new Date(NOW),acceptedReq:null};
    D.posts.unshift(p);made.push(p);
  }
  // 관심 조건 알림 (B-21)
  made.slice(0,1).forEach(p=>D.users.forEach(u=>{
    if(u.id===a.id||u.status!=='active') return;
    if((u.watch||[]).some(w=>(!w.region||w.region===p.region)&&(!w.cat||p.cats.includes(w.cat))&&(!w.date||w.date===p.date)))
      notify(u.id,`관심 조건에 맞는 공고가 올라왔어요: ${p.cats.join('·')} · ${fdate(p.date)}`,{name:'u_post',p:{id:p.id}});
  }));
  return {ok:true,posts:made};
}
function canEditPost(p){return p.status==='open';}
function deletePost(p){ if(p.status!=='open') return false; p.status='deleted'; D.reqs.filter(r=>r.postId===p.id&&['wait_helper','wait_recv'].includes(r.stage)).forEach(r=>{r.stage='cancelled';notifyReqOther(r,r.by===(r.helperId)?'recv':'helper',`공고가 삭제돼 요청이 취소됐어요`);}); return true; }

/* ---- 요청·제안 (B-14~19, B-22) ---- */
function sideRecvActor(r){return r.recv.k==='elder'?elderOf(r.recv.id).mgr:r.recv.id;}
function notifyRecvSide(r,text,go){notify(sideRecvActor(r),(r.recv.k==='elder'?`${elderOf(r.recv.id).alias} 어르신 건: `:'')+text,go||{name:'u_req',p:{id:r.id}});}
function notifyHelper(r,text){notify(r.helperId,text,{name:'u_req',p:{id:r.id}});}
function notifyReqOther(r,side,text){ if(side==='helper') notifyHelper(r,text); else notifyRecvSide(r,text); }
function validateTime(p,start,hours){
  if(!(hours>=0.5&&hours<=4)||(hours*2)%1) return '활동 시간은 30분 단위, 최대 4시간이에요.';
  if(start<p.from||start+hours>p.to) return `공고에 적힌 시간(${frange(p.from,p.to)}) 안에서만 정할 수 있어요.`;
  if(startAt(p.date,start)<=NOW) return '이미 지난 시간이에요.';
  return null;
}
function sendReq(o){
  const a=me(); const p=o.postId?postOf(o.postId):null;
  const kind=o.kind; // request | proposal | direct
  if(kind==='proposal'||kind==='direct'&&false){}
  if(kind==='proposal'&&!helperOK(a)) return {ok:false,err:VERIFY_MSG};
  if(kind!=='proposal'){ const hu=acct(o.helperId); if(!helperOK(hu)) return {ok:false,err:'이 봉사자는 지금 활동할 수 없어요.'}; if(o.recv.k==='user'&&o.helperId===o.recv.id) return {ok:false,err:'내 공고에는 요청할 수 없어요.'}; }
  if(p){
    if(!postOpen(p)) return {ok:false,err:'이미 마감됐거나 수락된 공고예요.'};
    if(o.recv.k==='user'&&p.aKind==='user'&&p.aId===a.id) return {ok:false,err:'내 공고에는 보낼 수 없어요.'};
    const e=validateTime(p,o.start,o.hours); if(e) return {ok:false,err:e};
    if(D.reqs.some(r=>r.postId===p.id&&r.by===a.id&&['wait_helper','wait_recv'].includes(r.stage)&&r.recv.id===o.recv.id&&r.helperId===o.helperId)) return {ok:false,err:'이미 이 공고에 보낸 요청이 있어요.'};
  }else{
    if(!(o.hours>=0.5&&o.hours<=4)||(o.hours*2)%1) return {ok:false,err:'활동 시간은 30분 단위, 최대 4시간이에요.'};
    if(startAt(o.date,o.start)<=NOW) return {ok:false,err:'이미 지난 시간이에요.'};
  }
  const cl=classify((o.content||'')+' '+(o.memo||'')); if(cl.lv==='block') return {ok:false,err:`'${cl.why}'에 해당해 보낼 수 없어요.`,block:cl};
  if(kind!=='proposal'){const c=canReceive(o.recv.k==='user'?acct(o.recv.id):null,creditOf(o.cat,o.hours)); if(!c.ok) return c;}
  if(o.extra&&o.extra!==o.cat&&W(o.extra)>W(o.cat)){const t=o.cat;o.cat=o.extra;o.extra=t;}
  const r={extra:o.extra&&o.extra!==o.cat?o.extra:null,id:nid('r'),postId:p?p.id:null,kind,helperId:o.helperId,recv:o.recv,by:a.id,date:p?p.date:o.date,start:o.start,hours:o.hours,cat:o.cat,content:o.content,memo:o.memo||'',
    stage:kind==='proposal'?'wait_recv':'wait_helper',stageAt:new Date(NOW),deadline:new Date(NOW.getTime()+24*3600000),msgOpen:false,thread:[],journal:null,rated:{recv:null,helper:null},onHold:false,ded:null,credit:0,createdAt:new Date(NOW),confirmBy:null};
  D.reqs.unshift(r);
  const who=o.recv.k==='elder'?`${elderOf(o.recv.id).alias} 어르신(담당자 대신)`:acct(o.recv.id).name+' 님';
  if(kind==='proposal') notifyRecvSide(r,`${acct(r.helperId).name} 님이 봉사를 제안했어요 · ${fdate(r.date)} ${frange(r.start,r.start+r.hours)}`);
  else notifyHelper(r,`${who}이 ${kind==='direct'?'단골 요청':'요청'}을 보냈어요 · ${fdate(r.date)} ${frange(r.start,r.start+r.hours)}`);
  return {ok:true,req:r};
}
function lockPost(r){
  if(!r.postId) return;
  const p=postOf(r.postId); if(!p) return;
  p.status='locked'; p.acceptedReq=r.id;
  D.reqs.filter(x=>x.postId===p.id&&x.id!==r.id&&['wait_helper','wait_recv'].includes(x.stage)).forEach(x=>{x.stage='auto_rejected';x.stageAt=new Date(NOW);
    if(x.kind==='proposal') notifyHelper(x,'다른 제안이 수락돼 이 제안은 자동으로 거절됐어요.'); else notifyRecvSide(x,'다른 요청이 수락돼 이 요청은 자동으로 거절됐어요.');});
}
function helperAccept(r){
  const a=me(); if(!helperOK(a)) return {ok:false,err:VERIFY_MSG};
  if(r.stage!=='wait_helper') return {ok:false,err:'이미 처리된 요청이에요.'};
  if(r.postId&&!postOpen(postOf(r.postId))) return {ok:false,err:'공고가 이미 마감됐어요.'};
  lockPost(r); r.stage='wait_recv'; r.stageAt=new Date(NOW); r.deadline=new Date(NOW.getTime()+24*3600000); r.msgOpen=true;
  notifyRecvSide(r,`${acct(r.helperId).name} 님이 수락했어요. 최종 수락 또는 거부를 해 주세요 (24시간 안)`);
  return {ok:true};
}
function recvAccept(r,how){
  if(r.stage!=='wait_recv') return {ok:false,err:'이미 처리된 요청이에요.'};
  if(r.recv.k==='user'){const c=canReceive(acct(r.recv.id),creditOf(r.cat,r.hours)); if(!c.ok) return c;}
  if(r.kind==='proposal') lockPost(r);
  r.stage='confirmed'; r.stageAt=new Date(NOW); r.deadline=null; r.msgOpen=true;
  if(how) r.proxy={by:D.cur,how,at:new Date(NOW)};
  if(r.recv.k==='elder') r.thread.push({sys:true,text:`담당자가 ${how||'전화·방문'}으로 어르신께 확인한 뒤 수락했어요.`,at:fdt(NOW)});
  notifyHelper(r,`${r.recv.k==='elder'?elderOf(r.recv.id).alias+' 어르신 건이':nameOf('user',r.recv.id)+' 님이'} 최종 수락했어요. 일정이 확정됐어요 · ${fdate(r.date)} ${fh(r.start)}`);
  return {ok:true};
}
function rejectReq(r,side,reason,how){
  if(!['wait_helper','wait_recv'].includes(r.stage)) return {ok:false,err:'이미 처리된 요청이에요.'};
  const wasLocked=r.postId&&postOf(r.postId)&&postOf(r.postId).acceptedReq===r.id;
  r.stage='rejected'; r.stageAt=new Date(NOW); r.rejectReason=reason; r.rejectSide=side; r.deadline=null;
  if(wasLocked) postOf(r.postId).status='closed';   // B-19: 공고는 다시 열리지 않음
  if(how) r.proxy={by:D.cur,how,at:new Date(NOW)};
  if(side==='helper') notifyRecvSide(r,`${acct(r.helperId).name} 님이 요청을 거절했어요 (${reason})`);
  else notifyHelper(r,`${r.kind==='proposal'?'제안':'요청'}이 거부됐어요 (${reason})`);
  return {ok:true};
}
function startAct(r){ if(r.stage!=='confirmed') return; r.stage='inprogress'; r.stageAt=new Date(NOW); notifyRecvSide(r,`${acct(r.helperId).name} 님이 활동을 시작했어요`); }
function finishAct(r,text,photo){
  r.journal={text,photo:!!photo,ai:polish(text)}; r.stage='await_confirm'; r.stageAt=new Date(NOW); r.journalAt=new Date(NOW);
  notifyRecvSide(r,`${acct(r.helperId).name} 님이 활동을 마쳤어요. 확인해 주세요 (24시간 안에 확인하지 않으면 일지 기준으로 자동 확정돼요)`);
}
function confirmAct(r,by,hours){
  if(r.stage!=='await_confirm') return;
  if(hours&&hours!==r.hours){r.adjusted={from:r.hours,to:hours};r.hours=hours;}
  r.credit=creditOf(r.cat,r.hours); r.confirmBy=by;
  if(r.recv.k==='user'){const u=acct(r.recv.id);const cost=r.credit;const g=Math.min(giftBal(u),cost);r.ded={gift:g,earn:cost-g};}
  r.stage='completed'; r.stageAt=new Date(NOW); r.doneAt=new Date(NOW);
  notifyHelper(r,`활동이 확정돼 ${fmt(r.credit)}시간이 적립됐어요${by==='auto'?' (자동 확정)':''}`);
}
function cancelReq(r,byId){
  if(!ACTIVE.includes(r.stage)||r.stage==='await_confirm') return {ok:false,err:'취소할 수 없는 상태예요.'};
  const free=r.stage==='wait_helper'||r.stage==='wait_recv'||hoursLeft(startAt(r.date,r.start))>=24;
  const byHelper=byId===r.helperId;
  r.stage='cancelled'; r.stageAt=new Date(NOW); r.cancelBy=byId; r.cancelFree=free;
  if(!free&&byHelper){acct(r.helperId).pen++;}
  if(r.postId&&postOf(r.postId)&&postOf(r.postId).acceptedReq===r.id) postOf(r.postId).status='closed';
  const txt=`${byHelper?acct(r.helperId).name+' 님이':'받는 쪽이'} 일정을 취소했어요${free?'':' (24시간 이내 취소)'}`;
  if(byHelper) notifyRecvSide(r,txt); else notifyHelper(r,txt);
  return {ok:true,free};
}
const msgOpen=r=>r.msgOpen&&['wait_recv','confirmed','inprogress','await_confirm'].includes(r.stage);
function sendMsg(r,fromId,text){
  if(!msgOpen(r)) return {ok:false,err:'지금은 메시지를 보낼 수 없어요.'};
  if(/01\d[- ]?\d{3,4}[- ]?\d{4}|카톡|카카오톡|오픈채팅|계좌|입금|송금|돈 ?(좀|주|보내)/.test(text)) return {ok:false,err:'연락처 교환·금전 요구는 보낼 수 없어요.'};
  r.thread.push({from:fromId,text,at:fdt(NOW)});
  const toHelper=fromId!==r.helperId;
  if(toHelper) notifyHelper(r,'새 메시지가 도착했어요'); else notifyRecvSide(r,'새 메시지가 도착했어요');
  return {ok:true};
}
function rateHelper(r,stars,tags){r.rated.recv={stars,tags};acct(r.helperId).rating.push(stars);}
function rateRecv(r,stars){r.rated.helper={stars};}   // 비공개 점수 (B-39)

/* ---- 시연 시계 · 기한 처리 (B-11, B-19, 자동 확정) ---- */
function tick(){
  if(!D) return; const today=dkey(NOW);
  D.posts.forEach(p=>{if(p.status==='open'&&p.date<today){p.status='closed';p.closeWhy='날짜 지남';}});
  D.reqs.forEach(r=>{
    if(['wait_helper','wait_recv'].includes(r.stage)&&r.deadline&&r.deadline<=NOW){
      const rq=r.kind==='proposal';
      r.stage='expired'; r.stageAt=new Date(NOW); r.deadline=null;
      if(r.postId&&postOf(r.postId)&&postOf(r.postId).acceptedReq===r.id) postOf(r.postId).status='closed';
      if(rq) notifyHelper(r,'제안이 24시간 안에 응답이 없어 자동 만료됐어요.');
      else notifyRecvSide(r,'요청이 24시간 안에 응답이 없어 자동 만료됐어요.');
      if(r.kind!=='proposal'&&r.msgOpen) notifyHelper(r,'받는 분의 최종 응답이 없어 요청이 만료됐어요.');
    }
    if(r.stage==='await_confirm'&&r.journal&&r.journalAt&&NOW-r.journalAt>=24*3600000) confirmAct(r,'auto');
    if(r.stage==='confirmed'){const h=hoursLeft(startAt(r.date,r.start));
      if(h<=24&&h>1&&!r.rm24){r.rm24=true;remind(r,'24시간 안에 시작해요');}
      if(h<=1&&h>0&&!r.rm1){r.rm1=true;remind(r,'1시간 안에 시작해요');}}
  });
}
function remind(r,t){const m=`시작 전 알림: ${t} · ${fdate(r.date)} ${fh(r.start)}`;notifyHelper(r,m);notifyRecvSide(r,m);}
function advance(h){NOW=new Date(NOW.getTime()+h*3600000);tick();}

/* ---- 가족·선물 (B-32, B-44) ---- */
const famOf=u=>D.famLinks.filter(f=>f.status==='연결'&&(f.a===u.id||f.b===u.id)).map(f=>acct(f.a===u.id?f.b:f.a));
function giftTime(from,to,h){ if(!(h>0)) return {ok:false,err:'시간을 입력해 주세요.'}; if(h>earnedBal(from)) return {ok:false,err:`보낼 수 있는 시간은 ${fmt(Math.max(0,earnedBal(from)))}이에요.`}; D.gifts.push({id:nid('g'),from:from.id,to:to.id,h,at:`${NOW.getMonth()+1}/${NOW.getDate()}`}); notify(to.id,`${from.name} 님이 ${fmt(h)}시간을 선물했어요`,{name:'u_wallet',p:{}}); return {ok:true}; }

/* ---- 독거노인·담당자 (C-01~03) ---- */
const eldersOf=m=>D.elders.filter(e=>e.mgr===m.id&&e.status==='active');
const activeReqsOfElder=e=>D.reqs.filter(r=>r.recv.k==='elder'&&r.recv.id===e.id&&ACTIVE.includes(r.stage));

/* ---- 리포트 (P-03~P-06) ---- */
function genReport(rk,rid){
  const mo=NOW.getMonth(), inM=(r,m)=>pd(r.date).getMonth()===m;
  const all=D.reqs.filter(r=>r.recv.k===rk&&r.recv.id===rid&&r.stage==='completed');
  const a=all.filter(r=>inM(r,mo)), b=all.filter(r=>inM(r,(mo+11)%12));
  const catsA={};a.forEach(r=>catsA[r.cat]=(catsA[r.cat]||0)+1);
  const jtxt=all.filter(r=>inM(r,mo)||inM(r,(mo+11)%12)).map(r=>r.journal&&r.journal.text||'').join(' ');
  const lines=[`이번 달 활동 ${a.length}회 · ${fmt(a.reduce((s,r)=>s+r.hours,0))}시간 (지난달 ${b.length}회)`];
  const top=Object.entries(catsA).sort((x,y)=>y[1]-x[1])[0]; if(top) lines.push(`가장 많이 받은 도움은 '${top[0]}'(${top[1]}회)예요.`);
  const hit=[];
  if(/식사|점심|입맛|안 ?드/.test(jtxt)) hit.push('식사와 관련한 언급');
  if(/외출|못 ?나가|안 ?나가/.test(jtxt)) hit.push('외출과 관련한 언급');
  if(hit.length) lines.push(`활동 일지에 ${hit.join(', ')}이 있었어요. 확인해 보시면 좋겠어요.`);
  const flag=hit.length>0||Math.abs(a.length-b.length)>=2;
  lines.push('※ 일지에 적힌 내용을 정리한 것이며 건강 진단이나 판단은 하지 않아요.');
  return {a:a.length,b:b.length,lines,flag};
}

/* ---- 신고·운영 (B-36, D-02) ---- */
function targetUserOf(kind,id,byId){
  if(kind==='메시지'){const rr=reqOf(String(id).split(':')[0]);if(!rr)return null;id=rr.id;kind='활동';}
  if(kind==='공고'){const p=postOf(id);return p?(p.aKind==='elder'?elderOf(p.aId).mgr:p.aId):null;}
  const r=reqOf(id); if(!r) return null;
  const recvActor=sideRecvActor(r);
  return byId===r.helperId?recvActor:r.helperId;
}
function addReport(o){const a=me();const rp={id:nid('rp'),by:a.id,kind:o.kind,target:o.target,tuser:targetUserOf(o.kind,o.target,a.id),type:o.type,text:o.text,status:'접수',at:`${NOW.getMonth()+1}/${NOW.getDate()}`,result:''};D.reports.unshift(rp);notify('a1',`새 신고가 접수됐어요 (${o.type})`,{name:'a_inbox',p:{}});return rp;}
function anomalies(){
  const lim=NOW.getTime()-8*86400000, g={};
  D.reqs.filter(r=>r.stage==='completed'&&!r.cleared&&!r.onHold&&r.hours<=1&&pd(r.date).getTime()>=lim).forEach(r=>{const k=r.helperId+'>'+r.recv.k+':'+r.recv.id;(g[k]=g[k]||[]).push(r);});
  return Object.entries(g).filter(([k,v])=>v.length>=3).map(([k,v])=>({key:k,reqs:v,helper:acct(v[0].helperId),recv:nameOf(v[0].recv.k,v[0].recv.id)}));
}
function timeBalance(){
  const issued=D.users.reduce((s,u)=>s+helperCredits(u),0);
  const spent=D.reqs.filter(r=>r.stage==='completed'&&r.ded).reduce((s,r)=>s+r.ded.gift+r.ded.earn,0);
  const elder=D.reqs.filter(r=>r.stage==='completed'&&r.recv.k==='elder'&&!r.onHold).reduce((s,r)=>s+r.credit,0);
  return {issued,spent,elder,gap:issued-spent};
}

/* ---- 노쇼(B-25) · 이의신청(B-28) · 담당자 정지·재배정(D-01) · 통계(D-04) ---- */
function reportNoShow(r){
  if(r.stage!=='confirmed'||startAt(r.date,r.start)>NOW) return {ok:false,err:'시작 시간이 지난 확정 건에서만 노쇼를 신고할 수 있어요.'};
  r.stage='cancelled';r.stageAt=new Date(NOW);r.noshow=true;r.cancelBy=r.helperId;r.cancelFree=false;acct(r.helperId).pen+=2;
  notifyHelper(r,'노쇼로 기록됐어요. 신뢰 점수에 패널티가 적용돼요.');notify('a1',`노쇼 발생: ${acct(r.helperId).name} 님`,{name:'a_members',p:{}});return {ok:true};
}
function appealDiff(r,text){D.appeals.push({id:nid('ap'),req:r.id,by:D.cur,text,status:'대기'});r.appealed=true;notify('a1','난이도 이의 신청이 접수됐어요',{name:'a_inbox',p:{t:'ap'}});}
function reassignElders(fromId,toId){D.elders.filter(e=>e.mgr===fromId&&e.status==='active').forEach(e=>{e.mgr=toId;});D.reqs.forEach(r=>{if(r.recv.k==='elder'&&elderOf(r.recv.id).mgr===toId&&r.stage!=='completed')notify(toId,`${elderOf(r.recv.id).alias} 어르신 건이 이관되어 확인이 필요해요`,{name:'u_req',p:{id:r.id}});});}
function regionOfReq(r){if(r.postId&&postOf(r.postId))return postOf(r.postId).region;return r.recv.k==='elder'?elderOf(r.recv.id).dong:acct(r.recv.id).region;}
function regionStats(){return REGIONS.map(g=>{const l=D.reqs.filter(r=>regionOfReq(r)===g&&r.stage!=='wait_helper'&&r.stage!=='wait_recv');const ok=l.filter(r=>['confirmed','inprogress','await_confirm','completed'].includes(r.stage)).length;return {g,n:l.length,ok,rate:l.length?Math.round(ok/l.length*100):null};});}
function demandSupply(){const o=D.posts.filter(p=>p.type==='offer'&&postOpen(p)).length,n=D.posts.filter(p=>p.type==='need'&&postOpen(p)).length;const eh=D.reqs.filter(r=>r.recv.k==='elder'&&r.stage==='completed').reduce((s,r)=>s+r.hours,0);return {o,n,eh,eReq:D.reqs.filter(r=>r.recv.k==='elder').length};}
const monthKey=d=>/^\d{4}/.test(d)?d.slice(0,7):`2026-${String(d.split('/')[0]).padStart(2,'0')}`;
function monthly(u){const m={};ledgerOf(u).forEach(x=>{const k=monthKey(x.date);m[k]=m[k]||{in:0,out:0,n:0};if(x.t>=0)m[k].in+=x.t;else m[k].out+=-x.t;m[k].n++;});return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));}

ACT.forgot=()=>sheet(`<h2>비밀번호 찾기</h2><p class="muted">가입한 아이디와 휴대폰 본인인증 후 새 비밀번호를 설정해요.</p><input class="in" id="fid" placeholder="아이디" style="margin-top:10px"><div class="chat-in"><input class="in" id="fph" placeholder="휴대폰 번호"><button data-act="sendCode" style="width:96px;font-size:13px">인증번호</button></div><input class="in" id="fcd" placeholder="인증번호 6자리" style="margin-top:8px"><input class="in" id="fnp" type="password" placeholder="새 비밀번호 (4자 이상)" style="margin-top:8px"><button class="btn" style="margin-top:12px" data-act="forgotGo">비밀번호 재설정</button>`);
ACT.sendCode=()=>toast('인증번호 123456을 보냈어요 (시연)');
ACT.forgotGo=()=>{const a=[...D.users,...D.mgrs].find(x=>x.loginId===val('#fid'));if(!a)return toast('없는 아이디예요');if(a.phone&&val('#fph')!==a.phone&&a.phone!=='010-0000-0000')return toast('가입한 번호와 달라요');if(val('#fcd')!=='123456')return toast('인증번호가 맞지 않아요');if(val('#fnp').length<4)return toast('새 비밀번호를 입력해 주세요');a.pw=val('#fnp');closeSheet();toast('비밀번호를 재설정했어요');};
SCREENS.signup=()=>({title:'사용자 가입',noTabs:true,html:`<p class="muted">가입 후 <b>누구나 도움을 요청</b>하거나 받을 수 있어요. 봉사하려면 신원 인증이 필요해요. 도움만 받고 싶은 어르신은 가입 없이 담당자를 통해 이용해요.</p>
 <form data-form="doSignup"><div class="lbl2">이름</div><input class="in" id="sn"><div class="lbl2">아이디</div><input class="in" id="si"><div class="lbl2">비밀번호</div><input class="in" id="sp" type="password"><div class="lbl2">활동 동네</div>${sel('sr',REGIONS.map(r=>[r,r]))}<div class="lbl2">연락처(공개되지 않아요)</div><div class="chat-in"><input class="in" id="sh" placeholder="010-0000-0000"><button type="button" data-act="sendCode" style="width:96px;font-size:13px">본인인증</button></div><input class="in" id="scd" placeholder="인증번호 6자리" style="margin-top:8px"><button class="btn" style="margin-top:18px">가입하기</button></form>`});
ACT.doSignup=()=>{const n=val('#sn'),i=val('#si'),p=val('#sp');if(!n||!i||p.length<4)return toast('이름·아이디·비밀번호(4자 이상)를 입력해 주세요');if(!val('#sh'))return toast('휴대폰 번호를 입력해 주세요');if(val('#scd')!=='123456')return toast('본인인증을 완료해 주세요 (인증번호 123456)');if([...D.users,...D.mgrs,...D.admins].some(x=>x.loginId===i))return toast('이미 있는 아이디예요');const id=nid('u');D.users.push({id,role:'user',loginId:i,pw:p,name:n,phone:val('#sh'),base:0,rating:[],cats:[],ver:{id:false,crime:false,safety:false,status:'none'},watch:[],voice:false,pen:0,status:'active',region:val('#sr'),times:'',style:'',exp:'',intro:'',age:0});toast('가입 완료!');ACT.loginAs({id});};
SCREENS.orgapply=()=>({title:'담당자(기관) 신청',noTabs:true,html:`<p class="muted">주민센터·복지관 등 기관은 운영자 승인 후 담당자 계정을 받아요. (A-04)</p><form data-form="doOrg"><div class="lbl2">기관명</div><input class="in" id="on"><div class="lbl2">담당자 이름</div><input class="in" id="op"><div class="lbl2">기관 연락처</div><input class="in" id="oc"><div class="lbl2">지원 대상·규모</div><textarea class="in" id="oo" rows="3"></textarea><button class="btn" style="margin-top:18px">신청하기</button></form>`});
ACT.doOrg=()=>{if(!val('#on')||!val('#op'))return toast('기관명과 이름을 입력해 주세요');D.orgApps.push({id:nid('o'),org:val('#on'),name:val('#op'),phone:val('#oc'),note:val('#oo'),status:'대기',at:`${NOW.getMonth()+1}/${NOW.getDate()}`});notify('a1','담당자 기관 신청이 접수됐어요',{name:'a_inbox',p:{}});toast('신청했어요. 승인되면 계정을 안내해 드려요');nav.stack=[{name:'login',p:{}}];render();};

/* ---------- 계정 전환 · 시연 도구 ---------- */
ACT.acctSheet=()=>{const a=me();sheet(`<h2>${esc(a.name)} · ${ROLES[a.role].label}</h2><div class="lbl2">계정 전환 (시연)</div>${[...D.users,...D.mgrs,...D.admins].filter(x=>x.status==='active').map(x=>`<div class="acct ${x.id===a.id?'on':''}" data-act="loginAs" data-id="${x.id}">${av(x.name)}<div><b>${esc(x.name)}</b><div class="mini">${ROLES[x.role].label}</div></div></div>`).join('')}
 <div class="lbl2">시연 시계 · ${fdt(NOW)}</div><div class="demo"><div class="btns"><button class="btn" data-act="adv" data-h="1">+1시간</button><button class="btn" data-act="adv" data-h="12">+12시간</button><button class="btn" data-act="adv" data-h="25">+25시간</button></div><p class="mini" style="color:#aab;margin:8px 0 0">24시간 응답 기한·자동 확정·공고 마감이 시간에 따라 처리돼요.</p></div>
 <div class="btns" style="margin-top:12px"><button class="btn ghost" data-act="reset">시연 데이터 초기화</button><button class="btn ghost" data-act="logout">로그아웃</button></div>`);};
ACT.adv=d=>{advance(+d.h);closeSheet();toast(`시간이 흘러 ${fdt(NOW)}이에요`);render();};
ACT.reset=()=>{closeSheet();D.__live=false;seed();nav.stack=[{name:'login',p:{}}];render();};
ACT.logout=()=>{closeSheet();D.cur=null;nav.stack=[{name:'login',p:{}}];render();};

/* ---------- 알림 · 공지 ---------- */
SCREENS.notifs=()=>{const l=D.notifs.filter(n=>n.to===D.cur);
 return {title:'알림',noTabs:false,tab:homeOf(me()),html:`<div class="row between" style="margin-bottom:6px"><span class="muted">알림으로 요청·제안·응답이 전달돼요. 자동 매칭은 없어요.</span>${l.some(n=>!n.read)?`<a class="mini" data-act="readAll" style="cursor:pointer">모두 읽음</a>`:''}</div>
  ${l.length?l.map(n=>`<div class="rq click" data-act="openNotif" data-id="${n.id}" style="${n.read?'opacity:.6':''}"><div style="flex:1"><div style="font-size:15px;font-weight:${n.read?500:700}">${esc(n.text)}</div><div class="rq-m">${fdt(n.at)}${n.voice?' · 음성 알림 설정됨':''}</div></div>${n.voice?`<button class="btn sm inl ghost" data-act="speak" data-id="${n.id}">📞 음성</button>`:''}${n.read?'':'<span class="dotn">N</span>'}</div>`).join(''):empty('새 알림이 없어요')}`};};
ACT.readAll=()=>{D.notifs.filter(n=>n.to===D.cur).forEach(n=>n.read=true);render();};
ACT.openNotif=d=>{const n=D.notifs.find(x=>x.id===d.id);n.read=true;if(n.go&&SCREENS[n.go.name]&&(n.go.name!=='u_req'||reqOf(n.go.p.id)))go(n.go.name,n.go.p);else render();};
SCREENS.notices=()=>({title:'공지사항',html:D.notices.map(n=>`<div class="card click" data-go="notice" data-id="${n.id}"><b>${esc(n.title)}</b><div class="mini">${n.at}</div></div>`).join('')});
SCREENS.notice=p=>{const n=D.notices.find(x=>x.id===p.id);return {title:'공지사항',html:`<h2 style="margin:0">${esc(n.title)}</h2><div class="mini" style="margin:4px 0 14px">${n.at}</div><p style="line-height:1.7">${esc(n.body)}</p>`};};

/* ---------- 문의 · 신고 ---------- */
SCREENS.inquiries=()=>{const l=D.inquiries.filter(q=>q.by===D.cur);return {title:'문의하기',html:`<button class="btn" data-go="inq_new">새 문의 작성</button><div style="margin-top:14px">${l.length?l.map(q=>`<div class="card"><div class="row between"><b>${esc(q.title)}</b>${tp(q.status,q.status==='답변 완료'?'ok':'y')}</div><div class="mini">${esc(q.type)} · ${q.at}</div><p style="margin:8px 0 0">${esc(q.body)}</p>${q.answer?`<div class="card info" style="margin-top:10px"><b>운영자 답변</b><p style="margin:4px 0 0">${esc(q.answer)}</p></div>`:''}</div>`).join(''):empty('문의 내역이 없어요')}</div>`};};
SCREENS.inq_new=()=>({title:'문의 작성',html:`<form data-form="doInq"><div class="lbl2">유형</div>${sel('qt',['이용 방법','적립 오류','신고 결과','계정','기타'].map(x=>[x,x]))}<div class="lbl2">제목</div><input class="in" id="qh"><div class="lbl2">내용</div><textarea class="in" id="qb" rows="5"></textarea><button class="btn" style="margin-top:16px">보내기</button></form>`});
ACT.doInq=()=>{if(!val('#qh')||!val('#qb'))return toast('제목과 내용을 입력해 주세요');D.inquiries.unshift({id:nid('q'),by:D.cur,type:val('#qt'),title:val('#qh'),body:val('#qb'),status:'접수',answer:'',at:`${NOW.getMonth()+1}/${NOW.getDate()}`});notify('a1','새 문의가 접수됐어요',{name:'a_inbox',p:{}});toast('문의를 보냈어요');back();};
SCREENS.my_reports=()=>{const l=D.reports.filter(r=>r.by===D.cur);return {title:'내 신고 내역',html:l.length?l.map(r=>`<div class="card"><div class="row between"><b>${esc(r.kind)} 신고 · ${esc(r.type)}</b>${tp(r.status,r.status==='처리 완료'?'ok':'y')}</div><div class="mini">${r.at}</div><p style="margin:8px 0 0">${esc(r.text)}</p>${r.result?`<div class="card info" style="margin-top:10px"><b>처리 결과</b><p style="margin:4px 0 0">${esc(r.result)}</p></div>`:''}</div>`).join(''):empty('신고 내역이 없어요')};};
ACT.reportSheet=d=>sheet(`<h2>신고하기</h2><p class="muted">운영자가 확인하고 조치해요. 신고한 사람은 상대에게 알려지지 않아요.</p><div class="lbl2">유형</div>${sel('rt',['허위 공고','연락처·금전 요구','부적절한 언행','노쇼','활동 시간 허위','기타'].map(x=>[x,x]))}<div class="lbl2">내용</div><textarea class="in" id="rx" rows="3"></textarea><button class="btn" style="margin-top:14px" data-act="reportGo" data-kind="${d.kind}" data-target="${d.target}">신고 접수</button>`);
ACT.reportGo=d=>{if(!val('#rx'))return toast('내용을 적어 주세요');addReport({kind:d.kind,target:d.target,type:val('#rt'),text:val('#rx')});closeSheet();toast('신고가 접수됐어요');};

/* ---------- 공공 서비스 안내 (P-AI, RAG 모사) ---------- */
SCREENS.svc=p=>({title:'공공 서비스 안내',html:`<p class="muted">상황을 말하면 <b>등록된 공공 서비스 자료</b> 안에서만 안내해요. ${M(6)} 자료에 없으면 없다고 말해요.</p>
 <div class="card"><div class="lbl2" style="margin-top:0">지역 (선택)</div>${sel('sg',[['','전체'],...REGIONS.map(r=>[r,r])],me()&&me().region||'')}<textarea class="in" id="sq" style="margin-top:8px" rows="3" placeholder="예) 혼자 사시는 할머니가 목욕을 못 하세요">${esc(p.q||'')}</textarea><button class="btn" style="margin-top:10px" data-act="svcGo">안내 받기</button></div>
 <div class="chips" style="flex-wrap:wrap;overflow:visible;margin-top:8px">${['목욕이 어려우세요','약 먹는 걸 도와주세요','혼자 쓰러지실까 걱정돼요','보이스피싱이 의심돼요','병원비가 어려워요'].map(q=>`<button class="chip" data-act="svcQ" data-q="${q}">${q}</button>`).join('')}</div><div id="svcOut" style="margin-top:14px"></div>`,mount:()=>{if(p.q)ACT.svcGo();}});
ACT.svcQ=d=>{$('#sq').value=d.q;ACT.svcGo();};
ACT.svcGo=()=>{const q=val('#sq');if(!q)return toast('상황을 입력해 주세요');const r=ragSearch(q,val('#sg'));
 aiRun('#svcOut',r.length?`<div class="ai"><div class="ah">${spk}안내 자료에서 ${r.length}건을 찾았어요</div>${r.map(s=>`<div class="card" style="background:#fff"><b>${esc(s.name)}</b><div class="kvl"><span>대상</span><span>${esc(s.target)}</span></div><div class="kvl"><span>내용</span><span>${esc(s.what)}</span></div><div class="kvl"><span>문의</span><span>${esc(s.where)}</span></div></div>`).join('')}<p class="mini">※ 대상 여부와 신청 방법은 반드시 해당 기관에서 확인해 주세요. (시연용 예시 자료)</p></div>`:`<div class="ai"><div class="ah">${spk}자료에서 찾지 못했어요</div><p style="margin:6px 0 0">등록된 자료에는 해당 내용이 없어요. 정확한 안내는 <b>보건복지상담센터 129</b>나 주민센터에 문의해 주세요. 생명이 위급하면 119예요.</p></div>`);};

/* ---------- 봉사자 인증 (A-05) ---------- */
SCREENS.verify=()=>{const a=me(),v=a.ver;const st={none:['미신청','g'],pending:['심사 중','y'],approved:['승인','ok'],rejected:['반려','r']}[v.status];
 return {title:'봉사자 인증',html:`<div class="card"><div class="row between"><b>현재 상태</b>${tp(st[0],st[1])}</div><p class="muted" style="margin:8px 0 0">봉사 공고·제안·수락은 <b>승인된 뒤</b>에만 할 수 있어요. 도움을 받는 건 인증 없이도 돼요.</p></div>
 <div class="lbl2">단계</div>${[['id','신분증 확인'],['crime','범죄경력 회보서 (권장)'],['safety','안전교육 퀴즈']].map(([k,l])=>`<div class="sw"><div><div class="t">${l}</div></div>${v[k]?tp('완료','ok'):`<button class="btn sm inl" data-act="verStep" data-k="${k}">${k==='safety'?'퀴즈 풀기':'제출'}</button>`}</div>`).join('')}
 ${v.status!=='approved'&&v.status!=='pending'?`<button class="btn" style="margin-top:16px" data-act="verSubmit">심사 요청</button>`:''}`};};
ACT.verStep=d=>{if(d.k==='safety')return go('quiz');me().ver[d.k]=true;toast('제출했어요');render();};
ACT.verSubmit=()=>{const v=me().ver;if(!v.id||!v.safety)return toast('신분증 확인과 안전교육은 꼭 필요해요');v.status='pending';notify('a1',`${me().name} 님의 봉사자 인증 심사 요청`,{name:'a_inbox',p:{}});toast('심사를 요청했어요');render();};
const QUIZ=[['도움 중 어르신이 연락처를 물어보면?',['알려 준다','서비스 안에서 메시지로만 이야기한다'],1],['“목욕시켜 달라”는 요청이 오면?',['도와드린다','신체 돌봄이라 거절하고 공공 서비스를 안내한다'],1],['활동이 끝나면?',['일지를 작성한다','아무것도 안 한다'],0]];
SCREENS.quiz=()=>({title:'안전교육 퀴즈',html:QUIZ.map((q,i)=>`<div class="card"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label class="opt" style="margin-top:8px"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')+`<button class="btn" style="margin-top:14px" data-act="quizGo">제출</button>`});
ACT.quizGo=()=>{const ok=QUIZ.every((q,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);return e&&+e.value===q[2];});if(!ok)return toast('틀린 문제가 있어요. 다시 확인해 주세요');me().ver.safety=true;toast('통과했어요!');back();};

/* ---------- 내 정보 수정 · 탈퇴 · 프로필 ---------- */
SCREENS.profile_edit=()=>{const a=me();return {title:'내 정보 수정',html:`<form data-form="doProf"><div class="lbl2">이름</div><input class="in" id="pn" value="${esc(a.name)}"><div class="lbl2">연락처 (공개되지 않아요)</div><input class="in" id="pph" value="${esc(a.phone||'')}"><div class="lbl2">활동 동네</div>${a.role==='user'?sel('pr',REGIONS.map(r=>[r,r]),a.region):`<input class="in" value="${esc(a.org||'')}" disabled>`}${a.role==='user'?`<div class="lbl2">봉사 가능 분야</div>${chipsSel('pc',CN,a.cats,SHORT.hasOwnProperty?c=>SHORT[c]:x=>x)}<div class="lbl2">가능 시간대</div><input class="in" id="pt" value="${esc(a.times)}"><div class="lbl2">자기소개 (공개)</div><textarea class="in" id="pi" rows="3">${esc(a.intro)}</textarea><div class="lbl2">경험 (공개)</div><input class="in" id="pe" value="${esc(a.exp)}">`:''}<div class="lbl2">비밀번호 변경 (바꾸지 않으려면 비워 두세요)</div><input class="in" id="pw0" type="password" placeholder="현재 비밀번호"><input class="in" id="pw1" type="password" placeholder="새 비밀번호 (4자 이상)" style="margin-top:8px"><button class="btn" style="margin-top:18px">저장</button></form>`};};

SCREENS.withdraw=()=>{const a=me();const busy=D.reqs.filter(r=>ACTIVE.includes(r.stage)&&(r.helperId===a.id||(r.recv.k==='user'&&r.recv.id===a.id)));

 sheet(`<h2>거부 사유</h2>${REASONS.map(x=>`<div class="opt" data-act="rejGo" data-id="${d.id}" data-side="recv" data-r="${x}"><span>${x}</span></div>`).join('')}`);};

 const x=recvAccept(r);if(!x.ok)return toast(x.err);toast('수락했어요. 일정이 확정됐어요');render();};

ACT.finA=d=>sheet(`<h2>활동 일지</h2><p class="muted">한두 줄이면 충분해요. AI가 문장을 다듬어 줘요.</p><textarea class="in" id="jt" rows="4" placeholder="예) 진료 동행하고 약국까지 다녀왔어요."></textarea><label class="sw"><div><div class="t">활동 사진 1장 첨부 (시연)</div><div class="d">받는 분이 동의한 경우에만 올릴 수 있어요</div></div><input type="checkbox" id="jp"></label><label class="sw"><div class="t">받는 분의 사진 동의를 받았어요</div><input type="checkbox" id="jpc"></label><div id="jai"></div><div class="btns" style="margin-top:12px"><button class="btn soft" data-act="jPol">AI로 다듬기</button><button class="btn" data-act="jGo" data-id="${d.id}">제출</button></div>`);

ACT.cfmA=d=>{const r=reqOf(d.id);sheet(`<h2>활동 확인</h2><div class="card"><b>봉사자 일지</b><p style="margin:4px 0 0">${esc(r.journal.ai)}</p></div>${r.recv.k==='elder'?`<p class="muted">담당자가 어르신께 확인한 내용을 기준으로 해 주세요.</p>`:''}<div class="lbl2">실제 활동 시간</div>${sel('ch',TIMES(.5,r.hours).map(([h])=>[h,h+'시간']),r.hours)}<p class="mini">줄이면 적립·차감도 줄어요. 확인하지 않으면 24시간 뒤 일지 기준으로 자동 확정돼요.</p><div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="closeSheet">나중에</button><button class="btn" data-act="cfmGo" data-id="${d.id}">확정</button></div>`);};
ACT.cfmGo=d=>{const r=reqOf(d.id);confirmAct(r,'recv',+val('#ch'));closeSheet();toast(`${fmt(r.credit)}시간이 확정됐어요`);render();};

ACT.rateH=d=>{RS=5;sheet(`<h2>받은 분은 어땠나요?</h2><p class="muted">비공개 점수로, 운영 참고용으로만 쓰여요.</p><div class="stars">${[1,2,3,4,5].map(i=>`<button class="on" data-act="star" data-n="${i}">★</button>`).join('')}</div><button class="btn" data-act="rateHGo" data-id="${d.id}">남기기</button>`);};
