<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D6DF2">
<title>시간 적금 · 첫 활동 교육 · 동네 클래스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#EFEBE4; --paper:#FBF9F5; --card:#FFFFFF; --ink:#1E2A26; --sub:#5C6B66; --mute:#8A9793;
  --line:#E4DED4; --pri:#2F6B5E; --pri-2:#3E8573; --pri-soft:#E3EFEA; --amber:#C98A2B; --amber-soft:#FBF0DC;
  --red:#B5483B; --red-soft:#F8E4E0; --blue:#3A6EA5; --blue-soft:#E4EDF7;
  --r:16px; --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;color:var(--ink);font-size:var(--fs);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
body.big{--fs:18px}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column}
@media (min-width:520px){
  body{padding:24px 0}
  #app{min-height:calc(100dvh - 48px);height:calc(100dvh - 48px);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(30,42,38,.18)}
}
/* header */
.hd{position:sticky;top:0;z-index:20;background:rgba(251,249,245,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;padding:12px 14px 10px;border-bottom:1px solid var(--line);min-height:58px}
.hd .bk{width:38px;height:38px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.hd .bk:hover{background:var(--pri-soft)}
.hd h1{font-size:18px;margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:-.3px}
.chip-role{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px 6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer}
.chip-role .dot{width:8px;height:8px;border-radius:50%;background:var(--pri)}
/* body */
.bd{flex:1 1 auto;overflow-y:auto;padding:16px 16px 28px}
.bd.notab{padding-bottom:28px}
.sec-t{font-size:13px;font-weight:700;color:var(--sub);margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sec-t a{color:var(--pri);font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:10px}
.click{cursor:pointer;transition:transform .08s ease, box-shadow .15s}
.click:active{transform:scale(.985)}
.click:hover{box-shadow:0 4px 14px rgba(30,42,38,.08)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row > *{min-width:0}
.grow{flex:1 1 auto;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--sub)} .mute2{color:var(--mute);font-size:13px}
.small{font-size:13px}
.b{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:#8A5A12}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.gray{background:#EEEAE3;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:16px;cursor:pointer;padding:0 16px;text-align:center}
.btn:hover{background:var(--pri-2)}
.btn.ghost{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}
.btn.ghost:hover{background:var(--pri-soft)}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.warn{background:var(--red)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px}
.btns{display:flex;gap:8px}
.btns > *{flex:1 1 0;min-width:0}
.stack > * + *{margin-top:10px}
/* hero credit */
.hero{background:linear-gradient(135deg,#2F6B5E 0%,#3E8573 100%);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .lbl{font-size:13px;opacity:.85}
.hero .num{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0 2px}
.hero .num small{font-size:16px;font-weight:600;opacity:.85;margin-left:4px}
.hero .sub{font-size:13px;opacity:.9}
.hero .acts{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}
.hero .acts button{flex:1 1 0;min-width:0;min-height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
.hero .acts button:hover{background:rgba(255,255,255,.28)}
.hero.amber{background:linear-gradient(135deg,#B9792A 0%,#D29A45 100%)}
/* list item */
.item{display:flex;gap:12px;align-items:flex-start}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--pri-soft);color:var(--pri)}
.ic.amber{background:var(--amber-soft);color:#8A5A12}
.ic.red{background:var(--red-soft);color:var(--red)}
.ic.blue{background:var(--blue-soft);color:var(--blue)}
.cr{font-weight:800;color:#8A5A12;white-space:nowrap}
.cr.plus{color:var(--pri)} .cr.minus{color:var(--red)}
/* tabs */
.tabs{position:sticky;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--mute);cursor:pointer;border-radius:12px}
.tabs button.on{color:var(--pri);font-weight:700}
.tabs button svg{width:24px;height:24px}
/* form */
label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:16px 2px 6px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:48px;outline:none}
.in:focus{border-color:var(--pri)}
textarea.in{min-height:110px;resize:vertical;line-height:1.55}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.stepper button{width:56px;height:52px;border:0;background:var(--pri-soft);color:var(--pri);font-size:22px;font-weight:700;cursor:pointer;flex:0 0 auto}
.stepper .v{flex:1 1 auto;text-align:center;font-size:20px;font-weight:800}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;cursor:pointer}
.opt + .opt{margin-top:8px}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--mute);flex:0 0 auto;display:grid;place-items:center}
.opt.on .rd{border-color:var(--pri)}
.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pri)}
.toggle{width:46px;height:28px;border-radius:999px;background:#D7D1C6;position:relative;border:0;cursor:pointer;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--pri)}
.toggle.on::after{left:21px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* AI box */
.ai{border:1.5px solid #CFE3DB;background:linear-gradient(180deg,#F4FAF7 0%,#FFFFFF 100%);border-radius:var(--r);padding:14px 16px}
.ai .ah{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--pri);margin-bottom:8px;letter-spacing:.2px}
.ai .ah .spark{width:20px;height:20px;border-radius:6px;background:var(--pri);color:#fff;display:grid;place-items:center}
.ai ul{margin:6px 0 0;padding-left:18px}
.ai li{margin:3px 0}
.ai.warn{border-color:#EBC9C2;background:linear-gradient(180deg,#FCF3F1 0%,#fff 100%)}
.ai.warn .ah{color:var(--red)} .ai.warn .ah .spark{background:var(--red)}
.ai.amber{border-color:#EED9B3;background:linear-gradient(180deg,#FDF7EC 0%,#fff 100%)}
.ai.amber .ah{color:#8A5A12} .ai.amber .ah .spark{background:var(--amber)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#E9F2EE 25%,#D6E8E0 50%,#E9F2EE 75%);background-size:200% 100%;animation:sh 1s infinite linear;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--sub)} .kv dd{margin:0;font-weight:600;min-width:0}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;line-height:1.5}
.msg.ai-m{background:var(--card);border:1px solid var(--line);border-top-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--pri);color:#fff;border-top-right-radius:6px;align-self:flex-end}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.qr button{border:1.5px solid var(--pri);background:var(--card);color:var(--pri);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.qr button:hover{background:var(--pri-soft)}
.composer{display:flex;gap:8px;margin-top:14px}
.composer .in{flex:1 1 auto;min-width:0}
.composer button{flex:0 0 auto;width:52px;border-radius:12px;border:0;background:var(--pri);color:#fff;cursor:pointer;display:grid;place-items:center}
/* stepper status */
.steps{display:flex;gap:4px;margin-top:10px}
.steps span{flex:1 1 0;height:6px;border-radius:3px;background:#E7E1D7}
.steps span.on{background:var(--pri)}
.stepl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
/* bars */
.bar{height:10px;border-radius:5px;background:#EEE9E1;overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:5px;background:var(--pri)}
.bar > i.amber{background:var(--amber)} .bar > i.red{background:var(--red)}
.vbars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.vbars .col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vbars .col i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--pri);display:block}
.vbars .col span{font-size:11px;color:var(--mute)}
/* doc thumb */
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.doc{aspect-ratio:3/4;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.doc b{font-size:11px}
.doc i{display:block;height:4px;border-radius:2px;background:#E6E1D8}
.doc i.s{width:60%}
/* sheet & toast */
.ov{position:fixed;inset:0;background:rgba(20,28,25,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:100%;max-width:430px;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;animation:up .2s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D3CCC1;margin:2px auto 12px}
.sheet h2{font-size:19px;margin:4px 0 6px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:min(380px,calc(100vw - 32px));text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
/* role pick */
.rolecard{display:flex;gap:14px;align-items:center}
.rolecard .ic{width:52px;height:52px;border-radius:16px}
.logo{display:flex;align-items:center;gap:10px;margin:18px 2px 6px}
.logo .mk{width:44px;height:44px;border-radius:14px;background:var(--pri);display:grid;place-items:center;color:#fff}
.notice{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:13px;color:#7A5212}
.divider{height:1px;background:var(--line);margin:14px 0}
.big-cta{min-height:64px;font-size:18px;border-radius:18px}
.center{text-align:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:0 0 auto;background:var(--pri-soft);color:var(--pri)}
.avatar.lg{width:64px;height:64px;font-size:22px}
.timer{font-size:44px;font-weight:800;letter-spacing:-1px;text-align:center;font-variant-numeric:tabular-nums}
.thanks{background:linear-gradient(160deg,#FFF8EA 0%,#FFFFFF 70%);border:1px solid #F0DFC0;border-radius:18px;padding:18px}
.thanks .q{font-size:16px;line-height:1.7;font-weight:500}
.ok{color:var(--pri);font-weight:700}
.warnc{color:var(--red);font-weight:700}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.check-row:last-child{border-bottom:0}
.check-row .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;font-size:13px;font-weight:800;color:#fff;background:var(--pri)}
.check-row .ck.w{background:var(--red)}
.cb{width:22px;height:22px;accent-color:var(--pri);flex:0 0 auto;margin-top:2px}

/* ===== v4: 흰 바탕 · 파랑 한 가지 · 여백 중심 ===== */
:root{--bg:#fff;--paper:#FFFFFF;--line:#F0F1F4;--ink:#1B1D22;--sub:#5F6672;--mute:#9AA1AC;--brand:#3D6DF2;--pri:#3D6DF2;--pri-2:#2F5BDB;--pri-soft:#EEF3FF;--fill:#F6F7F9;--r:16px;--fs:16px}
body{padding:0 !important;background:#fff;letter-spacing:-.3px}
body.big{--fs:19px}
#app{max-width:600px;height:100dvh !important;min-height:0 !important;border-radius:0 !important;box-shadow:none !important;overflow:hidden;background:#fff}
@media (min-width:601px){#app{box-shadow:0 0 0 1px #ECEDF0 !important}}
.hd{background:#fff;backdrop-filter:none;border-bottom:0;min-height:58px;padding:8px 14px 4px 20px}
.hd h1{font-size:20px;font-weight:700;letter-spacing:-.6px}
.hd .bk:hover{background:var(--fill)}
.chip-role{border:0;background:var(--fill);font-size:13px;padding:7px 10px 7px 12px;box-shadow:none;font-weight:600}
.tabs{background:#fff;border-top:1px solid var(--line);box-shadow:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{font-size:11.5px;color:#B4BAC3}
.tabs button.on{color:var(--ink);font-weight:700}
.tabs button svg{width:24px;height:24px}
.bd{padding:8px 20px 40px}
.sec-t{font-size:18px;font-weight:700;color:var(--ink);margin:36px 0 12px;letter-spacing:-.5px}
.sec-t a{font-size:13.5px;font-weight:500;color:var(--mute)}
.muted{color:var(--sub)} .mute2{color:var(--mute);font-size:13.5px} .small{font-size:14.5px}
.card{background:var(--fill);border:0;border-radius:var(--r);padding:18px 18px;box-shadow:none}
.card + .card{margin-top:10px}
.click:hover{box-shadow:none;background:#F1F2F5}
.click:active{transform:scale(.985)}
.item .b{font-size:16px}
/* 통장 */
.hero,.hero.amber{background:var(--brand);color:#fff;border-radius:20px;padding:20px 20px 18px;box-shadow:none;margin:4px 0 0}
.hero.amber{background:#F28C4B}
.hero::after{display:none}
.hero + .card{margin-top:12px}
.bk-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:18px;opacity:.9}
.bk-name{font-weight:600}
.bk-name::before{display:none}
.bk-no{opacity:.75;font-variant-numeric:tabular-nums}
.hero .lbl{font-size:13px;opacity:.8}
.hero .num{font-size:40px;font-weight:700;letter-spacing:-1.2px;margin:2px 0 4px}
.hero .num small{font-size:17px;opacity:.85;font-weight:500}
.hero .sub{font-size:13px;opacity:.8}
.hero .acts{margin-top:20px;gap:6px}
.hero .acts button{background:rgba(255,255,255,.16);border-radius:12px;min-height:44px;font-size:14.5px;font-weight:600}
.hero .acts button:hover{background:rgba(255,255,255,.26)}
.pass{background:var(--fill);border-radius:var(--r);padding:2px 18px 6px;box-shadow:none;font-variant-numeric:tabular-nums}
.pass-d{font-size:12.5px;color:var(--mute);font-weight:600;padding:16px 0 2px}
.pass-r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 12px;border-bottom:1px solid #EBEDF0}
.pass-r:last-child{border-bottom:0}
.pc{min-width:0} .pc b{display:block;font-size:15px;font-weight:600;color:var(--ink)} .pc span{font-size:12.5px;color:var(--mute)}
.pa{text-align:right;flex:0 0 auto} .pa b{display:block;font-size:16px} .pa span{font-size:12px;color:var(--mute)}
.pass .p-in{color:var(--brand)} .pass .p-out{color:var(--ink)}
/* 버튼 */
.btn{background:var(--brand);border-radius:14px;min-height:54px;font-size:16px;font-weight:600}
.btn:hover{background:var(--pri-2)}
.btn[disabled]{background:#D5DAE3;cursor:default}
.btn.ghost{background:var(--fill);color:var(--ink);border:0;box-shadow:none}
.btn.ghost:hover{background:#ECEEF2}
.btn.soft{background:var(--pri-soft);color:var(--brand)}
.btn.soft:hover{background:#E2EAFF}
.btn.warn{background:#EF4E4E}
.btn.sm{border-radius:12px;min-height:44px;font-size:14.5px}
.big-cta{min-height:56px;font-size:16.5px;border-radius:16px}
/* 태그·숫자 */
.tag{background:transparent;color:var(--sub);border-radius:0;font-size:12.5px;padding:0;font-weight:600}
.tags .tag + .tag::before{content:"·";margin-right:6px;color:#C9CED6}
.tag.amber{color:#E07A2E;background:transparent}
.tag.red{background:#FFEDED;color:#E54848;padding:3px 8px;border-radius:6px}
.tag.blue{color:var(--brand);background:transparent}
.tag.gray{color:var(--mute);background:transparent}
.tags{gap:6px}
.cr{color:var(--ink);font-weight:700;font-size:16px}
.cr.plus{color:var(--brand)} .cr.minus{color:var(--ink)}
/* AI */
.ai,.ai.warn,.ai.amber{border:0;border-radius:var(--r);background:var(--pri-soft);padding:18px;box-shadow:none}
.ai::before{display:none}
.ai.warn{background:#FFF1F1} .ai.amber{background:#FFF6EC}
.ai .ah{font-size:12.5px;font-weight:700;color:var(--brand);margin-bottom:8px}
.ai .ah .spark{width:auto;height:auto;background:none;color:var(--brand)}
.ai.warn .ah,.ai.warn .ah .spark{color:#E54848;background:none}
.ai.amber .ah,.ai.amber .ah .spark{color:#D9772B;background:none}
.ai .small,.ai li{font-size:14.5px;line-height:1.65}
.skel{background:linear-gradient(90deg,#E3EAFD 25%,#D3DEFB 50%,#E3EAFD 75%);background-size:200% 100%}
.ic,.ic.amber,.ic.red,.ic.blue{background:#fff;color:var(--ink);border-radius:14px}
.ic.red{color:#E54848}
.avatar{background:#E8EEFF;color:var(--brand);font-weight:700}
/* 폼 */
label.f{font-size:14px;color:var(--sub);font-weight:600;margin:22px 2px 8px}
.in,select.in,textarea.in{border:0;box-shadow:none;border-radius:14px;background:var(--fill);font-size:16px;min-height:54px;padding:14px 16px}
.in:focus{box-shadow:inset 0 0 0 2px var(--brand);background:#fff}
.stepper{border:0;border-radius:14px;box-shadow:none;background:var(--fill)}
.stepper button{background:transparent;color:var(--brand)}
.opt{border:0;border-radius:16px;background:var(--fill);box-shadow:none;padding:16px}

.msg{font-size:16px;border-radius:20px;padding:12px 16px}

.msg.me{background:var(--brand);border-top-right-radius:6px}
.qr button{background:#fff;border:0;box-shadow:inset 0 0 0 1.5px #D6DEF7;color:var(--brand);font-size:15px;font-weight:600;padding:10px 15px}
.composer button{background:var(--brand);border-radius:14px}
.steps span{height:5px;background:#E6E9EE} .steps span.on{background:var(--brand)}
.bar{height:8px;background:#E9ECF1} .bar > i{background:var(--brand)}
.vbars .col i{background:var(--brand)}
.check-row .ck{background:var(--brand);border-radius:50%}
.check-row .ck.w{background:#EF4E4E}
.ok{color:var(--brand)} .warnc{color:#E54848;font-weight:600}
.notice{background:var(--fill);color:var(--sub);border-radius:14px;font-size:13.5px}
.divider{background:#E9ECF0}
.sheet{max-width:600px;background:#fff;border-radius:24px 24px 0 0}
.toast{background:rgba(27,29,34,.92);border-radius:14px;bottom:92px;font-size:14.5px}
.timer{font-size:48px;font-weight:700}
.btns > .card{margin-top:0 !important}
/* ===== 스플래시 · 온보딩 · 로그인 · 가입 ===== */
.bd.full{padding:0 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.splash{justify-content:center;align-items:center}
.sp-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:spIn .9s ease both}
.sp-icon{width:84px;height:84px;border-radius:24px;background:var(--brand);color:#fff;padding:18px;box-shadow:0 12px 30px rgba(61,109,242,.28)}
.sp-word{font-size:15px;font-weight:600;color:var(--brand);letter-spacing:.5px}
@keyframes spIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.ob{animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ob-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:40px;min-height:0}
.ob-text{transition:opacity .26s, transform .26s}
.ob-ill{width:100%;max-width:340px;margin:30px auto 18px;transition:opacity .26s, transform .26s}
.ob-ill svg{width:100%;height:auto;display:block}
.fade{opacity:0;transform:translateY(8px)}
.ob-h{font-size:28px;font-weight:700;line-height:1.35;letter-spacing:-1px;margin:0}
.ob-p{font-size:15px;color:var(--sub);line-height:1.6;margin:12px 0 0}
.ob-dots{display:flex;gap:6px;justify-content:center}
.ob-dots i{width:6px;height:6px;border-radius:3px;background:#D5DAE3;cursor:pointer;transition:width .25s}
.ob-dots i.on{width:18px;background:var(--brand)}
.ob-note{font-size:12px;color:var(--mute);text-align:center;margin:18px 0 14px}
.ob-btns{display:flex;gap:10px}
.ob-btns .btn{flex:1;min-height:56px;border-radius:999px;font-size:16px}
.ob-login{background:var(--fill);color:var(--ink)} .ob-login:hover{background:#ECEEF2}
.au-demo{display:block;margin:14px auto 0;border:0;background:none;color:var(--mute);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.au-form{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.au-form .btn{margin-top:6px}
.au-links{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0 30px;font-size:14px;color:var(--sub)}
.au-links a{cursor:pointer} .au-links span{width:1px;height:12px;background:#D5DAE3}
.au-or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin-bottom:14px}
.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.sns{border-radius:14px;font-size:15.5px}
.btn.kakao{background:#FEE500;color:#191600} .btn.kakao:hover{background:#F5DC00}
.btn.naver{background:#03C75A} .btn.naver:hover{background:#02B451}
.su-prog{height:3px;background:var(--line);border-radius:2px;margin:0 0 26px;overflow:hidden}
.su-prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.su-h{font-size:24px;font-weight:700;letter-spacing:-.8px;margin:0;line-height:1.35}
.su-p{color:var(--sub);margin:8px 0 22px;font-size:15px}
.su-role{display:flex;align-items:center;gap:14px;background:var(--fill);border-radius:18px;padding:18px;cursor:pointer;margin-top:10px}
.su-role.on{background:var(--pri-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.su-ic{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--brand);flex:0 0 auto}
.su-ic svg{width:24px;height:24px}
.su-rt{font-weight:700;font-size:16.5px} .su-rd{font-size:13.5px;color:var(--sub);margin-top:2px}
.su-role .rd{width:22px;height:22px;border-radius:50%;border:2px solid #CDD3DC;flex:0 0 auto;display:grid;place-items:center}
.su-role.on .rd{border-color:var(--brand)} .su-role.on .rd::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--brand)}
.su-bottom{margin-top:32px}
.seg{display:flex;background:var(--fill);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;min-height:46px;border-radius:11px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.su-check{display:flex;align-items:center;gap:12px;padding:14px 4px;cursor:pointer;font-size:15px}
.su-check.all{background:var(--fill);border-radius:14px;padding:16px;margin-bottom:6px}
.su-check .bx{width:24px;height:24px;border-radius:50%;background:#E3E7ED;flex:0 0 auto;display:grid;place-items:center}
.su-check .bx::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.su-check.on .bx{background:var(--brand)}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:700;animation:spIn .5s ease}

/* ===== v5: 요청 카드 · 홈 · 채팅 · 차트 · 로그인 ===== */
.cat-ic{display:grid;place-items:center;border-radius:16px;flex:0 0 auto}
.rq{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #EEF0F3;border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(27,36,64,.05)}

.rq:hover{border-color:#DCE3F5}

.rq-cr span{font-size:11px;color:#7D93D6}

.reg{background:linear-gradient(180deg,#F3F6FF 0%,#FFFFFF 100%);border:1px solid #E3EAFD;border-radius:22px;padding:18px}
.reg-n{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reg-b{font-size:11.5px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:3px 8px}
.reg-box{background:#fff;border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 2px 10px rgba(27,36,64,.05)}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:4px 20px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.nc{flex:0 0 200px;scroll-snap-align:start;background:#fff;border:1px solid #EEF0F3;border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(27,36,64,.05);display:flex;flex-direction:column}
.nc-t{font-weight:700;font-size:16px;margin-top:14px;letter-spacing:-.4px;line-height:1.35;min-height:43px}
.nc-m{font-size:13px;color:var(--sub);margin-top:2px}
.nc-f{display:flex;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #F0F1F4;font-size:12.5px;color:var(--mute)}
.nc-f span{display:flex;align-items:center;gap:3px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
.cg-i{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--ink);font-weight:500;padding:0}
.cg-i:active{transform:scale(.95)}
.tip{display:flex;align-items:center;gap:12px;background:var(--fill);border-radius:18px;padding:16px 18px;margin-top:28px}
/* 채팅 */
.bd.chatv{display:flex;flex-direction:column;padding-bottom:0;background:#F7F8FA}
.chat-wrap{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 0 16px}
.chat-day{text-align:center;margin:8px 0 18px}
.chat-day span{font-size:12px;color:var(--mute);background:#EDEFF3;border-radius:999px;padding:4px 12px}
.chat{gap:12px}
.mrow{display:flex;gap:8px;align-items:flex-start;max-width:88%}
.bot{width:34px;height:34px;border-radius:12px;background:var(--brand);color:#fff;padding:7px;flex:0 0 auto}
.mcol{display:flex;flex-direction:column;gap:4px;min-width:0}

.msg{max-width:100%}
.msg.ai-m{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);border-top-left-radius:6px}
.msg.me{max-width:80%;box-shadow:0 2px 8px rgba(61,109,242,.25)}
.mcol.wide .ai{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.mcol.wide .ai.amber{background:#FFF8EE}
.chat-dock{position:sticky;bottom:0;background:#fff;margin:0 -20px;padding:12px 20px 14px;border-top:1px solid #EEF0F3;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(27,36,64,.06)}
.chat-dock:empty{display:none}
.qr-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 2px}
.qr-row::-webkit-scrollbar{display:none}
.qr-row .qr{display:flex;flex-wrap:nowrap;gap:8px;margin:0}

.qr-reset{flex:0 0 auto;border:0;background:var(--fill);color:var(--sub);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chat-dock .composer{margin-top:10px}
.chat-dock .composer .in{border-radius:999px;background:var(--fill);min-height:50px;padding:0 18px}
.chat-dock .composer button{width:50px;height:50px;border-radius:50%}
/* 차트 */
.chart{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpis > div{background:var(--fill);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:2px}

.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}

.bd.lf{padding-top:4px}

.fl label{font-size:13px;color:var(--sub);font-weight:600;padding-left:4px}

.lf-keep{display:flex;align-items:center;gap:6px;cursor:pointer}
.lf-keep input{accent-color:var(--brand);width:17px;height:17px}
.bd.lf .au-or{margin:30px 0 18px}
.sns-row{display:flex;justify-content:center;gap:16px}
.sns-c{width:56px;height:56px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.sns-c.kakao{background:#FEE500} .sns-c.naver{background:#03C75A;color:#fff;font-size:20px} .sns-c.apple{background:#111}
.sns-c:active{transform:scale(.94)}
.lf-sign{text-align:center;color:var(--sub);font-size:14px;margin-top:34px}
.lf-sign a{color:var(--brand);font-weight:700;cursor:pointer;margin-left:4px}

/* ===== v6: AI 모듈 라벨 · 도구 실행 · 영수증 · 안내문 · AI 분석 ===== */
.ai .ah{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mod{margin-left:auto;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;letter-spacing:0}
.mod.m1{background:#E3EAFF;color:#3D6DF2} .mod.m2{background:#EDE7FF;color:#6A4FD8} .mod.m3{background:#E2F5EA;color:#1F9D63} .mod.m4{background:#FFEBD9;color:#C9671A} .mod.m5{background:#FFE4EA;color:#D1436B}
.tool-list{display:flex;flex-direction:column;gap:2px}

.tool:last-child{border-bottom:0}
.tool.done,.tool.run{opacity:1}
.tool .b{font-size:14px}
.tk{width:20px;height:20px;border-radius:50%;flex:0 0 auto;margin-top:1px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:#D5DAE3}
.tool.done .tk{background:var(--brand)}
.tool.run .tk{background:none;border:2.5px solid #C9D6FB;border-top-color:var(--brand);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tool code,code.fn{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:#6E7CA8;margin-top:2px;word-break:break-all;line-height:1.45}
code.fn{background:#fff;border-radius:8px;padding:6px 9px;margin:0 0 10px}
.tr{font-size:13.5px;color:var(--ink);margin-top:3px}
.rc{background:#fff;border-radius:12px;padding:12px 14px;font-variant-numeric:tabular-nums;border:1px dashed #D5DCEA}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:1px dashed #E1E6EF;margin-bottom:6px}
.rc-h span{font-size:12px;color:var(--mute)}
.rc-r,.rc-t{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.rc-t{border-top:1px dashed #E1E6EF;margin-top:6px;padding-top:8px}
.rc-t b{font-size:16px}
.upl{width:100%;min-height:96px;border:2px dashed #CBD6F5;background:#F7F9FF;border-radius:16px;color:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14.5px;cursor:pointer}
.upl:hover{background:#EEF3FF}
.paper{background:#FFFEFA;border:1px solid #ECE6D6;border-radius:6px;padding:18px 18px 14px;box-shadow:0 8px 22px rgba(60,50,20,.10);transform:rotate(-1.2deg);margin:6px 6px 0;font-family:"Nanum Myeongjo","Noto Serif KR",serif}
.pp-h{font-weight:700;font-size:16px;text-align:center;padding-bottom:10px;border-bottom:2px solid #333;margin-bottom:8px}
.pp-r{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:6px 0;border-bottom:1px solid #EFEADD}
.pp-r span:first-child{color:#777;flex:0 0 auto}
.pp-r span:last-child{text-align:right}
.pp-s{font-size:12px;color:#8A6B2E;margin-top:10px}
.policy{display:flex;flex-direction:column;gap:10px}
.policy > div{background:#fff;border-radius:12px;padding:12px 14px}
.policy b{display:block;font-size:15px;margin-bottom:2px}
.policy span{font-size:14px;color:var(--sub);line-height:1.55}
.ask-hero{background:var(--fill);border-radius:20px;padding:20px 18px}
.ask-hero .composer{margin-top:14px}
.ask-hero .composer .in{background:#fff}
.ask-hero .qr-row{margin:10px -18px 0;padding:0 18px}
.ans{margin-top:22px}
.ans .msg.me{max-width:85%;display:table}
.ans-n{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-bottom:10px}
.hb{display:flex;flex-direction:column;gap:9px;background:#fff;border-radius:12px;padding:14px}
.hb-r{display:grid;grid-template-columns:52px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.hb-r span{color:var(--sub)} .hb-r b{text-align:right}
.hb-b{height:12px;background:#F0F2F6;border-radius:6px;overflow:hidden}

.rp b{display:block;font-size:15px;margin-top:12px}

.rp p{margin:4px 0 0;font-size:14.5px;line-height:1.65;color:var(--sub)}
.mcol.wide .policy > div{background:#F7F8FA}

.tip .btn{white-space:nowrap;flex:0 0 auto}
.hs{scroll-padding-left:20px}
.btns .btn{white-space:nowrap}
#mtext{min-height:150px}
.bd > .tags:first-child{margin-top:8px}
.rq-m{white-space:normal;overflow:visible}
/* ===== v7: 요구사항 명세 반영 ===== */
.hd-r{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.bell{position:relative;width:38px;height:38px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}

.chip-role{padding:6px 8px 6px 10px;font-size:12px}
/* time bar */
.tb{position:relative;height:8px;border-radius:4px;background:#EDF0F5;margin-top:10px}

.tr-t{font-size:15px;font-weight:700;letter-spacing:-.3px}

.cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px 4px 4px}
.cat-chip .cat-ic{border-radius:50%}
.kind{font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 7px;white-space:nowrap}
.kind.offer{background:#E6F7EE;color:#1F9D63} .kind.need{background:#FFF1E2;color:#D9731A} .kind.reg{background:#EAF0FF;color:#3D6DF2}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;background:#FFF4D6;color:#B07C00;white-space:nowrap}
.badge.trust{background:#E6F7EE;color:#1F9D63}
.badge.elder{background:#F1EDFF;color:#6A4FD8}
.seg2{display:flex;background:var(--fill);border-radius:14px;padding:4px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:none;min-height:44px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--sub);cursor:pointer}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* todo */
.todo{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #EEF0F3;border-radius:18px;padding:14px 16px;cursor:pointer}
.todo + .todo{margin-top:8px}
.todo .n{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto}
.todo .t{font-weight:700;font-size:15px} .todo .d{font-size:12.5px;color:var(--mute)}
.dl{font-size:11.5px;font-weight:700;color:#E5484D;background:#FFEDED;border-radius:6px;padding:3px 7px;white-space:nowrap}
/* state */
.st{font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.st.wait{background:#FFF4E5;color:#D9731A} .st.ok{background:#E6F7EE;color:#1F9D63} .st.go{background:#EAF0FF;color:#3D6DF2} .st.end{background:#F1F2F5;color:#8A919C} .st.no{background:#FFEDED;color:#E5484D}
.flow{display:flex;align-items:flex-start;margin:6px 0 2px}
.flow > div{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--mute)}
.flow > div::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:#E4E8EF;z-index:0}
.flow > div:first-child::before{display:none}
.flow > div span{display:block;width:18px;height:18px;border-radius:50%;background:#E4E8EF;margin:0 auto 4px;position:relative;z-index:1}
.flow > div.on{color:var(--ink);font-weight:600}
.flow > div.on span,.flow > div.on::before{background:var(--brand)}
.flow > div.cur span{box-shadow:0 0 0 4px #D6E2FF}
/* intro card */
.intro{background:linear-gradient(180deg,#F3F6FF,#fff);border:1px solid #E3EAFD;border-radius:20px;padding:18px}
.intro .ph{width:64px;height:64px;border-radius:50%;background:#DCE6FF;color:var(--brand);display:grid;place-items:center;font-size:24px;font-weight:800;flex:0 0 auto}
.stars{color:#FFB400;letter-spacing:1px}
/* messages */
.thread{display:flex;flex-direction:column;gap:8px;background:var(--fill);border-radius:18px;padding:14px}
.tm{max-width:84%;font-size:14.5px;line-height:1.5}
.tm .bub{padding:10px 13px;border-radius:16px;background:#fff}
.tm.me{align-self:flex-end} .tm.me .bub{background:var(--brand);color:#fff}
.tm .meta{font-size:11px;color:var(--mute);margin:3px 4px 0;display:flex;gap:8px}
.tm.me .meta{justify-content:flex-end}
.tm .meta a{cursor:pointer;color:var(--mute);text-decoration:underline}
.tsys{align-self:center;font-size:12px;color:var(--sub);background:#fff;border-radius:999px;padding:5px 12px;text-align:center}
.tin{display:flex;gap:8px;margin-top:10px}
.tin .in{flex:1;min-width:0;border-radius:999px;min-height:48px;padding:0 16px}
.tin button{width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
/* time picker */
.tp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tp button{border:0;background:var(--fill);border-radius:12px;min-height:44px;font-weight:600;cursor:pointer;font-size:14px}
.tp button.on{background:var(--brand);color:#fff}
.tp button:disabled{opacity:.35;cursor:default}
.sum{background:var(--fill);border-radius:16px;padding:14px 16px}
.sum .between + .between{margin-top:8px}
/* notif */
.nt{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.nt.new{background:linear-gradient(90deg,#F5F8FF,#fff);margin:0 -20px;padding:14px 20px}
.nt .ic{width:40px;height:40px;border-radius:14px;flex:0 0 auto}
/* menu list */
.ml{background:var(--fill);border-radius:18px;overflow:hidden}
.ml > div{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;font-size:15px}
.ml > div + div{border-top:1px solid #ECEEF2}
.ml > div:hover{background:#F0F2F5}
.ml .grow span{display:block;font-size:12.5px;color:var(--mute)}
.ml svg{flex:0 0 auto}
.danger{color:#E5484D}
/* elder card */
.ec{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #EEF0F3;border-radius:18px;padding:14px 16px;cursor:pointer}
.ec + .ec{margin-top:8px}
.ec .av{width:46px;height:46px;border-radius:16px;background:#F1EDFF;color:#6A4FD8;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.lock{display:flex;gap:10px;align-items:flex-start;background:#F4F1FF;border-radius:14px;padding:12px 14px;font-size:13.5px;color:#4B3A9E}
/* fab */
.fab{position:sticky;bottom:12px;margin-left:auto;display:flex;align-items:center;gap:6px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:0 18px;height:50px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(0,0,0,.2);cursor:pointer;margin-top:16px;width:max-content}
/* mic */
.mic{width:50px;height:50px;border-radius:50%;border:0;background:var(--fill);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.wave{display:flex;gap:5px;justify-content:center;align-items:center;height:60px;margin:18px 0}
.wave i{width:6px;border-radius:3px;background:var(--brand);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:12px}50%{height:50px}}
.stars-in{display:flex;gap:6px;justify-content:center;font-size:34px;color:#E2E6EC;cursor:pointer}
.stars-in span.on{color:#FFB400}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat2 > div{background:var(--fill);border-radius:16px;padding:14px}
.stat2 b{display:block;font-size:20px;letter-spacing:-.5px} .stat2 span{font-size:12px;color:var(--sub)}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px}
.hero .row3 div{text-align:center;font-size:11.5px;opacity:.9} .hero .row3 b{display:block;font-size:15px;opacity:1}
.empty{text-align:center;color:var(--mute);padding:30px 0;font-size:14px}
.tag2{font-size:12px;border-radius:999px;background:var(--fill);padding:5px 10px;font-weight:600;cursor:pointer;border:0}
.tag2.on{background:var(--ink);color:#fff}
.ai-ban{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#EEF3FF 0%,#F6F1FF 100%);border-radius:22px;padding:18px 18px;margin-top:26px}
.ah2{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--brand)}
.ah2 .spark{background:none;color:var(--brand)}
.ai-orb{width:58px;height:58px;border-radius:20px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 8px 18px rgba(61,109,242,.3)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:4px 0;line-height:1.3;text-align:center}
.qa button span{width:52px;height:52px;border-radius:18px;display:grid;place-items:center}
.qa button:active{transform:scale(.95)}
pre.json{background:#1B1D22;color:#C9D6FF;font-size:11.5px;border-radius:10px;padding:10px 12px;overflow-x:auto;margin:8px 0 0;white-space:pre-wrap;word-break:break-all}
details summary{list-style:none} details summary::-webkit-details-marker{display:none}
.bd > .card.item,.card.item{display:flex;align-items:center;gap:12px}
.mcol.wide .policy > div{background:#F7F8FA}
.ec.av{cursor:default}
.nc .cats .cat-chip{font-size:11.5px}

.chk{display:flex;align-items:center;gap:12px;background:var(--fill);border-radius:16px;padding:14px 16px;margin-top:12px}
.chk.on{background:#EAF0FF}
.dotp{width:12px;height:12px;border-radius:50%;background:var(--brand);flex:0 0 auto;box-shadow:0 0 0 5px rgba(61,109,242,.18);animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 9px rgba(61,109,242,.05)}}
.mapbox{position:relative;height:150px;border-radius:16px;margin-bottom:12px;background:linear-gradient(0deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),repeating-linear-gradient(45deg,#E7ECF5 0 12px,#EEF2F9 12px 24px)}
.pin2{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);color:#E5484D}
.cert{border:1.5px solid #E3E7EF;border-radius:18px;padding:18px;background:#fff;margin-top:14px}
.cert-h{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px dashed #E3E7EF}

.plinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.plink{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#fff;background:var(--brand);border-radius:10px;padding:8px 12px;text-decoration:none}
.plink.ghost{background:#EEF3FF;color:var(--brand)}
.btn.sm{white-space:nowrap;flex-shrink:0}

/* ===== 추가: 첫 활동 교육 · 동네 클래스 ===== */
.mod.m6{background:#FFF3D1;color:#A66F00}
.new-badge{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:#E5484D;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.edu-ban{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF6E0 0%,#FFFDF6 100%);border:1px solid #F5E2B0;border-radius:22px;padding:18px;margin-top:18px;cursor:pointer}
.edu-ban .eo{width:54px;height:54px;border-radius:18px;background:#F2B233;color:#fff;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 8px 18px rgba(242,178,51,.3)}
.edu-ban.done{background:linear-gradient(135deg,#EAF8F0 0%,#FAFFFC 100%);border-color:#CDEBDC}
.edu-ban.done .eo{background:#1F9D63;box-shadow:0 8px 18px rgba(31,157,99,.25)}
.estep{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.estep:last-child{border-bottom:0}
.estep .no{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--sub);display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 auto}
.estep.on .no{background:var(--brand);color:#fff}
.estep.ok .no{background:#1F9D63;color:#fff}
.rcard{background:#fff;border:1px solid #EEF0F3;border-radius:24px;padding:26px 22px;box-shadow:0 8px 24px rgba(27,36,64,.06);min-height:330px;display:flex;flex-direction:column}
.rcard .big-ic{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;margin-bottom:18px}
.rcard h3{font-size:22px;letter-spacing:-.6px;margin:0 0 10px;line-height:1.35}
.rcard p{color:var(--sub);margin:0;font-size:16px}
.rcard .ex{margin-top:auto;background:var(--fill);border-radius:14px;padding:12px 14px;font-size:14px}
.qz-q{font-size:20px;font-weight:700;letter-spacing:-.5px;line-height:1.4;margin:6px 0 18px}
.opt.right{border-color:#1F9D63;background:#E9F7EF}
.opt.wrong{border-color:#E5484D;background:#FFF0F0}
.persona{display:flex;gap:12px;align-items:center;background:var(--fill);border-radius:18px;padding:14px}
.persona .pa{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
.hint{font-size:12.5px;color:#A66F00;background:#FFF6E0;border-radius:10px;padding:8px 10px;margin-top:10px}
.sc-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.sc-row .l{width:64px;font-size:13.5px;color:var(--sub);flex:0 0 auto}
.sc-row .bar{flex:1 1 auto}
.sc-row b{width:40px;text-align:right;flex:0 0 auto}
.fix{border-left:3px solid #E5484D;padding:8px 0 8px 12px;margin-top:12px}
.fix .was{color:var(--sub);font-size:14px;text-decoration:line-through;text-decoration-color:#E5484D80}
.fix .now{font-size:14.5px;margin-top:4px}
.fix.soft{border-left-color:#F2B233}
.cert-c{text-align:center;background:linear-gradient(180deg,#F3F6FF 0%,#fff 100%);border:1px solid #E3EAFD;border-radius:24px;padding:28px 20px}
.cert-c .medal{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(61,109,242,.3)}
.cl-card{background:#fff;border:1px solid #EEF0F3;border-radius:22px;overflow:hidden;box-shadow:0 4px 14px rgba(27,36,64,.05);cursor:pointer}
.cl-card + .cl-card{margin-top:12px}
.cl-card .cv{height:96px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 16px;font-size:40px}
.cl-card .clb{padding:14px 16px 16px}
.cl-card .ct{font-size:17px;font-weight:700;letter-spacing:-.4px;margin-top:2px}
.tch{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.9)}
.cl-hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px}
.cl-hs::-webkit-scrollbar{display:none}
.cl-hs .cl-card{flex:0 0 220px;margin:0}
.cl-hs .cl-card .cv{height:72px;font-size:30px}
.curri{counter-reset:c;margin:0;padding:0;list-style:none}
.curri li{position:relative;padding:10px 0 10px 40px;border-bottom:1px dashed var(--line)}
.curri li:last-child{border-bottom:0}
.curri li::before{counter-increment:c;content:counter(c);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--pri-soft);color:var(--brand);font-weight:800;font-size:13px;display:grid;place-items:center}
.curri li span{float:right;color:var(--mute);font-size:13px}
.settle{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px;margin-top:10px}
.settle b{text-align:right}
.ring-wrap{display:flex;gap:14px;align-items:center}
.seat{display:flex;gap:4px;margin-top:8px}
.seat i{width:18px;height:18px;border-radius:6px;background:var(--fill)}
.seat i.on{background:var(--brand)}
.fab{position:sticky;bottom:12px;margin-left:auto;display:flex;align-items:center;gap:6px;width:auto;min-height:50px;padding:0 20px;border-radius:999px;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:15px;box-shadow:0 10px 24px rgba(61,109,242,.35);cursor:pointer;margin-top:16px}
/* ---------- QR 시작·종료 체크 ---------- */
.qr-steps{display:flex;gap:6px;margin-top:16px}
.qr-steps div{flex:1 1 0;min-width:0;background:var(--fill);border-radius:12px;padding:8px 4px;font-size:12.5px;line-height:1.3;text-align:center;color:var(--mute);font-weight:600}
.qr-steps .on{background:var(--pri-soft);color:var(--brand)}
.qr-steps .done{background:#E7F6EE;color:#1F9D63}
.qr-by{display:inline-block;font-size:11.5px;font-weight:700;color:var(--brand);background:#fff;border-radius:6px;padding:1px 6px;margin-left:2px;vertical-align:1px}
.qr-ic{width:44px;height:44px;border-radius:14px;background:var(--pri-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.qr-cam{position:relative;height:270px;border-radius:18px;margin:12px 0 4px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#343B4B 0,#151821 70%)}
.qr-ghost{position:absolute;left:50%;top:44%;width:118px;height:118px;transform:translate(-50%,-50%) rotate(-4deg);opacity:.55;border-radius:6px;overflow:hidden;filter:blur(.4px)}
.qr-ghost svg{display:block;width:100%;height:100%}
.qr-frame{position:absolute;left:50%;top:44%;width:176px;height:176px;transform:translate(-50%,-50%)}
.qr-frame i{position:absolute;width:30px;height:30px;border:4px solid #fff;transition:border-color .2s ease}
.qr-frame .c1{top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.qr-frame .c2{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.qr-frame .c3{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.qr-frame .c4{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.qr-line{position:absolute;left:12px;right:12px;top:14px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#8FB0FF,transparent);box-shadow:0 0 12px #8FB0FF;animation:qrl 1.5s ease-in-out infinite alternate}
@keyframes qrl{to{top:160px}}
.qr-okm{position:absolute;left:50%;top:44%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:#1F9D63;color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);transition:opacity .2s ease,transform .25s cubic-bezier(.2,.9,.3,1.3)}
.qr-cam.ok .qr-frame i{border-color:#3DDC97}
.qr-cam.ok .qr-line{display:none}
.qr-cam.ok .qr-okm{opacity:1;transform:none}
.qr-hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#fff;font-size:14.5px;font-weight:600}
.qr-show{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 4px}
.qr-box{background:#fff;padding:12px;border-radius:18px;border:1px solid var(--line);box-shadow:0 6px 24px rgba(20,30,60,.08);width:max-content}
.qr-box svg{display:block;width:min(220px,62vw);height:min(220px,62vw)}
.qr-timer{width:min(220px,62vw);height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.qr-timer i{display:block;height:100%;width:100%;background:var(--brand);transition:width 1s linear}
.qr-card{margin-top:12px;border:1.5px dashed #C9D2E3;border-radius:18px;padding:16px;text-align:center}
.qr-card .qr-box svg{width:160px;height:160px}
@media (prefers-reduced-motion:reduce){.qr-line{animation:none;top:50%}.qr-okm{transition:none}}
.qr-by.late{color:#B4540A;background:#FFF1E2}

/* ---------- 지각·노쇼 안내 ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:13px 14px;margin-top:14px;font-size:14px;line-height:1.5}
.alert > svg{flex:0 0 auto;margin-top:1px}
.alert b{display:block;font-size:15.5px;line-height:1.4;margin-bottom:2px}
.alert.warn{background:#FFF5E3;color:#6E4A0E}
.alert.bad{background:#FFEDEE;color:#9B1C24}
.demo-clock{display:inline-flex;align-items:center;gap:6px;margin-top:14px;min-height:36px;border:1px dashed #C3CCDD;background:#fff;border-radius:999px;padding:0 12px;font:inherit;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
.demo-clock:hover{background:var(--fill)}
.ic-line{display:flex;align-items:center;gap:6px}

/* =====================================================================
   다듬기 레이어 — 기존 디자인은 그대로 두고 읽기·조작 품질만 끌어올림
   ===================================================================== */
/* 보조 글씨 대비 4.5:1 이상 (#9AA1AC 2.6:1 → #687080 4.8:1) */
:root{--mute:#687080}
/* 12px 미만 글씨 없애기 */
.tabs button{font-size:12px;color:#6E7683;min-height:52px}
.tabs button.on{color:var(--ink)}
.flow > div{font-size:12px;line-height:1.3}
.flow > div.cur{color:var(--brand);font-weight:700}
.tb-l{font-size:12px}
.badge{font-size:12px;padding:2px 8px}
.stepl,.vbars .col span,.doc b,.rq-cr span,.reg-b,.kpis em,.mod,.tm .meta,.hero .row3 div,.nc .cats .cat-chip,.kind,.dl,.st,.tch,.qr-by,.new-badge,pre.json{font-size:12px}
.ml .grow span{font-size:13px;margin-top:1px}

::selection{background:#D6E2FF;color:var(--ink)}
input,textarea{caret-color:var(--brand)}
.bd,.sheet{scrollbar-width:thin;scrollbar-color:#D5DAE3 transparent}
/* 키보드 포커스 */
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.tabs button:focus-visible,.ml > div:focus-visible{outline-offset:-3px}
.sheet:focus-visible{outline:none}
/* 누를 때 반응 */
.btn,.chip,.tag2,.qa button,.tabs button,.demo-clock,.opt{transition:transform .12s ease-out,background-color .15s ease-out}
.btn:active:not([disabled]),.chip:active,.tag2:active,.qa button:active,.demo-clock:active{transform:scale(.97)}
.click,.todo,.cl-card,.reg,.nc,.ml > div,.opt{transition:transform .14s ease-out,background-color .15s ease-out}
.click:active,.todo:active,.cl-card:active,.reg:active,.nc:active,.opt:active{transform:scale(.985)}
.tabs button:active{transform:scale(.94)}
/* 시트 열림 */
.ov.on{animation:ovIn .2s ease-out}
.ov.on .sheet{animation:sheetUp .32s cubic-bezier(.32,.72,0,1)}
@keyframes ovIn{from{background:rgba(20,28,25,0)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
/* 화면 전환: 앞으로는 오른쪽에서, 뒤로는 왼쪽에서 */
.bd.nav-fwd{animation:navF .26s cubic-bezier(.2,.8,.2,1)}
.bd.nav-bwd{animation:navB .26s cubic-bezier(.2,.8,.2,1)}
.bd.nav-swap{animation:navS .18s ease-out}
@keyframes navF{from{opacity:.3;transform:translate3d(18px,0,0)}}
@keyframes navB{from{opacity:.3;transform:translate3d(-18px,0,0)}}
@keyframes navS{from{opacity:.4}}

html.big{zoom:1.15}
html.big #app{height:calc(100dvh / 1.15) !important}
.toggle{background:#D5DAE3}

function render(){
 const {name,p}=cur(); const out=SCREENS[name](p||{}); const role=D.role; const canBack=nav.stack.length>1;
 const unread=role==='org'?D.NO.filter(n=>n.new).length:role==='user'?D.N.filter(n=>n.new).length:0;
 $('#hd').style.display=out.noHeader?'none':'flex';
 $('#hd').innerHTML=`${canBack?`<button class="bk" data-act="back" aria-label="뒤로">${I.back}</button>`:'<span style="width:4px"></span>'}<h1>${out.title}</h1>
  <div class="hd-r">${role&&role!=='admin'&&!out.noBell?`<button class="bell" data-go="notif" aria-label="알림">${I.bell2}${unread?`<i>${unread}</i>`:''}</button>`:''}${role?`<button class="chip-role" data-act="roleSheet"><span class="dot" style="background:${ROLES[role].color}"></span>${ROLES[role].label}${I.down}</button>`:''}</div>`;
 $('#bd').className='bd '+(out.cls||''); $('#bd').innerHTML=out.html; $('#bd').scrollTop=0;
 const showTabs=role&&!out.noTabs; $('#tabs').style.display=showTabs?'flex':'none';
 if(showTabs){const active=out.tab||name; $('#tabs').innerHTML=ROLES[role].tabs.map(([k,l,i])=>`<button class="${k===active?'on':''}" data-tab="${k}">${I[i]}<span>${l}</span></button>`).join('');}
 if(out.mount) out.mount();
}

  <label class="f">비밀번호</label><input class="in" type="password" placeholder="8자 이상"><label class="f">비밀번호 확인</label><input class="in" type="password" placeholder="한 번 더 입력">

 if(st===3){const all=su.agree.every(Boolean);return{title:'회원가입',noTabs:true,html:head+`<h2 class="su-h">약관에 동의해 주세요</h2>

 if(/무거|계단|쌀|이사|높은/.test(t)) return {lv:'주의',html:`<div class="ai amber"><div class="ah">${spk}보낼 수 있어요 · 주의${M(2)}</div><div class="small">무거운 짐이나 계단이 있어 다칠 수 있어요. 무리하지 않는 선에서 도와 달라고 적어 두면 좋아요.</div><div class="between" style="margin-top:8px"><span class="small">난이도 제안</span><b>${cat==='동행'?'책임 1.5':'수고 1.2'}</b></div><div class="small muted">근거: 신체 부담(무거운 짐)</div></div>`};
 return {lv:'허용',html:`<div class="ai"><div class="ah">${spk}보낼 수 있어요 · 허용${M(2)}</div><div class="between"><span class="small">난이도 제안</span><b>${LV(cat)} ${W(cat).toFixed(1)}</b></div><div class="small muted">근거: ${cat==='동행'?'이동 중 안전 책임':'신체 부담·위험·전문성이 낮아요'}</div></div>`};
}

function hbars(rows,c){const mx=Math.max(...rows.map(r=>r[1]));return `<div class="hb" style="padding:10px 0 0;background:none">${rows.map(([k,v])=>`<div class="hb-r"><span>${k}</span><div class="hb-b"><i style="width:${Math.max(6,v/mx*100)}%;background:${c}"></i></div><b>${v}</b></div>`).join('')}</div>`;}
function groupBars(rows,la,lb){const W2=320,H=170,pt=22,pb=28,bw=16,gap=5;const max=Math.max(...rows.flatMap(r=>[r[1],r[2]]))*1.1;const cw=(W2-16)/rows.length;
 return `<svg viewBox="0 0 ${W2} ${H}" class="chart">${rows.map(([d,a,b],i)=>{const cx=8+cw*i+cw/2,ha=(H-pt-pb)*a/max,hb=(H-pt-pb)*b/max,by=H-pb;return `<rect x="${cx-bw-gap/2}" y="${by-ha}" width="${bw}" height="${ha}" rx="6" fill="#F59E4B"/><rect x="${cx+gap/2}" y="${by-hb}" width="${bw}" height="${hb}" rx="6" fill="#3D6DF2"/><text x="${cx-bw/2-gap/2}" y="${by-ha-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C46A17">${a}</text><text x="${cx+bw/2+gap/2}" y="${by-hb-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3D6DF2">${b}</text><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="#5F6672">${d}</text>`;}).join('')}</svg>`;}

document.addEventListener('click',e=>{
 if(e.target.id==='ov')return closeSheet();
 const t=e.target.closest('[data-act],[data-go],[data-tab],[data-tab-go]');if(!t)return;
 if(t.tagName==='SUMMARY')return;
 if(t.dataset.act){const f=ACT[t.dataset.act];if(f)f(t);return;}
 if(t.dataset.tab){forElder=null;forFamily=null;return tab(t.dataset.tab);}
 if(t.dataset.tabGo){closeSheet();forElder=null;return tab(t.dataset.tabGo);}
 if(t.dataset.go){closeSheet();if(t.dataset.go==='write_need')wnReset();return go(t.dataset.go,{id:t.dataset.id});}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
 if(f==='login')return ACT.roleSheet();
 if(f==='wn'){const v=$('#wnin').value.trim();if(v)wnSay(v);}
 if(f==='rec'){const v=$('#recq').value.trim();if(v)recRun(v);}
 if(f==='pub'){const v=$('#pubq').value.trim();if(v)pubRun(v);}
 if(f==='msg'){const v=$('#msgin').value.trim();if(!v)return;if(/010|카톡|계좌|입금|송금/.test(v)){toast('연락처 교환·금전 요구는 보낼 수 없어요');return;}RR(e.target.dataset.id).msgs.push({f:'me',t:v,d:'방금'});render();$('#bd').scrollTop=$('#bd').scrollHeight;}
 if(f==='qmsg'){const v=$('#qmsgin').value.trim();if(!v)return;QQ(e.target.dataset.id).msgs.push({f:'org',t:v,d:'방금'});render();$('#bd').scrollTop=$('#bd').scrollHeight;}
});
document.addEventListener('change',e=>{const c=e.target.dataset.change;if(c==='woS'||c==='woE'){if(c==='woS')wo.s=+e.target.value;else wo.e=+e.target.value;if(wo.e<=wo.s)wo.e=Math.min(20,wo.s+1);if(wo.e-wo.s>12)wo.e=wo.s+4;$('#woBar').innerHTML=tbar(wo.s,wo.e);}});

const RPX=id=>RP.find(r=>r.id===id);
const rpS=id=>EDU.rp[id]||(EDU.rp[id]={i:0,log:[{p:1,t:RPX(id).open}],done:false,res:null});
function rpScore(id){const s=rpS(id),me=s.log.filter(l=>!l.p);const n=q=>me.filter(l=>l.q===q).length;
 const bad=me.filter(l=>l.q==='bad');const comm=Math.min(100,40+20*n('good')+10*n('ok'));const emp=Math.max(0,Math.min(100,46+18*n('good')+8*n('ok')-6*n('poor')));
 const safe=!bad.length;return {safe,comm,emp,bad,pass:safe&&comm>=60&&emp>=60};}
function rpClassify(id,t){const s=rpS(id),turn=RPX(id).turns[s.i];
 const flag=/010|번호는|번호 알려|카톡|아이디는|아이디 알려/.test(t)?'연락처':/받을게|받겠|이번만|잘 마실|잘 먹을/.test(t)&&!/마음만/.test(t)?'금전·선물':/붙여 드릴|붙여드릴|씻겨|먹여 드/.test(t)?'신체 돌봄':/비밀번호 알려|인증번호 알려|폰 주세요/.test(t)?'개인정보':null;
 if(flag&&!/안 돼|안돼|못 해|할 수 없|규칙/.test(t))return {q:'bad',f:flag};
 return t.length>=22?{q:'good'}:{q:'ok'};}
function rpSay(id,t,cl){const s=rpS(id),R=RPX(id);if(s.done)return;s.log.push({p:0,t,q:cl.q,f:cl.f,turn:s.i});render();
 setTimeout(()=>{s.log.push({p:1,t:R.turns[s.i].next});s.i++;if(s.i>=R.turns.length)s.done=true;if(cur().name==='edu_rp')render();},700);}

 <div class="row" style="gap:8px;margin-top:12px">${['#FFE8D6','#FFF1E2','#FDE7DA'].map(b=>`<div style="flex:1;aspect-ratio:1;border-radius:14px;background:${b};display:grid;place-items:center;color:#EE8424">${ic('heart',22)}</div>`).join('')}</div><div class="mute2" style="margin-top:6px">사진은 선생님과 학생이 모두 동의한 것만 남아요</div>

 <div class="card" style="margin-top:12px"><div class="b">정산 기록</div><div class="settle"><span class="muted">내 수강 (1.5시간 × 0.5, 30분 단위)</span><b style="color:#E5484D">−1.0시간</b><span class="muted">선생님 적립 (기관이 대신 받음)</span><b>+2.5시간</b><span class="muted">공동 적립</span><b>+2.5시간</b></div><div class="mute2" style="margin-top:6px">기관 대상 선생님의 적립 시간은 그분이 받는 무차감 도움으로 다시 돌아가요.</div></div>
 <button class="btn ghost" style="margin-top:14px" data-act="toastMsg" data-v="배움 노트를 가족에게 공유했어요 (시연)">가족에게 공유하기</button>`};};

/* 수업 열기: AI 인터뷰 */
let cn={msgs:[],step:0,d:{},org:false};
const CNQ=[null,['1시간','1시간 30분','2시간'],['4명, 재료는 기관에서','6명, 재료는 각자','3명, 재료는 제가 준비'],['다음 주 토요일 오전','다음 주 수요일 오후']];
function cnReset(){cn.msgs=[{a:1,t:cn.org?'어르신께 여쭤본 내용을 적어 주세요. 어떤 걸 가르쳐 주고 싶어 하세요?':'어떤 걸 가르쳐 주고 싶으세요? 편하게 말씀해 주세요. 제가 수업 계획으로 정리해 드릴게요.'}];cn.step=0;cn.d={};cn.blocked=false;}
function cnKind(t){return /김치|깍두기|찌개|반찬|요리|떡|전|국|장 담/.test(t)?'요리':/뜨개|바느질|목도리|수선|재봉|자수/.test(t)?'손재주':/노래|이야기|옛날|고향|사진/.test(t)?'노래·이야기':/폰|키오스크|카톡|컴퓨터|앱/.test(t)?'디지털':'생활 지혜';}
const CN_T={'요리':[['재료 손질 보기',2],['양념·재료 알아보기',3],['같이 만들기',5],['맛보고 담기',2],['보관법 듣기',1]],'손재주':[['재료와 도구 알아보기',1],['기본기 따라 하기',2],['한 단계씩 해 보기',4],['마무리와 다음 숙제',1]],'노래·이야기':[['인사하고 고향 소개',1],['그 시절 사진·노래 같이 보기',2],['이야기 듣고 질문하기',2],['한 줄씩 기록 남기기',1]],'디지털':[['화면 구성 알아보기',1],['따라 하기',2],['혼자 해 보기',2],['질문 시간',1]],'생활 지혜':[['도구 알아보기',1],['시범 보기',2],['직접 해 보기',3],['정리하고 질문',1]]};
function cnSay(t){cn.msgs.push({a:0,t});
 if(cn.step===0){if(/침|뜸|마사지|민간요법|약초|투자|주식|코인|보험|전도|교회|포교|판매|팔아/.test(t)){cn.blocked=true;cn.msgs.push({card:`<div class="ai warn"><div class="ah">${spk}이 수업은 열 수 없어요${M(2)}</div><div class="small">${/침|뜸|마사지|민간요법|약초/.test(t)?'몸에 직접 하는 시술이나 민간요법은 다칠 수 있어서 수업으로 열 수 없어요.':/투자|주식|코인|보험/.test(t)?'투자·보험 권유는 금전 피해가 생길 수 있어 수업으로 열 수 없어요.':'종교 활동이나 물건 판매는 수업으로 열 수 없어요.'}</div><div class="small muted" style="margin-top:6px">요리, 손재주, 옛날 이야기, 생활 지혜 같은 수업은 언제든 환영이에요.</div></div>`});render();return;}
  cn.d.topic=t;cn.d.kind=cnKind(t);setTimeout(()=>{cn.msgs.push({a:1,t:`좋아요! ${cn.d.kind} 수업이네요. 수업은 얼마나 걸릴까요? 처음 해 보는 사람 기준으로요.`});cn.step=1;render();},500);}
 else if(cn.step===1){cn.d.h=/2시간/.test(t)?2:/30분|반/.test(t)?1.5:1;setTimeout(()=>{cn.msgs.push({a:1,t:'몇 명까지 함께하면 좋을까요? 재료는 누가 준비하나요?'});cn.step=2;render();},500);}
 else if(cn.step===2){const m=t.match(/(\d)명/);cn.d.cap=m?+m[1]:4;cn.d.items=/기관/.test(t)?'재료는 기관에서 준비해요':/각자/.test(t)?'재료는 각자 가져와요':'재료는 선생님이 준비해요 (준비 시간 1시간 인정)';setTimeout(()=>{cn.msgs.push({a:1,t:'언제가 좋으세요? 장소는 담당자가 주민센터나 경로당 공간으로 잡아 드려요.'});cn.step=3;render();},500);}
 else if(cn.step===3){cn.d.date=/수요일/.test(t)?'11/19(수)':'11/22(토)';cn.d.s=/오후/.test(t)?14:10;cn.msgs.push({a:1,t:'잠깐만요, 수업 계획으로 정리해 볼게요.'});cn.step=4;render();
  setTimeout(()=>{cn.msgs.push({card:cnCard()});render();},1000);}
 render();}
function cnCard(){const d=cn.d,unit=d.h*60,tpl=CN_T[d.kind],w=tpl.reduce((a,b)=>a+b[1],0);d.steps=tpl.map(([t,x])=>[t,Math.max(5,Math.round(unit*x/w/5)*5)]);
 d.title=d.topic.replace(/\s*(알려 ?주고 싶어요?|가르쳐 ?주고 싶어요?|하는 법|들려주기)$/,'').trim();d.caution=d.kind==='요리'?'칼과 불을 쓰니 조심해 주세요. 알레르기가 있으면 미리 알려 주세요.':d.kind==='손재주'?'바늘·가위에 다치지 않게 조심해요.':'특별한 주의사항은 없어요.';d.lv=d.kind==='요리'?'주의':'허용';
 return `<div class="ai"><div class="ah">${spk}AI가 정리한 수업${M(1)}</div><div class="b" style="font-size:17px">${d.title}</div><div class="mute2">${d.kind} · ${fmt(d.h)}시간 · 최대 ${d.cap}명 · ${d.date} ${ap(d.s)}</div>
 <ol class="curri" style="margin-top:8px">${d.steps.map(([t,m])=>`<li>${t}<span>${m}분</span></li>`).join('')}</ol>
 <dl class="kv"><dt>준비물</dt><dd>${d.items}</dd><dt>주의</dt><dd>${d.caution}</dd><dt>판단</dt><dd><span class="st ${d.lv==='허용'?'ok':'wait'}">${d.lv}</span></dd></dl>
 <div class="settle" style="border-top:1px solid var(--line);padding-top:10px"><span class="muted">${cn.org?'어르신':'내'} 적립 (수업 + 준비)</span><b style="color:var(--brand)">+${fmt(d.h+1)}시간</b><span class="muted">학생 1명 수강</span><b>−${fmt(d.h*0.5)}시간</b></div>
 <div class="btns" style="margin-top:12px"><button class="btn ghost sm" data-act="cnReset">다시 할래요</button><button class="btn sm" data-act="cnPublish">확인하고 올리기</button></div></div>`;}
SCREENS.cls_new=()=>{if(!cn.msgs.length)cnReset();const qs=cn.blocked?[]:cn.step===0?['우리 어머니께 배운 깍두기 담그는 법','뜨개질로 목도리 뜨기','옛날 동네 이야기 들려주기','침 놓는 법 알려 주고 싶어']:CNQ[cn.step]||[];const done=cn.msgs.some(m=>m.card)&&!cn.blocked;
 let first=true;const msgs=cn.msgs.map(m=>{if(m.card)return `<div class="mrow"><span class="bot">${LOGO}</span><div class="mcol wide">${m.card}</div></div>`;if(m.a){const n=first?'<div class="bot-n">수업 도우미</div>':'';first=false;return `<div class="mrow"><span class="bot">${LOGO}</span><div class="mcol">${n}<div class="msg ai-m">${m.t}</div></div></div>`;}return `<div class="msg me">${m.t}</div>`;}).join('');
 return{title:cn.org?'어르신 대신 수업 열기':'수업 열기',noTabs:true,cls:'chatv',html:`<div class="chat-wrap"><div class="chat-day"><span>AI가 묻고 수업 계획을 정리해요 · ${MODS[1]}</span></div><div class="chat">${msgs}</div></div>
 <div class="chat-dock">${done||cn.step===4?'':`<div class="qr-row"><div class="qr">${qs.map(q=>`<button data-act="cnSay" data-v="${esc(q)}">${q}</button>`).join('')}</div><button class="qr-reset" data-act="cnReset">↺ 처음부터</button></div><form class="composer" data-form="cn"><button type="button" class="mic" data-act="voice" data-v="cn" aria-label="음성">${I.mic}</button><input class="in" id="cnin" placeholder="말하듯 적어 주세요"><button type="submit" aria-label="보내기">${I.send}</button></form>`}</div>`,mount(){const b=$('#bd');b.scrollTop=b.scrollHeight;}};};

/* 모양만 QR인 시연용 패턴 (seed가 바뀌면 무늬도 바뀜) */
function qrSvg(seed){const N=25;let h=2166136261;for(const ch of String(seed)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
 const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%1000)/1000;};
 const fin=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
 let cells='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(fin(x,y))continue;if(rnd()<.48)cells+=`M${x+2} ${y+2}h1v1h-1z`;}
 const eye=(x,y)=>`<rect x="${x+2.5}" y="${y+2.5}" width="6" height="6" rx="1.2" fill="none" stroke="#1B1D22"/><rect x="${x+4}" y="${y+4}" width="3" height="3" rx=".5" fill="#1B1D22"/>`;
 return `<svg viewBox="0 0 ${N+4} ${N+4}" shape-rendering="crispEdges" aria-label="QR 코드"><rect width="${N+4}" height="${N+4}" fill="#fff"/><path d="${cells}" fill="#1B1D22"/>${eye(0,0)}${eye(N-7,0)}${eye(0,N-7)}</svg>`;}

const qrTm=(h,add=0)=>{const t=Math.round(h*60)+add;return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;};
const qrDur=m=>`${Math.floor(m/60)?Math.floor(m/60)+'시간 ':''}${m%60?m%60+'분':''}`.trim()||'0분';
/* 시연 시계: r.clk = 약속 시작 기준 지난 분(음수면 시작 전). 없으면 기본값
   - 시작: 기본 2분 뒤 도착 / 10분↑ 지각 / 30분↑ 노쇼 의심(자동 알림)
   - 종료: 기본 예정 종료 4분 뒤 / 예정 종료 30분↑ 지나도 종료 QR 없으면 예정 시각으로 자동 마감 */

 if(m==='in'){const off=r.clk!=null&&r.clk>0?r.clk:2;r.chk=1;r.inMin=off;r.inT=qrTm(r.s,off);r.inBy=by;r.late=off>=NS_LATE?off:0;}
 else{const out=by==='auto'?end:(r.clk!=null&&r.clk>end?r.clk:end+4);r.chk=2;r.outT=qrTm(r.s,Math.max(out,(r.inMin||0)+1));r.outBy=by;r.mins=Math.max(1,out-(r.inMin||2));}}

 if(k===0) return `${head}${qrSteps(0)}<button class="btn big-cta" style="margin-top:12px" data-act="qrScan" data-v="${r.id}" data-m="in">${ic('qr',22)} 시작 QR 찍기</button><div class="mute2 center" style="margin-top:8px">도착하면 ${who}를 찍어 주세요. 담당자${r.elder?'':'·받는 분'}에게 시작 알림이 가요</div>${c>=NS_LATE?`<button class="btn ghost sm" style="margin-top:10px" data-act="checkIn" data-v="${r.id}">${ic('pin',16)} QR이 안 되면 위치로 체크인</button>`:`<div class="btns" style="margin-top:10px"><button class="btn ghost sm" data-act="checkIn" data-v="${r.id}">${ic('pin',16)} 위치로 체크인</button><button class="btn ghost sm" data-act="rCancel" data-v="${r.id}">일정 취소</button></div><div class="mute2 center" style="margin-top:6px">QR이 안 찍히면 위치로 체크인해요 · 일정 취소는 24시간 전까지 무료</div>`}`;
 if(k===1) return `${head}${qrSteps(1)}<div class="chk on"><span class="dotp"></span><div class="grow"><b>활동 중</b> · ${r.inT} 시작 <span class="qr-by">${r.inBy==='qr'?'QR 확인':'위치 확인'}</span>${r.late?` <span class="qr-by late">지각 ${r.late}분</span>`:''}<div class="mute2">예정 종료 ${hh(r.s+r.h)} · 끝나면 ${who}를 한 번 더 찍어 주세요</div></div></div><div class="btns" style="margin-top:10px"><button class="btn warn" data-act="sos">${ic('bell',18)} 긴급</button><button class="btn" data-act="qrScan" data-v="${r.id}" data-m="out">${ic('qr',18)} 종료 QR 찍기</button></div><button class="au-demo" style="margin-top:6px" data-act="checkOut" data-v="${r.id}">QR이 안 찍혀요 · 버튼으로 마치기</button>`;
 return `${qrSteps(2)}<div class="chk"><span class="dotp" style="background:#1F9D63;animation:none;box-shadow:none"></span><div class="grow"><b>활동 끝</b> · ${r.inT} ~ ${r.outT} (${qrDur(r.mins)})<div class="mute2">${r.outBy==='auto'?`종료 QR이 없어 예정 종료 시각으로 자동 마감했어요. ${to}${r.elder?'가':'이'} 확인하면 정산돼요`:r.inBy==='qr'&&r.outBy==='qr'?'QR로 기록된 시간이 일지에 자동으로 들어가요':'QR이 아닌 방법으로 기록돼 받는 분이 시간을 한 번 더 확인해요'}</div></div></div><button class="btn big-cta" style="margin-top:10px" data-go="log_write" data-id="${r.id}">활동 일지 쓰기</button>`;}

function qrRecvBlock(r){const k=r.chk||0,v=nm(r.vol),c=qrNow(r);
 if(k===0&&c>=NS_MISS) return `${demoClockBtn(r)}${alertBox('bad',`${v} 님이 아직 오지 않았어요`,`약속 시간이 ${c}분 지났는데 시작 QR이 없어요. 사정이 있을 수 있으니 메시지를 먼저 보내 보세요.`)}${r.waiting?`<div class="notice" style="margin-top:10px">조금 더 기다리기로 했어요. ${v} 님에게 알렸어요.</div>`:''}<div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="nsWait" data-v="${r.id}">조금 더 기다릴게요</button><button class="btn warn" data-act="nsReport" data-v="${r.id}">노쇼 신고·취소</button></div><div class="mute2 center" style="margin-top:8px">취소하면 보류된 ${fmt(r.h)}시간이 바로 돌아와요</div>`;
 if(k===0&&c>=NS_LATE) return `${demoClockBtn(r)}${alertBox('warn',`약속 시간이 ${c}분 지났어요`,`${v} 님이 아직 시작 QR을 찍지 않았어요. ${NS_MISS}분이 지나면 다시 알려 드려요.`)}<button class="btn big-cta" style="margin-top:10px" data-act="qrShow" data-v="${r.id}">${ic('qr',22)} 내 QR 보여주기 (시작)</button>`;
 if(k===0) return `${demoClockBtn(r)}<div class="card" style="margin-top:16px"><div class="row" style="gap:12px"><span class="qr-ic">${ic('qr',22)}</span><div class="grow"><div class="b">${v} 님이 도착하면 내 QR을 보여 주세요</div><div class="mute2">QR을 찍어야 활동 시간이 기록돼요. 끝날 때도 한 번 더 보여 주세요</div></div></div></div><button class="btn big-cta" style="margin-top:10px" data-act="qrShow" data-v="${r.id}">${ic('qr',22)} 내 QR 보여주기 (시작)</button>`;
 if(k===1) return `${demoClockBtn(r)}<div class="chk on"><span class="dotp"></span><div class="grow"><b>${v} 님 도착</b> · ${r.inT} 시작<div class="mute2">끝나면 종료 QR을 보여 주세요 · 예정 종료 ${hh(r.s+r.h)}</div></div></div><div class="btns" style="margin-top:10px"><button class="btn warn" data-act="sos">${ic('bell',18)} 긴급</button><button class="btn" data-act="qrShow" data-v="${r.id}">${ic('qr',18)} 내 QR 보여주기 (종료)</button></div>`;
 return `<div class="chk"><span class="dotp" style="background:#1F9D63;animation:none;box-shadow:none"></span><div class="grow"><b>활동 끝</b> · ${r.inT} ~ ${r.outT} (${qrDur(r.mins)})<div class="mute2">${r.outBy==='auto'?'종료 QR이 없어 예정 시각으로 자동 마감했어요. ':''}${v} 님이 일지를 올리면 확인해 주세요. 확인하면 시간이 정산돼요</div></div></div>`;}

/* 카메라 화면 (시연: 1.6초 뒤 자동 인식) */
let _qrT=[];
function qrScanner(title,sub,target,onDone,foot=''){_qrT.forEach(clearTimeout);_qrT=[];
 sheet(`<h2>${title}</h2><p class="muted" style="margin:0">${sub}</p><div class="qr-cam" id="qrcam"><div class="qr-ghost">${qrSvg(target)}</div><div class="qr-frame"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><div class="qr-line"></div></div><div class="qr-okm">${ic('check',34)}</div><div class="qr-hint" id="qrhint">QR을 네모 안에 맞춰 주세요</div></div>${foot}<button class="btn ghost" style="margin-top:8px" data-act="closeSheet">닫기</button>`);
 _qrT.push(setTimeout(()=>{const c=$('#qrcam');if(!c)return;c.classList.add('ok');$('#qrhint').textContent='확인됐어요';if(navigator.vibrate)navigator.vibrate(40);
  _qrT.push(setTimeout(()=>{if(!$('#qrcam'))return;closeSheet();onDone();},700));},1600));}

/* 내 QR 띄우기 (30초마다 새로 바뀜) */
let _qrI=null;
function qrShowSheet(title,sub,seedBase,demoBtn){clearInterval(_qrI);let left=30,n=0;
 sheet(`<h2>${title}</h2><p class="muted" style="margin:0">${sub}</p><div class="qr-show"><div class="qr-box" id="qrbox">${qrSvg(seedBase+0)}</div><div class="qr-timer"><i id="qrbar"></i></div><div class="mute2" id="qrleft">30초 뒤 새 QR로 바뀌어요 · 캡처한 QR은 쓸 수 없어요</div></div>${demoBtn}<button class="btn ghost" style="margin-top:8px" data-act="closeSheet">닫기</button>`);
 _qrI=setInterval(()=>{const b=$('#qrbox');if(!b||!$('#ov').classList.contains('on')){clearInterval(_qrI);return;}left--;if(left<=0){left=30;n++;b.innerHTML=qrSvg(seedBase+n);}
  $('#qrbar').style.width=(left/30*100)+'%';$('#qrleft').textContent=`${left}초 뒤 새 QR로 바뀌어요 · 캡처한 QR은 쓸 수 없어요`;},1000);}

D.cls.att={};
function clsQrBlock(c){const a=D.cls.att[c.id]||{},cost=fmt(clCost(c));
 if(!a.in) return `<div class="btns"><button class="btn ghost" data-act="clsCancel" data-id="${c.id}">신청 취소</button><button class="btn" data-act="qrClsScan" data-id="${c.id}" data-m="in">${ic('qr',20)} 출석 QR 찍기</button></div><div class="mute2 center" style="margin-top:8px">수업 시작 때 선생님 화면이나 교실 입구의 QR을 찍어요<br>시연: 수업 날이 아니어도 찍어 볼 수 있어요</div>`;
 if(!a.out) return `<div class="chk on" style="margin-top:0"><span class="dotp"></span><div class="grow"><b>출석 완료</b> · ${a.in} <span class="qr-by">QR 확인</span><div class="mute2">묶여 있던 ${cost}시간이 정산됐어요 · 끝날 때 마침 QR을 찍어 주세요</div></div></div><button class="btn" style="margin-top:10px" data-act="qrClsScan" data-id="${c.id}" data-m="out">${ic('qr',20)} 마침 QR 찍기</button>`;
 return `<div class="chk" style="margin-top:0"><span class="dotp" style="background:#1F9D63;animation:none;box-shadow:none"></span><div class="grow"><b>수강 완료</b> · ${a.in} ~ ${a.out}<div class="mute2">끝까지 들었어요. 선생님께 ${fmt(c.h+1)}시간이 적립돼요</div></div></div><button class="btn soft" style="margin-top:10px" data-act="toastMsg" data-v="후기를 남겼어요 (시연)">후기 남기기</button>`;}

Object.assign(ACT,{
 qrScan(el){const r=RR(el.dataset.v),m=el.dataset.m,who=qrWho(r);
  qrScanner(m==='in'?'시작 QR 찍기':'종료 QR 찍기',`${who}를 화면 네모 안에 맞춰 주세요. 위치도 함께 확인하고 저장하지 않아요.`,r.id+m,()=>{qrMark(r,m,'qr');render();toast(m==='in'?`${r.inT} 시작을 기록했어요. ${r.elder?'담당자':nm(r.recv)+' 님'}에게 알렸어요`:`${r.inT}~${r.outT} 기록 완료! 일지를 써 주세요`);},
  `<div class="mute2 center" style="margin-top:4px">${r.elder?'카드가 안 보이면 담당자에게 메시지로 알려 주세요':'상대방이 휴대폰 화면 밝기를 높이면 잘 찍혀요'}</div>`);},
 qrShow(el){const r=RR(el.dataset.v),k=r.chk||0;
  qrShowSheet(k===0?'시작 QR':'종료 QR',`${nm(r.vol)} 님에게 이 화면을 보여 주세요.`,r.id+(k===0?'in':'out'),`<button class="au-demo" style="margin-top:12px" data-act="qrShowDone" data-v="${r.id}">시연: ${nm(r.vol)} 님이 찍었어요</button>`);},
 qrShowDone(el){const r=RR(el.dataset.v),m=(r.chk||0)===0?'in':'out';clearInterval(_qrI);closeSheet();qrMark(r,m,'qr');render();toast(m==='in'?`${nm(r.vol)} 님이 ${r.inT}에 도착했어요`:`${r.inT}~${r.outT} 활동이 끝났어요`);},
 qrCard(el){const e=EL(el.dataset.v);
  sheet(`<h2>현관 QR 카드</h2><p class="muted" style="margin:0">${e.alias} 댁 현관 안쪽에 붙여 두는 카드예요. 메이트가 도착·종료할 때 찍어요.</p><div class="qr-card"><div class="b" style="font-size:15px">시간 적금 · 활동 확인 카드</div><div class="qr-box" style="margin:10px auto">${qrSvg(e.id+'card'+_qrCardN)}</div><div class="mute2">메이트: 시작할 때 한 번, 끝날 때 한 번 찍어 주세요</div><div class="mute2" style="margin-top:2px">카드 번호 ${e.id.toUpperCase()}-${String(1042+_qrCardN)}</div></div><div class="notice" style="margin-top:10px">카드에는 주소·이름이 들어 있지 않아요. 잃어버리면 재발급하세요 — 예전 카드는 바로 못 쓰게 돼요.</div><div class="btns" style="margin-top:12px"><button class="btn ghost" data-act="qrCardRe" data-v="${e.id}">재발급</button><button class="btn" data-act="toastMsg" data-v="인쇄 화면을 열었어요 (시연)">인쇄하기</button></div>`);},
 qrCardRe(el){_qrCardN=(_qrCardN||0)+1;ACT.qrCard(el);toast('새 카드를 만들었어요. 예전 카드는 막혔어요');},
 qrClsScan(el){const c=CLX(el.dataset.id),m=el.dataset.m;
  qrScanner(m==='in'?'출석 QR 찍기':'마침 QR 찍기',`${c.place||'교실'} · 선생님 화면이나 입구의 QR을 찍어 주세요.`,c.id+m,()=>{const a=D.cls.att[c.id]=D.cls.att[c.id]||{};
   if(m==='in'){a.in=qrTm(c.s,1);const cost=clCost(c);D.me.hold-=cost;D.me.bal-=cost;D.me.mOut+=cost;D.L.unshift({d:'11/9',t:`클래스 수강 · ${c.t}`,base:c.h,w:.5,v:-cost,k:'사용'});render();toast(`출석했어요. ${fmt(cost)}시간이 정산됐어요`);}
   else{a.out=qrTm(c.s+c.h,3);render();toast('수업을 끝까지 들었어요. 수고하셨어요!');}});},
 qrClsShow(el){const c=CLX(el.dataset.id);
  qrShowSheet('출석 QR',`${c.t} · 수강생이 들어올 때와 끝날 때 이 QR을 찍어요.`,c.id+'t',`<div class="sum" style="margin-top:12px"><div class="between"><span class="muted">출석</span><b>0/${c.joined}명</b></div><div class="between"><span class="muted">끝까지 들은 사람</span><b>0명</b></div></div><div class="mute2 center" style="margin-top:6px">출석한 사람 수가 실시간으로 늘어나요 (시연)</div>`);},
 demoClock(el){const r=RR(el.dataset.v),k=r.chk||0,end=Math.round(r.h*60),c=qrNow(r);
  const opts=k===0?[[-15,'약속 15분 전','평소 상태'],[12,'약속 12분 지남','지각 안내가 떠요'],[35,'약속 35분 지남','노쇼 의심 · 자동 알림']]
   :[[Math.max((r.inMin||0)+5,end-20),'종료 20분 전','활동 중'],[end+10,'예정 종료 10분 지남','종료 QR 안내가 떠요'],[end+40,'예정 종료 40분 지남','종료 QR 누락 · 자동 마감']];
  sheet(`<h2>시연 시계</h2><p class="muted" style="margin:0 0 10px">시간을 옮겨 지각·노쇼·종료 누락 상황을 미리 볼 수 있어요.</p>${opts.map(([v,t,s])=>`<div class="opt ${v===c?'on':''}" data-act="demoClockSet" data-v="${r.id}" data-m="${v}"><span class="rd"></span><div class="grow"><div class="b">${t} · ${qrTm(r.s,v)}</div><div class="mute2">${s}</div></div></div>`).join('')}`);},
 demoClockSet(el){const r=RR(el.dataset.v),v=+el.dataset.m,k=r.chk||0,end=Math.round(r.h*60);closeSheet();r.clk=v;
  if(k===0&&v>=NS_MISS){qrNoShowNotify(r);render();return toast(r.vol==='me'?`${r.elder?'담당자':nm(r.recv)+' 님'}에게 도착 지연을 알렸어요`:`${nm(r.vol)} 님이 아직 안 왔어요. 알림을 보냈어요`);}
  if(k===1&&v>=end+END_GRACE){qrMark(r,'out','auto');r.msgs.push({f:'sys',t:`종료 QR이 없어 ${hh(r.s+r.h)}로 자동 마감했어요.`});render();return toast('종료 QR이 없어 예정 시각으로 자동 마감했어요');}
  render();},
 lateNotify(el){const r=RR(el.dataset.v);r.msgs.push({f:'me',t:`조금 늦어요. ${qrTm(r.s,qrNow(r)+10)}쯤 도착할게요. 죄송해요!`,d:'방금'});render();toast('늦는다고 알렸어요');},
 nsWait(el){const r=RR(el.dataset.v);r.waiting=1;r.msgs.push({f:'sys',t:'받는 분이 조금 더 기다리기로 했어요.'});render();toast(`${nm(r.vol)} 님에게 알렸어요`);},
 nsReport(el){const r=RR(el.dataset.v);confirmSheet('노쇼로 신고하고 취소할까요?',`${nm(r.vol)} 님이 약속 ${qrNow(r)}분이 지나도록 오지 않았어요. 취소하면 보류된 ${fmt(r.h)}시간이 바로 돌아오고, 운영팀이 사실을 확인해요.`,'신고·취소',()=>{r.st='canceled';D.me.hold=Math.max(0,D.me.hold-r.h);r.msgs.push({f:'sys',t:'노쇼 신고로 일정이 취소됐어요.'});D.reports.unshift({t:'노쇼',target:`${nm(r.vol)} (봉사)`,st:'검토 중',d:'11/9'});render();toast(`취소했어요. ${fmt(r.h)}시간이 돌아왔어요`);},true);},
});
let _qrCardN=0;

nav.stack=[{name:'splash',p:{}}];render();


</script>
</body>
</html>
