<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시간 적금 · 웹앱 (담당자·운영자)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--brand:#5B8DEF;--pri-soft:#EEF3FF;--fill:#F6F7F9;--line:#F0F1F4;--ink:#1B1D22;--sub:#5F6672;--mute:#9AA1AC;
--give:#6DB3A0;--give-s:#E9F6F1;--recv:#6F9CF0;--recv-s:#E8F0FE;--org:#4FAE96;--org-s:#E6F4F0;--admin:#E0A23E;--admin-s:#FCF3E3;
--red:#E5655B;--red-s:#FDECEA;--amber:#D9962B;--amber-s:#FCF3E3;--acc:var(--give);--acc-s:var(--give-s)}
*{box-sizing:border-box}
body{margin:0;background:#E7EAF0;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
/* 상단 시연 도구 */
.tool{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid #DDE1E8}
.tool b{font-size:13px;margin-right:4px}
.tool .rl{padding:6px 12px;border-radius:8px;background:var(--fill);font-size:13px;font-weight:600;color:var(--sub)}
.tool .rl.on{background:var(--ink);color:#fff}
.tool select{padding:6px 8px;border:1px solid #DDE1E8;border-radius:8px;background:#fff;font-size:13px;max-width:260px}
.tool .sid{font-size:12px;color:var(--mute);font-family:ui-monospace,Menlo,monospace}
.stage{display:flex;justify-content:center;padding:24px 16px 48px}
/* 폰 프레임 */
.phone{width:390px;height:844px;background:#fff;border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(20,30,60,.18);border:8px solid #1B1D22}
@media (max-width:430px){.stage{padding:0}.phone{width:100%;height:calc(100vh - 54px);border-radius:0;border:0}}
.hd{flex:none;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.hd h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h2{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;position:relative}
.hd .ic .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.tg{display:flex;background:var(--fill);border-radius:999px;padding:3px;flex:none}
.tg button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mute)}
.tg button.on.g{background:var(--give);color:#fff}
.tg button.on.r{background:var(--recv);color:#fff}
.bd{flex:1;overflow-y:auto;padding:16px 16px 24px;background:#fff;position:relative}
.bd.gray{background:var(--fill)}
.tb{flex:none;height:64px;display:flex;border-top:1px solid var(--line);background:#fff}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mute);font-weight:600}
.tb button i{font-style:normal;font-size:19px;filter:grayscale(1);opacity:.55}
.tb button.on{color:var(--ink)}
.tb button.on i{filter:none;opacity:1}
/* 공통 요소 */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.gray .card{border-color:transparent}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--fill)}
.sec{font-size:16px;font-weight:700;margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between}
.sec:first-child{margin-top:0}
.sec a,.lk{font-size:13px;color:var(--sub);font-weight:500;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mu{color:var(--mute);font-size:12px}
.su{color:var(--sub);font-size:13px}
.t{font-weight:700;font-size:15px}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px}
.btn.pri{background:var(--acc);color:#fff}
.btn.sec2{background:var(--fill);color:var(--ink)}
.btn.line{border:1px solid #DDE1E8;background:#fff}
.btn.red{background:var(--red-s);color:var(--red)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.w{width:100%}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.sticky{position:sticky;bottom:-24px;margin:16px -16px -24px;padding:12px 16px 16px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 22%)}
.gray .sticky{background:linear-gradient(to bottom,rgba(246,247,249,0),var(--fill) 22%)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
button.chip.on,.chip.on{background:var(--ink);color:#fff}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--fill);color:var(--sub);white-space:nowrap}
.tag.g{background:var(--give-s);color:#3E8C77}.tag.b{background:var(--recv-s);color:#3F6FCB}.tag.r{background:var(--red-s);color:var(--red)}.tag.a{background:var(--amber-s);color:#A8701A}.tag.k{background:var(--ink);color:#fff}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--acc-s);color:var(--ink);flex:none;font-size:15px}
.av.s{width:32px;height:32px;font-size:13px}
.av.l{width:56px;height:56px;font-size:20px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--sub)}
.in{width:100%;height:48px;border:1px solid #DDE1E8;border-radius:12px;padding:0 14px;background:#fff;outline:none}
.in:focus{border-color:var(--acc)}
textarea.in{height:96px;padding:12px 14px;resize:none}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .ar{color:var(--mute)}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.kv span:first-child{color:var(--sub)}
.kv b{font-weight:700}
.hr{height:1px;background:var(--line);margin:12px 0}
.note{background:var(--fill);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--sub)}
.warn{background:var(--amber-s);border-radius:12px;padding:12px 14px;font-size:13px;color:#8A5B12}
.danger{background:var(--red-s);border-radius:12px;padding:12px 14px;font-size:13px;color:#B5443B}
.empty{text-align:center;color:var(--mute);padding:28px 0;font-size:13px}
.sw{width:44px;height:26px;border-radius:13px;background:#D7DBE2;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{flex:none}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.dotr{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
/* AI 카드: 항상 같은 모양 */
.ai{border-radius:16px;padding:16px;margin-bottom:12px;background:#F2FAF6;border:1px solid #E2DCFB}
.ai-h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:#5B48C8;margin-bottom:8px}
.ai-r{margin-top:10px;padding-top:10px;border-top:1px dashed #D6CEF7;font-size:12px;color:#7A6DB8}
.ai .card{border-color:#E7E2FB}
.ai-btn{background:#6B57D6!important;color:#fff!important}
.ld{display:flex;align-items:center;gap:10px;color:#5B48C8;font-weight:600;font-size:13px}
.ld i{width:16px;height:16px;border:2px solid #CFC6F5;border-top-color:#6B57D6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 단계 바 */
.steps{display:flex;gap:4px;margin:4px 0 6px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--acc)}
.stl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute)}
.stl span.on{color:var(--ink);font-weight:700}
/* 채팅 */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 13px;border-radius:16px;font-size:14px;background:var(--fill);align-self:flex-start;border-top-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--acc);color:#fff;border-radius:16px;border-top-right-radius:4px}
.msg.bot{background:#F1EEFF}
/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .w{font-size:11px;color:var(--mute);padding:4px 0}
.cal button{height:40px;border-radius:10px;font-size:13px;position:relative}
.cal button.on{background:var(--ink);color:#fff;font-weight:700}
.cal button.td{font-weight:800;color:var(--acc)}
.cal button.on.td{color:#fff}
.cal button .d{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--acc)}
/* 시트 */
.ov{position:absolute;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:flex-end;z-index:30;animation:fi .15s}
.sh{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:10px 20px 24px;max-height:86%;overflow-y:auto;animation:su .2s}
.sh .gr{width:40px;height:4px;border-radius:2px;background:#DDE1E8;margin:0 auto 14px}
.sh h3{margin:0 0 14px;font-size:18px}
@keyframes su{from{transform:translateY(40px);opacity:.6}}
@keyframes fi{from{opacity:0}}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(27,29,34,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:40;white-space:nowrap;animation:fi .2s}
/* 표 */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--sub);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--fill);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.sel td{background:#FFF8EA}
.tbl tr.ck{cursor:pointer}
/* 편성표 */
.grid{display:grid;grid-template-columns:62px repeat(5,1fr);gap:3px;font-size:10.5px}
.grid .h{text-align:center;color:var(--sub);font-weight:700;padding:4px 0}
.grid .n{font-weight:700;font-size:12px;display:flex;flex-direction:column;justify-content:center}
.grid .c{border-radius:8px;min-height:54px;padding:4px;display:flex;flex-direction:column;gap:1px}
.grid .c.f{background:var(--org-s)}
.grid .c.x{background:var(--red-s);cursor:pointer;border:1px dashed #F0A79F}
.grid .c.e{background:var(--fill)}
.grid .c b{font-size:10.5px}
/* 운영자 웹 */
.desk{width:1240px;max-width:100%;height:800px;background:#fff;border-radius:16px;overflow:hidden;display:flex;box-shadow:0 20px 60px rgba(20,30,60,.16);position:relative}
.nav{width:220px;flex:none;background:#1F232B;color:#C9CED8;padding:20px 12px;overflow-y:auto}
.nav .lg{color:#fff;font-weight:800;font-size:17px;padding:0 10px 18px}
.nav .lg small{display:block;font-weight:500;font-size:12px;color:#8C93A1}
.nav button{display:flex;width:100%;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font-size:14px;color:#C9CED8;text-align:left}
.nav button.on{background:#333946;color:#fff;font-weight:700}
.nav .gp{font-size:11px;color:#6E7584;padding:14px 10px 6px;font-weight:700}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--fill)}
.mtop{height:60px;flex:none;display:flex;align-items:center;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);gap:12px}
.mtop h1{font-size:19px;margin:0;flex:1}
.mbd{flex:1;overflow-y:auto;padding:24px 28px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g21{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.desk .card{margin-bottom:16px}
.kpi .mu{font-size:13px}.kpi .big{margin-top:4px}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.hbar span:first-child{width:96px;color:var(--sub);flex:none}
.hbar .bar{flex:1;height:12px}
.hbar b{width:44px;text-align:right}
@media (max-width:900px){.desk{flex-direction:column;height:auto}.nav{width:100%;display:flex;flex-wrap:wrap;gap:4px}.nav .gp,.nav .lg{display:none}.nav button{width:auto}.g2,.g3,.g4,.g21{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer}
.lrow:hover{background:var(--fill)}.lrow.on{background:var(--acc-s)}
.dov{position:absolute;inset:0;background:rgba(15,20,30,.35);z-index:30;display:flex;justify-content:flex-end;animation:fi .15s}
.dov.c{align-items:center;justify-content:center}.dov.t{background:rgba(15,20,30,.08);align-items:flex-start}
.drw{width:480px;max-width:100%;height:100%;background:#fff;padding:24px;overflow-y:auto;display:flex;flex-direction:column;animation:sl .2s}
.drw .dbody{flex:1}.drw .ic,.mdl .ic{width:34px;height:34px;border-radius:10px;background:var(--fill)}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding-top:16px;border-top:1px solid var(--line);margin-top:16px}
.mdl{width:820px;max-width:94%;max-height:86%;background:#fff;border-radius:18px;padding:24px;overflow-y:auto}
.pop{margin:62px 150px 0 0;width:420px;background:#fff;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.18);padding:6px 18px 10px;max-height:70%;overflow-y:auto}
@keyframes sl{from{transform:translateX(40px);opacity:.6}}
.mtop .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;position:relative;background:var(--fill)}
.mtop .ic .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.prof{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:999px;background:var(--fill);font-weight:600;font-size:13px}
.grid.pc{grid-template-columns:96px repeat(5,1fr);gap:5px;font-size:12px}
.grid.pc .c{min-height:60px;padding:7px 8px;border-radius:10px}.grid.pc .c b{font-size:12.5px}.grid.pc .n{font-size:13px}
.grid.mini{grid-template-columns:64px repeat(5,1fr)}.grid.mini .c{min-height:30px;padding:5px 7px}
.grid .c.sel{outline:2px solid var(--red);outline-offset:1px}
.desk .sec{margin:4px 0 10px}
.tbl tr.ck:hover td{background:var(--fill)}
@media (max-width:900px){.split{grid-template-columns:1fr!important}.pop{margin:62px 8px 0}}
.kv span{white-space:nowrap;flex:none;margin-right:12px}
</style><style>/* ===== 웹앱 디자인 (시간 적금 모바일 프로토타입 디자인 이식) ===== */
:root{--ink:#1F2633;--sub:#5B6576;--mute:#9AA3B2;--line:#EEF1F5;--fill:#F4F6FA;--bd:#E3E8EF;--red:#E5655B;--red-s:#FDECEA}
body{background:#F3F5F9;letter-spacing:-.1px}
.tool{padding:8px 20px;gap:6px;justify-content:flex-start;border-bottom:1px solid #E6EAF0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px)}
.tool b{display:flex;align-items:center;gap:8px;font-size:14px;margin-right:10px}
.tool b .tl-lg{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#E8F0FE;color:#5B8DEF}
.tool b .tl-lg svg{width:16px;height:16px}
.tool .rl{border-radius:999px;padding:6px 14px;background:#F1F4F8;color:#6B7585}
.tool .rl.on[data-role=org]{background:#E2F3EC;color:#2F8069}
.tool .rl.on[data-role=admin]{background:#FCF0D9;color:#A6700F}
.tool select{border-radius:999px;border-color:#E3E8EF;padding:6px 12px;margin-left:auto}
.tool .sid{min-width:70px}
.stage{padding:0}
.desk{width:100%!important;max-width:none!important;height:calc(100vh - 51px)!important;border-radius:0!important;box-shadow:none!important;background:#F6F8FB}
.nav{width:236px;background:#fff!important;color:#6B7585!important;border-right:1px solid #E6EAF0;padding:18px 14px!important;display:flex;flex-direction:column}
.nav .lg{display:flex;align-items:center;gap:10px;color:#1F2633!important;font-size:16px!important;padding:2px 6px 18px!important;margin-bottom:6px;border-bottom:1px solid #EEF1F5}
.nav .lg .lg-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--acc-s);color:var(--acc-k);flex:none}
.nav .lg .lg-ic svg{width:22px;height:22px}
.nav .lg small{color:var(--acc-k)!important;font-weight:700!important;margin-top:1px}
.nav .gp{color:#A3ACBA!important;font-size:11.5px!important;padding:16px 10px 6px!important;letter-spacing:.2px}
.nav button{gap:11px!important;padding:10px 12px!important;border-radius:12px!important;color:#5B6576!important;font-weight:600;font-size:14.5px!important;margin-bottom:2px}
.nav button:hover{background:#F4F6FA}
.nav button.on{background:var(--acc-s)!important;color:var(--acc-k)!important;font-weight:800!important}
.nav button .ni{width:20px;height:20px;flex:none;display:grid;place-items:center}
.nav button .ni svg{width:19px;height:19px}
.nav button:last-child{margin-top:auto;color:#9AA3B2!important}
.main{background:#F6F8FB!important}
.mtop{height:68px!important;padding:0 32px!important;border-bottom:1px solid #EEF1F5!important}
.mtop h1{font-size:21px!important;letter-spacing:-.4px}
.mtop .ic{background:#F4F6FA!important;border-radius:12px!important;color:#5B6576}
.mtop .ic svg{width:19px;height:19px}
.prof{background:#F4F6FA!important;padding:3px 14px 3px 3px!important}
.mbd{padding:26px 32px 40px!important}
/* 카드: 모바일과 같은 반투명 흰색 + 연한 테두리 */
.card,.desk .card{background:rgba(255,255,255,.72)!important;border:1px solid var(--bd)!important;border-radius:20px!important}
.kpi{padding:18px 20px!important}
.kpi .big{font-size:26px!important;letter-spacing:-.6px;margin:6px 0 2px!important}
.kpi .mu:last-child{color:var(--acc-k);font-weight:700}
.sec{letter-spacing:-.3px}
/* AI 카드: 그라데이션·보라색 제거 → 역할 색 파스텔 */
.ai{background:var(--ai-bg)!important;border:1px solid var(--ai-bd)!important;border-radius:20px!important}
.ai-h{color:var(--acc-k)!important}
.ai-r{border-top:1px dashed var(--ai-bd)!important;color:#8A94A6!important}
.ai .card{background:rgba(255,255,255,.8)!important;border-color:var(--ai-bd)!important}
.ai-btn{background:var(--acc)!important}
.ld{color:var(--acc-k)!important}.ld i{border-color:var(--ai-bd)!important;border-top-color:var(--acc)!important}
.msg.bot{background:#F1F4F8!important}
/* 버튼·칩·세그먼트 */
.btn{border-radius:12px}
.btn.pri{background:var(--acc)!important;color:#fff}
.btn.sec2{background:#F1F4F8!important}
.btn.line{border-color:var(--bd)!important;background:rgba(255,255,255,.8)!important}
.chip{background:rgba(255,255,255,.72)!important;border:1px solid var(--bd);color:#5B6576!important}
button.chip.on,.chip.on{background:var(--acc-s)!important;color:var(--acc-k)!important;border-color:transparent!important;font-weight:800}
.seg{background:#EEF1F5!important;border-radius:14px!important}
.seg button.on{color:var(--acc-k)!important;box-shadow:0 1px 3px rgba(40,60,90,.08)!important}
.tag{border-radius:999px!important;padding:2px 9px!important}
.tag.k{background:#EEF1F5!important;color:#4A5262!important}
.in{border-color:var(--bd)!important;border-radius:12px;background:rgba(255,255,255,.85)!important}
.note{background:#F1F4F8!important}
.av{background:var(--acc-s)!important;color:var(--acc-k)!important;font-weight:800!important}
.lrow{border-radius:14px!important}.lrow.on{background:var(--acc-s)!important}
.lrow:hover{background:#F4F6FA}
.li{border-bottom-color:#EEF1F5!important}
.tbl th{background:#F6F8FB!important;color:#7C8696!important;font-weight:700}
.tbl td{border-bottom-color:#EEF1F5!important}
.tbl tr.sel td{background:var(--acc-s)!important}
.cal button.on{background:var(--acc)!important}
.grid .c{border-radius:12px!important}
.grid .c.e{background:#F1F4F8!important}
.bar{background:#EEF1F5!important}
.dov{background:rgba(31,38,51,.28)!important}
.drw{border-left:1px solid var(--bd);border-radius:24px 0 0 24px}
.mdl,.pop{border-radius:24px!important;border:1px solid var(--bd)}
.toast{background:rgba(31,38,51,.9)!important;border-radius:999px!important;padding:11px 18px!important}
.sw.on{background:var(--acc)!important}
/* 아이콘 */
.ei{display:inline-grid;place-items:center;width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.15em}
.ei svg{width:100%;height:100%}
.ei.spk{color:var(--acc-k)}
.dic{display:inline-grid;place-items:center;border-radius:30%;box-shadow:inset 0 0 0 1px var(--dk);vertical-align:middle;flex:none}
.dic.mini{border-radius:7px;margin-right:3px;vertical-align:-.35em}
.hd .ic svg{width:19px;height:19px}
@media (max-width:900px){.desk{height:auto!important}.nav{flex-direction:row}.nav button:last-child{margin-top:0}}
/* 차트 */
#ctip{position:fixed;left:0;top:0;z-index:999;pointer-events:none;opacity:0;transition:opacity .12s;background:#fff;border:1px solid #E3E8EF;border-radius:12px;padding:8px 11px;font-size:12.5px;color:#2A3140;box-shadow:0 8px 24px rgba(40,60,90,.14);white-space:nowrap}
#ctip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
#ctip div{margin-top:3px}
.lc .lc-hit line,.lc .lc-hit circle{opacity:0;transition:opacity .1s}
.lc .lc-hit:hover line,.lc .lc-hit:hover circle{opacity:1}
svg path[data-tip]:hover{filter:brightness(.94)}
.hbar .bar{height:10px!important;border-radius:999px!important;background:#EEF1F5!important}
.hbar .bar i{border-radius:999px!important}
.hbar b{font-variant-numeric:tabular-nums}
.dst{display:flex;gap:2px;height:12px;border-radius:999px;overflow:hidden;margin:12px 0 12px}
.dst i{display:block;min-width:4px}
.dst-l{display:grid;gap:7px}
.dst-l div{display:flex;align-items:center;gap:8px;font-size:13px;color:#4A5262}
.dst-l i{width:9px;height:9px;border-radius:3px;flex:none}
.dst-l span{flex:1}.dst-l b{font-variant-numeric:tabular-nums;color:#1F2633}
.wfill{margin-top:8px}
.wf-h{font-size:13px;font-weight:800;color:#9AA3B2;margin:10px 2px 10px;letter-spacing:.3px}
.wfill .g3{align-items:stretch}
.wcard2{margin-bottom:0!important;display:flex;flex-direction:column}
.wc-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.wc-h b{font-size:14.5px}.wc-h span{font-size:12px;color:#9AA3B2}
.wlog{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #EEF1F5;font-size:13px}
.wc-h+.wlog{border-top:0}
.wlog>i{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.wl-t{font-weight:700;color:#2A3140}.wl-s{font-size:12px;color:#9AA3B2}
.wlog>span{font-size:12px;color:#9AA3B2;flex:none}
/* 역할별 색: 툴바 */
.tool a.rl{background:#E8F0FE!important;color:#3A6FD8!important}
/* 캘린더 */
.cseg{display:flex;gap:2px;padding:3px;border-radius:12px;background:#EEF1F5;margin-right:10px}
.cseg button{height:32px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:700;color:#7C8696}
.cseg button.on{background:#fff;color:var(--acc-k);box-shadow:0 1px 3px rgba(40,60,90,.08)}
.ccal{padding:12px 14px 14px!important}
.cw-hd{display:grid;grid-template-columns:60px repeat(var(--cols),1fr);border-bottom:1px solid #EEF1F5;padding-bottom:8px}
.cw-d{display:flex;align-items:baseline;justify-content:center;gap:6px;cursor:pointer;padding:4px 0;border-radius:10px}
.cw-d span{font-size:12.5px;color:#9AA3B2;font-weight:700}.cw-d b{font-size:18px;color:#2A3140}
.cw-d:hover{background:#F4F6FA}
.cw-d.today b{background:var(--acc);color:#fff;border-radius:999px;min-width:30px;height:30px;display:inline-grid;place-items:center;font-size:15px}
.cw-d.today span{color:var(--acc-k)}
.cw-bd{display:grid;grid-template-columns:60px repeat(var(--cols),1fr);max-height:560px;overflow-y:auto;scrollbar-width:none;padding-top:6px}
.ct-h{position:relative;font-size:11px;color:#A3ACBA}.ct-h span{position:absolute;top:-7px;right:10px}
.cw-col{position:relative;border-left:1px solid #EEF1F5}
.cw-col.today{background:rgba(79,174,150,.035)}
.cw-cell{position:absolute;left:0;right:0;border-top:1px dashed #EEF1F5}
.cev{position:absolute;left:5px;right:5px;border-radius:12px;border:1px solid;padding:7px 9px;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:default;box-shadow:inset 3px 0 0 var(--ca)}
.cev:hover{box-shadow:inset 3px 0 0 var(--ca),0 6px 16px rgba(40,60,90,.1);z-index:2}
.ce-t{font-size:12.5px;font-weight:800;color:#1F2633;line-height:1.3}
.ce-s{font-size:11.5px;color:#6B7585}
.ce-alt{font-size:12px;line-height:1.45;margin-top:2px;color:#B05A47}
.ce-foot,.ce-tags{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:auto}
.ce-v{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:#4A5262;background:rgba(255,255,255,.75);border-radius:999px;padding:2px 8px 2px 2px}
.ce-av{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--ca);color:#fff;font-size:10px;font-weight:800}
.ce-tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.75);color:#6B7585}
.ce-tag.g{background:#E2F3EC;color:#2F8069}.ce-tag.r{background:#fff;color:#C25E48}
.cev.gap{background:repeating-linear-gradient(135deg,#FFF5F2 0 8px,#FDECE6 8px 16px);border:1.5px dashed #EFA898;cursor:pointer;box-shadow:none}
.cev.gap .ce-t{color:#B05A47}
.cev.gap.sel{border-style:solid;border-color:#D9705A;box-shadow:0 0 0 3px rgba(217,112,90,.15)}
.cnow{position:absolute;left:-1px;right:0;height:0;border-top:2px solid #D9705A;z-index:3}
.cnow i{position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#D9705A}
.cnow span{position:absolute;right:4px;top:-18px;font-size:10.5px;font-weight:800;color:#C25E48;background:#fff;padding:0 4px;border-radius:6px}
.cday-tabs{display:flex;gap:6px;margin-bottom:10px}
.cday-tabs button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;color:#6B7585;background:#F4F6FA}
.cday-tabs button.on{background:var(--acc-s);color:var(--acc-k)}
.cm-hd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;font-weight:700;color:#9AA3B2;text-align:center;padding:4px 0 8px}
.cm-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cm-c{min-height:92px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid #EEF1F5;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cm-c:hover{border-color:var(--acc)}
.cm-c.off{background:none;border:0;cursor:default}
.cm-c.we{background:#FAFBFC}.cm-c.we .cm-n{color:#B4BCC8}
.cm-n{font-size:12.5px;font-weight:800;color:#4A5262;margin:0 0 2px 2px}
.cm-c.today{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-s)}
.cm-c.today .cm-n{color:#fff;background:var(--acc);border-radius:999px;width:22px;height:22px;display:grid;place-items:center;margin:0}
.cm-e{font-size:11px;font-weight:700;color:#2A3140;padding:3px 6px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 2px 0 0 var(--ca)}
.cm-e.gap{background:#FFF1EC;color:#B05A47;border:1px dashed #EFA898;box-shadow:none}
.cm-more{font-size:11px;color:#9AA3B2;padding-left:4px}
.cleg{gap:16px!important;margin-top:12px}
.cleg i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid;margin-right:5px;vertical-align:-1px}
.cleg i.g{background:#FFF5F2;border:1.5px dashed #EFA898}
/* 모바일 보기 */
.mstage{position:relative;display:flex;justify-content:center;align-items:center;height:calc(100vh - 51px);padding:12px;background:#EEF1F6}
.mphone{height:100%;aspect-ratio:430/900;max-width:100%;min-width:360px;border-radius:40px;background:#1F2633;padding:7px;box-shadow:0 24px 60px rgba(40,60,90,.22)}
.mphone iframe{width:100%;height:100%;border:0;border-radius:34px;background:#fff;display:block}
.mside{position:absolute;right:24px;top:20px;width:220px;padding:16px;border-radius:20px;background:rgba(255,255,255,.75);border:1px solid #E3E8EF}
.ms-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.ms-dot{width:10px;height:10px;border-radius:50%;background:#6F9CF0}
.mside p{color:#6B7585;font-size:12.5px;line-height:1.6;margin:8px 0 12px}
.ms-b{display:flex;flex-direction:column;gap:6px}
.ms-b .btn{width:100%}
@media (max-width:1100px){.mside{display:none}}
@media (max-width:600px){.mstage{padding:0}.mphone{aspect-ratio:auto;width:100%;min-width:0;border-radius:0;padding:0}.mphone iframe{border-radius:0}}
.tool a.rl.on{background:#6F9CF0!important;color:#fff!important}
/* 화면 높이 채우기: 마지막 카드가 아래까지 */
.mbd{display:flex;flex-direction:column}
.mbd>*{flex:none}
.mbd>.split:last-child,.mbd>.g21:last-child,.mbd>.g2:last-child,.mbd>.g3:last-child{flex:1 0 auto;align-items:stretch!important}
.mbd>.split:last-child>div,.mbd>.g21:last-child>div,.mbd>.g2:last-child>div,.mbd>.g3:last-child>div{display:flex;flex-direction:column;min-width:0}
.mbd>.split:last-child>div>.card:last-child,.mbd>.g21:last-child>div>.card:last-child,.mbd>.g2:last-child>div>.card:last-child,.mbd>.g3:last-child>div>.card:last-child,.mbd>.split:last-child>.card,.mbd>.g21:last-child>.card,.mbd>.g2:last-child>.card,.mbd>.g3:last-child>.card,.mbd>.card:last-child{flex:1 0 auto;margin-bottom:0!important}
.mbd>.split:last-child>div>.ai:last-child,.mbd>.g21:last-child>div>.ai:last-child{flex:1 0 auto;margin-bottom:0!important}
.card:has(>.empty:only-child),.card:has(>div:only-child>.empty){display:flex;flex-direction:column;justify-content:center}
.stage>.mstage{width:100%}
.btn{white-space:nowrap}
.mbd>.row:first-child{flex-wrap:wrap;row-gap:10px}
.mbd>.row:first-child>b{white-space:nowrap}
.mbd>.row:first-child .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 200px}
.cseg button{white-space:nowrap}
.cev.narrow{padding:6px 7px}
.cev.narrow .ce-t{font-size:11.5px}
.cev.narrow .ce-s{font-size:10.5px}
.cev.narrow .ce-tag:not(.r){display:none}
.cev.narrow .ce-v{font-size:10.5px;padding-right:5px}
.cev{word-break:keep-all}
.cev .ce-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cev .ce-s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev.narrow .ce-foot,.cev.narrow .ce-tags{display:none}
.mbd .g21:has(.ccal){grid-template-columns:3fr 1fr!important}
.cev .ce-t,.cev .ce-s{flex-shrink:0}
.cev.short .ce-foot,.cev.short .ce-tags,.cev.short .ce-alt{display:none}
.cev.short .ce-t{-webkit-line-clamp:1}
.cw-bd{max-height:none}
/* ===== 리디자인: 역할 색 밴드 ===== */
.desk.rd{--band:#3E9E85;position:relative;background:#F2F4F7!important}
.desk.rd-admin{--band:#C98522}
.desk.rd::before{content:"";position:absolute;left:0;right:0;top:0;height:282px;background:var(--band);z-index:0}
.desk.rd>.nav,.desk.rd>.main{position:relative;z-index:1;background:transparent!important}
.desk.rd .nav{border-right:0!important;padding:20px 16px!important}
.desk.rd .main{background:transparent!important}
.desk.rd .mtop{background:transparent!important;border:0!important}
.desk.rd .mtop h1{color:#fff!important}
.desk.rd .mtop .mu{color:rgba(255,255,255,.75)!important}
.desk.rd .mtop .ic{background:rgba(255,255,255,.18)!important;color:#fff}
.desk.rd .prof{background:rgba(255,255,255,.92)!important}
.desk.rd .mtop .tg{background:rgba(255,255,255,.2)}
.desk.rd .mbd{padding-top:8px!important}
/* 사이드바 프로필 */
.nav .lg.pfl{display:block!important;border:0!important;padding:0 4px 18px!important;color:#fff!important;text-align:center}
.pf-top{display:flex;align-items:center;gap:8px;justify-content:flex-start;font-size:15px;margin-bottom:12px}
.pf-lg{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.pf-lg svg{width:18px;height:18px}
.pf-av{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:#fff;color:var(--band);font-size:24px;font-weight:900;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.pf-o{font-size:12px;opacity:.85}
.pf-n{font-size:18px;font-weight:800;margin-top:2px}.pf-n small{font-size:12px;font-weight:600;opacity:.85;margin-left:2px}
.pf-rows{margin-top:12px;display:grid;gap:5px}
.pf-rows div{display:flex;justify-content:space-between;font-size:12.5px;padding:0 6px}
.pf-rows span{opacity:.8}.pf-rows b{font-weight:800}
.nv-card{margin-top:14px;background:#fff;border-radius:22px;padding:8px;box-shadow:0 8px 24px rgba(40,60,90,.08);display:flex;flex-direction:column;flex:1}
.nv-card .gp{padding:12px 10px 4px!important}
.nv-card>button:last-child{margin-top:auto}
/* 패널 공통 */
.desk.rd .card,.desk.rd .ai{box-shadow:0 6px 22px rgba(40,60,90,.06)}
.desk.rd .card{background:#fff!important;border-color:#EDF0F4!important;border-radius:22px!important}
/* 홈 */
.hb-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;color:#fff;margin:0 0 18px}
.hb-hi{font-size:24px;font-weight:800;letter-spacing:-.5px}.hb-hi b{background:#fff;color:var(--band);padding:0 8px;border-radius:8px}
.hb-sub{font-size:13.5px;opacity:.9;margin-top:6px}
.hb-kpi{display:flex;gap:10px}
.hk{min-width:108px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);cursor:pointer}
.hk:hover{background:rgba(255,255,255,.26)}
.hk span{display:block;font-size:12px;opacity:.85}.hk b{font-size:20px;font-weight:800}
.hb-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:stretch}
.pnl{background:#fff;border-radius:24px;padding:20px 22px;box-shadow:0 8px 28px rgba(40,60,90,.08)}
.pnl.wide{margin-top:18px}
.nbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:var(--band);color:#fff;font-size:13.5px;cursor:pointer;margin-bottom:6px}
.nb-ic{width:22px;height:22px;display:grid;place-items:center}.nb-ic svg{width:18px;height:18px}
.nbar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nb-r{font-size:12px;opacity:.85;white-space:nowrap}
.pg2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.psec{padding-top:16px}
.pg2 .psec:nth-child(odd){border-right:1px solid #EEF1F5;padding-right:24px}.pg2 .psec:nth-child(even){padding-left:24px}
.ps-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ps-h b{font-size:16px;letter-spacing:-.3px}
.ps-a{font-size:12px;font-weight:700;color:#6B7585;border:1px solid #E3E8EF;border-radius:999px;padding:4px 11px;background:#fff}
.ps-a:hover{border-color:var(--band);color:var(--band)}
.prow,.vrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #F1F3F6;cursor:pointer;min-width:0}
.prow:hover .pr-t{color:var(--band)}
.pr-t{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:#2A3140;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-t small{display:block;font-size:12px;font-weight:500;color:#9AA3B2;overflow:hidden;text-overflow:ellipsis}
.pr-d{font-size:12px;color:#9AA3B2;flex:none}
.pr-n{min-width:30px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.stag{flex:none;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.avc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.cpill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid}
.dstrip{display:flex;align-items:center;gap:4px;margin:10px 0 12px}
.ds-m{font-size:13px;color:#6B7585;margin-right:8px}.ds-m b{font-size:34px;color:var(--band);letter-spacing:-1px}
.dstrip button{flex:1;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;color:#9AA3B2}
.dstrip button b{font-size:16px;color:#4A5262}.dstrip button span{font-size:11px}
.dstrip button.on{background:var(--band);color:#fff}.dstrip button.on b{color:#fff}
.slist{max-height:260px;overflow-y:auto;scrollbar-width:none}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:13px}
.s-tm{flex:none;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;min-width:58px;text-align:center}
.s-t{flex:1;font-weight:700;color:#2A3140;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-v{font-size:12px;color:#9AA3B2}.s-v em{font-style:normal;color:#C25E48;font-weight:700}
.vst{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#F1F4F8;color:#6B7585}
.vst.on{background:#E2F3EC;color:#2F8069}.vst.off{background:#F6F7F9;color:#B4BCC8}
.opgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:8px}
.opc{border-radius:20px;padding:16px;cursor:pointer;transition:transform .12s}
.opc:hover{transform:translateY(-2px)}
.opc-d{font-size:12px;color:#6B7585}.opc-t{font-size:15.5px;font-weight:800;margin-top:10px;color:#1F2633}.opc-k{font-size:12px;color:#6B7585;margin-top:2px}
.opc-p{display:flex;justify-content:space-between;font-size:12px;margin-top:14px;color:#4A5262}

 xs.forEach((x,i)=>{if(i%(opt.step||1)===0)g+=`<text x="${X(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="#9AA1AC">${x}</text>`});
 series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.c}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="5 4"':''} points="${s.d.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;s.d.forEach((v,i)=>{if(i===s.d.length-1)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${s.c}"/><text x="${X(i)-6}" y="${Y(v)-8}" font-size="11" text-anchor="end" fill="${s.c}" font-weight="700">${s.l}</text>`})});

window.showMobile=function(){const stage=document.getElementById('stage');document.querySelectorAll('.tool .rl').forEach(b=>b.classList.remove('on'));const a=document.querySelector('.tool a.rl');if(a)a.classList.add('on');document.getElementById('sid').textContent='U-APP';
 stage.innerHTML=`<div class="mstage"><div class="mphone"><iframe id="mframe" title="시간 적금 사용자 앱"></iframe></div><div class="mside"><div class="ms-h"><span class="ms-dot"></span>사용자 · 모바일 앱</div><p>도움 받기(파랑)와 봉사하기(민트)는 앱 오른쪽 위 메뉴에서 바꿔요.</p><div class="ms-b"><button class="btn line sm" data-mact="reload">처음부터 보기</button><button class="btn line sm" data-role="org">기관 담당자로</button><button class="btn line sm" data-role="admin">운영자로</button></div></div></div>`;
 const f=document.getElementById('mframe');f.srcdoc=mobileSrc();};
document.addEventListener('click',e=>{const a=e.target.closest('.tool a.rl');if(a){e.preventDefault();showMobile();return;}const r=e.target.closest('[data-mact="reload"]');if(r){showMobile();return;}const g=e.target.closest('.mside [data-role]');if(g){ACT.login(g.dataset.role);}},true);

<script>
/* ===== 돌봄 편성표: 일 / 주 / 월 캘린더 ===== */
(function(){
const CK=c=>/동행/.test(c)?'동행':/장보기/.test(c)?'장보기·심부름':/말동무/.test(c)?'말동무·정서':/디지털/.test(c)?'디지털 도움':/정리/.test(c)?'생활 정리':'가벼운 집안일';
const H0=8,H1=20,RH=62;
const fmt=h=>`${String(Math.floor(h)).padStart(2,'0')}:${h%1?'30':'00'}`;
function evs(L){const out=[];L.forEach((e,ei)=>{Object.entries(SCHED[e.id]||{}).forEach(([k,c])=>{k=+k;const day=Math.floor(k/2),pm=k%2;const AM=[9,10.5,9.5,11,9,10,11.5,9.5,10.5],PM=[13,14.5,16,13.5,15,16.5,14,15.5,13];const st=(pm?PM:AM)[ei%9];const du=c.gap?1.5:(ei%2?1:1.5);
 out.push({e,k,day,st,du,c,cat:CK(c.gap||c.c),gap:!!(c.gap&&!c.done)});});});return out;}
function vpill(n){return n?`<span class="ce-v"><span class="ce-av">${n[0]}</span>${n}</span>`:'';}
function lanes(L){L=L.slice().sort((a,b)=>a.st-b.st);let cl=[],end=-1,lanesEnd=[];const flush=()=>{const n=lanesEnd.length;cl.forEach(x=>x.n=n);cl=[];lanesEnd=[];};L.forEach(x=>{if(x.st>=end&&cl.length)flush();let li=lanesEnd.findIndex(e=>e<=x.st);if(li<0){li=lanesEnd.length;lanesEnd.push(0);}lanesEnd[li]=x.st+x.du;x.lane=li;cl.push(x);end=Math.max(end,x.st+x.du);});flush();return L;}
function pos(x){const w=100/(x.n||1);return `left:calc(${x.lane*w}% + 4px);width:calc(${w}% - 8px);right:auto;`;}
function evBlock(x,wide){const [a,b,bg]=DC[x.cat]||DC.ai;const sel=F('gsel','')===x.e.id+'|'+x.k;
 if(x.gap)return `<div class="cev gap ${sel?'sel':''} ${x.n>1?'narrow':''} ${x.du<1.4?'short':''}" style="${pos(x)}top:${(x.st-H0)*RH+2}px;height:${x.du*RH-4}px" ${A('f','gsel='+x.e.id+'|'+x.k)} data-tip="<b>빈칸</b> ${x.e.n} 님 · ${x.c.gap}<div>${x.c.alt}</div>"><div class="ce-t">빈칸 · ${x.c.gap}</div><div class="ce-s">${x.e.n} 님 · ${fmt(x.st)}–${fmt(x.st+x.du)}</div>${wide?`<div class="ce-alt">→ ${x.c.alt}</div>`:''}<div class="ce-tags"><span class="ce-tag r">대안 보기</span></div></div>`;
 return `<div class="cev ${x.n>1?'narrow':''} ${x.du<1.4?'short':''}" style="${pos(x)}top:${(x.st-H0)*RH+2}px;height:${x.du*RH-4}px;background:${bg};border-color:${b};--ca:${a}" data-tip="<b>${x.e.n} 님 · ${x.c.c}</b><div>${fmt(x.st)}–${fmt(x.st+x.du)} · 봉사자 ${x.c.v}</div>"><div class="ce-t">${x.e.n} 님 · ${x.c.c}</div><div class="ce-s">${fmt(x.st)}–${fmt(x.st+x.du)} · ${x.e.dong}</div>${wide?`<div class="ce-alt" style="color:#5B6576">${x.e.caution}</div>`:''}<div class="ce-foot">${vpill(x.c.v)}${x.c.dg?'<span class="ce-tag g">단골</span>':''}<span class="ce-tag">확정</span></div></div>`;}
function timeCol(){let h='';for(let t=H0;t<H1;t++)h+=`<div class="ct-h" style="height:${RH}px"><span>${String(t).padStart(2,'0')}:00</span></div>`;return h;}
function nowLine(dayIdx,cols){if(dayIdx!==4)return '';const t=15+50/60;return `<div class="cnow" style="top:${(t-H0)*RH}px"><i></i><span>15:50</span></div>`;}
function weekView(L,days){const E=evs(L);const cols=days.length;
 return `<div class="cw" style="--cols:${cols}"><div class="cw-hd"><div></div>${days.map(d=>{const [w,dt]=DAYS[d].split(' ');return `<div class="cw-d ${d===4?'today':''}" ${A('f','sday='+d)}><span>${w}</span><b>${dt.split('/')[1]}</b></div>`;}).join('')}</div>
 <div class="cw-bd"><div class="ct">${timeCol()}</div>${days.map(d=>`<div class="cw-col ${d===4?'today':''}" style="height:${(H1-H0)*RH}px">${Array.from({length:H1-H0},(_,i)=>`<div class="cw-cell" style="top:${i*RH}px;height:${RH}px"></div>`).join('')}${lanes(E.filter(x=>x.day===d)).map(x=>evBlock(x,cols===1)).join('')}${nowLine(d)}</div>`).join('')}</div></div>`;}
function monthView(L){const E=evs(L);const first=new Date(2026,10,1).getDay();const n=30;const cells=[];for(let i=0;i<(first+6)%7;i++)cells.push(null);for(let d=1;d<=n;d++)cells.push(d);while(cells.length%7)cells.push(null);
 const extra={16:[['이순례','말동무','최미경']],17:[['이순례','동행','김하늘']],18:[['정말순','장보기','이도윤']],19:[['한영자','디지털','김하늘']],20:[['오덕수','장보기','이도윤'],['정말순','생활 정리','최미경']],23:[['오덕수','동행',null]],24:[['한영자','디지털','김하늘']],25:[['이순례','말동무','최미경']],27:[['정말순','장보기','이도윤']],3:[['이순례','말동무','최미경']],4:[['정말순','생활 정리','최미경']],5:[['오덕수','장보기','이도윤']],6:[['한영자','디지털','김하늘']],2:[['오덕수','동행','김하늘']]};
 const byDay=d=>{if(d>=9&&d<=13)return E.filter(x=>x.day===d-9).map(x=>[x.e.n,x.gap?x.c.gap:x.c.c,x.gap?null:x.c.v,x.cat,x.gap]);return (extra[d]||[]).filter(r=>L.some(e=>e.n===r[0])).map(r=>[r[0],r[1],r[2],CK(r[1]),!r[2]]);};
 return `<div class="cm"><div class="cm-hd">${['월','화','수','목','금','토','일'].map(w=>`<div>${w}</div>`).join('')}</div><div class="cm-g">${cells.map(d=>{if(!d)return '<div class="cm-c off"></div>';const L2=byDay(d);const wk=(first+d-1)%7;const we=wk===0||wk===6;
  return `<div class="cm-c ${d===13?'today':''} ${we?'we':''}" ${d>=9&&d<=13?A('calday',d-9):''}><div class="cm-n">${d}</div>${L2.slice(0,3).map(r=>{const [a,b,bg]=DC[r[3]]||DC.ai;return `<div class="cm-e ${r[4]?'gap':''}" style="${r[4]?'':`background:${bg};--ca:${a}`}" data-tip="<b>${r[0]} 님 · ${r[1]}</b>${r[2]?`<div>봉사자 ${r[2]}</div>`:'<div>빈칸</div>'}">${r[4]?'빈칸 ':''}${r[0]} · ${r[1]}</div>`;}).join('')}${L2.length>3?`<div class="cm-more">+${L2.length-3}</div>`:''}</div>`;}).join('')}</div></div>`;}
ACT.calday=v=>{st.f.sview='일';st.f.sday=+v;render();};
const _sp=schedPage;
schedPage=function(){const v=F('sview','주');let h=_sp();
 const seg=`<div class="cseg">${['표','일','주','월'].map(k=>`<button class="${v===k?'on':''}" ${A('f','sview='+k)}>${k==='표'?'편성표':k==='일'?'일':k==='주'?'주':'월'}</button>`).join('')}</div>`;
 h=h.replace('<span class="sp"></span>',`<span class="sp"></span>${seg}`);
 if(v==='월')h=h.replace('<b style="font-size:16px">11/9 ~ 11/13</b>','<b style="font-size:16px">2026년 11월</b>');
 if(v==='일'){const d=F('sday',4);h=h.replace('<b style="font-size:16px">11/9 ~ 11/13</b>',`<b style="font-size:16px">${DAYS[d].split(' ')[1]} (${DAYS[d].split(' ')[0]})</b>`);}
 if(v==='표')return h;
 const fe=F('se','전체');const L=ELDERS.filter(e=>fe==='전체'||e.id===fe);
 const body=v==='월'?monthView(L):v==='일'?`<div class="cday-tabs">${DAYS.map((x,i)=>`<button class="${F('sday',4)===i?'on':''}" ${A('f','sday='+i)}>${x}</button>`).join('')}</div>`+weekView(L,[F('sday',4)]):weekView(L,[0,1,2,3,4]);
 const leg=`<div class="row mu cleg"><span><i style="background:#EDF3FE;border-color:#CFE0FC"></i>확정</span><span><i class="g"></i>빈칸 · 누르면 오른쪽에 대안</span><span><i style="background:#D9705A;width:10px;height:2px;border:0"></i>지금</span></div>`;
 const i=h.indexOf('<div class="g21"');const j=h.indexOf('<div class="card">',i);const k=h.indexOf('</div></div>\n <div>',j);
 if(i<0||j<0||k<0)return h;
 let out=h.slice(0,j)+`<div class="card ccal">${body}${leg}</div>`+h.slice(k+12);
 const days=DAYS.map((d,di)=>{let f=0,g=0;ELDERS.forEach(e=>Object.entries(SCHED[e.id]||{}).forEach(([k,c])=>{if(Math.floor(k/2)===di){c.gap&&!c.done?g++:f++;}}));return [d,f,g];});
 const vc={};ELDERS.forEach(e=>Object.values(SCHED[e.id]||{}).forEach(c=>{if(c.v)vc[c.v]=(vc[c.v]||0)+1;}));const vl=Object.entries(vc).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const extra=`<div class="card sp-box"><b>요일별 편성</b><div class="mu" style="margin:2px 0 6px">확정 · 빈칸</div>${days.map(([d,f,g])=>`<div class="dayrow"><b>${d.split(' ')[0]} ${d.split(' ')[1].split('/')[1]}</b><div class="db"><i style="flex:${f};background:var(--acc)" data-tip="<b>${d}</b> 확정 ${f}건"></i><i style="flex:${g};background:#EFA898" data-tip="<b>${d}</b> 빈칸 ${g}건"></i><i style="flex:${Math.max(0,8-f-g)}"></i></div><span>${f}건${g?` · <b style="color:#C25E48">${g}</b>`:''}</span></div>`).join('')}</div>
 <div class="card sp-box"><b>이번 주 봉사자</b><div class="mu" style="margin:2px 0 4px">편성 많은 순</div>${vl.map(([n,c])=>`<div class="dayrow"><span class="avc" style="width:28px;height:28px;font-size:12px;background:var(--acc-s);color:var(--acc-k)">${n[0]}</span><b style="width:auto;flex:1">${n}</b><span>${c}건</span></div>`).join('')}</div>`;
 if(out.endsWith('</div></div>'))out=out.slice(0,-12)+extra+'</div></div>';
 return out;};
})();

 const lone=ELDERS.filter(e=>e.home==='혼자');
