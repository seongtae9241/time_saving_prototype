/* 봉사 신청서: 쓰는 방법 하나 (PC 세그먼트 · 900px 이하 셀렉트) */
.q3mseg{margin:0 0 16px}
.q3mseg .q3mo{display:none;align-items:center;gap:10px}
.q3mseg .q3mo .sel{flex:1;min-width:0}
.q3mdesc{margin:8px 0 0}
@media (max-width:900px){.q3mseg .q3pc{display:none!important}.q3mseg .q3mo{display:flex}}
.q3help{margin:0 0 18px;padding:14px 16px;border:1px solid var(--rule-2);border-radius:12px;background:var(--sunken)}
.q3help .q2cf>.rowx>.btn{display:none}
.q3help .q2cf{margin:0}
.q3paste{margin-top:12px}

/* 관리 대상 접는 카드 안 */
.q3fin{padding:0 0 4px}
.q3fin .split2{margin-top:0}
.q3fl{margin:0;padding:0 22px 8px;color:var(--ink-3)}
.q3fin>.panel-b,.q3fin>.tw,.q3fin>.panel-f{margin:0}
.q3cau{margin-left:auto;flex:none;align-self:center}
.callout .sp{min-width:0}
/* 기관 클래스 카드 일정 두 줄 (N05) */
.q2c .q3sch{display:flex;flex-direction:column;gap:2px}
.q2c .q3sch span{white-space:nowrap}
/* 단체 봉사 참석 확인 */
.q3ck{cursor:pointer}.q3ck input{width:18px;height:18px;accent-color:var(--acc);flex:none}
.q3ck:not(.on) b{color:var(--ink-3)}
/* 링크 미리보기 */
.q3lp{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
.q3lp .sp{display:flex;flex-direction:column;min-width:0}.q3lp small{color:var(--ink-3)}
/* 월간 리포트 카드 */
.q3mcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 22px 20px}
@container (max-width:640px){.q3mcards{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.q3mcards{grid-template-columns:minmax(0,1fr);padding:0 16px 16px}}
.q3mc{border:1px solid var(--rule);border-radius:12px;padding:14px 16px;background:var(--surface)}
.q3mc-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
/* 홈 브리핑 */
.q3brief{display:flex;align-items:center;gap:12px;padding:12px 18px;margin:0 0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--rule)}
.q3brief p{margin:0;flex:1;min-width:0;color:var(--ink-2)}
@media (max-width:600px){.q3brief{flex-wrap:wrap}.q3brief p{flex-basis:100%}}
/* 가장 급한 것부터 강조 */
.nextbox.q3flash{box-shadow:0 0 0 3px var(--acc-line,#F8D4C9);transition:box-shadow .3s}
/* 뒤로 */
.q3back{display:inline-flex;align-items:center;gap:2px;margin:0 10px 0 -4px;padding:2px 8px 2px 2px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink-2);font:inherit;font-size:calc(13px*var(--fz));cursor:pointer;vertical-align:middle}
.q3back .i{width:16px;height:16px}
.q3back:hover{border-color:var(--acc);color:var(--ink)}
/* 담당자 등록 */
.q3flow{display:inline-flex;gap:3px;margin-right:8px;vertical-align:middle}
.q3flow i{width:14px;height:4px;border-radius:2px;background:var(--rule)}
.q3flow i.done{background:var(--ink-4,#9AA0AC)}.q3flow i.cur{background:var(--acc)}
.q3stc{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.q3em{word-break:break-all}
.q3rules{list-style:none;margin:2px 0 14px;padding:0;display:flex;gap:14px;flex-wrap:wrap;font-size:calc(13px*var(--fz));color:var(--ink-3)}
.q3rules li{display:inline-flex;align-items:center;gap:4px}
.q3rules li .i{width:14px;height:14px;opacity:.35}
.q3rules li.ok{color:var(--ok,#1F7A4D)}.q3rules li.ok .i{opacity:1}
/* 내 정보 */
.q3me{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start;margin-bottom:20px}
@media (max-width:1100px){.q3me{grid-template-columns:minmax(0,1fr)}}

.q3menu .lrow>.i:first-child{width:18px;height:18px;color:var(--ink-3)}
.q3sg{padding:14px 22px!important;border-top:1px solid var(--rule-2)}
input[readonly]{background:var(--bg,#F6F7F9);color:var(--ink-3)}
/* 오늘 일정 '지금' 점: 활동 중인 줄 안쪽 (N13) */
.lrow.q3now{position:relative}
.nowdot3{position:absolute;left:6px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--neg,#C8372D);box-shadow:0 0 0 0 rgba(200,55,45,.45);animation:q3pulse 1.8s infinite}
@keyframes q3pulse{0%{box-shadow:0 0 0 0 rgba(200,55,45,.45)}70%{box-shadow:0 0 0 7px rgba(200,55,45,0)}100%{box-shadow:0 0 0 0 rgba(200,55,45,0)}}
@media (prefers-reduced-motion:reduce){.nowdot3{animation:none}}
/* 숫자 카드: 마우스 올리면 코랄 테두리 (HOME-14) */
html body .kpis.kf9 a.kpi.kpi.kpi.kpi:hover,html body .kpis a.kpi.kpi.kpi.kpi:hover,html body .kpis a.kpi.kpi.kpi.kpi:focus-visible{border-color:var(--acc)!important;box-shadow:0 0 0 1px var(--acc),0 4px 14px rgba(16,24,40,.08)!important}
/* 390 숫자 카드 보조 줄 끊김 (N14, C08) */
.kpi .meta .nw3{white-space:nowrap}
/* 토스트는 아래 가운데 (U19: 머리 도구 줄을 덮지 않게) */
.toast{top:auto!important;bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}
/* 버튼 위계 (N10): 위험 = 흰 면 + 빨간 글자 */
.btn.ghost.danger-t{background:var(--surface)!important;border:1px solid var(--rule)!important;color:var(--neg,#C8372D)!important}
.btn.ghost.danger-t:hover{border-color:var(--neg,#C8372D)!important}
/* 확인 권장 */
.tag.q3rec{white-space:nowrap}
input[type=password]{width:100%;height:42px;padding:0 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:calc(15px*var(--fz))}
input[type=password]:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}
input[type=password].bad,input[type=password][aria-invalid=true]{border-color:var(--neg,#C8372D)}
/* 바로 하기 칩: 좁은 화면에서는 줄 바꿈 (잘림 없음, N03) */
@media (max-width:700px){.quick2{flex-wrap:wrap!important;overflow:visible!important;row-gap:8px}.quick2 .q2chip{flex:none}}

.q3rate .rowx{flex-wrap:wrap;row-gap:6px}
.q3rate .note{min-width:0}
td.q3nw{white-space:nowrap}
.q3rate{min-width:0;max-width:100%;box-sizing:border-box}.q3rate .chips{flex-wrap:wrap!important;overflow:visible!important}
.nextbox{min-width:0}.nextbox>*{min-width:0;max-width:100%}
.q2ck-r .sp{font-size:calc(15px*var(--fz))}
.fs12 .q3lg{margin:8px 0 12px!important}
.q3rate .chips{margin:14px 0 4px!important}
.q3rate .chips+.btns{margin-top:16px!important}

/* ===== 사용자 쪽 디자인 반영 (5회차, 2026-11-23) — ref-디자이너-2026-11-23.html 의 사용자(도움받기·봉사하기) 화면 부품을 담당자 PC에 =====
   디자이너 값 → 코랄 대응 (토큰 그대로): #5B8DEF 주색 → --acc · #3F6FD6 진한 글자 → --acc-text · #C9DAF8 옅은 테두리 → --acc-line · #EEF4FE/#E8F0FE 옅은 면 → --acc-soft
   부품: ① 채팅 목록 카드(동그란 이름·★단골·상태 알약·점선 절취선·마지막 말·답 기다리는 수) ② 말풍선 ③ 날짜 타일(큰 날짜 + 월·요일)
         ④ 분류 아이콘 타일(분류마다 옅은 면 + 한 단계 진한 테두리 + 선 아이콘) ⑤ 홈 주요 카드 티켓 머리(점선 + 양옆 반원 홈, 홈 색 = 바탕색)
         ⑥ 세그먼트 모양(옅은 바닥 위 둥근 칸, 규칙은 기존: 흰 바탕·켜짐 연한 코랄·숫자는 글자) ⑦ 타임라인(점 + 세로줄) ⑧ 큰 숫자 + 작은 단위
   6회차 정리(R4): 이 절은 스타일 끝에 있어 같은 명시도면 순서로 이긴다. !important 127개 중 96개를 뺐고(계산된 스타일 163상태·픽셀 250상태 차이 0),
   남은 31개는 앞 층에 이미 있는 !important(같은 속성)를 이겨야 하는 곳뿐이다. 새 규칙은 !important 없이 쓰고, 앞 층 !important와 부딪힐 때만 붙인다. */
:root{--n5line:transparent;--un5:#D02F2F;--reg5b:#FFF5DB;--reg5c:#7A5300;--ok5b:#E4F3EF;--ok5c:#0F6B57;--st5b:#F1F3F6;--bub5:#F2F4F7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--n5line:var(--line9);--reg5b:#3A2E14;--reg5c:#F2C46B;--ok5b:#15302A;--ok5c:#63CDB0;--st5b:#262B33;--bub5:#232830}}
:root[data-theme="dark"]{--n5line:var(--line9);--reg5b:#3A2E14;--reg5c:#F2C46B;--ok5b:#15302A;--ok5c:#63CDB0;--st5b:#262B33;--bub5:#232830}

/* --- ④ 분류 아이콘 타일: 분류마다 옅은 면 (코랄은 버튼·켜짐에만) --- */
.c5-go{--c5i:#3B6FD1;--c5b:#EDF3FE;--c5r:#CFE0FC}
.c5-shop{--c5i:#1F8A5B;--c5b:#E8F6EF;--c5r:#C8EAD8}
.c5-talk{--c5i:#6A55C9;--c5b:#F1EEFC;--c5r:#DAD3F6}
.c5-digi{--c5i:#0F7F8E;--c5b:#E7F6F8;--c5r:#C4E8EE}
.c5-tidy{--c5i:#A8740C;--c5b:#FFF7E3;--c5r:#FCE6B5}
.c5-home{--c5i:#B5456F;--c5b:#FDEEF3;--c5r:#F8D3E0}
.c5-etc{--c5i:var(--ink-3);--c5b:var(--sunken);--c5r:var(--rule)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .itile.c5{--c5b:color-mix(in srgb,var(--c5i) 22%,var(--surface));--c5r:color-mix(in srgb,var(--c5i) 38%,var(--surface));--c5x:color-mix(in srgb,var(--c5i) 55%,#fff)}}
:root[data-theme="dark"] .itile.c5{--c5b:color-mix(in srgb,var(--c5i) 22%,var(--surface));--c5r:color-mix(in srgb,var(--c5i) 38%,var(--surface));--c5x:color-mix(in srgb,var(--c5i) 55%,#fff)}
html body .itile.ct.c5{display:inline-grid;place-items:center;flex:none;width:36px;height:36px;background:var(--c5b)!important;box-shadow:inset 0 0 0 1.5px var(--c5r);border-radius:30%!important;border:0}
html body .itile.ct.c5 svg.i{color:var(--c5x,var(--c5i))!important;width:18px;height:18px}
html body #main .panel .itile.ct.c5{display:inline-grid}
html body .itile.ct.c5.sm5{width:32px;height:32px}
html body .itile.ct.c5.sm5 svg.i{width:16px;height:16px}
html body .itile.ct.c5.xs5{width:22px;height:22px;border-radius:7px!important;vertical-align:-5px;margin-right:7px}
html body .itile.ct.c5.xs5 svg.i{width:13px;height:13px}
html body table.tight1 .itile.ct.c5{width:32px;height:32px}
html body table.tight1 .itile.ct.c5 svg.i{width:16px;height:16px}
/* 홈 오늘 처리할 일: 표에서는 분류 타일이 이름 앞(동그란 이름 대신) */
html body #main table.tight1 .who>.av{display:none}

/* --- ③ 날짜 타일 (참고: 큰 날짜 + '11월 수', 옅은 면 정사각형) --- */
.dt5{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;flex:none;width:58px;height:58px;border-radius:15px;background:var(--acc-soft);color:var(--acc-text);line-height:1;box-sizing:border-box}
.dt5>b{font-size:calc(20px*var(--fz));font-weight:800;letter-spacing:-.5px;line-height:1;color:inherit}
.dt5>span{font-size:calc(13px*var(--fz));font-weight:700;margin-top:4px;white-space:nowrap;line-height:1.1;color:inherit}
.lrow.on .dt5,tr.urgent .dt5,.q2c.off .dt5{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--acc-line)}
.dt5.wk5{width:52px;height:54px}
.dt5.wk5>b{font-size:calc(17px*var(--fz))}
.dt5.wk5.many>b{font-size:calc(13px*var(--fz));letter-spacing:-.3px}
.wk5r{display:inline-flex;align-items:center;gap:12px;white-space:nowrap}
/* 표에서는 날짜 칸이 따로 있어 숨기고, 카드형 줄(좁은 카드·모바일)에서만 날짜 타일 */
.dt5.cm5{display:none}
@container card (max-width:640px){
 html body #main .tw .dt5.cm5{display:inline-flex}
 html body #main .tw .d5d{display:none}
 html body #main table.tight1 .who>.itile.ct.c5{display:none}
}
@media (max-width:600px){
 html body #main .tw .dt5.cm5{display:inline-flex}
 html body #main .tw .d5d{display:none}
 html body #main table.tight1 .who>.itile.ct.c5{display:none}
}
/* 요청 목록 줄: 날짜 타일 + 작은 분류 타일 */
html body #main .lrow.dl5{align-items:center}
html body #main .lrow.dl5>.sp{min-width:0}
/* 기관 행사·지난 행사: 같은 날짜 타일 모양 */
html body #main .ev-d{align-self:start;height:76px;padding:0;background:var(--acc-soft);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
html body #main .ev-d b,html body #main .ev-d .num{font-size:calc(28px*var(--fz));font-weight:800;line-height:1!important;color:var(--acc-text);letter-spacing:-.5px}
html body #main .ev-d small{font-size:calc(13px*var(--fz));font-weight:700;line-height:1.1!important;color:var(--acc-text)}
html body #main .prow .pd{align-self:center;height:64px;padding:0;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--sunken)}
html body #main .prow .pd b{font-size:calc(22px*var(--fz))!important;font-weight:800;line-height:1!important;color:var(--ink)!important}
html body #main .prow .pd span{font-size:calc(13px*var(--fz));font-weight:700;line-height:1.1;color:var(--ink-2)}
/* 기관 클래스 카드 머리: 시작일 타일 + 분류·제목 */
.q2c-h5{display:flex;align-items:center;gap:12px;min-width:0}
.q2c-ht5{display:grid;gap:6px;min-width:0}
.q2c-ht5 h3{margin:0;min-width:0;line-height:1.5}
/* 방문 주의사항 띠: 글과 버튼 세로 가운데 맞춤 (한 줄일 때 5.8px 어긋남) */
html body #main .stackv>.callout[data-dgk="방문 주의사항"]{align-items:center}

/* --- ⑦ 타임라인: 홈 오늘 일정 (점 + 세로줄) --- */
html body #main .tl5>.lrow:not(.pastfold){position:relative;padding-left:52px!important}
html body #main .tl5>.lrow:not(.pastfold)::before{content:"";position:absolute;left:31px;top:0;bottom:0;border-left:2px dashed var(--rule);pointer-events:none}
html body #main .tl5>.lrow:not(.pastfold):first-child::before,html body #main .tl5>.pastfold+.lrow::before{top:50%}
html body #main .tl5>.lrow:not(.pastfold):last-child::before,html body #main .tl5>.lrow:has(+.nowline.end12)::before{bottom:50%}
html body #main .tl5>.lrow:not(.pastfold):only-child::before{display:none}
html body #main .tl5>.lrow:not(.pastfold)::after{content:"";position:absolute;left:24px;top:50%;margin-top:-8px;width:16px;height:16px;border-radius:50%;box-sizing:border-box;background:var(--surface);border:3px solid var(--acc-line);pointer-events:none}
html body #main .tl5>.lrow.past::after{border-color:var(--rule)}
html body #main .tl5>.lrow:has(.gap12)::after{border-color:color-mix(in srgb,var(--neg) 55%,var(--surface))}
html body #main .tl5>.lrow.q3now::after{display:none}
html body #main .tl5>.lrow.q3now .nowdot3{left:24px;top:50%;width:16px;height:16px;margin-top:-8px;border:3px solid var(--surface);box-sizing:border-box}
html body #main .tl5>.lrow>.tn{flex:none;white-space:nowrap}
@container card (max-width:560px){
 html body #main .tl5>.lrow:not(.pastfold){flex-wrap:wrap;row-gap:6px;column-gap:10px}
 html body #main .tl5>.lrow>.sp{flex:1 1 150px;min-width:0}
 html body #main .tl5>.lrow>.muted.small,html body #main .tl5>.lrow>.tag{white-space:nowrap}
 html body #main .tl5>.lrow:not(.pastfold)::after,html body #main .tl5>.lrow.q3now .nowdot3{top:32px}
 html body #main .tl5>.lrow:not(.pastfold):first-child::before,html body #main .tl5>.pastfold+.lrow::before{top:32px}
 html body #main .tl5>.lrow:not(.pastfold):last-child::before,html body #main .tl5>.lrow:has(+.nowline.end12)::before{bottom:auto;height:32px}
}
/* 좁은 카드의 머리에는 동그란 아이콘을 빼서 제목·꼬리표가 한 줄에 */
html body #main .panel>.panel-h.nar9.nar9 h2 .ht9{display:none!important}
/* 안부 확인 기록: 같은 타임라인 */
html body #main .pin12{gap:0}
html body #main .pin12 li{position:relative;background:transparent;border-left:0;border-radius:0;padding:2px 0 14px 28px}
html body #main .pin12 li::before{content:"";position:absolute;left:7px;top:18px;bottom:-2px;border-left:2px dashed var(--rule)}
html body #main .pin12 li:last-child::before{display:none}
html body #main .pin12 li::after{content:"";position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;box-sizing:border-box;background:var(--surface);border:3px solid var(--acc-line)}
html body #main .pin12 li:first-child::after{border-color:var(--acc)}
html body #main .pin12 li.miss::after{border-color:var(--warn)}
html body #main .pin12 li.miss .pin12-r{color:var(--warn-ink,var(--warn))}

/* --- 편성표 옆 패널: 분류 타일, 색 막대는 빈칸·요청 단계만 --- */
html body #main .dp-b{grid-template-columns:34px minmax(0,1fr);column-gap:10px}
html body #main .dp-b>.itile.ct.c5{grid-column:1;grid-row:1/span 5;align-self:start;width:34px;height:34px}
html body #main .dp-b>:not(.itile){grid-column:2}
html body #main .dp-r.ok{border-left-color:transparent}

/* --- ⑤ 홈 주요 카드 티켓 머리: 머리 아래 점선 + 양옆 반원 홈(바탕색) --- */
html body #main .panel:is([data-dgk="오늘 처리할 일"],[data-dgk="먼저 살펴볼 분"],[data-dgk="오늘 일정"],[data-dgk="최근 도착한 일지"])>.panel-h{position:relative;border-bottom:1.5px dashed var(--acc-line);padding-bottom:16px;margin-bottom:6px}
html body #main .panel:is([data-dgk="오늘 처리할 일"],[data-dgk="먼저 살펴볼 분"],[data-dgk="오늘 일정"],[data-dgk="최근 도착한 일지"])>.panel-h::before,
html body #main .panel:is([data-dgk="오늘 처리할 일"],[data-dgk="먼저 살펴볼 분"],[data-dgk="오늘 일정"],[data-dgk="최근 도착한 일지"])>.panel-h::after{content:"";display:block;position:absolute;bottom:-12px;top:auto!important;width:22px;height:22px;border-radius:50%;background:var(--canvas);border:1px solid var(--n5line);box-sizing:border-box;box-shadow:none;pointer-events:none;z-index:1;transform:none;opacity:1}
html body #main .panel:is([data-dgk="오늘 처리할 일"],[data-dgk="먼저 살펴볼 분"],[data-dgk="오늘 일정"],[data-dgk="최근 도착한 일지"])>.panel-h::before{left:-12px;right:auto;clip-path:inset(0 0 0 calc(50% - 1px))}
html body #main .panel:is([data-dgk="오늘 처리할 일"],[data-dgk="먼저 살펴볼 분"],[data-dgk="오늘 일정"],[data-dgk="최근 도착한 일지"])>.panel-h::after{right:-12px;left:auto;clip-path:inset(0 calc(50% - 1px) 0 0)}
/* 티켓 머리의 제목 앞 동그란 아이콘 (참고 'AI 도움 찾기' 머리) */
html body #main .panel:is([data-dgk="오늘 처리할 일"],[data-dgk="먼저 살펴볼 분"],[data-dgk="오늘 일정"],[data-dgk="최근 도착한 일지"])>.panel-h h2 .ht9{display:inline-grid!important;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc-soft);flex:none}
html body #main .panel:is([data-dgk="오늘 처리할 일"],[data-dgk="먼저 살펴볼 분"],[data-dgk="오늘 일정"],[data-dgk="최근 도착한 일지"])>.panel-h h2 .ht9 svg.i{width:16px!important;height:16px!important;color:var(--acc-text)!important}
html body #main .panel:is([data-dgk="오늘 처리할 일"],[data-dgk="먼저 살펴볼 분"],[data-dgk="오늘 일정"],[data-dgk="최근 도착한 일지"])>.panel-h h2:has(.ht9){display:inline-flex;align-items:center;gap:10px}

/* --- ⑥ 세그먼트·탭 모양: 옅은 바닥 위 둥근 칸 (참고 seg2: 바닥 14 · 칸 11) --- */
html body #main .tabs,html body #main .seg,html body #top .seg{border-radius:14px!important;padding:4px!important;gap:2px}
html body #main .tabs>button,html body #main .seg>button,html body #main .tabs>a,html body #main .seg>a,html body #top .seg>button{border-radius:10px!important;min-height:34px}
html body #main .panel .tabs,html body #main .panel .seg{background:var(--bub5)!important}

/* --- ⑧ 큰 숫자 + 작은 단위 (참고 통장 '23시간 30분') --- */
html body #main .kpi{border-radius:20px!important}
html body #main .kpi .value{font-size:calc(34px*var(--fz))!important;font-weight:800!important;letter-spacing:-1px}
html body #main .kpi .value .u{font-size:calc(15px*var(--fz));font-weight:600!important;letter-spacing:-.2px;margin-left:3px;color:var(--ink-3)}
html body #main .kpi:first-child .value .u{color:inherit}
/* 첫 KPI는 통장 카드처럼 왼쪽 띠 + 점선 */
html body #main .kpis>.kpi:first-child{padding-left:38px!important;background-image:linear-gradient(var(--hero-stub),var(--hero-stub)),repeating-linear-gradient(180deg,var(--acc-line) 0 5px,transparent 5px 10px)!important;background-size:12px 100%,2px 100%!important;background-position:0 0,12px 0!important;background-repeat:no-repeat!important}

/* --- ① 지원자 목록 = 채팅 목록 카드 --- */
html body #main .apl12.cxl5{gap:10px;grid-template-columns:minmax(0,1fr);min-width:0}
html body #main .cxl5 .apl12-r{min-width:0;max-width:100%;box-sizing:border-box}
html body #main .cxl5 .apl12-r{display:block;--c5bd:var(--acc-line);border:1.5px solid var(--c5bd);border-radius:20px;padding:12px 14px;background:var(--surface);box-shadow:none}
html body #main .cxl5 .apl12-r.on{--c5bd:var(--acc)}
.cxl5-t{display:flex;align-items:center;gap:12px;min-width:0}
.cxl5-t>.av{width:46px;height:46px;font-size:calc(18px*var(--fz));flex:none}
.cxl5-t>.sp{flex:1;min-width:0;display:grid;gap:2px}
.cxl5-t .apl12-n{display:flex;align-items:center;gap:6px;min-width:0;font-size:calc(15.5px*var(--fz))}
.cxl5-t .apl12-n b{font-weight:800}
.cxl5-t .apl12-n b,.reg5{white-space:nowrap;flex:none}
html body #main .cxl5-t .muted.ellip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@container card (max-width:420px){.cxl5-t>.av{width:40px;height:40px;font-size:calc(16px*var(--fz))}.cxl5-t{gap:10px}}
@media (max-width:600px){.cxl5-t>.av{width:40px;height:40px;font-size:calc(16px*var(--fz))}.cxl5-t{gap:10px}}
.reg5{font-style:normal;font-size:calc(13px*var(--fz));font-weight:800;color:var(--reg5c);background:var(--reg5b);border-radius:999px;padding:2px 8px;white-space:nowrap;line-height:1.4}
.st5{flex:none;font-size:calc(13px*var(--fz));font-weight:700;border-radius:999px;padding:3px 10px;background:var(--st5b);color:var(--ink-3);white-space:nowrap;line-height:1.4}
.st5.go{background:var(--acc-soft);color:var(--acc-text)}
.st5.ok{background:var(--ok5b);color:var(--ok5c)}
.cut5{position:relative;height:0;border-top:1.5px dashed var(--c5bd,var(--acc-line));margin:12px -14px 10px}
.cut5::before,.cut5::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;box-sizing:border-box;background:var(--notch-bg,var(--surface));border:1.5px solid var(--c5bd,var(--acc-line))}
.cut5::before{left:-12.5px;clip-path:inset(0 0 0 calc(50% - 1.5px));background:var(--notch-bg-l,var(--notch-bg,var(--surface)))}
.cut5::after{right:-12.5px;clip-path:inset(0 calc(50% - 1.5px) 0 0);background:var(--notch-bg-r,var(--notch-bg,var(--surface)))}
.cxl5-b{display:flex;align-items:center;gap:8px;min-width:0}
.cxl5-b p{flex:1;min-width:0;margin:0;font-size:calc(14.5px*var(--fz));line-height:1.5;color:var(--ink-2);white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;word-break:break-all}
.cxl5-b>span{flex:none;font-size:calc(13px*var(--fz));color:var(--ink-3);white-space:nowrap}
.un5{flex:none;font-style:normal;min-width:22px;height:22px;border-radius:999px;background:var(--un5);color:#fff;font-size:calc(13px*var(--fz));font-weight:800;display:grid;place-items:center;padding:0 6px;box-sizing:border-box;line-height:1}
html body #main .cxl5 .apl12-r>.btns{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:10px;width:auto}

/* --- ② 채팅 말풍선 (참고: 상대 회색 면, 나 주색 면 흰 글자, 시스템은 회색 알약) --- */
html body #main .chat12-b{background:var(--surface)}
html body #main .chat12-bub{background:var(--bub5);border:0;border-radius:18px 18px 18px 6px;padding:10px 14px;color:var(--ink)}
html body #main .chat12-m.me .chat12-bub{background:var(--acc);color:var(--on-acc,#fff);border-radius:18px 18px 6px 18px}
html body #main .chat12-meta{font-size:calc(13px*var(--fz));color:var(--ink-3)}
html body #main .chat12-sys{align-self:center;max-width:90%;text-align:center;background:var(--bub5);color:var(--ink-3);border-radius:12px;padding:6px 12px;font-size:calc(12.5px*var(--fz))}
html body #main .chat12-f input{border-radius:999px!important;border:0!important;box-shadow:inset 0 0 0 1.5px var(--acc-line);padding:0 18px}
html body #main .chat12-f .btn{border-radius:999px}
html body #main .q3ch-h>.av{width:44px;height:44px;font-size:calc(17px*var(--fz))}

/* --- 계정 바꾸기(시연): 참고처럼 떠 있는 카드 안 세로 목록 --- */
.acct5{margin:20px 0 14px;padding:12px;border:1px solid var(--rule);border-radius:16px;background:var(--surface);box-shadow:0 8px 28px rgba(30,42,60,.08)}
.acct5 h4{margin:0 0 8px;font-size:calc(13px*var(--fz));font-weight:700;color:var(--ink-3);letter-spacing:-.2px}
.acct5 .q2acct{margin:0;display:grid;gap:6px}
.acct5 .q2acct button{display:block;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--surface);border-radius:11px;padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.acct5 .q2acct button:hover{background:var(--hover)}
.acct5 .q2acct button b{display:block;font-size:calc(14px*var(--fz));font-weight:800;line-height:1.4}
.acct5 .q2acct button em{display:block;font-style:normal;font-size:calc(13px*var(--fz));color:var(--ink-3);margin-top:1px;line-height:1.4}
.acct5 .q2acct button em .mt,.acct5 .q2acct button em .mt>span{font-size:inherit}
.acct5 .q2acct button.on{border-color:var(--acc);background:var(--acc-soft)}
.acct5 .hint{margin:8px 2px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .acct5{box-shadow:none}}
:root[data-theme="dark"] .acct5{box-shadow:none}
/* 내 정보: 담당자 계정 안내 */
.note5{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--sunken);color:var(--ink-2);font-size:calc(15px*var(--fz));line-height:1.55}
.note5 svg.i{flex:none;width:18px;height:18px;margin-top:2px;color:var(--ink-3)}
#main>.note5,#main .wrap>.note5{margin:0}

/* ===== 11/24 사용자 피드백: 마우스 올림은 줄 전체 바탕만 바뀜(칸마다 회색 X), 막대가 날짜 타일과 겹치지 않게 ===== */
html body #main .tw>table>tbody>tr.row:hover>td{background:transparent!important}
html body #main .tw>table>tbody>tr.row:not(.urgent):hover{background:var(--hover)}
html body #main .tw>table>tbody>tr.row.urgent:hover{background:color-mix(in srgb,var(--acc-soft,#FEF2EE) 100%,var(--surface))}
/* 급한 줄 표시 막대: 표 모드는 줄 왼쪽 끝 한 줄, 카드 모드는 줄 바깥 왼쪽 끝(내용과 16px 떨어짐) — 첫 칸 위 그림자는 쓰지 않음 */
html body #main .tw>table>tbody>tr.row.urgent>td:first-child{box-shadow:none!important}
html body #main .tw>table>tbody>tr.row.urgent{box-shadow:inset 3px 0 0 var(--acc,#C2502F)}

/* 11/24: 머리 '내 담당 / 기관 전체' 탭도 다른 탭과 같은 흰 바탕(켜짐 연한 코랄, 숫자는 글자) */
html body .seg.scope12{background:var(--surface,#fff)!important;box-shadow:none!important}
html body .seg.scope12>button:not(.on){background:transparent!important;color:var(--ink-2)!important}
html body .seg.scope12>button:not(.on) .tn{color:var(--ink-3)!important}
html body .seg.scope12>button.on{background:var(--acc-weak2,#FCE7E0)!important;color:var(--acc-text,#A8432A)!important}
:root[data-theme="dark"] .seg.scope12>button.on{background:color-mix(in srgb,var(--acc,#C2502F) 26%,var(--surface))!important}

/* 11/24: 카드 안 '더 보기' 같은 펼침 메뉴가 카드 가장자리에서 잘리지 않게 — 메뉴가 열린 카드만 넘침 허용 + 위로 올림 */
html body #main .panel:has(details.menu[open]){overflow:visible!important;position:relative;z-index:40}
html body #main details.menu[open]>.menu-b{z-index:41}

/* 11/24: 셀렉트 상자는 색 없이 — 필터가 골라져도 흰 바탕·회색 선·검은 글자(고른 상태는 옆 ✕ 버튼으로 알림). 초점은 진한 회색 테두리 */
html body select,html body select.sel,html body select.fsel,html body select.fsel.on10{background-color:var(--surface,#fff)!important;border-color:var(--line9,#E4E7EC)!important;color:var(--ink,#16191F)!important;font-weight:500!important}
html body select:focus,html body select.sel:focus,html body select.fsel:focus{border-color:var(--ink-3,#6B7280)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-3,#6B7280) 18%,transparent)!important}

/* 11/24: 마크(태그·배지·★단골 등)끼리, 마크와 옆 글자 사이를 최소 8px 띄움 */
html body #main :is(div,span,p,td,li,dd,h2,h3,b):has(> :is(.tag,.reg5,.status)){column-gap:8px}
html body #main :is(.tag,.reg5,.status):not(:last-child){margin-inline-end:8px}
html body #main :is(div,span,p,td,li,dd,h2,h3,b):has(> :is(.tag,.reg5,.status)):is([style*="flex"],.rowx,.mt,.tags) > :is(.tag,.reg5,.status){margin-inline-end:0}
html body #main :is(.tag,.reg5,.status)+:is(.tag,.reg5,.status){margin-inline-start:0}
html body #main .sp>.q3rec{margin-inline-start:8px}

/* 11/24: 편성표 옆 패널 일정 줄 — 아이콘을 시간 위로 올려 왼쪽 한 칸에 모으고, 오른쪽 내용 폭을 넓힘 */
html body #main .dp-r{grid-template-columns:52px minmax(0,1fr)!important;align-items:start!important;column-gap:12px!important;row-gap:3px!important}
html body #main .dp-r>.dp-b{display:contents}
html body #main .dp-r .dp-b>.itile.ct.c5{grid-column:1!important;grid-row:1!important;width:32px!important;height:32px!important;margin-bottom:4px}
html body #main .dp-r>.dp-t{grid-column:1;grid-row:2/span 4;align-self:start}
html body #main .dp-r .dp-b>:not(.itile){grid-column:2!important;min-width:0}
html body #main .dp-r>.btn,html body #main .dp-r>:not(.dp-t):not(.dp-b){grid-column:2!important}
html body #main .dp-r .dp-cau2{white-space:normal!important;display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html body #main .dp-r .dp-cau2>span{white-space:normal!important;overflow:visible!important;text-overflow:clip!important}

/* 11/24: 수락·허가·허용 느낌 버튼은 초록 파스텔 (코랄 주 버튼보다 우선) */
html body .btn.ok-btn,html body button.ok-btn{background:#E4F4EA!important;color:#1E6B45!important;border:1.5px solid #BFE3CD!important;box-shadow:none!important}
html body .btn.ok-btn:hover,html body button.ok-btn:hover{background:#D3EDDD!important;border-color:#9FD3B4!important}
html body .btn.ok-btn svg,html body button.ok-btn svg{color:#1E6B45!important;stroke:currentColor}
html body .btn.ok-btn:disabled,html body button.ok-btn:disabled{opacity:.55}
:root[data-theme="dark"] .btn.ok-btn,:root[data-theme="dark"] button.ok-btn{background:color-mix(in srgb,#2F8F5B 26%,var(--surface))!important;color:#A9E3C2!important;border-color:color-mix(in srgb,#2F8F5B 55%,var(--surface))!important}
:root[data-theme="dark"] .btn.ok-btn svg,:root[data-theme="dark"] button.ok-btn svg{color:#A9E3C2!important}

/* 11/24: 일지 타임라인 — 동그라미 중심을 세로선 중앙에 맞춤(오늘 일정과 같은 모양: 연한 점선, 속 빈 원) */
html body #main .tline::before{left:27px!important;border-left:2px dashed color-mix(in srgb,var(--ink-4) 60%,transparent)!important;top:26px!important;bottom:26px!important}
html body #main .tline>.tl-row{position:relative;padding-left:52px!important}
html body #main .tline>.tl-row>.tl-dot{position:absolute;left:28px;top:20px;margin:0!important;transform:translateX(-50%);width:14px;height:14px;box-sizing:border-box;border:2.5px solid color-mix(in srgb,var(--acc) 55%,var(--surface));background:var(--surface)}

/* 11/24: 목록 줄 마우스 올림 — 왼쪽 막대 없이 줄 전체 바탕만 바뀜(글자와 겹치지 않게) */
html body #main :is(button,a,div).lrow:not(.static):hover{box-shadow:none!important;background:var(--hover)}
html body #main .subrows>.lrow{padding:10px 12px!important;border-radius:10px;margin:0 -12px}

/* 11/24: 요청 보드 카드 머리 — 이름·담당자·기한 마크가 카드 밖으로 넘치지 않게(자리가 모자라면 기한 마크가 다음 줄로) */
html body #main .kcard>.kc-top{display:flex!important;flex-wrap:wrap!important;align-items:center;column-gap:8px;row-gap:6px;min-width:0}
html body #main .kcard>.kc-top>b{min-width:0;flex:1 1 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
html body #main .kcard>.kc-top>b>.kmgr12{white-space:nowrap}
html body #main .kcard>.kc-top>.duep{flex:none;white-space:nowrap;max-width:100%}
html body #main .kcard .duep i{display:inline!important}
html body #main .kcard .duep:not(.hot) svg.i{display:none!important}
html body #main .kcard .duep.hot svg.i{display:block!important}
html body #main .kc-top .duep:not(.hot){display:inline-flex!important}

/* 11/24: 작은 표(table.vars) 마우스 올림 — 회색 바탕이 글자에 붙지 않게 양끝 칸에 안쪽 여백(머리칸도 같이 맞춤), 모서리는 각지게 */
html body #main table.vars :is(td,th):first-child{padding-left:12px!important}
html body #main table.vars :is(td,th):last-child{padding-right:12px!important}
html body #main table.vars tbody tr:hover>td{background:var(--hover)!important}

/* ===== 11/24 새 디자인 참고 (팀 사용자 화면 v108에서 고른 세부 — 코랄 강조·위 11/24 규칙 유지) ===== */
/* ① 패널 제목 개수 → 작은 연한 코랄 알약 (참고: 활동 '확정됨 7' 개수 알약 .rp-sum>b) */
html body #main .panel-h h2>.cnt-n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;margin-left:8px;padding:0 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc-text);font-size:calc(13px*var(--fz));font-weight:700;line-height:1;vertical-align:2px;letter-spacing:0}
/* ② 날짜 타일 — 더 작고 가볍게: 숫자는 굵은 코랄, 아랫줄(월·요일)은 보통 굵기 (참고: 활동 목록 날짜 타일 .ac-d 48px·12px 모서리) */
html body #main .dt5:not(.wk5){width:54px;height:54px;border-radius:13px}
html body #main .dt5:not(.wk5)>b{font-size:calc(18px*var(--fz));letter-spacing:-.3px}
html body #main .dt5>span{font-weight:500;margin-top:3px;color:color-mix(in srgb,var(--acc-text) 80%,var(--ink-3))}

  $('#layer').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeLayer()"><div class="dialog enter" role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="dlg-h">${itile(danger?'warn':'bell',danger?'neg':'')}<h3 id="dlgt">${title}</h3></div>${/알림이|전달돼요|알림 받/.test(text)?`<div class="notify"><span class="tile">${icon('bell')}</span><div><b>알림이 가요</b><p>${text}</p></div></div>`:`<p>${text}</p>`}${extra}<div class="err" id="dlgerr"></div><div class="btns"><button class="btn" type="button" id="dlgcancel" onclick="closeLayer()">취소</button><button class="btn ${danger?'danger':'primary'}" id="dlgok" type="button" onclick="dlgOk()">${ok}</button></div></div></div>`;
  setTimeout(()=>{const b=danger||fc?$('#dlgcancel'):$('#dlgok');b&&b.focus()},0);
}
function dlgOk(){if(DLG&&DLG.onOk()!==false)closeLayer()}
function closeLayer(){$('#layer').innerHTML='';DLG=null;S.layer=null;stampTitle()}
function openLayer(t,p){S.layer={t,p};S.step=0;drawLayer();const en=$('#layer .drawer,#layer .dialog,#layer .pop');if(en)en.classList.add('enter');const f=$('#layer [data-focus]');f&&f.focus();stampTitle()}
function stampTitle(){const {v,p}=route();const s=$('#stamp');if(s)s.title=sid(v,p)}
function drawLayer(){if(!S.layer)return;const b=$('#layer .drawer-b');const sc=b?b.scrollTop:0;$('#layer').innerHTML=LAYERS[S.layer.t](S.layer.p);if($('#stp'))stepGo(S.step,true);const nb=$('#layer .drawer-b');if(nb)nb.scrollTop=sc}
const drawer=(title,body,foot,wide)=>`<div class="drawer-scrim" onclick="closeLayer()"></div><aside class="drawer ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dwt"><div class="drawer-h"><h3 id="dwt">${title}</h3><button class="btn sm" type="button" data-focus onclick="closeLayer()">닫기</button></div><div class="drawer-b">${body}</div>${foot?`<div class="drawer-f">${foot}</div>`:''}</aside>`;
const modal=(title,body,foot)=>`<div class="scrim" onclick="if(event.target===this)closeLayer()"><div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="detail-h" style="margin-bottom:10px"><h3 id="dlgt">${title}</h3><button class="btn sm" type="button" data-focus onclick="closeLayer()">닫기</button></div>${body}${foot?`<div class="btns" style="margin-top:16px">${foot}</div>`:''}</div></div>`;
/* 서랍 안 단계: 칸을 지우지 않고 보였다 숨겼다만 해요 */
const stepper=names=>`<div class="stepper" id="stp">${names.map((n,i)=>`<button type="button" onclick="stepGo(${i})"><i>${i+1}</i>${n}</button>`).join('')}</div>`;
const stepFoot=(saveLabel,saveFn,always)=>`<button class="btn" type="button" id="stprev" style="margin-right:auto" onclick="stepGo(S.step-1)">이전</button><button class="btn" type="button" onclick="closeLayer()">취소</button><button class="btn ${always?'':'primary'}" type="button" id="stnext" onclick="stepGo(S.step+1)">다음</button><button class="btn primary" type="button" id="stsave" data-always="${always?1:0}" onclick="${saveFn}">${saveLabel}</button>`;
function stepGo(i,keep){const secs=[...document.querySelectorAll('#layer .stepsec')];const n=secs.length;i=Math.max(0,Math.min(n-1,i));S.step=i;secs.forEach((s,j)=>s.hidden=j!==i);document.querySelectorAll('#stp button').forEach((b,j)=>{b.classList.toggle('on',j===i);b.classList.toggle('done',j<i);b.setAttribute('aria-current',j===i?'step':'false')});
  const last=i===n-1,sv=$('#stsave');$('#stprev').hidden=i===0;$('#stnext').hidden=last;sv.hidden=!(last||sv.dataset.always==='1');if(!keep)$('#layer .drawer-b').scrollTop=0}
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML)closeLayer()});

<script id="qa1-js">
/* 수정 1회차: 초점 가두기·되돌리기, 탭 화살표, 끌기 스크롤 다시 재기, 띠 마우스 끌기, 자동 한 칸 표시 */
(function(){
const $q=s=>document.querySelector(s);
/* ---- 23 서랍·창: 연 버튼 기억 → 닫으면 그 버튼(다시 그려졌으면 같은 이름의 버튼)으로 초점 ---- */
let opener=null;
const desc=el=>el&&el!==document.body?{el,tag:el.tagName,label:el.getAttribute('aria-label')||'',text:(el.textContent||'').trim().slice(0,40)}:null;
const remember=()=>{if(!$q('#layer').innerHTML)opener=desc(document.activeElement)};
const _ol=openLayer;openLayer=function(){remember();const r=_ol.apply(this,arguments);setTimeout(focusIn,0);return r};
const _cb=confirmBox;confirmBox=function(){remember();return _cb.apply(this,arguments)};
const _cl=closeLayer;closeLayer=function(){const had=!!$q('#layer').innerHTML;const r=_cl.apply(this,arguments);if(had&&opener){const o=opener;opener=null;setTimeout(()=>back(o),30)}return r};
function back(o){let t=o.el&&o.el.isConnected&&o.el.offsetParent?o.el:null;
 if(!t)t=[...document.querySelectorAll('#main button,#main a,#main [tabindex],#top button,.mbar button')].find(e=>e.tagName===o.tag&&e.offsetParent&&((o.label&&e.getAttribute('aria-label')===o.label)||(!o.label&&(e.textContent||'').trim().slice(0,40)===o.text)));
 if(t&&!$q('#layer').innerHTML)try{t.focus({preventScroll:true})}catch(e){}}
const FOC='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"]),summary';
const vis=e=>!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length)&&getComputedStyle(e).visibility!=='hidden';
function box(){const L=$q('#layer');if(L&&L.innerHTML){const ds=L.querySelectorAll('[role=dialog]');return ds[ds.length-1]||L}if(document.body.classList.contains('m-nav'))return $q('.side');return null}
function focusIn(){const b=box();if(!b||b.contains(document.activeElement))return;const f=b.querySelector('[data-focus]')||[...b.querySelectorAll(FOC)].find(vis);if(f)f.focus()}
document.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const b=box();if(!b)return;const L=[...b.querySelectorAll(FOC)].filter(vis);if(!L.length)return;const i=L.indexOf(document.activeElement);
 if(i<0){e.preventDefault();(e.shiftKey?L[L.length-1]:L[0]).focus();return}
 if(e.shiftKey&&i===0){e.preventDefault();L[L.length-1].focus()}else if(!e.shiftKey&&i===L.length-1){e.preventDefault();L[0].focus()}},true);
document.addEventListener('focusin',e=>{const b=box();if(b&&!b.contains(e.target)&&!e.target.closest('.toast,.dg9-toast'))setTimeout(focusIn,0)});
/* ---- 23 탭: ←/→로 옆 탭 ---- */
document.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'||e.altKey)return;const t=e.target.closest&&e.target.closest('[role=tab]');if(!t)return;const list=t.closest('[role=tablist]');if(!list)return;
 const tabs=[...list.querySelectorAll('[role=tab]')];let i=tabs.indexOf(t)+(e.key==='ArrowRight'?1:-1);i=(i+tabs.length)%tabs.length;e.preventDefault();
 const li=[...document.querySelectorAll('[role=tablist]')].indexOf(list);tabs[i].click();setTimeout(()=>{const l2=document.querySelectorAll('[role=tablist]')[li];const t2=l2&&l2.querySelectorAll('[role=tab]')[i];if(t2)t2.focus()},0)});
function tabIdx(){document.querySelectorAll('[role=tablist]').forEach(l=>{const T=[...l.querySelectorAll('[role=tab]')];if(!T.length)return;const on=T.find(t=>t.getAttribute('aria-selected')==='true')||T[0];T.forEach(t=>t.tabIndex=t===on?0:-1)})}
/* ---- 13 끌기 스크롤: 크기가 바뀔 때마다(창·AI 도우미·다시 그림) 넘치는지 다시 잰다 ---- */
function mark(){const m=$q('#main');if(!m)return;m.querySelectorAll('*').forEach(el=>{const ox=getComputedStyle(el).overflowX;const can=(ox==='auto'||ox==='scroll')&&el.scrollWidth>el.clientWidth+4;el.classList.toggle('pan9',can)});
 document.querySelectorAll('#main .tabs,#main .seg,#main .nchips12,#top .seg').forEach(el=>{const o=el.scrollWidth>el.clientWidth+4;el.classList.toggle('qa-ovf',o);el.classList.toggle('qa-end',o&&el.scrollLeft+el.clientWidth>=el.scrollWidth-4);if(o&&!el.dataset.qaS){el.dataset.qaS='1';el.addEventListener('scroll',()=>el.classList.toggle('qa-end',el.scrollLeft+el.clientWidth>=el.scrollWidth-4),{passive:true})}})}
/* ---- 15 자동 한 칸: 2단을 골랐어도 실제로 나란히 놓인 줄이 없으면 2단 버튼을 흐리게 + 안내 ---- */
function segFix(){const s=$q('#top .dg12-seg');if(!s||s.hidden)return;const v=curView();const mode=layoutStore.load()[v+':cols-mode']==='1'?'1':'2';
 const rows=[...document.querySelectorAll('#main .dg12>.dg12-row')].filter(r=>r.children.length===2&&!r.classList.contains('dg12-hid'));
 const side=rows.some(r=>{const a=r.children[0].getBoundingClientRect(),b=r.children[1].getBoundingClientRect();return a.width&&b.width&&Math.abs(a.left-b.left)>20&&a.top<b.bottom-4&&b.top<a.bottom-4});
 const auto=mode==='2'&&rows.length>0&&!side;const b1=s.querySelector('[data-cm="1"]'),b2=s.querySelector('[data-cm="2"]');if(!b1||!b2)return;
 s.classList.toggle('dg12-auto',auto);b1.setAttribute('aria-pressed',String(auto||mode==='1'));b2.setAttribute('aria-pressed',String(!auto&&mode==='2'));
 const t=auto?'공간이 좁아 한 칸으로 보는 중':'두 칸으로 보기';b2.title=t;b2.setAttribute('aria-label',t);s.title=auto?t:''}
/* ---- 14 띠·카드 마우스 끌기: 끄는 동안 본문 어디서나 끌기를 받아(놓을 곳이 없으면 그대로) 끌기가 바로 취소되지 않게 ---- */
let dragging=false;
document.addEventListener('dragstart',e=>{dragging=!!(e.target&&e.target.closest&&e.target.closest('.dg11-sh,.dg11-top,.dg9-h'))},true);
const stop=()=>{dragging=false};document.addEventListener('dragend',stop,true);document.addEventListener('drop',()=>setTimeout(stop,0),true);
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{if(dragging)e.preventDefault()}));
/* ---- 묶어서 실행 ---- */
let rq=0;const later=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{try{mark()}catch(e){}try{segFix()}catch(e){}})};
onRender(()=>{try{tabIdx()}catch(e){}later();setTimeout(later,60)});
const _ai=drawAib;drawAib=function(){const r=_ai.apply(this,arguments);later();setTimeout(later,350);return r};
addEventListener('resize',later);addEventListener('load',()=>{setTimeout(later,120);try{tabIdx()}catch(e){}});
try{const ro=new ResizeObserver(later);ro.observe($q('#main'));}catch(e){}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.dg12-seg'))setTimeout(later,30)});
setTimeout(later,200);
})();
</script>
<script id="qa2-js">
/* ===== 기능 추가 2회차 (2026-11-23): 예전 앱 기능을 11판에 옮김 =====
   바로 하기 · 관리 대상(동의 기록·보호자 공유 동의·지원 종료·지난 요청 다시 올리기·현관 QR·받지 않기·맞는 기관 클래스) ·
   편성표 방문 주의사항 · 요청 처리(받지 않기·시간 조정·노쇼) · 대신 요청(대화로 채우기·올리기 전 점검·말로 만들기·통화 메모 여러 건) ·
   리포트 변화 큰 사례 · 정기 요청 · 기관 클래스 · 1:1 문의 · 탈퇴(시연) · 계정 바꾸기(데모) · 담당 넘기기(수락 필요).
   관리 대상은 앱 회원이 아니에요(기관 데이터). AI(예시)는 규칙으로만 동작하고, 이름·주민번호·전화번호를 보내지 않아요. 이름은 모두 q2로 시작 */
const Q2ST={'박지현':['010-****-1234','2026.10.02'],'이수진':['010-****-5678','2026.08.14'],'최은호':['010-****-9012','2026.09.01']};
const Q2TODAY='2026.11.13';

const q2tm=m=>`${m[1].padStart(2,'0')}:${m[2]}~${m[3].padStart(2,'0')}:${m[4]}`;

/* ---------- 1. 홈 '바로 하기' → 관리 대상 고르기(위임받은 분만) → 흐름 ---------- */
const Q2QA={req:['봉사 신청서 쓰기','edit'],dg:['단골에게 요청','user'],repost:['지난 요청 다시 올리기','recur'],recur:['정기 요청','clock'],voice:['말로 공고 만들기','mic'],memo:['통화 메모로 여러 건','doc']};

function q2PickGo(k,id){const e=EL(id);if(!canReq(e))return;
 if(k==='req'||k==='voice'||k==='memo'){S.f.nrm=k==='req'?'direct':k;S.f.nrs=0;closeLayer();go('newreq',id);return}
 if(k==='dg')return openLayer('q2dg',id);
 if(k==='repost')return openLayer('q2repost',id);
 if(k==='recur'){S.f.q2re=id;return openLayer('q2recurForm')}}

/* ---------- 2. 관리 대상 상세 ---------- */
function q2MgrBtn(e){const pend=e.hand&&DLGREQ.find(r=>r.id===e.hand);
 if(pend)return `<button class="btn sm" type="button" disabled title="${pend.to} 님 수락을 기다려요">담당 넘기기 · 수락 대기</button>`;

function q2CareBtns(e){const ok=canReq(e);
 return `<details class="menu q2more"><summary class="btn sm" aria-label="${e.n} 님 더 하기">더 보기${icon('chev')}</summary><div class="menu-b">
  <button type="button" ${ok?'':'disabled title="위임(보호자 동의·서면 동의) 뒤 가능"'} onclick="openLayer('q2repost','${e.id}')">지난 요청 다시 올리기</button>

  <button type="button" onclick="S.f.q2re='${e.id}';openLayer('q2recurForm')" ${ok?'':'disabled title="위임(보호자 동의·서면 동의) 뒤 가능"'}>정기 요청 등록</button>
  ${e.ended?`<button type="button" onclick="q2Resume('${e.id}')">지원 재개</button>`:`<button type="button" class="danger-t" onclick="q2EndCare('${e.id}')">지원 종료</button>`}</div></details>`}
function q2CareFlags(e){let h='';
 if(e.ended)h+=`<div class="panel-f rowx q2endbar"><span class="tag q2endt">지원 종료</span><span class="muted sp">${e.ended.d} · ${esc(e.ended.why)} · ${e.ended.by} 기록. 기록은 남고 새 요청은 할 수 없어요.</span><button class="btn sm" type="button" onclick="q2Resume('${e.id}')">지원 재개</button></div>`;
 const r=e.hand&&DLGREQ.find(x=>x.id===e.hand);
 if(r)h+=`<div class="panel-f rowx"><span class="tag q2wait">담당 넘기기 수락 대기</span><span class="muted sp">${r.from} → ${r.to} · ${r.d} 보냄 · 사유: ${esc(r.msg)}</span>${r.from===ME?`<button class="btn sm ghost danger-t" type="button" onclick="q2CancelHand('${r.id}')">요청 취소</button>`:r.to===ME?`<a class="link" href="#dlg/inbox">받은 요청 보기</a>`:''}</div>`;
 return h}
function q2CarePanels(e){
 const sv=e.svcC||[],sh=e.share||{on:false,hist:[]},fam=e.fam||[],f0=fam[sh.to]||fam[0];
 const svc=`<div><h3 class="sec-t">서비스 동의 기록 <span class="sub">담당자가 확인하고 대신 기록해요</span></h3>${sv.length?`<dl class="props w"><dt>최근 동의</dt><dd class="tn">${sv[0].d} · ${sv[0].how}</dd><dt>받은 담당자</dt><dd>${sv[0].by}</dd>${sv[0].note?`<dt>메모</dt><dd>${esc(sv[0].note)}</dd>`:''}</dl>${sv.length>1?`<ul class="q2hist" aria-label="이전 동의 기록">${sv.slice(1).map(x=>`<li><span class="tn">${x.d}</span><span>${x.how} · ${x.by}${x.note?' · '+esc(x.note):''}</span></li>`).join('')}</ul>`:''}`:`<p class="muted" style="margin:0">아직 서비스 동의 기록이 없어요. 서면·보호자 구두·전화로 받은 뒤 기록해 주세요.</p>`}<div class="btns" style="margin-top:12px"><button class="btn sm" type="button" onclick="openLayer('q2svc','${e.id}')">${icon('plus')}동의 기록 추가</button></div></div>`;
 const share=`<div><h3 class="sec-t">보호자 공유 동의 <span class="sub">리포트 요약을 보호자에게</span></h3>
   <div class="q2row"><span class="sp"><b style="font-weight:600">리포트 요약 받기</b><small>${f0?`${f0[0]} ${f0[1]} 님 · ${sh.via}`:'등록된 보호자 연락처가 없어요'} · ${sh.on?'동의함':'동의 안 함'}</small></span><button type="button" class="tgl ${sh.on?'on':''}" role="switch" aria-checked="${!!sh.on}" aria-label="보호자 공유 동의" ${f0?'':'disabled'} onclick="q2ShareTog('${e.id}')"></button></div>

 const qr=e.qr;const act=REQS.filter(r=>r.e===e.id&&(r.st===2||r.st===3)).length;

   <p class="hint" style="margin:10px 0 0">댁 현관 안쪽에 붙여 두는 카드예요. 봉사자가 도착할 때 한 번(시작 QR), 끝날 때 한 번(종료 QR) 찍어요. 카드에 이름·주소는 없어요.</p>
   <div class="btns" style="margin-top:12px"><button class="btn sm" type="button" onclick="openLayer('q2qr','${e.id}')">${icon('qr')}크게 보기 · 인쇄</button><button class="btn sm ghost danger-t" type="button" ${e.ended?'disabled title="지원을 종료한 분이에요"':''} onclick="q2Reissue('${e.id}')">다시 발급</button></div>`
   :`<p class="muted" style="margin:0">아직 현관 QR 카드를 발급하지 않았어요. 발급해서 인쇄해 두면 봉사자가 시작·종료를 찍어요.</p><div class="btns" style="margin-top:12px"><button class="btn sm" type="button" ${e.ended?'disabled':''} onclick="q2Issue('${e.id}')">${icon('qr')}카드 발급</button></div>`}</div>`;
 const bl=e.blocks||[];

/* 현관 QR: 코드로 정해지는 네모 무늬 (QR처럼 보이는 시연용 패턴 · 그림 아님) */
function q2Qr(code,size){const N=21;let h=0;for(const ch of code)h=(h*31+ch.charCodeAt(0))>>>0;const rnd=()=>{h=(h*1103515245+12345)>>>0;return (h>>>16)&1};
 
 const on=(x,y)=>{for(const [x0,y0] of [[0,0],[N-7,0],[0,N-7]]){if(x>=x0&&x<x0+7&&y>=y0&&y<y0+7){const dx=x-x0,dy=y-y0;return dx===0||dy===0||dx===6||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)}}return null};
 let r='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const f=on(x,y);const v=f===null?(((x===7||y===7)&&(x<8&&y<8||x>N-9&&y<8||x<8&&y>N-9))?0:rnd()):f;if(v)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg width="${size}" height="${size}" viewBox="-1 -1 ${N+2} ${N+2}" role="img" aria-label="현관 QR 카드 ${code}" shape-rendering="crispEdges"><g fill="#1d2230">${r}</g></svg>`}
function q2Issue(id){const e=EL(id);e.qr={code:'HB-'+String(e.tel||'0000').replace(/\D/g,'').slice(-4),d:Q2TODAY,old:[]};render();toast(`${e.n} 님 현관 QR 카드를 발급했어요 · 인쇄해 붙여 주세요`)}

  onOk:()=>{const n=+(q.code.replace(/\D/g,''))||1000;q.old.unshift(q.code);q.code='HB-'+String((n*7+13)%9000+1000);q.d=Q2TODAY;render();toast(`새 카드 ${q.code}를 발급했어요. 이전 카드 ${q.old[0]}는 쓸 수 없어요`)}})}

 return `<div class="q2prop"><div class="k">${icon('clock')}시간 조정 제안이 왔어요</div><p><b style="font-weight:600">${v.n}</b> 님 · ${p.at}<br><span class="tn"><s>${r.d} ${r.tm}</s> → <b>${p.d||r.d} ${p.tm}</b></span></p><p class="muted small">"${esc(p.msg)}"</p><div class="btns"><button class="btn sm primary" type="button" onclick="q2PropOk('${r.id}')">제안 수락</button><button class="btn sm" type="button" onclick="q2PropNo('${r.id}')">거절 (원래 시간 유지)</button><button class="btn sm" type="button" onclick="openLayer('q2counter','${r.id}')">다른 시간 제안</button></div></div>`}
function q2PropOk(rid){const r=REQS.find(x=>x.id===rid),v=P[r.v],p=r.prop;confirmBox({title:'시간 조정 제안을 받아들일까요?',text:`${p.d||r.d} ${p.tm}로 바뀌어요. ${v.n} 님께 수락 알림이 가요. 관리 대상(보호자)께도 바뀐 시간을 알려 주세요.`,ok:'제안 수락',
 onOk:()=>{const old=r.tm;r.tm=p.tm;if(p.d)r.d=p.d;r.prop=null;chatOf(r,r.v).push(['sys',`시간을 ${old} → ${r.tm}로 바꿨어요 (담당자 ${ME} 수락)`,'방금']);render();toast('시간 조정 제안을 받아들였어요. 봉사자에게 알림을 보냈어요')}})}
function q2PropNo(rid){const r=REQS.find(x=>x.id===rid),v=P[r.v];confirmBox({title:'제안을 거절할까요?',text:`원래 시간(${r.d} ${r.tm})으로 진행해요. ${v.n} 님께 거절 알림이 가요.`,ok:'거절하기',danger:true,
 extra:`<div class="field"><label for="q2pn">남길 말 <span class="note">선택 · 봉사자에게 보여요</span></label><input id="q2pn" type="text" placeholder="예: 어르신이 3시 이후에는 주무세요"></div>`,
 onOk:()=>{const m=q2v('q2pn');r.prop=null;chatOf(r,r.v).push(['sys',`시간 조정 제안을 거절했어요 · 원래 시간 ${r.tm} 유지${m?' · '+m:''}`,'방금']);render();toast('제안을 거절했어요. 원래 시간으로 진행해요')}})}
function q2SaveCounter(rid){const r=REQS.find(x=>x.id===rid),d=q2v('q2cd'),nd=normDate(d),t=q2v('q2ct'),m=q2v('q2cmsg');
 if(!vRun([['q2cd',!d?'날짜를 적어 주세요':!nd?'11/17처럼 월/일로 적어 주세요':mdN(nd)<1113?'지난 날짜는 고를 수 없어요':''],['q2ct',timeErr(t)],['q2cmsg',m.length>80?'80자까지 적어 주세요':'']]))return;
 const mm=t.match(TIME_RE);const tm=q2tm(mm);r.prop=null;r.counter={d:nd,tm};chatOf(r,r.v).push(['me',`${nd} ${tm}은 어떠세요?${m?' '+m:''}`,'방금'],['sys',`다른 시간(${nd} ${tm})을 제안했어요 · 봉사자 답을 기다려요`,'방금']);closeLayer();render();toast('다른 시간을 제안했어요. 봉사자에게 알림을 보냈어요')}
const Q2NS=['연락 없이 오지 않았어요','시간이 지나서 취소 연락이 왔어요','관리 대상이 댁에 안 계셨어요','기타'];
function q2NoShowBox(r){const e=EL(r.e),v=P[r.v];
 return `<div class="k">${icon('warn')}시작 QR이 아직 없어요</div><p>예정 ${r.d} ${r.tm} · 지금 15:50. ${v.n} 님이 현관 QR을 찍지 않았어요. 먼저 봉사자와 관리 대상께 연락해 확인해 주세요.</p><div class="btns"><button class="btn sm" type="button" onclick="openChat('${r.id}','${r.v}')">${icon('talk')}봉사자와 채팅</button>${callBtn(e.tel,'관리 대상께 전화')}</div><div class="btns dec12"><button class="btn sm ghost danger-t" type="button" onclick="q2NoShow('${r.id}')">노쇼로 처리</button></div><p class="hint" style="margin:0">노쇼로 처리해도 벌점·가중치는 없어요. 1시간 = 1시간 기준이라 활동하지 않은 시간은 적립되지 않고 기록만 남아요.</p>`}
function q2NoShow(rid){const r=REQS.find(x=>x.id===rid),e=EL(r.e),v=P[r.v];
 confirmBox({title:`${v.n} 님 노쇼로 처리할까요?`,text:`${e.n} 님 ${r.cat} · ${r.d} ${r.tm}. 요청은 '노쇼'로 끝나고 ${v.n} 님께 알림이 가요. 시간은 적립되지 않고 기록만 남아요.`,ok:'노쇼로 처리',danger:true,
  extra:`<div class="field"><label for="q2nr">사유</label><select class="sel" id="q2nr"><option value="">사유 고르기</option>${Q2NS.map(x=>`<option>${x}</option>`).join('')}</select></div><label class="ck12" for="q2nre" style="margin:0 0 6px"><input type="checkbox" id="q2nre" checked><span>같은 내용으로 다시 공고 올리기 <span class="note" style="display:block">날짜를 새로 정하는 대신 요청 화면으로 가요</span></span></label>`,
  onOk:()=>{const w=q2v('q2nr');if(!vRun([['q2nr',w?'':'사유를 골라 주세요']]))return false;const again=($('#q2nre')||{}).checked;
   r.st=5;r.what='노쇼';r.ns={why:w,d:'11/13 15:50',by:ME};chatOf(r,r.v).push(['sys',`노쇼로 기록했어요 · ${w}`,'방금']);S.doneT=(S.doneT||0)+1;
   if(again&&canReq(e)){setTimeout(()=>q2RepostFrom(rid,'노쇼로 기록했어요 · 다시 올릴 내용을 채워 뒀어요'),0);return}render();toast('노쇼로 기록했어요. 봉사자에게 알림을 보냈어요')}})}
function q2NoShowDone(r){const ns=r.ns||{};return `<div class="k">노쇼로 기록했어요</div><p>${ns.d||''} · 사유: ${esc(ns.why||'')} · ${ns.by||''} 기록. 시간은 적립되지 않았고, 벌점·가중치는 없어요.</p><div class="btns"><button class="btn sm" type="button" ${canReq(EL(r.e))?'':'disabled'} onclick="q2RepostFrom('${r.id}')">${icon('recur')}같은 내용으로 다시 올리기</button></div>`}
/* 지난 요청 → 직접 쓰기 칸에 미리 채움 (날짜는 새로) */
function q2RepostFrom(rid,msg){const r=REQS.find(x=>x.id===rid),E=EL(r.e);if(!canReq(E))return;
 S.f['nrc_'+E.id]=r.cat;S.f['nrti_'+E.id]=r.title||`${r.cat} 도와주실 분을 찾아요`;S.f['nrbd_'+E.id]=r.body||`${r.cat} 도움이 필요해요. ${r.issue?'참고: '+r.issue:''}`.trim();
 S.f['nrd_'+E.id]='';S.f['nrtm_'+E.id]=r.tm;S.f['nrim_'+E.id]=r.issue||E.caution;S.f['q2pf_'+E.id]=`지난 요청(${r.d} ${r.cat})`;S.f.nrm='direct';S.f.nrs=0;
 closeLayer();go('newreq',E.id);toast(msg||'지난 요청 내용을 가져왔어요. 날짜를 새로 적어 주세요');setTimeout(()=>{const d=$('#nrd');if(d){d.focus({preventScroll:true});d.scrollIntoView({block:'center'})}},80)}
function q2PrefillNote(E){const k=S.f['q2pf_'+E.id];if(!k)return '';const voice=k==='voice';
 return `<div class="q2note" role="status">${icon(voice?'mic':'recur')}<span class="sp"><b style="font-weight:600">${voice?'말한 내용으로 칸을 채웠어요.':esc(k)+'에서 가져왔어요.'}</b> ${voice?'틀린 곳은 고쳐서 올려 주세요.':'날짜를 새로 적고, 바뀐 곳을 고쳐서 올려 주세요.'}</span><button class="link" type="button" onclick="q2ClearPf('${E.id}')">비우기</button></div>`}
function q2ClearPf(id){['nrc_','nrti_','nrbd_','nrd_','nrtm_','nrim_','q2pf_'].forEach(k=>delete S.f[k+id]);render();toast('가져온 내용을 비웠어요')}

/* ---------- 4. 대신 요청: 대화로 채우기 (규칙으로 동작하는 AI 예시) ---------- */
const Q2CATK=[['동행',/병원|동행|진료|복지관|같이 가|모시고|정형외과|외과|치과|한의원/],['장보기·심부름',/장보기|장 보|마트|시장|심부름|사다|사 다|약 받/],['디지털 도움',/휴대폰|스마트폰|핸드폰|카톡|카카오|앱|키오스크|영상통화|사진 보내/],['말동무·정서',/말동무|말벗|이야기|대화|적적|외로/],['가벼운 집안일',/청소|빨래|설거지|집안일/],['생활 정리',/정리|수납|서랍|옷장/]];
function q2CatOf(t){const c=CATS.find(c=>t.includes(c.k));if(c)return c.k;const k=Q2CATK.find(([,re])=>re.test(t));return k?k[0]:''}
function q2DateOf(t){let m=t.match(/(\d{1,2})\s*[\/.]\s*(\d{1,2})/);if(m)return normDate(m[1]+'/'+m[2]);m=t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);if(m)return normDate(m[1]+'/'+m[2]);
 if(/모레/.test(t))return normDate('11/15');if(/내일/.test(t))return normDate('11/14');if(/오늘/.test(t))return normDate('11/13');
 m=t.match(/(다음\s*주\s*|이번\s*주\s*)?([월화수목금토일])요일/);if(m){const wi=Q2WK.indexOf(m[2]);let d;if(m[1]&&/다음/.test(m[1]))d=16+wi;else{d=9+wi;if(d<=13)d+=7}return normDate(d>30?'12/'+(d-30):'11/'+d)}return ''}
function q2TimeOf(t,cat){let m=t.match(/(\d{1,2}):(\d{2})\s*~\s*(\d{1,2}):(\d{2})/);if(m)return q2tm(m);
 m=t.match(/(오전|오후|아침|저녁|낮)?\s*(\d{1,2})\s*시\s*(반|(\d{1,2})\s*분)?/);if(!m)return '';let h=+m[2],mi=m[3]==='반'?30:m[4]?+m[4]:0;if((m[1]==='오후'||m[1]==='저녁'||m[1]==='낮'||!m[1])&&h<=7)h+=12;if(h>23||mi>59)return '';
 const rest=t.slice(t.indexOf(m[0])+m[0].length);const e=rest.match(/^\s*(부터)?\s*~?\s*(오후|오전)?\s*(\d{1,2})\s*시\s*(반)?\s*까지/);let eh,em=0;if(e){eh=+e[3];em=e[4]?30:0;if(eh<h&&eh<=12)eh+=12}else{eh=h+(cat==='동행'?2:1);em=mi}
 if(eh>23)return '';const p=n=>String(n).padStart(2,'0');return `${p(h)}:${p(mi)}~${p(eh)}:${p(em)}`}
const Q2ASK={cat:'어떤 도움이 필요하세요? 예: 병원 동행, 장보기, 휴대폰 도움, 말동무',d:'언제 필요하세요? 예: 11/17, 다음 주 화요일',tm:'몇 시부터 몇 시까지요? 예: 오후 2시부터 4시까지, 14:00~16:00',bd:'봉사자가 알아야 할 내용을 한두 문장으로 적어 주세요. 예: 진료 끝나고 약국에도 들러 주세요'};
const q2chat=id=>(S.q2ch=S.q2ch||{})[id]||(S.q2ch[id]=[]);
function q2Missing(E){const id=E.id,g=k=>(F(k+id,'')||'').trim();const out=[];if(!g('nrc_'))out.push('cat');if(!normDate(g('nrd_')))out.push('d');if(timeErr(g('nrtm_')))out.push('tm');if(g('nrbd_').length<10)out.push('bd');return out}
function q2ChatFill(E){const open=F('q2cf_'+E.id,false),M=q2chat(E.id);
 return `<div class="q2cf"><div class="rowx nw"><button type="button" class="btn sm ${open?'q2on':''}" aria-expanded="${open}" onclick="q2CfTog('${E.id}')">${icon('talk')}대화로 채우기</button><span class="ai-tag">AI(예시)</span><span class="hint" style="margin:0">빠진 칸을 하나씩 물어보고 아래 칸을 채워요</span></div>
  ${open?`<div class="q2cf-b" id="q2cfb" aria-live="polite">${M.map(m=>`<div class="q2m ${m[0]}">${esc(m[1])}</div>`).join('')}</div><form class="q2cf-f" onsubmit="event.preventDefault();q2CfSend('${E.id}')"><input type="text" id="q2cfin" placeholder="예: 다음 주 화요일 오후 2시 병원 동행" aria-label="대화로 채우기에 답하기" autocomplete="off"><button class="btn sm primary" type="submit">보내기</button></form><p class="hint" style="margin:8px 0 0">이름·전화번호·정확한 주소는 적지 마세요. AI(예시)에는 관리 대상 이름을 보내지 않아요. 규칙으로 칸을 채우는 시연이에요.</p>`:''}</div>`}
function q2CfTog(id){const E=EL(id),o=!F('q2cf_'+id,false);S.f['q2cf_'+id]=o;const M=q2chat(id);if(o&&!M.length){const miss=q2Missing(E);M.push(['ai',miss.length?`안녕하세요. 빠진 칸을 같이 채워 볼게요. ${Q2ASK[miss[0]]}`:'필요한 칸이 이미 다 채워져 있어요. 고칠 곳이 있으면 말해 주세요.'])}render();q2CfFocus()}
function q2CfFocus(){setTimeout(()=>{const b=$('#q2cfb');if(b)b.scrollTop=b.scrollHeight;const i=$('#q2cfin');if(i)i.focus({preventScroll:true})},0)}
function q2CfSend(id){const E=EL(id),i=$('#q2cfin');let t=(i&&i.value||'').trim();if(!t){i&&i.focus();return}const M=q2chat(id);M.push(['me',t]);
 const cut=[];Q2RISK.forEach(([re,w])=>{if(re.test(t)){cut.push(w);t=t.replace(new RegExp(re.source,'g'),' ').replace(/\s+/g,' ').trim()}});if(t.includes(E.n)){cut.push('이름');t=t.split(E.n).join('어르신')}
 if(cut.length)M.push(['ai',`${josa([...new Set(cut)].join('·'),'은/는')} 빼고 채웠어요. 그런 정보는 담당자만 보는 관리 대상 정보에 이미 있어요.`]);if(t.length<2){render();return q2CfFocus()}
 const before=q2Missing(E),asked=before[0],got=[];const cat=q2CatOf(t)||F('nrc_'+id,'');
 const c=q2CatOf(t);if(c&&!F('nrc_'+id,'')){S.f['nrc_'+id]=c;got.push(`카테고리 "${c}"`)}
 const d=q2DateOf(t);if(d){S.f['nrd_'+id]=d;got.push(`날짜 ${d}`)}
 const tm=q2TimeOf(t,cat);if(tm){S.f['nrtm_'+id]=tm;got.push(`시간 ${tm}`)}
 if((asked==='bd'||(t.length>=15&&!(F('nrbd_'+id,'')||'').trim()))&&t.length>=10){S.f['nrbd_'+id]=t;got.push('내용')}
 if(!(F('nrti_'+id,'')||'').trim()&&F('nrc_'+id,'')){const dd=normDate(F('nrd_'+id,''));S.f['nrti_'+id]=`${dd?dd.split(' ')[0]+' ':''}${F('nrc_'+id,'')} 도와주실 분을 찾아요`;got.push('제목')}
 const miss=q2Missing(E);
 M.push(['ai',(got.length?`${josa(got.join(', '),'을/를')} 채웠어요. `:asked==='bd'?'조금 더 자세히(10자 이상) 적어 주세요. ':'잘 못 알아들었어요. ')+(miss.length?Q2ASK[miss[0]]:'다 채웠어요. 아래 칸을 확인하고 "공고 올리기"를 눌러 주세요. 올리기 전에 한 번 더 점검해 드려요.')]);
 render();q2CfFocus()}

/* ---------- 5. 대신 요청: 올리기 전 점검 ---------- */
function q2Issues(E){const id=E.id,g=k=>(F(k+id,'')||'').trim(),out={miss:[],risk:[],over:[]};
 [['nrc','도움 종류',!g('nrc_')],['nrti','제목',!g('nrti_')],['nrbd','내용',g('nrbd_').length<10],['nrd','날짜',!normDate(g('nrd_'))],['nrtm','시간',!!timeErr(g('nrtm_'))]].forEach(([f,l,bad])=>{if(bad)out.miss.push([f,l])});
 [['nrti','제목',g('nrti_')],['nrbd','내용',g('nrbd_')]].forEach(([f,l,v])=>{Q2RISK.forEach(([re,w])=>{if(re.test(v))out.risk.push([f,l,w])});if(v.includes(E.n))out.risk.push([f,l,'관리 대상 이름'])});
 const nd=normDate(g('nrd_')),m=g('nrtm_').match(TIME_RE);if(nd&&m&&!timeErr(g('nrtm_'))){const a=+m[1]+(+m[2])/60,b=+m[3]+(+m[4])/60;REQS.filter(r=>r.e===id&&r.st<5&&r.d===nd).forEach(r=>{const x=r.tm.match(TIME_RE);if(!x)return;const c=+x[1]+(+x[2])/60,d=+x[3]+(+x[4])/60;if(a<d&&c<b)out.over.push(r)})}
 return out}
function q2CkHtml(E){const I=q2Issues(E),fix=(f,l)=>`<button class="link" type="button" onclick="q2Fix('${f}')">${l} 칸으로</button>`;
 const row=(cls,ic,body)=>`<div class="q2ck-r ${cls}">${icon(ic)}<span class="sp">${body}</span></div>`;
 return `<h4>올리기 전 점검</h4>`+
  (I.miss.length?row('bad','warn',`빠진 칸 ${I.miss.length}개: ${I.miss.map(([f,l])=>fix(f,l)).join(' ')}`):row('ok','check','필요한 칸을 다 채웠어요'))+
  (I.risk.length?row('bad','warn',`공개되는 칸에 ${josa([...new Set(I.risk.map(x=>x[2]))].join('·'),'이/가')} 있어요. 수락 뒤 채팅으로 알려 주세요. ${[...new Set(I.risk.map(x=>x[0]))].map(f=>fix(f,f==='nrti'?'제목':'내용')).join(' ')}`):row('ok','check','정확한 주소·전화번호·이름이 공개 칸에 없어요'))+

 return head('classes')+srow([['classes','모집 중',CLASSES.filter(c=>c.st!=='마감').length,'개',`마감 ${CLASSES.filter(c=>c.st==='마감').length}개`],['care','수강 인원',CLASSES.reduce((s,c)=>s+c.cnt,0),'명',`정원 ${CLASSES.reduce((s,c)=>s+c.cap,0)}명`],['memo','담당자 메모',CLASSES.reduce((s,c)=>s+c.notes.length,0),'건','자리 문의 · 대신 신청'],['user','맞는 관리 대상',live.filter(e=>q2ClassFor(e).length).length,'명',`${allScope()?'기관 전체':'내 담당'} 중 · 나이대·동·관심 도움`]])+
 `<div class="toolbar"><select class="sel" aria-label="상태로 거르기" style="width:auto;min-width:160px" onchange="setF('q2cst',this.value)">${['전체','모집 중','마감'].map(o=>`<option ${st===o?'selected':''}>${o}</option>`).join('')}</select><div class="filters"><button class="btn sm primary" type="button" onclick="openLayer('q2classForm')">${icon('plus')}클래스 올리기</button></div></div>
 <section class="panel"><div class="panel-h tight"><h2>기관 클래스 <span class="tn cnt-n">${L.length}</span></h2><span class="sub">정원·일정이 있는 정규 강좌예요. 하루 행사·모임 안내는 기관 행사에 올려요</span></div>${L.length?`<div class="q2cls">${L.map(c=>{const full=c.st==='마감'||c.cnt>=c.cap;return `<button type="button" class="q2c ${full?'off':''}" onclick="openLayer('q2classView','${c.id}')"><span class="q2c-h5">${dtile(c.start)}<span class="q2c-ht5"><span class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</span><h3>${esc(c.t)}</h3></span></span><p class="tn q3sch"><span>${c.sch}</span><span>${c.start} 시작</span></p><p class="muted small">${esc(c.place)} · ${c.age}세 이상</p><span class="appc"><span class="pbar" role="img" aria-label="수강 ${c.cnt}명, 정원 ${c.cap}명"><i style="width:${Math.min(100,c.cnt/c.cap*100)}%"></i></span><span class="tn small muted">${c.cnt} / ${c.cap}명</span></span><span class="rowx nw"><span class="status ${full?'':'ok'}">${full?'마감':'모집 중'}</span>${c.notes.length?`<span class="muted small">메모 ${c.notes.length}건</span>`:''}</span></button>`}).join('')}</div>`:`<div class="empty line q2e">'${st}' 클래스가 없어요. <button class="link" type="button" onclick="setF('q2cst','전체')">전체 보기</button> <button class="link" type="button" onclick="openLayer('q2classForm')">클래스 올리기</button></div>`}
 <div class="panel-f line-note">관리 대상 화면의 "이 분께 맞는 기관 클래스"에 나이대·사는 동·관심 도움이 맞는 강좌가 보여요. 시간이 적립·차감되지 않아요.</div></section>`}
function q2CloseClass(id){const c=CLASSES.find(x=>x.id===id);if(c.st==='마감'){c.st='모집 중';drawLayer();render();toast('클래스 모집을 다시 열었어요');return}confirmBox({title:'이 클래스 모집을 마감할까요?',text:`"${c.t}"에 더는 신청을 받지 않아요. 관리 대상 화면의 추천에서도 '마감'으로 보여요.`,ok:'마감하기',danger:true,onOk:()=>{c.st='마감';render();toast('클래스 모집을 마감했어요')}})}
function q2SaveClass(){const g=q2v,t=g('q2ct2'),sch=g('q2cs'),sd=g('q2csd'),nd=normDate(sd),pl=g('q2cp'),cap=g('q2ccap'),tags=[...(S.f.q2ctags||[])],ds=[...(S.f.q2cdong||[])],desc=g('q2cdesc');
 const ok=vRun([['q2ct2',!t?'제목을 적어 주세요':t.length>40?'제목은 40자까지 적어 주세요':''],['q2ctg',tags.length?'':'관심 도움을 하나 이상 골라 주세요'],['q2cs',!sch?'일정을 적어 주세요':!TIME_RE.test((sch.match(/\d{1,2}:\d{2}\s*~\s*\d{1,2}:\d{2}/)||[''])[0])?'"매주 수 14:00~15:30"처럼 요일과 시간을 적어 주세요':''],['q2csd',!sd?'시작일을 적어 주세요':!nd?'11/25처럼 월/일로 적어 주세요':mdN(nd)<1113?'지난 날짜는 고를 수 없어요':''],['q2cp',pl?'':'장소를 적어 주세요'],['q2ccap',!cap?'정원을 적어 주세요':!/^\d{1,3}$/.test(cap)||+cap<1||+cap>100?'정원은 1~100 사이 숫자로 적어 주세요':''],['q2cdg',ds.length?'':'다니기 쉬운 동을 하나 이상 골라 주세요'],['q2cdesc',desc.length>300?'설명은 300자까지 적어 주세요':'']]);
 if(!ok)return;CLASSES.unshift({id:q2id(CLASSES,'cl'),t,tags,sch,start:nd,place:pl,cap:+cap,cnt:0,age:+(F('q2cage','65세 이상').match(/\d+/)||[0])[0]||0,dongs:ds,desc,st:'모집 중',notes:[]});
 ['q2ctags','q2cdong','q2cage'].forEach(k=>S.f[k]=undefined);closeLayer();toast(`"${t}" 기관 클래스를 올렸어요`);if(route().v==='classes')render();else go('classes')}

 <div class="panel-f line-note">관리 대상 이름·전화번호·주민번호는 적지 말아 주세요. 급한 일은 기관 대표 전화로 연락해 주세요.</div></section>`}
function q2SaveQna(){const c=q2v('q2qc'),t=q2v('q2qt'),b=q2v('q2qb');const pii=v=>Q2RISK.some(([re])=>re.test(v));
 const ok=vRun([['q2qc',c?'':'분류를 골라 주세요'],['q2qt',!t?'제목을 적어 주세요':t.length<2?'제목을 2자 이상 적어 주세요':t.length>40?'제목은 40자까지 적어 주세요':pii(t)?'전화번호·주소·주민번호는 빼 주세요':''],['q2qb',!b?'내용을 적어 주세요':b.length<10?'내용을 10자 이상 적어 주세요':b.length>1000?'내용은 1000자까지 적어 주세요':pii(b)?'전화번호·주소·주민번호는 빼 주세요':'']]);

function q2MeMore(){return `<div class="acct5"><h4 id="acct5h">계정 바꾸기 (시연)</h4><div class="q2acct" role="group" aria-labelledby="acct5h">${(typeof q3Accts==='function'?q3Accts().map(x=>[x.n,x.tmp,x.job,x.boss]):STAFF.map(x=>[x[0],0,x[1],0])).map(([n,tmp,job,boss])=>`<button type="button" class="${n===ME?'on':''}" aria-pressed="${n===ME}" onclick="q2Switch('${n}')"><b>${n}${tmp?' (첫 로그인)':''}</b><em>${metaText(job||'담당자',boss?'기관 대표':'',n===ME?'지금 계정':'')}</em></button>`).join('')}</div><p class="hint">시연용이에요. 담당자마다 '내 담당'과 받은 담당자 요청이 달라져요.</p></div>

function q2DoWd(){const v=q2v('q2wdin');if(!vRun([['q2wdin',!v?'"탈퇴합니다"를 적어 주세요':v!=='탈퇴합니다'?'"탈퇴합니다"를 그대로 적어 주세요':'']]))return;S.q2wd=true;closeLayer();render();toast('시연: 탈퇴 처리됨 · 실제로 지우지 않아요')}

/* ===== 수정 3회차 (2026-11-23): 회의·사용자 결정 반영 — 채팅 안에서 수락(5단계), 봉사 신청서, 담당자 등록·첫 로그인 비밀번호, 내 정보,
   일지(필수)·평가(선택 3일), 단체 봉사 받기·참석 확인, 남은 결함. 새 층을 만들지 않고 qa2 블록 안에 둠. 이름은 q3로 시작 ===== */
const Q3US='행복요양원';
/* ---------- 1. 채팅 안에서 수락 (도움받기 채팅처럼: 지원자 탭 · 말풍선 · 입력 · 수락 버튼) ---------- */
function appList(r){if(!(r.apps||[]).length)return '';const cur=F('chat_'+r.id,r.apps[0].p);
 /* 5회차: 사용자 쪽 채팅 목록 카드 모양 — 동그란 이름, 이름·★단골, 한 줄 정보, 상태 알약, 점선 아래 마지막 말 · 답 기다리는 말 수 */
 return `<div class="apl12 cxl5" role="list" aria-label="지원자 ${r.apps.length}명">${r.apps.map(a=>{const p=P[a.p],th=chatOf(r,a.p),ms=th.filter(m=>m[0]!=='sys'),n=th.length,last=ms[ms.length-1];
  let un=0;for(let i=ms.length-1;i>=0&&ms[i][0]!=='me';i--)un++;

function q3SavePost(k){const g=q2v,t=g('opt'),x=g('opx'),d=g('opd'),nd=normDate(d),tm=g('optm'),n=g('opn2');const C=[['opt',!t?'제목을 적어 주세요':t.length>40?'제목은 40자까지 적어 주세요':Q2RISK.some(([re])=>re.test(t))?'전화번호·주소는 빼 주세요':''],['opx',!x?(k==='해 드려요'?'내용을 적어 주세요':'할 일을 적어 주세요'):x.length<5?'5자 이상 적어 주세요':'']];
 if(k!=='해 드려요')C.push(['opd',!d?'날짜를 적어 주세요':!nd?'11/22처럼 월/일로 적어 주세요':mdN(nd)<1113?'지난 날짜는 고를 수 없어요':''],['optm',timeErr(tm)]);
 if(k==='봉사자 모집')C.push(['opc2',g('opc2')?'':'도움 종류를 골라 주세요']);
 if(k==='단체 봉사')C.push(['opp',!g('opp')?'장소를 적어 주세요':Q2RISK.some(([re])=>re.test(g('opp')))?'개인 주소는 적지 말고 기관·공공장소 이름만 적어 주세요':''],['opn2',!n?'모집 인원을 적어 주세요':!/^\d{1,3}$/.test(n)?'숫자로 적어 주세요':+n<2?'단체 봉사는 2명 이상이에요. 1명이면 봉사자 모집으로 올려 주세요':+n>100?'100명까지 적어 주세요':'']);
 if(k==='해 드려요')C.push(['opw',g('opw')?'':'가능한 때를 적어 주세요'],['opn2',!n?'받을 수 있는 인원을 적어 주세요':!/^\d{1,3}$/.test(n)||+n<1?'1 이상의 숫자로 적어 주세요':'']);
 if(!vRun(C))return;const id='op'+(OPOSTS.reduce((m,p)=>Math.max(m,+p.id.slice(2)||0),0)+1);const m=tm&&tm.match(TIME_RE);
 OPOSTS.unshift({id,kind:k,t,d:k==='해 드려요'?g('opw'):nd,tm:m?q2tm(m):'',cat:g('opc2')||(k==='단체 봉사'?'가벼운 집안일':'생활 정리'),need:k==='봉사자 모집'?+(F('opn','1명').replace(/\D/g,''))||1:+n,app:0,st:k==='해 드려요'?'신청 받는 중':'모집 중',txt:x,place:g('opp')||''});
 closeLayer();S.f.opk='전체';render();toast(`${k} 공고를 올렸어요`)}

  document.querySelectorAll('details.menu>summary').forEach(sm=>{sm.setAttribute('aria-haspopup','menu');sm.setAttribute('aria-expanded',String(!!sm.parentElement.open))})}catch(e){}});

<script>
/* 11/24: 수락·허가·허용 느낌 버튼에 초록 파스텔(ok-btn) 표시 — 화면·서랍·확인 창 어디서 그려져도 붙도록 관찰 */
(function(){
 const YES=/(수락|허가|허용|승인|동의|넘겨받기|우리 기관에서 받기|참석 확인)/, NO=/(거절|취소|안 받|받지 않|끄기|풀기|해제|철회|안 함|대기|필요|보내기)/;
 function mark(root){(root||document).querySelectorAll('button,.btn').forEach(b=>{const t=(b.textContent||'').replace(/\s+/g,' ').trim();const ok=t.length<=16&&YES.test(t)&&!NO.test(t)&&!b.closest('.seg,.tabs,nav,.flow7');b.classList.toggle('ok-btn',ok)})}
 let q=0;const run=()=>{q=0;mark(document)};
 new MutationObserver(()=>{if(!q)q=requestAnimationFrame(run)}).observe(document.body,{childList:true,subtree:true,characterData:true});
 addEventListener('load',run);run();
})();
</script>
